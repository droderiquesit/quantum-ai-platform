[package]
name = "qip-api"
description = "HTTP API and web server: routing, authn/authz, rate limits and audit logging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
qip-core.workspace = true
qip-events.workspace = true
qip-financial.workspace = true
qip-risk.workspace = true
qip-observability.workspace = true
qip-storage.workspace = true
qip-agents.workspace = true
qip-risk-engine.workspace = true
qip-kernel.workspace = true
qip-web.workspace = true
# The mesh backbone's central half: the API is the composition root that
# serves the spine's endpoints, drains the delta inbox into the platform and
# dispatches capital envelopes over the durable spool.
qip-contracts.workspace = true
qip-mesh.workspace = true
qip-transport.workspace = true

[dev-dependencies]
# The tests publish genuine cell deltas and verify dispatched grants with the
# real cell-side types, so the API's decode is proven against the payloads an
# edge cell actually writes rather than against a mirror this side also
# maintains. Dev-only: the serving binary never names the edge crate — the
# composition root's decode goes through `qip_mesh::delta`.
qip-edge.workspace = true
# The whitelist tests need a live grant in the plane, and the only door a
# grant enters by is `CentralPlane::issue` — behind a compiled strategy, a
# full evidence set and a dual approval. These are the crates that fixture is
# built from. Dev-only for the same reason as above: the serving binary holds
# no grant path and constructs no envelope, which `api_boundary.rs` proves.
qip-strategy.workspace = true
qip-lifecycle.workspace = true
qip-compliance.workspace = true
qip-capital.workspace = true
qip-simulation-engine.workspace = true
# The research read surface is proven premise-first: a test feeds bars into
# the platform through `Platform::observe` so a prediction and a price tape
# exist before the route is read. `SensedRecord` and `Bar` are the kernel's
# own input types and the kernel re-exports neither. Dev-only: the serving
# binary ingests nothing and names neither crate.
qip-market.workspace = true
qip-market-ingestion.workspace = true

[lints]
workspace = true

[[bin]]
name = "qip-api"
path = "src/main.rs"
