[package]
name = "qip-edge-node"
description = "The edge cell deployable: one region, its venues, the hot path."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
qip-core.workspace = true
qip-contracts.workspace = true
qip-edge.workspace = true
# The scanner's settings and the graph the node builds from the payload's
# whitelist. A workspace crate the edge already depends on, not a third
# external dependency.
qip-arbitrage.workspace = true
qip-feature-dag.workspace = true
qip-observability.workspace = true
# The journal's durable destination. Already a workspace dependency; the node
# resolves a target from the environment through it rather than keeping its own
# separate answer to where this deployment stores things.
qip-storage.workspace = true
# The venue adapter framework: the simulated exchange is the paper gateway the
# cell places against, so the deployable actually contains the venue seam
# rather than a stub the tests alone exercise.
qip-brokers.workspace = true
qip-execution-engine.workspace = true
# ADR 0011's mesh, so the deployable actually contains the wire to the central
# plane rather than a cell that only ever talks to itself. The transport types
# the node names — the peer address, the retry ladder, the socket limits — are
# configuration this binary reads from the environment.
qip-transport.workspace = true
# The feed seam. The simulated feed hands the cell a decoder for the venue's
# depth and tracks a book for each instrument it publishes, so the node names
# the decoder trait and the book state the cell already holds through
# `qip-edge`. Both are workspace crates the edge depends on already, not a
# third external dependency.
qip-protocols.workspace = true
qip-orderbook.workspace = true
# The strategy plan the payload names by digest is read from a file on the
# node and compiled here, so the deployable names the specification, the
# compiler and the catalogue the cell already depends on through `qip-edge`.
# A workspace crate the edge depends on already, not a third external
# dependency; `serde_json` is one of the two permitted and parses the plan.
qip-strategy.workspace = true
serde_json.workspace = true
# The repricer: the parent/child conservation arithmetic and the
# cancel-then-replace decision `qip_routing::reprice` holds, wired here into
# the pass loop beneath the cell's placer seam. A workspace crate the edge's
# order model already comes from, not a third external dependency.
qip-routing.workspace = true

[dev-dependencies]
# The mesh tests frame a capital grant the way the central plane does, so the
# node is exercised against a payload built independently of it rather than
# against one this crate also produced. Dev-only: nothing in the binary needs
# the event envelope directly.
qip-events.workspace = true
qip-financial.workspace = true

[lints]
workspace = true
