[package]
name = "qip-fastbrain"
description = "Fast Brain node: market data, microstructure, real-time risk and execution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "qip_fastbrain"
path = "src/lib.rs"

[[bin]]
name = "qip-fastbrain"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
qip-core.workspace = true
qip-financial.workspace = true
qip-observability.workspace = true
qip-storage.workspace = true
qip-agents.workspace = true
qip-investment-agents.workspace = true
qip-kernel.workspace = true
# The risk limits the platform is assembled with. Held here rather than
# defaulted inside the kernel so the node states the limits it runs under.
qip-risk.workspace = true
qip-risk-engine.workspace = true
# The bar interval the synthetic exchange is asked for. A node cycling ten
# times a second fed minute bars is blind between minutes, so the cadence is
# chosen from the cycle interval rather than left at the environment's default.
qip-market.workspace = true
qip-data-finder.workspace = true
qip-contracts.workspace = true
# Where records come from in this build. The node polls a `DataAdapter`, so the
# synthetic exchange and a recorded replay are the same seam, and a licensed
# feed would be a third implementation rather than a rewrite of the loop.
qip-market-ingestion.workspace = true
# The drain's HTTP client (ADR 0028). A workspace-internal crate under
# libs/, so this is an inward edge and not a third-party dependency — but it
# is a real one: this root now holds an outbound client it did not hold
# before. What it may reach is bounded by the transport itself, which refuses
# any scheme but plaintext http by name, and by the one operator-set URL.
qip-transport.workspace = true

[lints]
workspace = true
