[package]
name = "qip-deepbrain"
description = "Deep Brain node: world model, discovery, reasoning, simulation, optimisation and learning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "qip_deepbrain"
path = "src/lib.rs"

[[bin]]
name = "qip-deepbrain"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
qip-core.workspace = true
qip-events.workspace = true
qip-financial.workspace = true
qip-observability.workspace = true
qip-storage.workspace = true
# The research warehouse client (R12-DATA-9054) and the evaluation type the
# outcomes it streams are read from. Workspace-internal.
qip-mesh.workspace = true
qip-learning-engine.workspace = true
qip-agents.workspace = true
qip-investment-agents.workspace = true
qip-risk.workspace = true
qip-risk-engine.workspace = true
qip-kernel.workspace = true
# Ships this process's desk fills to qip-ledgerd, on the deep brain's own
# desk chain (`node::DESK_CHAIN`).
qip-desk-ship.workspace = true
# The evolution loop: the grammar and trial ledger, the harness that scores a
# generated candidate on observed bars, and the evidence types the factory's
# gate reads. All workspace-internal; the app is the composition root where
# these were always meant to meet.
qip-evolution.workspace = true
qip-simulation-engine.workspace = true
qip-strategy.workspace = true
qip-market.workspace = true
qip-market-ingestion.workspace = true
qip-ai.workspace = true
qip-training.workspace = true
qip-quant.workspace = true
qip-numerics.workspace = true
qip-lifecycle.workspace = true
qip-contracts.workspace = true
# The ambient mesh's one door to the agency (R12-AGENCY-7029): promotion, the
# action guard and a drafting-only outbox. Workspace-internal.
qip-agency.workspace = true
# Source discovery (§7.4-§7.6.2): ASSESS, REGISTER and SCORE, all
# workspace-internal. `Platform::assess_sources` already wraps
# `DataFinder::assess`; this root is where the candidate catalogue and the
# probe that reaches a reviewed egress route (ADR 0060) meet it on a cadence,
# the same composition-root role this crate already plays for the evolution
# loop. The only place a candidate list is read from disk and the only place
# a probe is built, for the same reason it is the only place the universe is
# read: a service that reached for either could not be deployed twice with
# different sources.
qip-data-finder.workspace = true
# The drain's HTTP client (ADR 0028). A workspace-internal crate under
# libs/, so this is an inward edge and not a third-party dependency — but it
# is a real one: this root now holds an outbound client it did not hold
# before. What it may reach is bounded by the transport itself, which refuses
# any scheme but plaintext http by name, and by the one operator-set URL.
qip-transport.workspace = true
# The hosted language-model adapter (ADR 0037). This is the one root that may
# construct it: the fast brain reads none of its variables (ADR 0008) and the
# API serves what the brains recorded. In-tree; not a third-party dependency.
qip-reasoning-engine.workspace = true
# The anomaly-to-gap mapping (EXPAND-025, `signal_mapper.rs`) reads the
# DISCOVER stage's `Anomaly` and writes the expansion engine's `Observation`,
# so it needs both crates — and only a composition root off the reflex path
# may hold the expansion engine (EXPAND-005). It lived in
# `qip-opportunity-engine` for one merge, which made a Lane 2 service and the
# kernel above it depend on the curriculum, and through the curriculum on the
# agent registries: research became a dependency of deciding. This is the
# Lane 3 root, where the two meet without either depending on the other.
# Both workspace-internal; not third-party dependencies.
qip-opportunity-engine.workspace = true
qip-expansion.workspace = true
# The outcome record's `Action` enum (EXPAND-6069 reads each paper fill's
# slippage), and the tick desk's synthetic future tree and twin state, live in
# `qip-twin`; the tick desk's fusion reads the knowledge graph's own type from
# `qip-world-model`. Both Lane 3, both workspace-internal.
qip-twin.workspace = true
qip-world-model.workspace = true

[dev-dependencies]
# The campaign tests decode the closed-manifest record straight off the
# platform's event log, which is a stream frame; the library that seals
# frames is the one that reads them back. A dev-dependency and not a
# dependency: the node never decodes its own log.
qip-streaming.workspace = true
# The operations tests build the router's typed quantum dispatch record, which
# the kernel journals but does not re-export.
qip-optimization-engine.workspace = true
# The research tests build the evidence records a connector would forward,
# to prove a poisoned feed in the world fabric reaches the research loop.
qip-world-model.workspace = true

[lints]
workspace = true
