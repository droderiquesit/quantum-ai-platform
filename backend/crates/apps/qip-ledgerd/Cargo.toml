[package]
name = "qip-ledgerd"
description = "Ledger composition root: sole writer of the ledger chain of double-entry postings for fills, and its own read-side API (ADR 0100)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
qip-core.workspace = true
qip-contracts.workspace = true
qip-events.workspace = true
qip-storage.workspace = true
qip-transport.workspace = true
qip-portfolio.workspace = true
qip-observability.workspace = true

[dev-dependencies]
qip-streaming.workspace = true
# Test-only: `qip-transport/tests/support/certs.rs` mints the throwaway CA and
# workload certificates the read API's mutual-TLS test needs, with `ring`,
# because committing PEM private keys as fixtures is forbidden. Already in
# the lockfile and on the allow-list as `qip-transport`'s (ADR 0110), pinned
# to the same version, so this adds no package — only a test-time edge.
ring = { version = "=0.17.14", default-features = false }

[lints]
workspace = true
