[dev-dependencies]
qip-streaming.workspace = true
# No `ring` here, although the read API's mutual-TLS test mints certificates
# with it through `qip-transport/tests/support/certs.rs`: that file names it
# as `qip_transport::ring`, the re-export of the one pin in `qip-tls`, and
# `cargo deny`'s workspace-duplicate check refuses a second pin.

[lints]
workspace = true
