[package]
name = "qip-lifecycle"
description = "Evidence and approval gates: holdout, paper, shadow, scale and retire."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
qip-core.workspace = true
qip-numerics.workspace = true
qip-contracts.workspace = true
# The venue rung of the ladder judges a decentralised venue's §34.3 model —
# whether its pool math, block-time execution, MEV estimate and contract-risk
# flag exist, and what the modelled cost of crossing it comes to. That model
# is `qip_financial::pool`, a lib: the gate reads it and never builds one, so
# the arithmetic has exactly one home and a venue cannot be admitted on a
# second copy of it that drifted.
qip-financial.workspace = true
# Deliberately NOT dependencies since ADR 0386: qip-ai and
# qip-simulation-engine. This is an asset-brain crate (ADR 0127), and those
# two put a model-holding crate, the strategy crate and the risk brain in its
# closure. The holdout gate still re-runs the validation rather than trusting
# numbers a researcher submitted; that arithmetic is `qip_numerics::validation`
# and has one home. Model eligibility reaches the demotion monitor as
# `qip_contracts::model_eligibility::ModelEligibility`, which the kernel takes
# from the registry. `brain_closure` fails if either line comes back.
# Deliberately NOT a dependency: qip-optimization-engine. A rung that holds
# capital has to name which of the four §23.4 pools funds it, and the pool
# arithmetic exists once, in that crate. This crate reaches it through
# `horizon::HorizonReconciler`, whose adapter qip-kernel composes, because the
# optimisation engine transitively reaches qip-quantum and this crate vetoes
# capital-holding promotions. That edge was taken once and
# `nothing_that_vetoes_executes_or_moves_money_can_reach_a_quantum_solver`
# caught it; the port keeps the single implementation without the solver
# behind it.
# The ledger records every rung a strategy moves across. A demotion for decayed
# performance is a capital-affecting action, and one that reached the ledger
# and no series was invisible to every operator; the registry is an in-memory
# lib, so the inward dependency direction holds.
qip-observability.workspace = true

[dev-dependencies]
# The trial book's tests stand in a store, and the store port speaks
# `serde_json::Value`; the crate itself never names it.
serde_json.workspace = true
# The demotion tests build the eligibility record the way the kernel does,
# from a real registry, so a registry refusal is shown to reach the trigger.
# Tests only; cargo gives a library target no dev-dependency.
qip-ai.workspace = true
# Deliberately not here either, though the solver-boundary test in
# qip-acceptance skips `dev` and `build` dependencies and would have permitted
# it: the horizon gate's tests stand in a reconciler of their own, because what
# they prove is what the gate refuses given figures, and the figures the real
# §23.4 arithmetic produces are proven where that arithmetic is called — in
# qip-kernel's `horizon_seam` suite. A dev edge here would leave the crate one
# copied line away from being a shipped edge again.

[lints]
workspace = true
