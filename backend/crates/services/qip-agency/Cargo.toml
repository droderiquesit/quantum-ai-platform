[package]
name = "qip-agency"
description = "Causal agency engine: affordance graph, bounded intervention plans, the conduct gate and the guarded act stage. GoalSpec, the tool registry and EffectAttribution are qip-contracts types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
qip-core.workspace = true
qip-contracts.workspace = true
# The legal-eligibility register a pass is asked against (R12-GOV-6116).
qip-compliance.workspace = true
# The hash-chained log the act stage's approvals and decisions are journaled
# on (R12-GOV-6124).
qip-events.workspace = true
# The statement fingerprint a citation's claim is compared with the recorded
# one by (R12-AGENCY-1056): the fabric's own, so a claim and the evidence it
# cites are normalised the same way. A library, which a service may use.
qip-evidence.workspace = true
# The canonical payload text a §27 ActionIntent digests (R12-CONTRACT-7082);
# already the workspace's one serialisation, not a new crate.
serde_json.workspace = true

[lints]
workspace = true
