[package]
name = "qip-streaming"
description = "The universal event envelope and the durable transport ports behind it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
qip-core.workspace = true
qip-contracts.workspace = true
qip-events.workspace = true
qip-financial.workspace = true
qip-market.workspace = true
# Gap detection, reordering and watermark discipline are already solved in the
# edge stack. This crate composes that tracker rather than growing a second
# implementation of it — see `sequencing.rs`.
qip-sequencing.workspace = true
# The in-tree mesh ADR 0011 puts where Pub/Sub was. The edge runs service →
# library, which is the direction `a_library_never_depends_on_a_service_or_an_
# application` permits, so the port adapter for it lives here in `mesh.rs`
# beside `local.rs` and `durable.rs` rather than in `qip-transport`'s tests.
qip-transport.workspace = true

[lints]
workspace = true
