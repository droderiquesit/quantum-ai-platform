[package]
name = "qip-market-ingestion"
description = "SENSE: provider adapters for market, news, fundamental, macro and alternative data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
qip-core.workspace = true
qip-numerics.workspace = true
qip-events.workspace = true
qip-financial.workspace = true
qip-market.workspace = true
qip-observability.workspace = true
# The REST adapter's socket. `qip_transport::http` is the sanctioned outbound
# HTTP client in this workspace: blocking, one connection per request, and
# bounded in every dimension a peer chooses. Both crates are below the
# application layer, so the dependency edge is legal.
qip-transport.workspace = true
# The depth adapter builds a real book rather than a second implementation of
# one. `qip-contracts` is the protocol-agnostic market message every venue
# decodes into; `qip-orderbook` applies those messages and owns what a crossed,
# locked or discarded book means; `qip-sequencing` owns gap detection. All
# three are edge crates and this is a service, which is the direction
# `qip-streaming`'s dependency on `qip-sequencing` already establishes. The
# alternative was a private book and a private gap check inside this crate,
# which is how two mechanisms end up disagreeing about whether a book is safe.
qip-contracts.workspace = true
qip-orderbook.workspace = true
qip-sequencing.workspace = true

[dev-dependencies]
# `StreamJournal` persists through `qip_core::kv::KeyValueStore` — the port,
# declared in a library this crate already depends on — so nothing here reaches
# for a filesystem and a deployment chooses the adapter. The tests need *an*
# adapter, and `MemoryKeyValueStore` is the one the workspace already ships;
# a store hand-rolled inside the test file would be a second implementation of
# the port whose disagreements with the real one nothing would catch.
# A dev-dependency and not a dependency: this is a service and `qip-storage` is
# a library, so the edge is legal in either position, but the crate needs the
# port and not the adapter, and the manifest should say which.
qip-storage.workspace = true

[lints]
workspace = true
