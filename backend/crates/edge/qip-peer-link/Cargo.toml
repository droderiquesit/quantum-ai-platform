[package]
name = "qip-peer-link"
description = "The peer Reflex Mesh link: wire thread, session, and the non-blocking port the reflex node holds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# ADR 0116: the protocol, the shared core and the transport's TLS, and
# nothing else. In particular no `qip-edge`: a link that could name the cell
# could be handed it and run coordination on the decision thread again, which
# is what this crate was cut out of `qip-edge-node` to stop.
[dependencies]
qip-core.workspace = true
qip-peer.workspace = true
# ADR 0112: the peer mesh is mutual TLS. `qip_transport::tls` already loads
# the workload identity, builds the TLS 1.3 configs on the `ring` provider
# and checks a certificate against the admitted peer names; the link reuses
# it rather than holding a second copy of that policy. `qip-transport` is a
# Lane 0 library the node already links, so this adds no crate to the node.
qip-transport.workspace = true
# The session types the wire drives on its own sockets (ADR 0116, "What
# would make this wrong": rustls confined to this crate, replacing only the
# stream type) come re-exported from `qip_transport::tls`, not from a second
# `rustls` line here. A second pin of the same crate is what `cargo deny`'s
# `[bans.workspace-dependencies] duplicates = "deny"` refuses, and rightly:
# two manifests naming one version and provider agree only until one of them
# is edited. Through `qip-transport` the link cannot drift from the TLS 1.3,
# `ring`-provider build that crate pins. The mTLS test mints throwaway
# certificates with `ring` through `qip-transport`'s shared
# `tests/support/certs.rs`, which reaches it as `qip_transport::ring` for the
# same reason, so no `ring` line sits here either.

[lints]
workspace = true
