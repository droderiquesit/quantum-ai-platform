[package]
name = "qip-peer-link"
description = "The peer Reflex Mesh link: wire thread, session, and the non-blocking port the reflex node holds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# ADR 0116: the protocol, the shared core and the transport's TLS, and
# nothing else. In particular no `qip-edge`: a link that could name the cell
# could be handed it and run coordination on the decision thread again, which
# is what this crate was cut out of `qip-edge-node` to stop.
[dependencies]
# The net-edge model (R12-MESH-5069): origination charges a crossing the
# expected move over the measured peer round trip through the same
# calculator the cell's desk prices its own cycles with. Lane 1 depending on
# the reflex vocabulary is the permitted direction; MESH-013 forbids the
# reverse.
qip-arbitrage.workspace = true
qip-core.workspace = true
qip-peer.workspace = true
# ADR 0112: the peer mesh is mutual TLS. `qip_tls` loads the workload
# identity, builds the TLS 1.3 configs on the `ring` provider and checks a
# certificate against the admitted peer names; the link reuses it rather than
# holding a second copy of that policy, and takes the session types the wire
# drives on its own sockets (ADR 0116, "What would make this wrong": rustls
# confined to this crate, replacing only the stream type) from its
# re-exports rather than pinning `rustls` a second time, which `cargo deny`'s
# workspace-duplicate check refuses.
#
# `qip-tls` and not `qip-transport`, which this crate depended on for the
# same module until 2026-10-11: `qip-transport` is the durable fabric's wire
# and reaches `qip-events`, and
# `reflex_mesh_traffic_and_durable_fabric_traffic_share_no_crate_in_either_direction`
# holds the mesh apart from both, so a frame journal or a replay cursor can
# never land on a leg's path by an innocent import.
qip-tls.workspace = true

[dev-dependencies]
# The mTLS test mints throwaway certificates through `qip-transport`'s shared
# `tests/support/certs.rs`, which needs its base64 encoder and `ring`. A
# dev-dependency ships in no binary, so the separation above still holds for
# everything the node runs.
qip-transport.workspace = true

[lints]
workspace = true
