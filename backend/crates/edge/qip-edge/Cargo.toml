[package]
name = "qip-edge"
description = "An edge cell: the hot execution path, local state and the durable asynchronous mirror."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
qip-core.workspace = true
qip-contracts.workspace = true
qip-protocols.workspace = true
qip-sequencing.workspace = true
qip-orderbook.workspace = true
qip-feature-dag.workspace = true
qip-strategy.workspace = true
qip-arbitrage.workspace = true
# Named by no source file in this crate: the cell sends through its own
# `Placer` seam and never constructs the order manager. The edge stays because
# the architecture suite's `only_the_edge_cell_itself_holds_an_order_manager`
# uses "the cell reaches qip-execution-engine" as its vacuity guard, and
# dropping the edge fails that guard rather than the property it guards. The
# guard needs re-stating against the cell's real order path before this line
# can go; until then the edge is a pinned claim, not a use.
qip-execution-engine.workspace = true
qip-risk-engine.workspace = true
# The platform's own event envelope, which is what the mesh carries. The cell
# does not invent a second wire format for its state deltas.
qip-events.workspace = true
# ADR 0011's in-tree mesh. Both crates are libraries, so the dependency edge
# runs the permitted way; the `qip-streaming` adapter that wears the same
# transport as a `Publisher` is a service and therefore cannot be used from
# here, which is why this reaches for `MeshPublisher` directly.
qip-transport.workspace = true
# The metric registry the cell records into. A library holding an in-memory
# `BTreeMap` behind a mutex — it exports nothing and opens nothing — so the
# `libs <- edge` edge this adds is the permitted direction and adds no I/O to a
# crate whose hot path must not do any. The cell records into a handle it is
# *given*; where those numbers are served from stays a decision for
# `qip-edge-node`.
qip-observability.workspace = true

[lints]
workspace = true
