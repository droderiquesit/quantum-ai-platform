[package]
name = "qip-transport"
description = "The in-tree streaming backbone: an HTTP/1.1 client and the mesh transport that replaces a managed message bus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
qip-core.workspace = true
qip-contracts.workspace = true
# The mesh carries `qip_events::AnyEvent` — the platform's own type-erased
# event — rather than inventing a second wire envelope. `qip-streaming` cannot
# be a dependency here: it is a service and this is a library, and
# `a_library_never_depends_on_a_service_or_an_application` in the acceptance
# suite enforces that direction. It is a dev-dependency instead, so the tests
# can prove that a `StreamEnvelope` crosses this transport unchanged.
qip-events.workspace = true
# ADR 0110 and ADR 0112, admitted under ADR 0109: one cryptography library,
# in one crate. `ring` verifies ECDSA P-256 signatures on policy frames,
# halts, capital envelopes and model packs against a trust bundle, and is the
# provider `rustls` runs on, so the platform carries one implementation of
# the primitives rather than two. Both contain C and assembly (ADR 0109
# condition 8): `ring`'s primitives are BoringSSL-derived C and assembly,
# and that is named here rather than hidden. Pinned exactly, no default
# features: `ring` needs none for verification, signing from a PKCS#8
# document or the system random source; `rustls` takes `ring` as its
# provider and `std` for the blocking `StreamOwned` the in-tree client and
# server drive. TLS 1.2 is not enabled — ADR 0112 is mTLS 1.3 — so a peer
# that can only offer 1.2 fails the handshake rather than negotiating down.
ring = { version = "=0.17.14", default-features = false }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
# Already in the tree as `rustls`'s certificate verifier; named directly for
# one call, `EndEntityCert::verify_is_valid_for_subject_name`, which is how a
# mutual-TLS server checks a client certificate against the workload names
# it admits (`tls::PeerNames`). The version `rustls` resolves, so this adds
# no package to the lockfile.
webpki = { package = "rustls-webpki", version = "=0.103.15", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
qip-streaming.workspace = true
# The spool persists through the `KeyValueStore` port rather than reaching for
# the filesystem, so a test runs it in memory and a deployment chooses the
# adapter. The port is declared in `qip-core`, not here and not in
# `qip-storage`: `qip-storage` now depends on this crate, because its Cloud
# Storage and BigQuery adapters speak a REST API over `HttpClient`, and a
# normal dependency in both directions is a cycle cargo refuses to build.
# This edge is a dev-dependency, which cargo does permit in a cycle, and it
# buys only `MemoryKeyValueStore` for the spool tests.
qip-storage.workspace = true

[lints]
workspace = true
