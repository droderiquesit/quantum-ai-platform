[package]
name = "qip-acceptance"
description = "Workspace-level acceptance, infrastructure and documentation tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
qip-core.workspace = true
qip-agents.workspace = true
qip-ai.workspace = true
qip-events.workspace = true
qip-financial.workspace = true
qip-market.workspace = true
qip-risk.workspace = true
qip-investment-agents.workspace = true
qip-reasoning-engine.workspace = true
qip-simulation-engine.workspace = true
qip-optimization-engine.workspace = true
qip-portfolio-engine.workspace = true
qip-risk-engine.workspace = true
qip-execution-engine.workspace = true
qip-learning-engine.workspace = true
qip-market-ingestion.workspace = true
qip-entity-resolution.workspace = true
qip-world-model.workspace = true
qip-contracts.workspace = true
qip-compliance.workspace = true
qip-mesh.workspace = true
qip-observability.workspace = true
qip-kernel.workspace = true
qip-api.workspace = true
# The blueprint renderer, so the suite can refuse a traceability view that no
# longer matches its JSON sources (ADR 0099). A dev-dependency on an app, as
# qip-api above is: nothing ships depending on it.
qip-cli.workspace = true
# The edge node's library, so `order_route_risk_gate.rs` drives an order
# through the cell exactly as the binary assembles it — `assemble_with_risk`,
# `run_pass`, the repricer — rather than reading the source for the gate's
# call (R12-RISK-4093). A path dependency rather than a new root
# `[workspace.dependencies]` entry; a dev-dependency on an app, as the two
# above are, and nothing ships depending on it.
qip-edge-node = { path = "../../apps/qip-edge-node" }

# The ledger daemon's library, so `vertical_slice_ledgerd.rs` drives a P1
# outcome record into the store's real apply path (idempotent re-apply,
# refold, the paper fence's park) — the last hop of the vertical slice,
# which `vertical_slice_cell_ledger.rs` could not reach. A path dependency
# like `qip-edge-node` above; a dev-dependency on an app, so nothing ships
# depending on it and `runtime_reachability`, which counts `[dependencies]`
# only, is unmoved.
qip-ledgerd = { path = "../../apps/qip-ledgerd" }

# The fast brain's library, so `vertical_slice_ship.rs` drives the desk's
# fills through the shipper `main` builds, over a real broker, into the real
# ledger store (the desk's ledger records had no production caller until
# `ship.rs`). A path dependency like the two above; a dev-dependency on an
# app, so nothing ships depending on it and `runtime_reachability`, which
# counts `[dependencies]` only, is unmoved.
qip-fastbrain = { path = "../../apps/qip-fastbrain" }
# The deep brain's desk chain name, for the three-desk shipping suite.
qip-deepbrain = { path = "../../apps/qip-deepbrain" }

# The stress, chaos and performance suites reach the edge stack directly: the
# cell and its journal, the books it prices from, the sequencer that decides a
# feed is corrupt, the compiler and runtime a strategy is evaluated by, the
# arbitrage pipeline, and the quantum port that reports itself unavailable.
# These are in-tree crates; the workspace's two-dependency rule is untouched.
qip-numerics.workspace = true
# The streaming-estimator suite additionally reaches the training crate, which
# is where the drift index that consumes those estimators' declared bounds
# lives. §21.1's "one that drifts past it marks every model depending on it as
# degraded" spans both crates and neither can assert it alone. In-tree; the
# workspace's two-dependency rule is untouched.
qip-training.workspace = true
qip-quantum.workspace = true
qip-sequencing.workspace = true
qip-orderbook.workspace = true
qip-feature-dag.workspace = true
qip-strategy.workspace = true
qip-arbitrage.workspace = true
qip-edge.workspace = true
# `tick_replay.rs` replays a recorded session from venue-native bytes, which
# is the one place the suite needs the wire decoders themselves: decode,
# sequence, book and fill are each deterministic in their own crate's tests,
# and TICK-017's claim is about the chain, which none of them can see whole.
# In-tree, and already linked through `qip-edge`; the workspace's
# two-dependency rule is untouched.
qip-protocols.workspace = true

# Blueprint §30.2's path router, for `path_router.rs`. The suite already
# reaches `qip-arbitrage`; the assertion that a cycle the search found is
# assigned a path needs both ends of that seam in one test, and neither
# crate's own tests can see the other.
qip-routing.workspace = true

# `m6_critical_path.rs` times the cost router's `select` on both arms of
# `Determinism`. That suite imported `qip_cost_router` without this line and
# so never compiled. In-tree; the workspace's two-dependency rule is untouched.
qip-cost-router.workspace = true

# The security suite additionally reaches the data finder, because the
# threat model's "unknown is not permission" property lives in its
# three-valued legality and nowhere else.
qip-data-finder.workspace = true

# The live end-to-end walk is the one test that has to reach every adapter that
# opens a socket at once: the venue order-entry adapter, the JSON-RPC chain
# adapter, the mesh transport both ends of the spine are built on, and the
# key-value store the centre's capital spool persists into. Each is already
# tested against a loopback listener on its own; `e2e_live.rs` is the first
# thing that runs them together. These are in-tree crates; the workspace's
# two-dependency rule is untouched.
qip-brokers.workspace = true
qip-chain.workspace = true
qip-transport.workspace = true
qip-storage.workspace = true

# The end-to-end demonstration is the one test that has to reach everything at
# once: the capital brain that signs a grant, the twin that prices what the
# platform did not do, the fabric that pre-positions the cash, and the cost
# engine that charges the decision for having been made. Nothing else in this
# crate needs them, and the demonstration is worth nothing without them.
qip-capital.workspace = true
qip-twin.workspace = true

# ARCH-033's phase-gate test verifies the transfer gate infrastructure:
# capital locations, FX conversion detection, and stated purposes (deviation reduction).
# These types live in the capital-fabric service.
qip-capital-fabric.workspace = true

# The region-share suite issues grants through `CentralPlane::issue`, the
# door a deployment uses, and that door refuses a strategy below pilot;
# walking one there needs the lifecycle's family and evidence types, which
# nothing re-exports. An in-tree crate; the two-dependency rule is untouched.
qip-lifecycle.workspace = true

# ADR 0100's broker library, so a later packet's acceptance test can walk the
# event fabric without a second manifest edge.
qip-streaming.workspace = true

# ADR 0100's ledger posting logic, so a later packet's acceptance test can
# walk fill-to-ledger reconciliation without a second manifest edge.
qip-portfolio.workspace = true

# EVENT-001 integration test for event prediction scoring. This crate holds
# the scoring module that compares platform probability against market
# probability for event contracts. In-tree; the two-dependency rule is untouched.
qip-prediction.workspace = true

[lints]
workspace = true
