[package]
name = "qip-training"
description = "Model training, distillation and the managed-training provider port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
qip-core.workspace = true
qip-numerics.workspace = true
# `DistilledModel` is the distillation target: the only learned function the
# hot path will evaluate, and the reason this crate exists in the shape it does.
qip-strategy.workspace = true
# `Horizon`, which sets the span a label covers and therefore the purge width
# any cross-validation of this data has to use.
qip-quant.workspace = true
# The HTTP client `vertex` reaches the managed training API through. In-tree,
# blocking, every limit explicit and no TLS — which is why a deployment has to
# put a TLS-terminating egress proxy in front of it, and why that requirement
# is stated on the adapter rather than assumed away.
qip-transport.workspace = true

# Deliberately absent, and each absence is a boundary rather than an oversight.
#
# `qip-lifecycle` holds the gates a model passes before it may influence
# capital. This crate measures a model and refuses to hand out one that falls
# short of a policy; it does not decide that anything is fit for production. A
# crate that both trains a model and clears it for use grades its own homework.
#
# `qip-simulation-engine` holds the validation machinery — purged k-fold with
# an embargo, deflated Sharpe, walk-forward. A caller runs those over the folds
# `TrainingDataset::select` builds; growing a second set of statistics in here
# would give the platform two answers that could disagree with each other.

[lints]
workspace = true
