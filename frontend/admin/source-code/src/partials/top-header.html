<header class="sticky top-0 z-50 glass @container">
  <div class="flex items-center justify-between px-2 sm:px-6 py-2 sm:py-4">
    <div class="flex items-center gap-2 sm:gap-4">
      <!-- Mobile Menu Button -->
      <button class="lg:hidden flex size-11 items-center justify-center rounded-xl bg-panel border border-border text-text hover:bg-accent/10 transition js-mobile-menu-toggle" id="mobileMenuBtn" aria-label="Toggle Mobile Menu">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>

      <!-- Sidebar Toggle (Desktop) -->
      <button class="hidden lg:flex size-11 items-center justify-center rounded-xl bg-panel border border-border text-text hover:bg-accent/10 transition js-sidebar-toggle" aria-label="Toggle Sidebar">
        <i data-lucide="panel-left" class="w-5 h-5"></i>
      </button>

      <!-- Search -->
      <div class="relative hidden md:block">
        <i data-lucide="search" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-muted"></i>
        <input type="text" id="globalSearch" placeholder="Search signals, pairs, markets... (⌘K)" class="w-80 pl-10 pr-4 py-2.5 rounded-xl bg-bg border border-border text-sm text-text placeholder:text-muted focus:outline-none focus:border-accent focus:ring-2 focus:ring-accent/20 transition" />
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Live Status -->
      <div class="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-500 text-[11px] font-semibold">
        <span class="live-dot !bg-emerald-500"></span>
        LIVE
      </div>

      <!-- Quick Generate Signal -->
      <button class="flex size-11 items-center justify-center rounded-xl bg-panel border border-border text-text hover:bg-accent/10 hover:border-accent/30 transition js-open-drawer" data-drawer-type="quickTrade" aria-label="Generate Signal">
        <i data-lucide="zap" class="w-5 h-5"></i>
      </button>

      <!-- Notifications -->
      <div class="dropdown">
        <button class="relative flex size-11 items-center justify-center rounded-xl bg-panel border border-border text-text hover:bg-accent/10 transition js-dropdown-toggle" aria-label="Toggle Notifications">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">5</span>
        </button>
        <div class="dropdown-menu w-75 min-[400px]:w-80 mt-2 rounded-2xl bg-panel border border-border shadow-2xl overflow-hidden max-[420px]:-left-[153px]! max-[450px]:-left-[183px]! max-[430px]:right-0!">
          <div class="p-4 border-b border-border flex items-center justify-between">
            <h2 class="text-base font-semibold text-text">Notifications</h2>
            <span class="text-xs font-medium text-accent">5 new</span>
          </div>
          <div class="max-h-72 overflow-y-auto">
            <div class="flex items-start gap-3 p-4 hover:bg-border/30 transition cursor-pointer">
              <div class="w-9 h-9 rounded-full bg-emerald-500/15 flex items-center justify-center shrink-0">
                <i data-lucide="trending-up" class="w-4 h-4 text-emerald-500"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-text truncate">New BUY signal: EUR/USD</p>
                <p class="text-xs text-muted">AI confidence 92% · 2 min ago</p>
              </div>
            </div>
            <div class="flex items-start gap-3 p-4 hover:bg-border/30 transition cursor-pointer">
              <div class="w-9 h-9 rounded-full bg-amber-500/15 flex items-center justify-center shrink-0">
                <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-500"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-text truncate">High volatility on BTC/USDT</p>
                <p class="text-xs text-muted">15 min ago</p>
              </div>
            </div>
            <div class="flex items-start gap-3 p-4 hover:bg-border/30 transition cursor-pointer">
              <div class="w-9 h-9 rounded-full bg-sky-500/15 flex items-center justify-center shrink-0">
                <i data-lucide="sparkles" class="w-4 h-4 text-sky-500"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-text truncate">AI model retrained — accuracy +3%</p>
                <p class="text-xs text-muted">1 hour ago</p>
              </div>
            </div>
          </div>
          <div class="p-3 border-t border-border">
            <button class="w-full text-center text-sm font-medium text-accent hover:underline">View all notifications</button>
          </div>
        </div>
      </div>

      <!-- Theme Toggle -->
      <button
        class="flex size-11 items-center justify-center rounded-xl bg-panel border border-border text-text hover:bg-accent/10 transition"
        id="themeToggle"
        aria-label="Toggle Theme"
        onclick="
          document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        "
      >
        <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
      </button>

      <!-- Profile Dropdown -->
      <div class="dropdown">
        <button class="flex items-center gap-2 p-1 rounded-xl hover:bg-border/50 transition js-dropdown-toggle">
          <span class="w-9 h-9 rounded-full bg-gradient-to-br from-accent to-teal-500 flex items-center justify-center">
            <span class="text-white font-semibold text-sm">AK</span>
          </span>
          <i data-lucide="chevron-down" class="w-4 h-4 text-muted hidden sm:block"></i>
        </button>
        <div class="dropdown-menu w-56 mt-2 rounded-2xl bg-panel border border-border shadow-2xl overflow-hidden p-2">
          <div class="p-3 mb-1 border-b border-border">
            <p class="font-semibold text-text">Alex Kim</p>
            <p class="text-xs text-muted">Pro Trader</p>
          </div>
          <a href="./index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-text hover:bg-accent/10 transition">
            <i data-lucide="user" class="w-4 h-4"></i>
            <span>My Profile</span>
          </a>
          <a href="./index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-text hover:bg-accent/10 transition">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span>Settings</span>
          </a>
          <a href="./index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-text hover:bg-accent/10 transition">
            <i data-lucide="help-circle" class="w-4 h-4"></i>
            <span>Help & Support</span>
          </a>
          <div class="mt-1 pt-1 border-t border-border">
            <a href="./index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-red-500 hover:bg-red-500/10 transition">
              <i data-lucide="log-out" class="w-4 h-4"></i>
              <span>Logout</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
