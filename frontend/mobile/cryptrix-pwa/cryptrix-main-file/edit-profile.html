<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="profile.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0 transition-colors hover:bg-surface/5"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h2 class="text-[17px] font-bold">Edit Profile</h2>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <div class="text-center mb-8">
            <div class="relative w-24 h-24 mx-auto mb-3">
              <div
                class="w-24 h-24 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-bg-dark text-3xl font-black"
              >
                AM
              </div>
              <button
                id="btn-change-photo"
                class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-primary flex items-center justify-center border-2 border-bg-dark transition-transform active:scale-95 cursor-pointer"
              >
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#0A0B0F"
                  stroke-width="2.5"
                >
                  <path
                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                  />
                  <circle cx="12" cy="13" r="4" />
                </svg>
              </button>
            </div>
            <div
              id="btn-change-photo-text"
              class="text-sm text-primary cursor-pointer font-semibold inline-block transition-opacity active:opacity-75"
            >
              Change Photo
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
              <label class="text-[13px] font-medium text-white/50 block mb-2"
                >First Name</label
              >
              <input
                type="text"
                class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none focus:border-primary/50 transition-colors"
                value="Alex"
              />
            </div>
            <div>
              <label class="text-[13px] font-medium text-white/50 block mb-2"
                >Last Name</label
              >
              <input
                type="text"
                class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none focus:border-primary/50 transition-colors"
                value="Mercer"
              />
            </div>
          </div>

          <div class="mb-4">
            <label class="text-[13px] font-medium text-white/50 block mb-2"
              >Email Address</label
            >
            <input
              type="email"
              class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none focus:border-primary/50 transition-colors"
              value="alex.mercer@email.com"
            />
          </div>

          <div class="mb-4">
            <label class="text-[13px] font-medium text-white/50 block mb-2"
              >Phone Number</label
            >
            <input
              type="tel"
              class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none focus:border-primary/50 transition-colors"
              value="+1 (555) 012-3456"
            />
          </div>

          <div class="mb-4">
            <label class="text-[13px] font-medium text-white/50 block mb-2"
              >Bio</label
            >
            <textarea
              class="w-full bg-surface-2 border border-white/10 rounded-card px-4 py-3 text-white text-sm focus:outline-none focus:border-primary/50 resize-none h-24 placeholder-white/30 transition-colors"
              placeholder="Tell us about yourself..."
            ></textarea>
          </div>

          <div class="mb-6">
            <label class="text-[13px] font-medium text-white/50 block mb-2"
              >Currency</label
            >
            <div class="relative">
              <select
                class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none appearance-none cursor-pointer"
              >
                <option>USD — US Dollar</option>
                <option>EUR — Euro</option>
                <option>GBP — British Pound</option>
                <option>BTC — Bitcoin</option>
              </select>
              <svg
                class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-white/40"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </div>
          </div>

          <button
            id="btn-save-profile"
            class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-primary w-full"
          >
            Save Changes
          </button>
        </div>
        <nav
  class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-surface border-t border-white/[0.08] flex items-center justify-around h-[72px] z-50"
>
  <a
    href="home.html"
    id="nav-home"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <polyline points="9 22 9 12 15 12 15 22" />
    </svg>
    <span class="text-[10px] font-semibold">Home</span>
  </a>
  <a
    href="market-overview.html"
    id="nav-market"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="22 7 13.5 15.5 8.5 10.5 1 18" />
      <polyline points="16 7 22 7 22 13" />
    </svg>
    <span class="text-[10px] font-semibold">Markets</span>
  </a>
  <a
    href="trade.html"
    id="nav-trade"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <div
      class="w-12 h-12 rounded-lg bg-primary flex flex-col items-center justify-center shadow-primary"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#000000"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="17 1 21 5 17 9" />
        <path d="M3 11V9a4 4 0 0 1 4-4h14" />
        <polyline points="7 23 3 19 7 15" />
        <path d="M21 13v2a4 4 0 0 1-4 4H3" />
      </svg>
      <span class="text-[10px] text-black font-semibold">Trade</span>
    </div>
  </a>
  <a
    href="portfolio-overview.html"
    id="nav-portfolio"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
      <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
    </svg>
    <span class="text-[10px] font-semibold">Portfolio</span>
  </a>
  <a
    href="profile.html"
    id="nav-profile"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
      <circle cx="12" cy="7" r="4" />
    </svg>
    <span class="text-[10px] font-semibold">Profile</span>
  </a>
</nav>

      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  <script defer src="index.js"></script></body>
</html>
