<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="pricing.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h2 class="text-[17px] font-bold">Checkout</h2>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <div
            class="bg-gradient-to-br from-primary/10 to-secondary/[0.06] border border-primary/20 rounded-card p-5 mb-5"
          >
            <div class="text-xs text-white/40 mb-1">Upgrading to</div>
            <div class="text-xl font-extrabold text-primary mb-1">
              Elite Plan
            </div>
            <div class="text-white/50 text-sm">
              Zero fees · AI portfolio manager · Dedicated support
            </div>
          </div>

          <div
            class="bg-surface border border-white/[0.08] rounded-card p-4 mb-5"
          >
            <div class="text-[15px] font-bold mb-4">Payment Method</div>
            <div class="flex gap-2 mb-4">
              <div
                class="px-4 py-2 text-sm font-semibold rounded-pill cursor-pointer border bg-primary text-bg-dark border-primary"
              >
                Credit Card
              </div>
              <div
                class="px-4 py-2 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                USDT
              </div>
              <div
                class="px-4 py-2 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                BTC
              </div>
            </div>

            <div class="mb-4">
              <label class="text-[13px] font-medium text-white/50 block mb-2"
                >Card Number</label
              >
              <input
                type="text"
                class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none"
                placeholder="4242 4242 4242 4242"
              />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-[13px] font-medium text-white/50 block mb-2"
                  >Expiry</label
                >
                <input
                  type="text"
                  class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none"
                  placeholder="MM/YY"
                />
              </div>
              <div>
                <label class="text-[13px] font-medium text-white/50 block mb-2"
                  >CVV</label
                >
                <input
                  type="text"
                  class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none"
                  placeholder="123"
                />
              </div>
            </div>
          </div>

          <div
            class="bg-surface border border-white/[0.08] rounded-card p-4 mb-5"
          >
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40"
                >Elite Plan (Monthly)</span
              >
              <span class="text-[13px] font-semibold text-white">$49.00</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40"
                >First Month Discount (20%)</span
              >
              <span class="text-[13px] font-semibold text-success">-$9.80</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Tax</span>
              <span class="text-[13px] font-semibold text-white">$0.00</span>
            </div>
            <div class="flex justify-between py-2.5">
              <span class="text-[13px] font-bold text-white">Total Today</span>
              <span class="text-[13px] font-bold text-primary">$39.20</span>
            </div>
          </div>

          <a
            href="payment-success.html"
            class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-primary w-full mb-3"
          >
            Pay $39.20
          </a>
          <div class="text-center text-xs text-white/30">
            Secure payment · Cancel anytime
          </div>
        </div>

        <nav
  class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-surface border-t border-white/[0.08] flex items-center justify-around h-[72px] z-50"
>
  <a
    href="home.html"
    id="nav-home"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <polyline points="9 22 9 12 15 12 15 22" />
    </svg>
    <span class="text-[10px] font-semibold">Home</span>
  </a>
  <a
    href="market-overview.html"
    id="nav-market"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="22 7 13.5 15.5 8.5 10.5 1 18" />
      <polyline points="16 7 22 7 22 13" />
    </svg>
    <span class="text-[10px] font-semibold">Markets</span>
  </a>
  <a
    href="trade.html"
    id="nav-trade"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <div
      class="w-12 h-12 rounded-lg bg-primary flex flex-col items-center justify-center shadow-primary"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#000000"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="17 1 21 5 17 9" />
        <path d="M3 11V9a4 4 0 0 1 4-4h14" />
        <polyline points="7 23 3 19 7 15" />
        <path d="M21 13v2a4 4 0 0 1-4 4H3" />
      </svg>
      <span class="text-[10px] text-black font-semibold">Trade</span>
    </div>
  </a>
  <a
    href="portfolio-overview.html"
    id="nav-portfolio"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
      <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
    </svg>
    <span class="text-[10px] font-semibold">Portfolio</span>
  </a>
  <a
    href="profile.html"
    id="nav-profile"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
      <circle cx="12" cy="7" r="4" />
    </svg>
    <span class="text-[10px] font-semibold">Profile</span>
  </a>
</nav>

      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  <script defer src="index.js"></script></body>
</html>
