<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="/assets/images/logo.png" />
    <meta name="theme-color" content="#00D4AA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="portfolio-overview.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="rtl:rotate-180"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" /></svg
          ></a>
          <h1 class="text-[17px] font-bold">Profit & Loss</h1>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-28 animate-fade-up">
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div
              class="bg-surface border border-white/[0.08] rounded-card p-4 text-center"
            >
              <div class="text-xs text-white/40 mb-1">Total Gain</div>
              <div class="text-xl font-extrabold text-success">+$12,430</div>
            </div>
            <div
              class="bg-surface border border-white/[0.08] rounded-card p-4 text-center"
            >
              <div class="text-xs text-white/40 mb-1">Total Loss</div>
              <div class="text-xl font-extrabold text-error">-$2,807</div>
            </div>
          </div>
          <div
            class="bg-surface border border-white/[0.08] rounded-card p-4 text-center mb-5"
          >
            <div class="text-xs text-white/40 mb-1">Net P&L</div>
            <div class="text-[32px] font-black text-success">+$9,623</div>
            <div class="text-sm text-success">+25.19% ROI</div>
          </div>
          <div
            class="bg-surface border border-white/[0.08] rounded-card p-4 mb-5"
          >
            <div class="text-[15px] font-bold mb-3">Monthly P&L</div>
            <div class="h-[160px]"><canvas id="pnl-chart"></canvas></div>
          </div>
          <div class="bg-surface border border-white/[0.08] rounded-card p-4">
            <div class="text-[15px] font-bold mb-4">P&L by Asset</div>
            <div id="pnl-list"></div>
          </div>
        </div>
        <include-bottom-nav />
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const d = window.AppData;
        if (!d) return;
        Charts.pnlBar("pnl-chart");
        const el = document.getElementById("pnl-list");
        if (!el) return;
        el.innerHTML = d.holdings
          .map((h) => {
            const coin = d.getCoin(h.coin);
            return (
              '<div class="flex items-center gap-3 py-2.5 border-b border-white/5">' +
              '<div class="w-8 h-8 rounded-xl flex items-center justify-center text-[9px] font-black flex-shrink-0" style="background:' +
              coin.color +
              "22;color:" +
              coin.color +
              '">' +
              h.coin.substring(0, 3) +
              "</div>" +
              '<div class="flex-1 min-w-0"><div class="text-sm font-semibold">' +
              coin.name +
              "</div></div>" +
              '<div class="text-right"><div class="text-sm font-bold text-success">+$' +
              h.pnl.toLocaleString() +
              '</div><div class="text-xs text-success">+' +
              h.pnlPct +
              "%</div></div></div>"
            );
          })
          .join("");
      });
    </script>
  </body>
</html>
