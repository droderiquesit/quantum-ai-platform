<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="/assets/images/logo.png" />
    <meta name="theme-color" content="#00D4AA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="transactions.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" /></svg
          ></a>
          <h1 class="text-[17px] font-bold">Transaction Detail</h1>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <div class="text-center mb-7">
            <div
              class="w-16 h-16 rounded-full bg-success/15 border-2 border-success/25 flex items-center justify-center mx-auto mb-3"
            >
              <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#00C896"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </div>
            <div class="text-[22px] font-extrabold">Buy Bitcoin</div>
            <div class="text-white/50 text-sm">Transaction completed</div>
          </div>
          <div
            class="bg-surface border border-white/[0.08] rounded-card p-4 mb-5"
          >
            <div class="text-[13px] text-white/40 text-center mb-2">
              Total Amount
            </div>
            <div class="text-[36px] font-black text-center text-success mb-4">
              +0.05 BTC
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Transaction ID</span>
              <span class="text-[13px] font-mono text-white/70">TX001</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Type</span>
              <span class="text-[13px] font-semibold">Market Buy</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Asset</span>
              <span class="text-[13px] font-semibold">Bitcoin (BTC)</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Amount</span>
              <span class="text-[13px] font-semibold">0.05 BTC</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Price</span>
              <span class="text-[13px] font-semibold">$42,100.00</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Total Paid</span>
              <span class="text-[13px] font-semibold">$2,105.00</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Fee</span>
              <span class="text-[13px] font-semibold">$2.11</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Date</span>
              <span class="text-[13px] font-semibold">2024-03-10 14:32</span>
            </div>
            <div class="flex justify-between py-2.5">
              <span class="text-[13px] text-white/40">Status</span>
              <span class="text-[13px] font-bold text-success"
                >✓ Completed</span
              >
            </div>
          </div>
          <div class="flex gap-3">
            <button
              onclick="showToast('TxHash copied!', 'success')"
              class="flex-1 bg-surface-2 border border-white/[0.08] rounded-btn h-11 font-semibold text-sm"
            >
              Copy TxHash
            </button>
            <a
              href="coin-detail.html?id=btc"
              class="flex-1 bg-primary text-bg-dark font-bold rounded-btn h-11 flex items-center justify-center shadow-primary"
              >View BTC</a
            >
          </div>
        </div>
        <include-bottom-nav />
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
