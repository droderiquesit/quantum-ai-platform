<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="/assets/images/logo.png" />
    <meta name="theme-color" content="#00D4AA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 pt-4 pb-4 sticky top-0 bg-bg-dark/95 backdrop-blur-sm z-10"
        >
          <h1 class="text-[24px] font-bold">Transactions</h1>
          <a
            href="transaction-filters.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
            </svg>
          </a>
        </div>

        <div class="animate-fade-up pb-24">
          <!-- Search -->
          <div class="px-5 mb-5 relative">
            <input
              type="text"
              placeholder="Search transactions..."
              class="w-full bg-surface-2 border border-white/10 rounded-xl h-[46px] pl-11 pr-4 text-sm text-white focus:outline-none focus:border-primary transition-colors placeholder-white/40"
            />
            <svg
              class="absolute left-9 top-1/2 -translate-y-1/2 text-white/40 pointer-events-none"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </div>

          <!-- Filters -->
          <div class="flex gap-2 overflow-x-auto px-5 pb-1 mb-6 scrollbar-hide">
            <div
              class="px-4 py-1.5 text-xs font-semibold rounded-pill cursor-pointer whitespace-nowrap border border-primary text-primary bg-primary/10"
            >
              All
            </div>
            <div
              class="px-4 py-1.5 text-xs font-semibold rounded-pill cursor-pointer whitespace-nowrap border bg-surface-2 text-white/60 border-white/10"
            >
              Buy
            </div>
            <div
              class="px-4 py-1.5 text-xs font-semibold rounded-pill cursor-pointer whitespace-nowrap border bg-surface-2 text-white/60 border-white/10"
            >
              Sell
            </div>
            <div
              class="px-4 py-1.5 text-xs font-semibold rounded-pill cursor-pointer whitespace-nowrap border bg-surface-2 text-white/60 border-white/10"
            >
              Deposit
            </div>
            <div
              class="px-4 py-1.5 text-xs font-semibold rounded-pill cursor-pointer whitespace-nowrap border bg-surface-2 text-white/60 border-white/10"
            >
              Withdraw
            </div>
            <div
              class="px-4 py-1.5 text-xs font-semibold rounded-pill cursor-pointer whitespace-nowrap border bg-surface-2 text-white/60 border-white/10"
            >
              Swap
            </div>
          </div>

          <!-- Summary Cards -->
          <div class="px-5 mb-6">
            <div class="grid grid-cols-3 gap-3">
              <div
                class="bg-surface border border-white/10 rounded-xl p-3 flex flex-col items-center justify-center"
              >
                <div class="text-[10px] text-white/50 mb-1 font-medium">
                  Total Trades
                </div>
                <div class="text-sm font-bold">11</div>
              </div>
              <div
                class="bg-surface border border-white/10 rounded-xl p-3 flex flex-col items-center justify-center"
              >
                <div class="text-[10px] text-white/50 mb-1 font-medium">
                  Buy Vol.
                </div>
                <div class="text-sm font-bold text-success">$6.8K</div>
              </div>
              <div
                class="bg-surface border border-white/10 rounded-xl p-3 flex flex-col items-center justify-center"
              >
                <div class="text-[10px] text-white/50 mb-1 font-medium">
                  Sell Vol.
                </div>
                <div class="text-sm font-bold text-error">$3.4K</div>
              </div>
            </div>
          </div>

          <!-- Transaction List -->
          <div class="px-5">
            <h3 class="text-sm font-bold text-white/80 mb-2">March 2024</h3>
            <div id="tx-list"></div>
          </div>
        </div>

        <include-bottom-nav />
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const d = window.AppData;
        if (!d) return;
        const el = document.getElementById("tx-list");
        if (!el) return;

        const icons = {
          buy: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>',
          sell: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF4757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>',
          deposit:
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00D4AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>',
          withdraw:
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFB800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>',
          swap: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7B61FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>',
          stake:
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>',
        };

        const txLimit = d.transactions.slice(0, 8); // To perfectly simulate the image items

        el.innerHTML = txLimit
          .map((tx) => {
            const symbol =
              tx.type === "sell" || tx.type === "withdraw" || tx.type === "swap"
                ? "-"
                : "+";
            const amountColor =
              tx.type === "sell" || tx.type === "withdraw" || tx.type === "swap"
                ? "text-error"
                : "text-success";
            const formattedDate = tx.date;

            return (
              '<a href="transaction-detail.html" class="flex items-center gap-4 py-3.5 border-b border-white/5 cursor-pointer last:border-0">' +
              '<div class="w-8 flex justify-center flex-shrink-0">' +
              (icons[tx.type] || "") +
              "</div>" +
              '<div class="flex-1 min-w-0"><div class="text-[13px] font-bold capitalize">' +
              tx.type +
              " " +
              tx.coin +
              '</div><div class="text-xs text-white/50">' +
              formattedDate +
              "</div></div>" +
              '<div class="text-right flex-shrink-0"><div class="text-[13px] font-bold ' +
              amountColor +
              '">' +
              symbol +
              "$" +
              tx.total.toLocaleString(undefined, {
                minimumFractionDigits: 0,
                maximumFractionDigits: 0,
              }) +
              '</div><span class="' +
              (tx.status === "completed"
                ? "bg-success/20 text-success"
                : "bg-warning/20 text-warning") +
              ' px-2 py-0.5 rounded-full text-[10px] font-bold capitalize mt-1 inline-block">' +
              tx.status +
              "</span></div>" +
              "</a>"
            );
          })
          .join("");
      });
    </script>
  </body>
</html>
