<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="/assets/images/logo.png" />
    <meta name="theme-color" content="#00D4AA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="transactions.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h1 class="text-[17px] font-bold">Filters</h1>
          <button
            onclick="showToast('Filters cleared', 'info')"
            class="text-primary font-bold text-sm text-right w-10"
          >
            Reset
          </button>
        </div>

        <div class="px-5 pt-5 pb-8 animate-fade-up">
          <!-- Transaction Type -->
          <div class="mb-6">
            <div class="text-[15px] font-bold mb-3">Transaction Type</div>
            <div class="flex flex-wrap gap-2">
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border border-primary text-primary bg-primary/10"
              >
                All
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                Buy
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                Sell
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                Deposit
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                Withdraw
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                Swap
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                Stake
              </div>
            </div>
          </div>

          <!-- Asset -->
          <div class="mb-6">
            <div class="text-[15px] font-bold mb-3">Asset</div>
            <div class="flex flex-wrap gap-2">
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border border-primary text-primary bg-primary/10"
              >
                All
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                BTC
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                ETH
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                BNB
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                SOL
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                AVAX
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                USDT
              </div>
            </div>
          </div>

          <!-- Date Range -->
          <div class="mb-6">
            <div class="text-[15px] font-bold mb-3">Date Range</div>
            <div class="grid grid-cols-2 gap-3 mb-3">
              <div>
                <label class="block text-xs text-white/50 mb-1.5">From</label>
                <div class="relative">
                  <input
                    type="date"
                    value="2024-03-01"
                    class="w-full bg-surface-2 border border-white/10 rounded-xl h-11 px-3.5 text-white text-sm focus:outline-none focus:border-primary transition-colors cursor-pointer"
                  />
                </div>
              </div>
              <div>
                <label class="block text-xs text-white/50 mb-1.5">To</label>
                <div class="relative">
                  <input
                    type="date"
                    value="03/15/2024"
                    class="w-full bg-surface-2 border border-white/10 rounded-xl h-11 px-3.5 text-white text-sm focus:outline-none focus:border-primary transition-colors cursor-pointer"
                  />
                </div>
              </div>
            </div>
            <div class="flex gap-2 flex-wrap">
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                7 Days
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border border-primary text-primary bg-primary/10"
              >
                30 Days
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                90 Days
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                1 Year
              </div>
            </div>
          </div>

          <!-- Status -->
          <div class="mb-6">
            <div class="text-[15px] font-bold mb-3">Status</div>
            <div class="flex flex-wrap gap-2">
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border border-primary text-primary bg-primary/10"
              >
                All
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                Completed
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                Pending
              </div>
              <div
                class="px-4 py-1.5 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                Failed
              </div>
            </div>
          </div>

          <!-- Amount Range -->
          <div class="mb-8">
            <div class="text-[15px] font-bold mb-3">Amount Range</div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-white/50 mb-1.5"
                  >Min Amount ($)</label
                >
                <input
                  type="text"
                  placeholder="0"
                  class="w-full bg-surface-2 border border-white/10 rounded-xl h-11 px-3.5 text-white text-sm focus:outline-none focus:border-primary transition-colors placeholder-white/30"
                />
              </div>
              <div>
                <label class="block text-xs text-white/50 mb-1.5"
                  >Max Amount ($)</label
                >
                <input
                  type="text"
                  placeholder="Unlimited"
                  class="w-full bg-surface-2 border border-white/10 rounded-xl h-11 px-3.5 text-white text-sm focus:outline-none focus:border-primary transition-colors placeholder-white/30"
                />
              </div>
            </div>
          </div>

          <!-- Action Button -->
          <a
            href="transactions.html"
            class="w-full bg-primary text-bg-dark font-bold rounded-btn h-[52px] flex items-center justify-center shadow-primary text-[15px]"
            >Apply Filters</a
          >
        </div>
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
