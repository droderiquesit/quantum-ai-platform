<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
      >
        <!-- Header -->
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <button
            onclick="history.back()"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </button>
          <h1 class="text-[17px] font-bold">Gainers &amp; Losers</h1>
          <div class="w-10"></div>
        </div>

        <div class="pb-24 px-5 pt-5">
          <!-- Tab bar -->
          <div class="flex bg-surface-2 rounded-card p-1 gap-1 mb-5">
            <button
              id="tab-gainers"
              onclick="switchTab('gainers')"
              class="flex-1 h-10 rounded-btn bg-success text-bg-dark font-bold text-sm transition-all"
            >
              🟢 Top Gainers
            </button>
            <button
              id="tab-losers"
              onclick="switchTab('losers')"
              class="flex-1 h-10 rounded-btn text-white/50 font-semibold text-sm transition-all"
            >
              🔴 Top Losers
            </button>
          </div>

          <!-- List -->
          <div id="gl-list"></div>
        </div>
        <include-bottom-nav />
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/gainers-losers.js"></script>
  </body>
</html>
