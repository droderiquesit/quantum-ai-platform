<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="javascript:history.back()"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="rtl:rotate-180"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" /></svg
          ></a>
          <h1 class="text-[17px] font-bold">Quick Actions</h1>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-28 animate-fade-up">
          <div class="grid grid-cols-2 gap-3">
            <a
              href="buy-crypto.html"
              class="bg-surface border border-white/[0.08] rounded-card p-5 cursor-pointer transition-all active:scale-95"
              ><div
                class="w-12 h-12 rounded-[14px] flex items-center justify-center mb-3"
                style="background: #00c89622"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#00C896"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                </svg>
              </div>
              <div class="text-sm font-bold mb-1">Buy Crypto</div>
              <div class="text-xs text-white/40">
                Purchase with card or bank
              </div></a
            ><a
              href="sell-crypto.html"
              class="bg-surface border border-white/[0.08] rounded-card p-5 cursor-pointer transition-all active:scale-95"
              ><div
                class="w-12 h-12 rounded-[14px] flex items-center justify-center mb-3"
                style="background: #ff475722"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#FF4757"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="23 18 13.5 8.5 8.5 13.5 1 6" />
                </svg>
              </div>
              <div class="text-sm font-bold mb-1">Sell Crypto</div>
              <div class="text-xs text-white/40">Convert crypto to cash</div></a
            ><a
              href="swap.html"
              class="bg-surface border border-white/[0.08] rounded-card p-5 cursor-pointer transition-all active:scale-95"
              ><div
                class="w-12 h-12 rounded-[14px] flex items-center justify-center mb-3"
                style="background: #7b61ff22"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#7B61FF"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="16 3 21 3 21 8" />
                  <line x1="4" y1="20" x2="21" y2="3" />
                </svg>
              </div>
              <div class="text-sm font-bold mb-1">Swap</div>
              <div class="text-xs text-white/40">Exchange between coins</div></a
            ><a
              href="deposit.html"
              class="bg-surface border border-white/[0.08] rounded-card p-5 cursor-pointer transition-all active:scale-95"
              ><div
                class="w-12 h-12 rounded-[14px] flex items-center justify-center mb-3"
                style="background: #00d4aa22"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#00D4AA"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="7 10 12 15 17 10" />
                </svg>
              </div>
              <div class="text-sm font-bold mb-1">Deposit</div>
              <div class="text-xs text-white/40">Add funds to account</div></a
            ><a
              href="withdraw.html"
              class="bg-surface border border-white/[0.08] rounded-card p-5 cursor-pointer transition-all active:scale-95"
              ><div
                class="w-12 h-12 rounded-[14px] flex items-center justify-center mb-3"
                style="background: #ffb80022"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#FFB800"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="17 8 12 3 7 8" />
                </svg>
              </div>
              <div class="text-sm font-bold mb-1">Withdraw</div>
              <div class="text-xs text-white/40">Send to bank or wallet</div></a
            ><a
              href="staking-dashboard.html"
              class="bg-surface border border-white/[0.08] rounded-card p-5 cursor-pointer transition-all active:scale-95"
              ><div
                class="w-12 h-12 rounded-[14px] flex items-center justify-center mb-3"
                style="background: #ff6b3522"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#FF6B35"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="8" r="6" />
                  <path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11" />
                </svg>
              </div>
              <div class="text-sm font-bold mb-1">Stake</div>
              <div class="text-xs text-white/40">Earn passive income</div></a
            ><a
              href="referral.html"
              class="bg-surface border border-white/[0.08] rounded-card p-5 cursor-pointer transition-all active:scale-95"
              ><div
                class="w-12 h-12 rounded-[14px] flex items-center justify-center mb-3"
                style="background: #9945ff22"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#9945FF"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />

                </svg>
              </div>
              <div class="text-sm font-bold mb-1">Refer & Earn</div>
              <div class="text-xs text-white/40">Get 30% commission</div></a
            ><a
              href="ai-advisor.html"
              class="bg-surface border border-white/[0.08] rounded-card p-5 cursor-pointer transition-all active:scale-95"
              ><div
                class="w-12 h-12 rounded-[14px] flex items-center justify-center mb-3"
                style="background: #f7931a22"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#F7931A"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="2" y="2" width="20" height="8" rx="2" />
                  <rect x="2" y="14" width="20" height="8" rx="2" />
                </svg>
              </div>
              <div class="text-sm font-bold mb-1">AI Advisor</div>
              <div class="text-xs text-white/40">Smart trading signals</div></a
            >
          </div>
        </div>
        <include-bottom-nav />
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script></script>
  </body>
</html>
