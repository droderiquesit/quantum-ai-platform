<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
   <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)] bg-bg-dark"
        id="app"
      >
        <div class="flex flex-col min-h-screen">
          <div class="px-5 pt-5">
            <button
              id="btn-back-forgot"
              class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center cursor-pointer transition-transform active:scale-95 hover:bg-surface/5"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
            </button>
          </div>

          <div class="flex-1 px-5 pt-10 pb-6 animate-fade-up">
            <div
              class="w-[72px] h-[72px] rounded-[20px] bg-warning/15 border-2 border-warning/20 flex items-center justify-center mb-6"
            >
              <svg
                width="36"
                height="36"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#FFB800"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </div>
            <h2 class="text-[26px] font-extrabold mb-3">Reset Password</h2>
            <p class="text-white/50 text-[15px] leading-relaxed mb-9">
              Enter your email and we'll send you instructions to reset your
              password.
            </p>

            <div class="mb-6">
              <label class="text-[13px] font-medium text-white/50 block mb-2"
                >Email Address</label
              >
              <div class="relative">
                <svg
                  class="absolute left-4 top-1/2 -translate-y-1/2 text-white/30 pointer-events-none"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                  />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
                <input
                  type="email"
                  class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 pl-11 pr-4 text-white placeholder-white/30 focus:outline-none focus:border-primary/50 transition-colors font-medium text-sm"
                  placeholder="Enter your email"
                />
              </div>
            </div>

            <a
              href="otp.html"
              class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-primary w-full mb-6"
            >
              Send Reset Link
            </a>

            <div class="text-center">
              <a
                href="signin.html"
                class="text-primary font-semibold text-sm transition-opacity hover:opacity-80"
              >
                ← Back to Sign In
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
