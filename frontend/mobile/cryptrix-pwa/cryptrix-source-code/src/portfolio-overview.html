<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="/assets/images/logo.png" />
    <meta name="theme-color" content="#00D4AA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)] bg-bg-dark"
        id="app"
      >
        <!-- Header -->
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <button
            onclick="history.back()"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </button>
          <h1 class="text-[17px] font-bold">Portfolio</h1>
          <a
            href="portfolio-rebalance.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#00D4AA"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="1" />
              <circle cx="19" cy="12" r="1" />
              <circle cx="5" cy="12" r="1" />
            </svg>
          </a>
        </div>

        <div class="pb-24">
          <!-- Hero balance card -->
          <div
            class="portfolio-card mx-5 mt-4 rounded-3xl p-6 relative overflow-hidden border border-primary/20"
          >
            <div
              class="absolute -top-10 -right-10 w-44 h-44 rounded-full opacity-10 blur-3xl bg-primary"
            ></div>
            <div
              class="absolute -bottom-8 -left-8 w-36 h-36 rounded-full opacity-10 blur-2xl bg-secondary"
            ></div>
            <div
              class="text-[13px] text-white/70 mb-2 font-medium tracking-wide relative z-10"
            >
              Total Portfolio Value
            </div>
            <div
              class="text-[42px] font-black text-white leading-none tracking-tight mb-5 relative z-10"
              id="port-total"
            >
              $47,823.56
            </div>
            <div class="grid grid-cols-3 gap-0 relative z-10">
              <div class="text-center">
                <div class="text-[11px] text-white/40 mb-1">
                  All-time P&amp;L
                </div>
                <div
                  class="text-[15px] font-extrabold text-success"
                  id="port-pnl"
                >
                  +$8,420.00
                </div>
              </div>
              <div class="border-x border-white/10 text-center">
                <div class="text-[11px] text-white/40 mb-1">ROI</div>
                <div
                  class="text-[15px] font-extrabold text-primary"
                  id="port-roi"
                >
                  +21.3%
                </div>
              </div>
              <div class="text-center">
                <div class="text-[11px] text-white/40 mb-1">Today</div>
                <div
                  class="text-[15px] font-extrabold text-success"
                  id="port-today"
                >
                  +2.4%
                </div>
              </div>
            </div>
          </div>

          <!-- Performance chart -->
          <div
            class="mx-5 mt-4 bg-surface border border-white/[0.08] rounded-card p-4"
          >
            <div class="flex items-center justify-between mb-4">
              <div class="text-[15px] font-bold">Performance</div>
              <div class="flex items-center gap-2">
                <div
                  class="flex bg-surface-2 rounded-[10px] p-1 gap-0.5"
                  id="period-btns"
                >
                  <button
                    onclick="setPeriod(this, '7D')"
                    class="period-btn h-7 px-2.5 rounded-lg text-xs font-semibold bg-primary text-bg-dark transition-all"
                  >
                    7D
                  </button>
                  <button
                    onclick="setPeriod(this, '30D')"
                    class="period-btn h-7 px-2.5 rounded-lg text-xs font-semibold text-white/50 transition-all"
                  >
                    30D
                  </button>
                  <button
                    onclick="setPeriod(this, '90D')"
                    class="period-btn h-7 px-2.5 rounded-lg text-xs font-semibold text-white/50 transition-all"
                  >
                    90D
                  </button>
                  <button
                    onclick="setPeriod(this, '1Y')"
                    class="period-btn h-7 px-2.5 rounded-lg text-xs font-semibold text-white/50 transition-all"
                  >
                    1Y
                  </button>
                </div>
                <a
                  href="portfolio-performance.html"
                  class="text-xs text-primary font-bold whitespace-nowrap"
                  >Full →</a
                >
              </div>
            </div>
            <div class="h-[150px]"><canvas id="portfolio-chart"></canvas></div>
          </div>

          <!-- Asset Allocation -->
          <div
            class="mx-5 mt-4 bg-surface border border-white/[0.08] rounded-card p-4"
          >
            <div class="flex items-center justify-between mb-4">
              <div class="text-[15px] font-bold">Asset Allocation</div>
              <a
                href="asset-allocation.html"
                class="text-[13px] text-primary font-bold"
                >Details</a
              >
            </div>
            <div class="flex items-center gap-4">
              <div class="w-[110px] h-[110px] flex-shrink-0 relative">
                <canvas id="alloc-donut"></canvas>
                <div
                  class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none"
                >
                  <div class="text-[11px] text-white/40">BTC</div>
                  <div class="text-[15px] font-extrabold">40%</div>
                </div>
              </div>
              <div
                class="flex-1 min-w-0 flex flex-col gap-1.5"
                id="alloc-legend"
              ></div>
            </div>
          </div>

          <!-- Holdings -->
          <div class="mx-5 mt-4">
            <div class="flex items-center justify-between mb-3">
              <div class="text-[15px] font-bold">Holdings</div>
              <a
                href="profit-loss.html"
                class="text-[13px] text-primary font-bold"
                >P&amp;L Details</a
              >
            </div>
            <div
              class="bg-surface border border-white/[0.08] rounded-card overflow-hidden"
              id="holdings-list"
            ></div>
          </div>

          <!-- Quick actions -->
          <div class="mx-5 mt-4 grid grid-cols-2 gap-3">
            <a
              href="buy-crypto.html"
              class="h-[50px] bg-gradient-to-r from-primary to-success text-bg-dark font-extrabold rounded-btn flex items-center justify-center gap-2 text-sm shadow-primary"
            >
              + Buy Crypto
            </a>
            <a
              href="portfolio-performance.html"
              class="h-[50px] bg-surface-2 border border-white/[0.08] text-white font-bold rounded-btn flex items-center justify-center gap-2 text-sm"
            >
              📊 Analytics
            </a>
          </div>
        </div>

        <include-bottom-nav />
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/portfolio.js"></script>
  </body>
</html>
