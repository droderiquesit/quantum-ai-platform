<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="/assets/images/logo.png" />
    <meta name="theme-color" content="#00D4AA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)] bg-bg-dark"
        id="app"
      >
        <!-- Header -->
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-surface border-b border-white/5 z-10"
        >
          <a
            href="trade.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/5 flex items-center justify-center flex-shrink-0 transition-all active:scale-95"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="rtl:rotate-180"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h1 class="text-[17px] font-bold text-white">Limit Order</h1>
          <div class="w-10"></div>
        </div>

        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <!-- Buy/Sell Switch -->
          <div
            class="flex bg-surface border border-white/5 rounded-[18px] p-1.5 gap-1.5 mb-6 shadow-sm"
          >
            <button
              class="flex-1 h-11 rounded-xl text-[13px] font-black bg-[#00D4AA] text-[#0A0B0F] shadow-sm shadow-[#00D4AA]/20"
            >
              Buy Limit
            </button>
            <a
              href="stop-loss-tp.html"
              class="flex-1 h-11 rounded-xl text-[13px] font-bold text-white/50 flex items-center justify-center hover:bg-surface-2"
              >Stop Loss</a
            >
          </div>

          <!-- Asset Picker -->
          <div
            id="asset-selector"
            onclick="window.showCoinPickerSheet(updateLimitCoin)"
            class="bg-surface rounded-[24px] p-4 mb-6 border border-white/5 shadow-sm flex items-center gap-4 cursor-pointer hover:bg-surface-2 transition-all active:scale-[0.98]"
          >
            <div
              id="limit-coin-icon"
              class="w-12 h-12 rounded-[18px] flex items-center justify-center text-[10px] font-black"
              style="background: #f7931a15; color: #f7931a"
            >
              BTC
            </div>
            <div class="flex-1">
              <div id="limit-coin-pair" class="text-base font-black text-white">
                BTC / USDT
              </div>
              <div
                id="limit-coin-price"
                class="text-[13px] text-success font-bold"
              >
                $43,900.24
              </div>
            </div>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#64748b"
              stroke-width="3"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </div>

          <!-- Price Input -->
          <div class="mb-5">
            <div class="flex justify-between items-center mb-2.5 px-1">
              <label class="text-[13px] font-bold text-white/50"
                >Limit Price</label
              >
              <span class="text-[11px] text-white/50 font-medium"
                >Market:
                <span id="market-price-hint" class="text-white font-bold"
                  >$43,900</span
                ></span
              >
            </div>
            <div class="relative">
              <input
                type="number"
                id="limit-price-input"
                class="w-full bg-surface border border-white/5 rounded-[20px] h-16 px-5 pr-24 text-white text-[20px] font-black focus:outline-none focus:ring-2 focus:ring-[#00D4AA]/20 transition-all"
                value="41500"
                oninput="calcDiff(this.value)"
              />
              <div
                class="absolute right-3 top-1/2 -translate-y-1/2 px-4 h-10 flex items-center bg-surface-2 border border-white/5 rounded-xl text-sm font-black text-white/50"
              >
                USDT
              </div>
            </div>
            <div
              id="price-diff"
              class="text-[12px] text-[#00D4AA] mt-2.5 font-bold px-1"
            >
              -5.46% below market
            </div>
          </div>

          <!-- Amount Input -->
          <div class="mb-6">
            <div class="flex justify-between items-center mb-2.5 px-1">
              <label class="text-[13px] font-bold text-white/50">Amount</label>
              <span class="text-[11px] text-white/50 font-medium"
                >Max:
                <span class="text-[#00D4AA] font-bold">$12,450</span></span
              >
            </div>
            <div class="relative">
              <input
                type="number"
                class="w-full bg-surface border border-white/5 rounded-[20px] h-16 px-5 pr-24 text-white text-[20px] font-black focus:outline-none focus:ring-2 focus:ring-[#00D4AA]/20 transition-all"
                value="0.02"
              />
              <div
                id="limit-symbol-badge"
                class="absolute right-3 top-1/2 -translate-y-1/2 px-4 h-10 flex items-center bg-surface-2 border border-white/5 rounded-xl text-sm font-black text-white/50"
              >
                BTC
              </div>
            </div>
          </div>

          <!-- Summary Card -->
          <div
            class="bg-surface rounded-[24px] p-5 mb-8 border border-white/5 shadow-sm"
          >
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/50 font-medium"
                >Order Value</span
              >
              <span class="text-[13px] font-bold text-white">$830.00 USDT</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/50 font-medium"
                >Order Expiry</span
              >
              <span class="text-[13px] font-bold text-white"
                >Good Till Cancelled</span
              >
            </div>
            <div class="flex justify-between py-2.5">
              <span class="text-[13px] text-white/50 font-medium">Max Fee</span>
              <span class="text-[13px] font-black text-[#00D4AA]"
                >$0.83 USDT</span
              >
            </div>
          </div>

          <a
            href="order-confirmation.html"
            class="bg-[#00D4AA] text-[#0A0B0F] font-extrabold rounded-[18px] h-14 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg shadow-[#00D4AA]/20 w-full text-[15px]"
          >
            Place Limit Order
          </a>
        </div>
        <include-bottom-nav />
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script>
      let currentLimitCoin = window.AppData.coins[0]; // BTC

      function updateLimitCoin(id) {
        const coin = window.AppData.coins.find((c) => c.id === id);
        if (!coin) return;
        currentLimitCoin = coin;

        document.getElementById("limit-coin-icon").style.background =
          coin.color + "15";
        document.getElementById("limit-coin-icon").style.color = coin.color;
        document.getElementById("limit-coin-icon").textContent =
          coin.symbol.substring(0, 3);
        document.getElementById("limit-coin-pair").textContent =
          `${coin.symbol} / USDT`;
        document.getElementById("limit-coin-price").textContent = formatPrice(
          coin.price,
        );
        document.getElementById("market-price-hint").textContent = formatPrice(
          coin.price,
        );
        document.getElementById("limit-symbol-badge").textContent = coin.symbol;

        calcDiff(document.getElementById("limit-price-input").value);
        showToast(`${coin.name} selected`, "info");
      }

      function calcDiff(val) {
        const price = parseFloat(val) || 0;
        const diff =
          ((price - currentLimitCoin.price) / currentLimitCoin.price) * 100;
        const el = document.getElementById("price-diff");
        el.textContent = `${diff >= 0 ? "+" : ""}${diff.toFixed(2)}% ${diff >= 0 ? "above" : "below"} market`;
        el.className = `text-[12px] ${diff >= 0 ? "text-[#FF4757]" : "text-[#00D4AA]"} mt-2.5 font-bold px-1`;
      }
    </script>
  </body>
</html>
