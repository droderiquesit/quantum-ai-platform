<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="min-h-screen bg-bg-dark flex flex-col relative overflow-hidden"
        >
          <!-- BG decorations -->
          <div
            class="absolute -top-20 -right-20 w-72 h-72 rounded-full pointer-events-none"
            style="
              background: radial-gradient(
                circle,
                rgba(0, 212, 170, 0.12),
                transparent 70%
              );
            "
          ></div>
          <div
            class="absolute top-32 -left-24 w-60 h-60 rounded-full pointer-events-none"
            style="
              background: radial-gradient(
                circle,
                rgba(123, 97, 255, 0.08),
                transparent 70%
              );
            "
          ></div>

          <!-- Hero -->
          <div
            class="flex-1 flex flex-col items-center justify-center px-8 pt-10 pb-6 text-center animate-fade-up"
          >
            <div class="flex items-center justify-center mb-6">
              <img
                src="./assets/images/logo-192.png"
                alt="logo"
                class="size-30"
              />
            </div>
            <h1
              class="text-[36px] font-black tracking-tight leading-[1.1] mb-4"
            >
              Invest Smarter<br /><span
                class="bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent"
                >with AI</span
              >
            </h1>
            <p class="text-white/60 text-base leading-relaxed max-w-[300px]">
              Real-time market intelligence, AI-powered signals, and seamless
              trading — all in one app.
            </p>
            <!-- Stats -->
            <div
              class="flex gap-6 mt-9 px-6 py-4 bg-surface/5 backdrop-blur-xl border border-white/10 rounded-card"
            >
              <div class="text-center">
                <div class="text-xl font-extrabold text-primary">$2.4B+</div>
                <div class="text-[11px] text-white/40">Volume</div>
              </div>
              <div class="w-px bg-surface/10"></div>
              <div class="text-center">
                <div class="text-xl font-extrabold text-secondary">500K+</div>
                <div class="text-[11px] text-white/40">Traders</div>
              </div>
              <div class="w-px bg-surface/10"></div>
              <div class="text-center">
                <div class="text-xl font-extrabold text-success">98.7%</div>
                <div class="text-[11px] text-white/40">Uptime</div>
              </div>
            </div>
          </div>

          <!-- CTAs -->
          <div class="px-6 pb-12">
            <a
              href="onboarding-1.html"
              class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-primary w-full mb-3 text-base"
            >
              Get Started Free
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14M12 5l7 7-7 7" />
              </svg>
            </a>
            <a
              href="signin.html"
              class="bg-surface-2 text-white border border-white/[0.08] rounded-btn h-12 flex items-center justify-center gap-2 transition-all active:scale-95 w-full text-base font-semibold"
            >
              Sign In to Account
            </a>
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>

    <script></script>
  </body>
</html>
