<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="/assets/images/logo.png" />
    <meta name="theme-color" content="#00D4AA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="watchlist.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h2 class="text-[17px] font-bold">Price Alerts</h2>
          <button
            onclick="showToast('Create alert coming soon', 'info')"
            class="w-10 h-10 rounded-xl bg-primary/15 border border-primary/20 flex items-center justify-center"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#00D4AA"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
        </div>
        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <div id="alerts-list"></div>
          <div class="mt-6">
            <button
              onclick="showToast('New alert created!', 'success')"
              class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-primary w-full"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              Create New Alert
            </button>
          </div>
        </div>
        <include-bottom-nav />
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const d = window.AppData;
        if (!d) return;
        const el = document.getElementById("alerts-list");
        if (!el) return;
        el.innerHTML = d.priceAlerts
          .map((a) => {
            const coin = d.getCoin(a.coin);
            if (!coin) return "";
            return (
              '<div class="flex items-center gap-3 p-4 bg-surface border border-white/[0.08] rounded-[20px] mb-3">' +
              '<div class="w-10 h-10 rounded-xl flex items-center justify-center text-[10px] font-black flex-shrink-0" style="background:' +
              coin.color +
              "22;color:" +
              coin.color +
              '">' +
              coin.symbol.substring(0, 3) +
              "</div>" +
              '<div class="flex-1">' +
              '<div class="text-[15px] font-bold">' +
              coin.name +
              "</div>" +
              '<div class="text-[11px] text-white/40 uppercase tracking-widest mt-0.5">' +
              a.condition +
              " price " +
              d.formatPrice(a.price) +
              "</div>" +
              "</div>" +
              '<div class="flex items-center gap-3">' +
              '<div class="form-switch inline-flex items-center cursor-pointer">' +
              '<input type="checkbox" class="sr-only peer" ' +
              (a.active ? "checked" : "") +
              " onchange=\"showToast('Alert status updated', 'success')\">" +
              "<div class=\"w-11 h-6 bg-surface/10 rounded-full peer peer-checked:bg-primary transition-colors relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-surface after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full\"></div>" +
              "</div>" +
              "<button class=\"w-8 h-8 rounded-lg bg-surface-2 flex items-center justify-center text-error/60\" onclick=\"showToast('Alert deleted', 'info')\">" +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>' +
              "</button>" +
              "</div>" +
              "</div>"
            );
          })
          .join("");
      });
    </script>
  </body>
</html>
