qip-reasoning-engine = { path = "crates/services/qip-reasoning-engine" }
qip-simulation-engine = { path = "crates/services/qip-simulation-engine" }
qip-optimization-engine = { path = "crates/services/qip-optimization-engine" }
qip-portfolio-engine = { path = "crates/services/qip-portfolio-engine" }
