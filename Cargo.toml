# Quantum AI Investment Platform — Cargo workspace.
#
# Architectural boundaries are enforced by the compiler: a crate can only reach
# what it declares in `[dependencies]`. See docs/adr/0002-monorepo-crate-layout.md.
[workspace]
resolver = "3"
members = [
    # --- libraries: shared, dependency-light, no I/O side effects ---
    "crates/libs/qip-core",
    "crates/libs/qip-numerics",
    "crates/libs/qip-events",
    "crates/libs/qip-financial",
    "crates/libs/qip-observability",
    "crates/libs/qip-storage",
    "crates/libs/qip-market",
    "crates/libs/qip-portfolio",
    "crates/libs/qip-risk",
    "crates/libs/qip-ai",
    "crates/libs/qip-agents",
    "crates/libs/qip-quantum",
    "crates/libs/qip-contracts",
    "crates/libs/qip-compliance",

    # --- source-adjacent edge cells: the hot execution path ---
    "crates/edge/qip-protocols",
    "crates/edge/qip-sequencing",
    "crates/edge/qip-orderbook",
    "crates/edge/qip-feature-dag",
    "crates/edge/qip-strategy",
    "crates/edge/qip-arbitrage",
    "crates/edge/qip-routing",
    "crates/edge/qip-edge",

    # --- domain services: each owns one stage of the intelligence loop ---
    "crates/services/qip-data-finder",
    "crates/services/qip-market-ingestion",
    "crates/services/qip-normalization",
    "crates/services/qip-entity-resolution",
    "crates/services/qip-world-model",
    "crates/services/qip-opportunity-engine",
    "crates/services/qip-reasoning-engine",
    "crates/services/qip-simulation-engine",
    "crates/services/qip-optimization-engine",
    "crates/services/qip-portfolio-engine",
    "crates/services/qip-risk-engine",
    "crates/services/qip-execution-engine",
    "crates/services/qip-learning-engine",
    "crates/services/qip-mesh",
    "crates/services/qip-chain",
    "crates/services/qip-prediction",
    "crates/services/qip-lifecycle",
    "crates/services/qip-capital",
    "crates/services/qip-cost-router",
    "crates/services/qip-twin",
    "crates/services/qip-capital-fabric",
    "crates/services/qip-streaming",
    "crates/services/qip-training",
    "crates/services/qip-brokers",
    "crates/services/qip-evolution",

    # --- investment agent organization ---
    "crates/agents/qip-investment-agents",

    # --- quantitative research ---
    "crates/quant/qip-quant",

    # --- composition root ---
    "crates/runtime/qip-kernel",

    # --- workspace-level tests ---
    "crates/tests/qip-acceptance",

    # --- deployable binaries ---
    "crates/apps/qip-api",
    "crates/apps/qip-web",
    "crates/apps/qip-cli",
    "crates/apps/qip-fastbrain",
    "crates/apps/qip-deepbrain",
    "crates/apps/qip-edge-node",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/droderiquesit/quantum-ai-platform"
authors = ["Quantum AI Platform Engineering"]

# Third-party surface is deliberately limited to serialization. Everything else
# (HTTP, numerics, hashing, RNG, quantum simulation) is implemented in-tree so
# the platform is auditable, reproducible and offline-buildable.
# See docs/adr/0003-dependency-policy.md.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

qip-core = { path = "crates/libs/qip-core" }
qip-numerics = { path = "crates/libs/qip-numerics" }
qip-events = { path = "crates/libs/qip-events" }
