# Continuous integration.
#
# The gates are ordered cheapest-first so a formatting mistake fails in seconds
# rather than after the test suite. Every gate is a hard failure: a warning
# nobody has to fix is a warning everybody stops reading.
name: ci

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

# The default token can read the repository and nothing else. Any job needing
# more asks for it explicitly, so the blast radius of a compromised action is
# visible in the diff that granted it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail on any warning. The workspace lint set already denies the ones that
  # matter; this catches the rest before they accumulate.
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  lint:
    name: clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # `--no-fail-fast` because without it cargo stops at the first failing
      # test binary and the totals then describe a fraction of the suite: a run
      # reporting 64 passed out of 3,000-odd reads as a small suite rather than
      # an aborted one. Every other gate's evidence depends on this one being
      # complete — a financial limit whose vetoing fixture regressed is invisible
      # if an earlier binary aborted the run before reaching it.
      - run: cargo test --workspace --all-features --no-fail-fast

  # The build that would actually be deployed. Run separately from the tests
  # because a release build catches optimisation-dependent problems the debug
  # build does not, and because a green test suite that cannot be released is
  # not a green build.
  release-build:
    name: release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo build --workspace --release --locked

  # The dependency policy, enforced. The platform depends on serde and
  # serde_json and nothing else; a pull request adding a third dependency has
  # to change this check deliberately rather than slip past review.
  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: ./scripts/check-dependencies.sh

  # Vulnerabilities in what we do depend on. `cargo audit` needs the advisory
  # database, so this job is the one place the build reaches the network for
  # anything other than the toolchain.
  security-audit:
    name: security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  # `cargo audit` reads only the advisory database; it has no opinion on a
  # licence or a duplicate version, and `scripts/check-dependencies.sh` checks
  # only crate *names* against the eleven permitted in `Cargo.lock`, not the
  # versions or licences behind them. `deny.toml` closes that: it repeats the
  # same eleven-name allowlist in a format `cargo deny` enforces on its own
  # rather than trusting the shell script's arithmetic, and it fails on a
  # licence outside the observed MIT/Apache-2.0/Unicode-3.0/Unlicense set, a
  # duplicate version of a permitted crate, or a dependency from a registry or
  # git remote other than crates.io.
  dependency-supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  # A software bill of materials for every release build, so an operator can
  # answer "is this affected" without guessing.
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "backend/**/*.cdx.json"
          retention-days: 90


  # The browser layer, gated like the Rust workspace. One npm tree at
  # frontend/ covers the portal and the shared packages; the landing keeps
  # its own tree deliberately (ADR 0015/0016), so it is a separate job and
  # one surface failing does not hide the other.
  frontend-portal:
    name: portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The committed token CSS must match the design-tokens package; drift
      # here is the two-surfaces-two-shades bug the generator exists to stop.
      - run: npm run tokens:check
      - run: npx tsc --noEmit
        working-directory: frontend/portal
      - run: npm run lint --workspace portal
      - run: npm run build --workspace portal
      - name: behavioural suite
        working-directory: frontend/portal
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  frontend-landing:
    name: landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/landing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: behavioural suite
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  # Dependency vulnerabilities across every lockfile in the monorepo, plus
  # IaC misconfiguration. Licensed template packages and the committed
  # architecture document are excluded: findings there are not actionable
  # without breaking ADR 0015's fidelity guarantee. cargo audit already
  # covers the Rust tree with the advisory database; this covers the rest.
  trivy:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installed from Aqua's signed apt repository rather than a marketplace
      # action: the action's version tags have moved before, and a gate that
      # fails on "unable to resolve action" is a gate testing nothing.
      - name: install trivy
        run: |
          set -euo pipefail
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy
      - name: scan
        run: |
          # check-secrets.sh is skipped for the same reason it excludes
          # itself from its own scan: it contains the detection patterns,
          # and a scanner that flags another scanner's regex as a leaked
          # key produces exactly one thing — a red build nobody believes.
          trivy fs \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --skip-dirs vendor,docs/architecture/capital-ai-v4 \
            --skip-files scripts/check-secrets.sh \
            .

  # The meta-linter: actionlint on the workflows, shellcheck on the gate
  # scripts, hadolint on the Dockerfile, gitleaks over the tree. Scope and
  # exclusions live in .trunk/trunk.yaml where they are reviewed like code.
  trunk:
    name: trunk meta-linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: trunk-io/trunk-action@v1
        with:
          arguments: --all --no-progress

  # Infrastructure is code and gets the same treatment. `terraform validate`
  # catches a malformed configuration; the structural checks in the Rust test
  # suite catch a well-formed one that would deploy something unsafe.
  infrastructure:
    name: infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: format
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      # The per-environment inputs, which until now nothing read.
      #
      # `infrastructure/environments/` is a *sibling* of the directory the two
      # steps around this one work in: the format step above is
      # `-chdir=infrastructure/terraform` and recurses only under it, and
      # `terraform validate` does not open a tfvars file at all — it checks the
      # configuration, not the values handed to it. So a
      # `terraform.tfvars` that was not even parseable passed this job, and the
      # first thing to notice would have been the apply an operator dispatched.
      #
      # `terraform fmt` parses HCL to reformat it, which is exactly the check
      # wanted, and it reads `.tfvars` as well as `.tf`. Pointed at the
      # environments directory it covers all four files, so the parser this
      # needs already exists and none is written here.
      #
      # Three exits, and they mean different things: 0 admits, 3 is valid HCL
      # in non-canonical layout and prints only the file name, 2 is a parse
      # error and prints terraform's own diagnostic. The message below exists
      # because a bare file name with no explanation is the kind of red build
      # people re-run rather than read.
      #
      # What this does **not** do, said plainly so the next reader does not
      # retire the other half: it does not screen the *values*. A project id
      # carrying `$(…)` or a backtick is a perfectly valid HCL string and is
      # admitted here. What refuses that is the charset guard each workflow
      # runs over what its own `sed` pulled out of this file before pasting it
      # anywhere. Neither check subsumes the other — this one catches the file
      # a workflow could not read at all, that one catches the file it could
      # read too well.
      - name: the environment tfvars parse
        run: |
          set -euo pipefail
          if ! terraform fmt -check -recursive infrastructure/environments; then
            echo >&2
            echo "an environment's terraform.tfvars is not valid HCL, or is not in canonical format." >&2
            echo "A parse error is printed above with its line; a bare file name means only that" >&2
            echo "'terraform fmt infrastructure/environments' would rewrite it." >&2
            echo "These files are what infra.yml, deploy.yml, vendor.yml and scripts/bootstrap-deploy.sh" >&2
            echo "derive every identity value from, and what every plan is given as its var-file." >&2
            exit 1
          fi
          echo "every environment's terraform.tfvars parses as HCL and is in canonical format"
      - name: validate
        run: |
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate
      # `validate` accepts a module using a provider it never declared; only
      # `plan` refuses it, and `plan` needs credentials CI does not have. So
      # that class of error passes here and fails on the day somebody applies
      # — which is exactly what happened with `modules/ai` and `google-beta`.
      # This is the static check that closes it.
      - name: provider declarations
        run: ./scripts/check-terraform-providers.sh

  # The secrets check runs on the diff, not the history: a secret already
  # committed needs rotating rather than a failing build, and a build that
  # fails forever on an old commit is a build people learn to ignore.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/check-secrets.sh
