# Continuous integration.
#
# The gates are ordered cheapest-first so a formatting mistake fails in seconds
# rather than after the test suite. Every gate is a hard failure: a warning
# nobody has to fix is a warning everybody stops reading.
name: ci

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

# The default token can read the repository and nothing else. Any job needing
# more asks for it explicitly, so the blast radius of a compromised action is
# visible in the diff that granted it.
permissions:
  contents: read

# A push on top of a push cancels the run it superseded. The account runs at
# most twenty jobs at once and this workflow has nineteen; a branch with an
# open pull request starts two runs per push (the push and the pull request),
# so a second push while the first pair is still running queued its jobs
# behind theirs — in run 950 the test job waited 95 s for a runner before its
# first step. The result of the superseded run was never going to be read.
# main is excepted: deploy.yml waits on ci for the exact commit it ships, and
# a cancelled run on main is a commit that can never deploy.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Fail on any warning. The workspace lint set already denies the ones that
  # matter; this catches the rest before they accumulate.
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  lint:
    name: clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The suite's time was execution, not compilation: ci run 941 compiled
      # in 6m40s and then ran 767 test binaries one after another for 35
      # minutes, four of them (tape, resilience, manifest_wiring and
      # qip-deepbrain's unit tests) for 31 of those minutes, each dominated by
      # one long, compute-bound test running as unoptimised debug code.
      # opt-level 1 makes those tests run as optimised code while keeping
      # debug-assertions and overflow-checks on — they are separate profile
      # keys and stay at the test profile's defaults, so an overflow a test
      # would have caught still panics.
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      # Line tables only, not full debug info. ci run 948 (the first with
      # opt-level 1) died compiling `qip-data-finder`'s tests with "No space
      # left on device" and 19 MB free: 767 optimised test binaries each
      # carrying full DWARF filled the runner's disk before one test ran.
      # Line tables keep file and line in every panic and backtrace, which is
      # what a failing test needs; variable-level debug info is what a
      # debugger needs, and nothing here attaches one.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      # cargo-nextest, pinned, and the digest of its release tarball. The
      # tarball is nextest's own release asset for this exact version, so a
      # tag that moved or a mirror that served something else fails the
      # checksum rather than running.
      NEXTEST_VERSION: "0.9.146"
      NEXTEST_SHA256: "682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428"
    steps:
      # The standard runner leaves ~14 GB free; these preinstalled SDKs are
      # ~20 GB this job never uses, and 767 optimised test binaries do not
      # fit beside them (run 948 died at 19 MB free). The removal takes
      # 60-100 s of disk I/O and nothing below needs the space until the
      # build, so it runs in the background while the checkout, toolchain
      # and cache restore go on, and the step before the build waits for it.
      - name: start freeing the runner's disk for the test build
        working-directory: /
        run: |
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/free-disk.pid"
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # cache-on-failure, because a run whose tests failed still compiled
      # every dependency, and a cache saved only on success means the run
      # that fixes the failure compiles them all again: runs 948, 949 and 950
      # each built the whole tree from nothing for exactly this reason.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      # cargo-nextest runs every test of every binary in parallel across the
      # runner's cores, where `cargo test` runs the binaries one at a time; a
      # long test in one binary then overlaps the others instead of queueing
      # them. Run 949: 9,248 tests in 297 s, against 35 minutes serially.
      #
      # Installed from nextest's release tarball, checked against the digest
      # above, rather than `cargo install`: building it from source took
      # 3m59s of the job in runs 949 and 950 — a quarter of the budget, spent
      # before a test ran. The version check first keeps a cached binary.
      - name: install cargo-nextest
        run: |
          set -euo pipefail
          if cargo nextest --version 2>/dev/null | grep -q "^cargo-nextest $NEXTEST_VERSION "; then
            echo "cargo-nextest $NEXTEST_VERSION is already installed"
            exit 0
          fi
          curl -sSfL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin" cargo-nextest
          cargo nextest --version
      # `kill -0` cannot be used here: the process is root's, so from the
      # runner's user it answers EPERM whether or not it is still running.
      - name: wait for the disk to be freed
        run: |
          while [ -d "/proc/$(cat "$RUNNER_TEMP/free-disk.pid")" ]; do sleep 2; done
          df -h /
      # The whole workspace, every time — pull requests included. `--no-fail-fast`
      # because a run that stops at the first failure reports a fraction of the
      # suite: a financial limit whose vetoing fixture regressed is invisible
      # if an earlier binary aborted the run before reaching it.
      - name: the whole workspace's tests, in parallel
        run: cargo nextest run --workspace --all-features --no-fail-fast
      # The schema compatibility gate (CICD-070). The suite above proves each
      # fabric-bound body still has the shape its row in schemas.lock.json
      # records, and that is a comparison of the tree with itself: a row
      # regenerated in place after a field was removed passes it, at the
      # version every consumer already trusts. This step compares the lock
      # with the one on the commit the pull request would merge into, and
      # exits 3 when a field was removed, renamed or retyped without a version
      # bump. A field that was only added passes.
      #
      # Pull requests only, because "the base" is a fact only a pull request
      # has. The base commit is fetched by its id rather than by a branch
      # name, so the comparison is with what this run was opened against and
      # not with wherever the branch has moved since.
      - name: schema compatibility against the base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:backend/crates/libs/qip-events/schemas.lock.json" > "$RUNNER_TEMP/base.lock.json"
          cargo run --quiet -p qip-cli --bin qip -- event-fabric schema-gate \
            --base "$RUNNER_TEMP/base.lock.json" \
            --head crates/libs/qip-events/schemas.lock.json

  # nextest does not run doctests; `cargo test --doc` does, and only those.
  # Its own job rather than a step after the suite: it compiles every
  # library a second time in doctest mode, and run beside the suite that
  # time overlaps the test job instead of extending it. Same profile as the
  # test job, for the same reasons, so the two builds agree on what they
  # measured.
  doctest:
    name: doctests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      - run: cargo test --workspace --all-features --doc --no-fail-fast

  # CICD-102: Validate that environment configuration only pins digests
  # with valid Binary Authorization attestations.
  attestation-check:
    name: attestation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-attestations.sh

  # The build that would actually be deployed. Run separately from the tests
  # because a release build catches optimisation-dependent problems the debug
  # build does not, and because a green test suite that cannot be released is
  # not a green build.
  release-build:
    name: release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo build --workspace --release --locked

  # The dependency policy, enforced. The platform depends on serde and
  # serde_json and nothing else; a pull request adding a third dependency has
  # to change this check deliberately rather than slip past review.
  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: ./scripts/check-dependencies.sh

  # Vulnerabilities in what we do depend on. `cargo audit` needs the advisory
  # database, so this job is the one place the build reaches the network for
  # anything other than the toolchain.
  security-audit:
    name: security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # rust-cache keeps ~/.cargo/bin between runs, so the binary each of
      # these three jobs installs is built from source once per Cargo.lock
      # and restored after: run 950 spent 2m02s, 1m53s and 1m01s building
      # cargo-audit, cargo-deny and cargo-cyclonedx before checking anything.
      # The version check first is what makes the restore count.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      - run: cargo audit --version >/dev/null 2>&1 || cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  # `cargo audit` reads only the advisory database; it has no opinion on a
  # licence or a duplicate version, and `scripts/check-dependencies.sh` checks
  # only crate *names* against the eleven permitted in `Cargo.lock`, not the
  # versions or licences behind them. `deny.toml` closes that: it repeats the
  # same eleven-name allowlist in a format `cargo deny` enforces on its own
  # rather than trusting the shell script's arithmetic, and it fails on a
  # licence outside the observed MIT/Apache-2.0/Unicode-3.0/Unlicense set, a
  # duplicate version of a permitted crate, or a dependency from a registry or
  # git remote other than crates.io.
  dependency-supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      - run: cargo deny --version >/dev/null 2>&1 || cargo install cargo-deny --locked
      - run: cargo deny check

  # A software bill of materials for every release build, so an operator can
  # answer "is this affected" without guessing.
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      - run: cargo cyclonedx --version >/dev/null 2>&1 || cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "backend/**/*.cdx.json"
          retention-days: 90


  # The browser layer, gated like the Rust workspace. One npm tree at
  # frontend/ covers the portal and the shared packages; the landing keeps
  # its own tree deliberately (ADR 0015/0016), so it is a separate job and
  # one surface failing does not hide the other.
  frontend-portal:
    name: portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The committed token CSS must match the design-tokens package; drift
      # here is the two-surfaces-two-shades bug the generator exists to stop.
      - run: npm run tokens:check
      - run: npx tsc --noEmit
        working-directory: frontend/portal
      - run: npm run lint --workspace portal
      - run: npm run build --workspace portal
      - name: behavioural suite
        working-directory: frontend/portal
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  frontend-landing:
    name: landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/landing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: behavioural suite
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  # Dependency vulnerabilities across every lockfile in the monorepo, plus
  # IaC misconfiguration. Licensed template packages and the committed
  # architecture document are excluded: findings there are not actionable
  # without breaking ADR 0015's fidelity guarantee. cargo audit already
  # covers the Rust tree with the advisory database; this covers the rest.
  trivy:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installed from Aqua's signed apt repository rather than a marketplace
      # action: the action's version tags have moved before, and a gate that
      # fails on "unable to resolve action" is a gate testing nothing.
      - name: install trivy
        run: |
          set -euo pipefail
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy
      - name: scan
        run: |
          # check-secrets.sh is skipped for the same reason it excludes
          # itself from its own scan: it contains the detection patterns,
          # and a scanner that flags another scanner's regex as a leaked
          # key produces exactly one thing — a red build nobody believes.
          trivy fs \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --skip-dirs vendor,docs/architecture/capital-ai-v4 \
            --skip-files scripts/check-secrets.sh \
            .

  # The meta-linter: actionlint on the workflows, shellcheck on the gate
  # scripts, hadolint on the Dockerfile, gitleaks over the tree. Scope and
  # exclusions live in .trunk/trunk.yaml where they are reviewed like code.
  trunk:
    name: trunk meta-linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: trunk-io/trunk-action@v1
        with:
          arguments: --all --no-progress

  # Infrastructure is code and gets the same treatment. `terraform validate`
  # catches a malformed configuration; the structural checks in the Rust test
  # suite catch a well-formed one that would deploy something unsafe.
  infrastructure:
    name: infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: format
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      # The per-environment inputs, which until now nothing read.
      #
      # `infrastructure/environments/` is a *sibling* of the directory the two
      # steps around this one work in: the format step above is
      # `-chdir=infrastructure/terraform` and recurses only under it, and
      # `terraform validate` does not open a tfvars file at all — it checks the
      # configuration, not the values handed to it. So a
      # `terraform.tfvars` that was not even parseable passed this job, and the
      # first thing to notice would have been the apply an operator dispatched.
      #
      # `terraform fmt` parses HCL to reformat it, which is exactly the check
      # wanted, and it reads `.tfvars` as well as `.tf`. Pointed at the
      # environments directory it covers all four files, so the parser this
      # needs already exists and none is written here.
      #
      # Three exits, and they mean different things: 0 admits, 3 is valid HCL
      # in non-canonical layout and prints only the file name, 2 is a parse
      # error and prints terraform's own diagnostic. The message below exists
      # because a bare file name with no explanation is the kind of red build
      # people re-run rather than read.
      #
      # What this does **not** do, said plainly so the next reader does not
      # retire the other half: it does not screen the *values*. A project id
      # carrying `$(…)` or a backtick is a perfectly valid HCL string and is
      # admitted here. What refuses that is the charset guard each workflow
      # runs over what its own `sed` pulled out of this file before pasting it
      # anywhere. Neither check subsumes the other — this one catches the file
      # a workflow could not read at all, that one catches the file it could
      # read too well.
      - name: the environment tfvars parse
        run: |
          set -euo pipefail
          if ! terraform fmt -check -recursive infrastructure/environments; then
            echo >&2
            echo "an environment's terraform.tfvars is not valid HCL, or is not in canonical format." >&2
            echo "A parse error is printed above with its line; a bare file name means only that" >&2
            echo "'terraform fmt infrastructure/environments' would rewrite it." >&2
            echo "These files are what infra.yml, deploy.yml, vendor.yml and scripts/bootstrap-deploy.sh" >&2
            echo "derive every identity value from, and what every plan is given as its var-file." >&2
            exit 1
          fi
          echo "every environment's terraform.tfvars parses as HCL and is in canonical format"
      # The same argument one directory across, for the files Argo CD renders.
      # Every other gate reads these as text — `gitops.rs` counts the files
      # whose bytes contain a principal, `console_route.rs` scans for a
      # `member:` line — and text matching cannot tell a well-formed document
      # from a broken one. A malformed `invokers.yaml` therefore passed every
      # check here and was caught by Argo CD instead, ten minutes into an
      # `apps` dispatch, reported as a sync timeout rather than as a file
      # that would not parse.
      - name: the GitOps manifests parse
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          ./scripts/check-manifests.py
      - name: validate
        run: |
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate
      # The gates, planned.
      #
      # `validate` checks that the configuration parses and that its references
      # resolve. It does not evaluate a single `validation` block or a single
      # `lifecycle.precondition`, which is where every safety refusal in this
      # repository lives — the autonomy ceiling, the zone model, the public
      # edge's refusal to front a trading zone. Those were asserted only as
      # text until 2026-09-14, by Rust tests reading the HCL, and text cannot
      # tell a rule that works from a rule that cannot run: `modules/network`'s
      # prefix check on `console_egress_cidr` read correctly, had a Rust test
      # asserting it both fires and admits, and killed the plan outright by
      # handing a null to `split`. The variable is null in three of the four
      # environments, so `terraform plan` was impossible in all three and
      # nothing noticed, because nothing planned.
      #
      # `terraform test` plans. Every harness mocks its provider, so this needs
      # no credential, reaches no project and creates nothing — which is the
      # only way to plan a configuration whose environments have been torn
      # down. `qip-acceptance`'s `terraform_plan` suite holds the other half:
      # that each harness proves a refusal *and* an admission, because a gate
      # proven only to refuse may refuse everything.
      - name: plan the gates
        run: |
          set -euo pipefail
          # `terraform test` runs from the configuration's directory and finds
          # its harnesses under `tests/`, so the module root is what -chdir
          # needs — not the directory the file was found in.
          directories=$(find infrastructure -name '*.tftest.hcl' -printf '%h\n' | sed 's|/tests$||' | sort -u)
          if [ -z "$directories" ]; then
            echo "no terraform test harness was found under infrastructure/." >&2
            echo "Every variable validation and lifecycle precondition in this repository is" >&2
            echo "asserted by a plan in a *.tftest.hcl file; with none present, the refusals" >&2
            echo "are checked only as text and a rule that cannot run reads exactly like one" >&2
            echo "that works." >&2
            exit 1
          fi
          for directory in $directories; do
            echo "::group::terraform test $directory"
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" test
            echo "::endgroup::"
          done
      # The fleet root (ADR 0102) is a separate Terraform root with its own
      # state, so the steps above, all `-chdir=infrastructure/terraform`, never
      # open it. No credential: providers are mocked and the backend is off.
      - name: fleet root
        run: |
          set -euo pipefail
          cd infrastructure/fleet
          terraform fmt -check -recursive .
          terraform init -backend=false -input=false
          terraform validate
          terraform test
      # The tenant foundation (ADR 0118) is a third root, with its own state in
      # the seed project, applied once by the owner and never by a workflow.
      # The harness loop above already runs its `terraform test`; this adds the
      # format and validate gates no other step opens it for.
      - name: foundation root
        run: |
          set -euo pipefail
          cd infrastructure/foundation
          terraform fmt -check -recursive .
          terraform init -backend=false -input=false
          terraform validate
      # `validate` accepts a module using a provider it never declared; only
      # `plan` refuses it, and a plan of the whole root against real providers
      # needs credentials CI does not have. The mocked plans above declare the
      # providers they mock, so they do not close this either. That class of
      # error passes here and fails on the day somebody applies — which is
      # exactly what happened with `modules/ai` and `google-beta`. This is the
      # static check that closes it.
      - name: provider declarations
        run: ./scripts/check-terraform-providers.sh

  # The secrets check runs twice: over the tree, and over every line any
  # commit in the history added (CICD-006).
  #
  # This comment used to say the check "runs on the diff, not the history",
  # and it ran on neither: it read the tree. A credential committed and then
  # deleted in a later commit of the same pull request passed it, and every
  # clone kept the blob. The reason given for staying off the history still
  # stands, and the second step answers it rather than ignoring it: a secret
  # already committed needs rotating, not a build that fails for ever, so a
  # finding somebody has read is recorded in scripts/secrets-reviewed.txt with
  # what it was, and only an unrecorded one fails the build.
  #
  # fetch-depth 0 is what makes the second step mean anything. A shallow
  # clone has one commit of history, and the script refuses to scan one
  # rather than report it clean.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/check-secrets.sh
      - run: ./scripts/check-secrets.sh --history

  # The development tooling's own tests: the model gateway, the fleet's
  # dispatcher and worker, the CodeQL blocking gate, the agent boundary, the
  # lane planner and the sandbox's egress proxy, and the game-day harness. They are the programs that send repository source
  # to a provider and decide what a day may cost, and until this job their
  # tests ran only when somebody remembered to run them. Node built-ins only,
  # so there is nothing to install. The files are named one by one rather
  # than globbed, because `node --test` with no path would also collect the
  # frontend's tests; the acceptance suite fails if a test file under
  # scripts/ is missing from this line.
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/model-gateway.test.mjs scripts/fleet/dispatch.test.mjs scripts/fleet/worker.test.mjs scripts/sast-gate.test.mjs scripts/agent-guard.test.mjs scripts/agent-lanes.test.mjs scripts/agent-egress.test.mjs scripts/game-day/harness.test.mjs scripts/rule-citation.test.mjs
      # The agent sandbox holds no secret, no credential and no write, every
      # job in it is time-limited (R12 SEC-9068, SEC-9084), and the lane's
      # network is the egress proxy and nothing else (SEC-9077). Judged by
      # the same function the tests above exercise, on the committed file.
      - run: node scripts/agent-guard.mjs sandbox .github/workflows/agent-sandbox.yml
      # The round's lane plan, the one agent-guard.mjs holds `Agent-Lane:`
      # commits to, is valid under the policy the merge enforces (CICD-9082,
      # CICD-9083): every lane has a branch, gates and a bounded budget, owns
      # only what its role may edit, and shares no path with an unordered lane.
      - run: node scripts/agent-lanes.mjs validate --policy scripts/agent-policy.json --manifest scripts/lanes/round-3.json

  # A pull request that changes a rule names it (R12 GOV-9080). The body is
  # read from the event file rather than an expression, because a pull
  # request's body is text a stranger wrote; the changed paths are the diff
  # against the base commit this run was opened on. `scripts/rule-citation.mjs`
  # says what counts as a rule and why each refusal fails closed.
  rule-citation:
    name: a changed rule is cited
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: every changed rule file is named in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          node scripts/rule-citation.mjs --event "$GITHUB_EVENT_PATH" --changed "$RUNNER_TEMP/changed.txt"

  # The repository's change-management hooks ensure every change goes through
  # git commits and pull requests. The guard refuses destructive bypass
  # commands before Bash executes them, and the formatter runs after edits.
  # Both have already been wrong in ways that were invisible until exercised,
  # so regression tests verify both the allow cases and the refuse cases.
  hooks:
    name: change management hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .claude/hooks/test_hooks.py

  # Static analysis, as a gate of ci rather than a workflow beside it (R12
  # CICD-9105). CodeQL used to run as its own workflow on push and pull
  # request, and `deploy.yml` waited only on ci, so a CodeQL finding stopped
  # nothing: the commit was built, signed and attested regardless. Called
  # here, a failed analysis fails ci, and ci's success is what deploy.yml
  # requires; deploy.yml also reads this job's results by name in the run
  # it is about to trust, so a ci run from before this job existed is not
  # mistaken for one that ran it. Since R2.8 a *finding* at or above the
  # severity committed in `scripts/sast-policy.json` fails the job as well,
  # not only an analysis that could not finish; see the last step of
  # codeql-analysis.yml. `security-events: write` is the one
  # permission the analysis needs beyond reading, granted to this job alone.
  # CodeQL runs on main, not on pull requests or work branches (owner's
  # decision, 2026-10-12): its Rust analysis took 10m09s in ci run 948, the
  # longest job in the run, and set the pace of every pull request. What
  # deploys is unchanged: deploy.yml only ever ships a main commit and its
  # "static analysis passed in that ci run" step still refuses a ci run with
  # no successful `sast / …` job, so nothing reaches an environment without
  # this scan. What changes is when a finding is seen — after merge rather
  # than before it — and codeql-analysis.yml's daily schedule still scans
  # code that has not changed.
  sast:
    name: sast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codeql-analysis.yml
