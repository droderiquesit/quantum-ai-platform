# Build the images, then deploy them.
#
# Two rules shape everything below.
#
# **Nothing deploys that has not passed the test suite.** `ci.yml` is the gate;
# this workflow does not re-run it and does not have its own weaker copy. On the
# automatic path it is triggered by ci finishing and refuses to proceed unless
# ci succeeded. On the manual path it asks GitHub whether ci succeeded for the
# commit being deployed, because "somebody pressed the button" is not evidence.
#
# **Production is never automatic.** The automatic path deploys to `dev` and
# nowhere else. `test`, `stage` and `prod` need a person to dispatch the
# workflow, and the `prod` GitHub environment is expected to carry
# required reviewers — a repository setting, not something this file can
# create. See docs/operations/external-dependencies.md.
#
# There is no service-account key anywhere here. The pipeline authenticates by
# exchanging the OIDC token GitHub mints for one job, through the workload
# identity pool the `cicd` Terraform module creates.
#
# **Nothing here is hand-configured.** Every value that authentication and
# attestation need — the provider audience, the CI service account, the
# Binary Authorization attestor and the key version that signs for it — is a
# pure function of the project id and project number recorded in
# `infrastructure/environments/<env>/terraform.tfvars`. The `derive the
# identity from the tfvars` step reads that file and constructs all six.
#
# They used to be repository variables a person pasted from `terraform
# output`. One of those pastes came from a shell whose `terraform` was a stub
# that printed apt install advice instead of a version; the advice landed in
# `GCP_WORKLOAD_IDENTITY_PROVIDER`, and every run afterwards failed with
# "Invalid value for audience" — a message naming neither the variable nor
# the shell that filled it. A value nothing re-derives is a value that stays
# wrong. `no_workflow_depends_on_a_repository_variable` in the acceptance
# suite keeps them from coming back.
name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    # The repository's default branch. It is not named `main`: the platform
    # was built on this branch and it became the default, so a filter on
    # `main` matched nothing and the automatic path could never fire — a
    # pipeline that looked complete and was unreachable. `main` stays listed
    # so a later rename to the conventional name does not silently re-break
    # this trigger in the other direction.
    branches:
      - "main"
      - "claude/autonomous-investment-platform-76gt4y"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy to. Production is never reached any other way."
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - stage
          - prod

# Read-only by default. The jobs that need to mint an OIDC token ask for it
# explicitly, so the blast radius of a compromised action is visible in the diff
# that granted it.
permissions:
  contents: read

concurrency:
  # One deployment at a time per environment. Two applies racing each other
  # produce a cluster in a state neither of them describes.
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  # The automatic path goes to dev and nowhere else.
  TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # The branch the promotion lands on. Distinct from DEPLOY_SHA, which is a
  # commit and is checked out detached: the digests must be committed to the
  # branch's tip, not to whatever it pointed at when ci finished, or the
  # promotion is written onto an ancestor and Argo CD never sees it.
  DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  # The gate. Everything else needs this job, so a failure here stops the
  # pipeline rather than producing images nobody should deploy.
  gate:
    name: the test suite passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: refuse a production deployment that nobody dispatched
        if: env.TARGET_ENVIRONMENT == 'prod' && github.event_name != 'workflow_dispatch'
        run: |
          echo "prod is not deployed automatically." >&2
          exit 1

      - name: the triggering ci run succeeded
        if: github.event_name == 'workflow_run'
        run: |
          conclusion='${{ github.event.workflow_run.conclusion }}'
          if [ "$conclusion" != "success" ]; then
            echo "ci concluded '$conclusion'; nothing is deployed." >&2
            exit 1
          fi

      # On the manual path there is no triggering run to inspect, so ask for
      # the commit's own history. A dispatch against a commit whose tests never
      # passed is exactly the case this exists to refuse.
      - name: ci succeeded for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&status=success" \
            --jq '.total_count')
          if [ "$runs" -lt 1 ]; then
            echo "no successful ci run for ${DEPLOY_SHA}; nothing is deployed." >&2
            exit 1
          fi
          echo "ci succeeded for ${DEPLOY_SHA}"

  # One image per deployable binary, built from the one Dockerfile so the four
  # cannot drift apart.
  #
  # The workspace builds five binaries and this matrix names four. Which ones
  # deploy, and why the others do not, is decided in
  # docs/adr/0010-what-gets-deployed.md rather than here — a reason living only
  # in a matrix comment is a reason only the person editing the matrix reads.
  #
  #   * `qip`, from `qip-cli`, is absent on purpose: it is an operator's tool,
  #     run by a person against a cluster rather than scheduled in one.
  #   * `qip-web` is absent because it is not a binary. It is the library
  #     `qip-api` links and renders from — `backend/crates/apps/qip-web` declares no
  #     `[[bin]]` and has no `main.rs` — so its pages are already served by the
  #     `qip-api` image, on `qip-api`'s port. An entry here would ask the
  #     Dockerfile for `cargo build --bin qip-web`, which has nothing to build.
  #
  # None of that is left as a claim.
  # backend/crates/tests/qip-acceptance/tests/infrastructure.rs checks it in every
  # direction that can be wrong: a binary that appears with no image fails, an
  # image with no manifest fails, a manifest with no image fails, an exclusion
  # whose reason is not in the decision record fails, and `qip-web` gaining a
  # `main.rs` fails rather than quietly shipping a library nobody serves.
  images:
    name: build and push ${{ matrix.binary }}
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token. This is the whole reason there is no key.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        binary:
          - qip-api
          - qip-fastbrain
          - qip-deepbrain
          - qip-edge-node
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Everything this job authenticates with is derived from the
      # environment's committed tfvars, not from repository variables.
      #
      # The variables are written by the bootstrap's last step, and a bootstrap
      # that fails earlier never reaches it. Worse, one did reach it from a
      # shell whose `terraform` was Cloud Shell's install-advisory stub, so the
      # four Terraform-derived variables held several lines of apt
      # instructions — non-empty, and therefore past every check that only
      # asked whether they were set. Deriving instead means a pipeline that
      # cannot be poisoned by a broken bootstrap, and one less thing an
      # operator has to get right before the first deployment works.
      #
      # Every value below is fixed by the Terraform that creates it, so
      # constructing it here cannot drift from what exists:
      #   provider    modules/cicd names the pool qip-github-<env>
      #   deploy SA   modules/cicd names the account qip-ci-<env>
      #   attestor    modules/binaryauthorization names it qip-<env>-build
      #   key version the attestor key is version 1 of qip-<env>-attestor in
      #               the key ring qip-<env>
      - name: derive the identity from the tfvars
        id: identity
        run: |
          set -euo pipefail
          tfvars="infrastructure/environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          [ -f "$tfvars" ] || { echo "no tfvars at $tfvars" >&2; exit 1; }
          project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          number="$(sed -n 's/^project_number[[:space:]]*=[[:space:]]*\([0-9]*\)/\1/p' "$tfvars" | head -1)"
          region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          [ -n "$region" ] || region="europe-west2"   # the variable's default
          [ -n "$project" ] && [ -n "$number" ] || {
            echo "$tfvars carries no project_id/project_number" >&2
            exit 1
          }
          # Refused before authenticating, not after. An environment still
          # carrying the marker has no project, so every value derived below —
          # the workload-identity audience, the service account, the attestor,
          # the key version — would be constructed from a name that exists
          # nowhere, and the run would die at the OIDC exchange with a message
          # about an audience rather than about the environment.
          if [ "$project" = "unprovisioned" ]; then
            echo "environment '${TARGET_ENVIRONMENT}' is not provisioned: its tfvars carry the 'unprovisioned' marker." >&2
            echo "Create a project for it (its own, never one another environment uses), record the id and number in $tfvars, then deploy." >&2
            exit 1
          fi
          ring="qip-${TARGET_ENVIRONMENT}"
          {
            echo "project=$project"
            echo "region=$region"
            echo "provider=projects/$number/locations/global/workloadIdentityPools/qip-github-${TARGET_ENVIRONMENT}/providers/github"
            echo "account=qip-ci-${TARGET_ENVIRONMENT}@$project.iam.gserviceaccount.com"
            echo "attestor=${ring}-build"
            echo "key_version=projects/$project/locations/$region/keyRings/$ring/cryptoKeys/${ring}-attestor/cryptoKeyVersions/1"
          } >> "$GITHUB_OUTPUT"

      - name: authenticate without a key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.account }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: let docker push to artifact registry
        run: gcloud auth configure-docker "${{ steps.identity.outputs.region }}-docker.pkg.dev" --quiet

      - name: build
        run: |
          set -euo pipefail
          prefix="${{ steps.identity.outputs.region }}-docker.pkg.dev/${{ steps.identity.outputs.project }}/qip-${TARGET_ENVIRONMENT}"
          docker build \
            --file infrastructure/docker/Dockerfile \
            --build-arg "BINARY=${{ matrix.binary }}" \
            --tag "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}" \
            .

      # Scan the image before it is pushed, signed, or attested. The image is
      # a static binary on scratch, so anything this finds is in the binary's
      # own dependency graph — which is serde and serde_json — and a finding
      # here is worth stopping the line for. After the push would be too
      # late: a signed, attested, vulnerable image is admissible.
      - name: scan image
        run: |
          set -euo pipefail
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
          prefix="${{ steps.identity.outputs.region }}-docker.pkg.dev/${{ steps.identity.outputs.project }}/qip-${TARGET_ENVIRONMENT}"
          trivy image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}"

      # Tagged by commit and never by `latest`. The registry refuses to move a
      # tag onto different bytes, so a tag names one image for ever and a
      # rollback is a tag somebody can still find.
      - name: push
        run: |
          set -euo pipefail
          prefix="${{ steps.identity.outputs.region }}-docker.pkg.dev/${{ steps.identity.outputs.project }}/qip-${TARGET_ENVIRONMENT}"
          docker push "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}"

      # Sign it. This is the step that makes the cluster's
      # `binary_authorization` block mean something.
      #
      # It was enforcing `PROJECT_SINGLETON_POLICY_ENFORCE` against no policy,
      # so Google evaluated the implicit one — default rule `ALWAYS_ALLOW` —
      # and every image in the registry was admissible.
      # `infrastructure/terraform/modules/binaryauthorization` makes the
      # default rule deny; this is what puts an image on the other side of it.
      #
      # By digest, never by tag. An attestation names bytes, and Binary
      # Authorization resolves whatever a manifest asks for to a digest and
      # looks for an attestation of *that*. The digest is read back from the
      # registry rather than from the local daemon, because what is signed has
      # to be what a node will pull.
      #
      # What this proves is that the pipeline pushed these bytes, and nothing
      # more: not that the source was reviewed, not that the dependencies were
      # the ones the lockfile names. The limits, and the two things a
      # deployment must still arrange, are in
      # infrastructure/terraform/modules/binaryauthorization/OUT-OF-BAND.md.
      - name: sign the pushed image
        env:
          BINAUTHZ_ATTESTOR: ${{ steps.identity.outputs.attestor }}
          BINAUTHZ_KEY_VERSION: ${{ steps.identity.outputs.key_version }}
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
          GCP_REGION: ${{ steps.identity.outputs.region }}
        run: |
          set -euo pipefail
          prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/qip-${TARGET_ENVIRONMENT}"
          digest=$(gcloud artifacts docker images describe \
            "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}" \
            --format='value(image_summary.digest)')
          if [ -z "${digest}" ]; then
            echo "the registry reports no digest for ${{ matrix.binary }}:${DEPLOY_SHA}." >&2
            exit 1
          fi
          image="${prefix}/${{ matrix.binary }}@${digest}"

          # A re-run of this workflow for the same commit must not fail here.
          # `sign-and-create` refuses to write an attestation that already
          # exists, and a re-deploy of an unchanged commit is a normal thing to
          # do — so an existing attestation for these exact bytes is success,
          # not a conflict.
          existing=$(gcloud container binauthz attestations list \
            --project "${GCP_PROJECT}" \
            --attestor "${BINAUTHZ_ATTESTOR}" \
            --attestor-project "${GCP_PROJECT}" \
            --artifact-url "${image}" \
            --format='value(name)')
          if [ -n "${existing}" ]; then
            echo "${image} is already attested."
            exit 0
          fi

          # `sign-and-create` moved to the beta track in current gcloud;
          # the component is installed in the setup step above.
          gcloud beta container binauthz attestations sign-and-create \
            --project "${GCP_PROJECT}" \
            --artifact-url "${image}" \
            --attestor "${BINAUTHZ_ATTESTOR}" \
            --attestor-project "${GCP_PROJECT}" \
            --keyversion "${BINAUTHZ_KEY_VERSION}"

  deploy:
    name: deploy to ${{ inputs.environment || 'dev' }}
    needs: images
    runs-on: ubuntu-latest
    # The GitHub environment. Where required reviewers and deployment branch
    # rules are configured, which is why `prod` names one at all.
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      # write, because the promotion IS the deployment now: this job commits
      # the digests it built to the branch and Argo CD applies them. Read
      # would leave the pipeline able to build an image and unable to deploy
      # it.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The promotion step needs the branch as well as the commit, and a
          # shallow clone cannot rebase onto it.
          fetch-depth: 0

      # Everything this job authenticates with is derived from the
      # environment's committed tfvars, not from repository variables.
      #
      # The variables are written by the bootstrap's last step, and a bootstrap
      # that fails earlier never reaches it. Worse, one did reach it from a
      # shell whose `terraform` was Cloud Shell's install-advisory stub, so the
      # four Terraform-derived variables held several lines of apt
      # instructions — non-empty, and therefore past every check that only
      # asked whether they were set. Deriving instead means a pipeline that
      # cannot be poisoned by a broken bootstrap, and one less thing an
      # operator has to get right before the first deployment works.
      #
      # Every value below is fixed by the Terraform that creates it, so
      # constructing it here cannot drift from what exists:
      #   provider    modules/cicd names the pool qip-github-<env>
      #   deploy SA   modules/cicd names the account qip-ci-<env>
      #   attestor    modules/binaryauthorization names it qip-<env>-build
      #   key version the attestor key is version 1 of qip-<env>-attestor in
      #               the key ring qip-<env>
      - name: derive the identity from the tfvars
        id: identity
        run: |
          set -euo pipefail
          tfvars="infrastructure/environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          [ -f "$tfvars" ] || { echo "no tfvars at $tfvars" >&2; exit 1; }
          project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          number="$(sed -n 's/^project_number[[:space:]]*=[[:space:]]*\([0-9]*\)/\1/p' "$tfvars" | head -1)"
          region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          [ -n "$region" ] || region="europe-west2"   # the variable's default
          [ -n "$project" ] && [ -n "$number" ] || {
            echo "$tfvars carries no project_id/project_number" >&2
            exit 1
          }
          # Refused before authenticating, not after. An environment still
          # carrying the marker has no project, so every value derived below —
          # the workload-identity audience, the service account, the attestor,
          # the key version — would be constructed from a name that exists
          # nowhere, and the run would die at the OIDC exchange with a message
          # about an audience rather than about the environment.
          if [ "$project" = "unprovisioned" ]; then
            echo "environment '${TARGET_ENVIRONMENT}' is not provisioned: its tfvars carry the 'unprovisioned' marker." >&2
            echo "Create a project for it (its own, never one another environment uses), record the id and number in $tfvars, then deploy." >&2
            exit 1
          fi
          ring="qip-${TARGET_ENVIRONMENT}"
          {
            echo "project=$project"
            echo "region=$region"
            echo "provider=projects/$number/locations/global/workloadIdentityPools/qip-github-${TARGET_ENVIRONMENT}/providers/github"
            echo "account=qip-ci-${TARGET_ENVIRONMENT}@$project.iam.gserviceaccount.com"
            echo "attestor=${ring}-build"
            echo "key_version=projects/$project/locations/$region/keyRings/$ring/cryptoKeys/${ring}-attestor/cryptoKeyVersions/1"
          } >> "$GITHUB_OUTPUT"

      - name: authenticate without a key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.account }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: credentials for the private cluster
        run: |
          # --dns-endpoint: the control plane keeps no public IP; this resolves
          # the IAM-gated DNS front door instead of the private 172.16.0.2 a
          # GitHub-hosted runner can never reach.
          gcloud container clusters get-credentials "qip-${TARGET_ENVIRONMENT}" \
            --region "${{ steps.identity.outputs.region }}" \
            --project "${{ steps.identity.outputs.project }}" \
            --dns-endpoint

      # The manifests carry placeholders rather than values, so the same files
      # describe every environment and a diff between environments is a diff in
      # this substitution rather than in five copies of a Deployment.
      #
      # Images render to digests, never tags. The attestation the images job
      # wrote names bytes — `<image>@sha256:…` — and Binary Authorization's
      # admission webhook refuses to even evaluate a tag reference: rendering
      # `:IMAGE_TAG` to the commit sha got every pod denied with "Expected
      # digest with sha256 scheme, but got tag or malformed digest". The digest
      # is read back from the registry with the same lookup the sign step used,
      # so the reference applied is the reference attested — and a tag moved
      # between signing and applying deploys nothing rather than deploying
      # bytes nobody signed.
      #
      # edge-cell.yaml is not applied here. A cell needs its cell id, its region
      # and its venue ranges, and bringing one up is a deliberate act with a
      # runbook — docs/operations/deploying-an-edge-cell.md — rather than
      # something a pipeline does unattended to a workload that trades.
      # The promotion. This workflow no longer applies anything.
      #
      # It used to `kubectl apply --server-side -f rendered/`, rendered from
      # infrastructure/kubernetes/base/. Argo CD applies the chart at
      # infrastructure/helm/qip, and for a while both ran — ADR 0017 calls that
      # the migration window. Two writers to one cluster is survivable only
      # while the two sources say the same thing, and on 2026-08-31 they stopped:
      # `qip-api-console` and `allow-api-ingress-from-console` were added to the
      # chart and not to the kustomize tree, so the next automatic run would
      # have applied a manifest set that has never heard of the console route,
      # contesting field ownership with Argo CD over every object they share.
      # Nothing enforced the equivalence the chart's own header claims — there
      # is no parity test — so the divergence would have been found by a
      # cluster behaving oddly rather than by a gate.
      #
      # So the pipeline's job stops at the registry. It builds, scans, signs and
      # attests, then records the digests it produced; Argo CD is the only thing
      # that writes to the cluster. That is what makes the cluster's state
      # answerable from the repository alone, which is the whole claim of
      # ADR 0017.
      - name: record the promoted digests
        run: |
          set -euo pipefail
          prefix="${{ steps.identity.outputs.region }}-docker.pkg.dev/${{ steps.identity.outputs.project }}/qip-${TARGET_ENVIRONMENT}"
          values="infrastructure/helm/qip/values-${TARGET_ENVIRONMENT}-images.yaml"

          # The workloads the chart names, read out of the chart rather than
          # listed here. Every template pulls its digest from a
          # `.Values.images.<key>` and builds its reference as
          # `<prefix>/qip-<key>@<digest>`, so this set is exactly the set the
          # render will demand. A workload added to the chart and forgotten
          # here would otherwise keep whatever digest this file already carried
          # — silently running the previous build of one service beside the new
          # build of the others, which is the kind of skew that is diagnosed
          # from behaviour rather than from a version.
          keys="$(grep -ohE '\.Values\.images\.[a-z0-9]+' \
            infrastructure/helm/qip/templates/*.yaml | sed 's/.*\.//' | sort -u)"
          [ -n "${keys}" ] || { echo "no images.* keys found in the chart templates" >&2; exit 1; }

          {
            echo "# dev's promoted image digests — written by .github/workflows/deploy.yml."
            echo "#"
            echo "# Not hand-edited. Argo CD reads this file, so a digest typed in here"
            echo "# by a person deploys those bytes; the pipeline is the only author so"
            echo "# that what runs is always something that was built, scanned, signed"
            echo "# and attested by a run whose number is below."
            echo "#"
            echo "# run ${{ github.run_id }}, commit ${{ github.sha }}"
            echo "images:"
          } > "${values}.new"

          for key in ${keys}; do
            # By digest, never by tag. The attestation names bytes, and Binary
            # Authorization refuses to evaluate a tag reference at all — the
            # failure is "Expected digest with sha256 scheme, but got tag or
            # malformed digest", at admission, on every pod. Reading the digest
            # back with the same lookup the sign step used is what makes the
            # reference deployed the reference attested, so a tag moved between
            # signing and promoting deploys nothing rather than unsigned bytes.
            digest="$(gcloud artifacts docker images describe \
              "${prefix}/qip-${key}:${DEPLOY_SHA}" \
              --format='value(image_summary.digest)')"
            [ -n "${digest}" ] || { echo "no digest for qip-${key}:${DEPLOY_SHA}" >&2; exit 1; }
            echo "  ${key}: ${digest}" >> "${values}.new"
          done

          mv "${values}.new" "${values}"
          cat "${values}"

      - name: commit the promotion
        run: |
          set -euo pipefail
          values="infrastructure/helm/qip/values-${TARGET_ENVIRONMENT}-images.yaml"

          # Carry the file across to the branch tip. The checkout is detached
          # at DEPLOY_SHA, and committing there would write the promotion onto
          # an ancestor: Argo CD tracks the branch, so it would never see it.
          promoted="$(mktemp)"
          cp "${values}" "${promoted}"
          git config user.name "algorik-deploy[bot]"
          git config user.email "algorik-deploy@users.noreply.github.com"
          git fetch origin "${DEPLOY_BRANCH}"
          git checkout -B "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"
          cp "${promoted}" "${values}"
          if git diff --quiet -- "${values}"; then
            echo "the branch tip already carries these digests; nothing to promote"
            exit 0
          fi
          git add "${values}"

          # `[skip ci]` is load-bearing, not tidiness. This workflow is
          # triggered by ci completing, and ci is triggered by a push. Without
          # it, the commit below starts ci, which starts this workflow, which
          # commits again — a loop that builds and promotes for ever off one
          # merge.
          git commit -m "Promote ${TARGET_ENVIRONMENT} to the digests run ${{ github.run_id }} built [skip ci]"

          # Another agent or a person may have pushed while the images job ran.
          # Rebase rather than force: the branch is shared, and a force-push
          # here would discard whatever landed in between.
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${DEPLOY_BRANCH}" && git push origin "HEAD:${DEPLOY_BRANCH}" && exit 0
            echo "push attempt ${attempt} failed; retrying"
            sleep $((attempt * 4))
          done
          echo "could not push the promotion after four attempts" >&2
          exit 1

      # An applied manifest is not a deployment that worked, and neither is a
      # committed digest. This is the step that fails when the image does not
      # start.
      #
      # It waits for the digest to appear on the workload before it waits for
      # the rollout, because Argo CD's sync is asynchronous: `kubectl rollout
      # status` run immediately would observe the *previous* ReplicaSet,
      # already healthy, and report success for a deployment that had not begun.
      #
      # The list is every Deployment the chart carries and nothing else.
      # `qip-edge-CELL_ID` is not on it — bringing up a cell is a deliberate act
      # with a runbook — and `kubectl rollout status` against a Deployment
      # nobody created waits until it times out rather than failing usefully.
      # The correspondence is checked by
      # `the_rollout_waits_on_every_workload_the_pipeline_applies`.
      #
      # Stated because it will be met: `qip-fastbrain` is currently OOMKilled
      # roughly hourly on an unbounded audit trail, so this step is expected to
      # time out against it until that is fixed. That is a known defect, not
      # something to work around by dropping it from this list.
      - name: wait for Argo CD to converge the cluster on those digests
        run: |
          set -euo pipefail
          values="infrastructure/helm/qip/values-${TARGET_ENVIRONMENT}-images.yaml"
          for workload in qip-api qip-fastbrain qip-deepbrain; do
            want="$(sed -n "s#^  ${workload#qip-}: \(sha256:[0-9a-f]*\)\$#\1#p" "${values}")"
            [ -n "${want}" ] || { echo "no promoted digest for ${workload}" >&2; exit 1; }

            echo "waiting for ${workload} to carry ${want}"
            for attempt in $(seq 1 60); do
              running="$(kubectl -n qip get "deployment/${workload}" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
              case "${running}" in
                *"${want}") break ;;
              esac
              if [ "${attempt}" -eq 60 ]; then
                echo "${workload} still runs ${running:-nothing} after 5m; Argo CD has not synced this promotion" >&2
                exit 1
              fi
              sleep 5
            done

            kubectl rollout status "deployment/${workload}" --namespace qip --timeout=5m
          done
