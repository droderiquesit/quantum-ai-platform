# Build, scan, sign, attest and push the images. Nothing here moves a
# service any more (ADR 0036): Kargo's warehouse discovers the attested digest
# in the registry, its promotion commits the digest into
# infrastructure/gitops/envs/<env>/kustomization.yaml, Argo CD reconciles the
# commit through Config Connector, and the post-sync hook proves the routed
# revision serves it. This workflow's last act is to record what it pushed.
#
# Two rules shape everything below.
#
# **Nothing deploys that has not passed the test suite.** `ci.yml` is the gate;
# this workflow does not re-run it and does not have its own weaker copy. On the
# automatic path it is triggered by ci finishing and refuses to proceed unless
# ci succeeded. On the manual path it asks GitHub whether ci succeeded for the
# commit being deployed, because "somebody pressed the button" is not evidence.
#
# **Production is never deployed from here.** The automatic path deploys to
# `dev` and nowhere else. `test` and `stage` need a person to dispatch the
# workflow. `prod` is not a dispatch choice, and the gate job refuses it on
# every trigger, a dispatch included; the `prod` GitHub environment's
# required reviewers (a repository setting, not something this file can
# create; see docs/operations/external-dependencies.md) are a third layer
# and not the only one.
#
# There is no service-account key anywhere here. The pipeline authenticates by
# exchanging the OIDC token GitHub mints for one job, through the workload
# identity pool the `cicd` Terraform module creates.
#
# **Nothing here is hand-configured.** Every value that authentication and
# attestation need — the provider audience, the CI service account, the
# Binary Authorization attestor and the key version that signs for it — is a
# pure function of the project id and project number recorded in
# `infrastructure/environments/<env>/terraform.tfvars`. The `derive the
# identity from the tfvars` step reads that file and constructs all six.
#
# They used to be repository variables a person pasted from `terraform
# output`. One of those pastes came from a shell whose `terraform` was a stub
# that printed apt install advice instead of a version; the advice landed in
# `GCP_WORKLOAD_IDENTITY_PROVIDER`, and every run afterwards failed with
# "Invalid value for audience" — a message naming neither the variable nor
# the shell that filled it. A value nothing re-derives is a value that stays
# wrong. `no_workflow_depends_on_a_repository_variable` in the acceptance
# suite keeps them from coming back.
name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    # The repository's default branch, by name. It was not `main` until
    # 2026-09-13: the platform was built on a `claude/...` branch that became
    # the default, and for a while this filter listed both names, because a
    # filter on `main` alone matched nothing and the automatic path could
    # never fire — a pipeline that looked complete and was unreachable. The
    # rename to `main` retired the second entry. If the default branch is
    # ever renamed again, this list is the first thing that silently stops
    # matching, and `deploy_workflow_run_branches` in the acceptance suite
    # reads it — so change it here, not only in the repository settings.
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy to. prod is refused: it is not a choice here and the gate refuses it on every trigger."
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - stage

# Read-only by default. The jobs that need to mint an OIDC token ask for it
# explicitly, so the blast radius of a compromised action is visible in the diff
# that granted it.
permissions:
  contents: read

concurrency:
  # One deployment at a time per environment. Two applies racing each other
  # produce a cluster in a state neither of them describes.
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  # The automatic path goes to dev and nowhere else.
  TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # The one environment whose registry every platform image is built into
  # (R12 CICD-9097, CICD-9112). A commit is built once, there, by the
  # automatic path; a dispatch for test, stage or prod finds that digest,
  # scans it again and attests it with the target environment's own
  # attestor — and never builds. Each environment used to build into its
  # own `qip-<env>`, so every environment ran different bytes from the ones
  # the environment before it tested, and Kargo promoted a digest into a
  # registry that had never held it. A literal rather than a repository
  # variable, for the reason the identity steps give; the registry's
  # project and region are read from this environment's committed tfvars.
  BUILD_ENVIRONMENT: dev

jobs:
  # The gate. Everything else needs this job, so a failure here stops the
  # pipeline rather than producing images nobody should deploy.
  gate:
    name: the test suite passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      # Reading the pull request a commit arrived through and its reviews,
      # for the agent boundary below. Read only.
      pull-requests: read
    steps:
      # No agent deploys (R12 GOV-9067). The rule and the agent identities
      # are `scripts/agent-policy.json`, checked out from the default branch
      # so the commit being deployed cannot loosen the rule it is judged by.
      - name: no development agent starts this workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .agent-guard
          sparse-checkout: scripts
          persist-credentials: false
      - name: refuse an agent actor
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          for who in "$ACTOR" "$TRIGGERING_ACTOR"; do
            node .agent-guard/scripts/agent-guard.mjs dispatch \
              --policy .agent-guard/scripts/agent-policy.json \
              --actor "$who" --workflow deploy.yml
          done

      # The two values every job below is built from, checked before anything
      # is believed about either. This job gates the rest — `images` needs it
      # and `deploy` needs `images` — so a refusal here is a refusal for the
      # whole pipeline.
      #
      # Character sets, and before any pattern tool sees them. `image.yml`'s
      # base-image guard states the reason at length and it is the same reason
      # here: every pattern tool in a shell matches per LINE, so a value whose
      # first line is well formed satisfies one while its second line is
      # somebody else's command. `DEPLOY_SHA` becomes the ref `actions/checkout`
      # is handed and part of the `gh api` query string below;
      # `TARGET_ENVIRONMENT` names a directory, a registry path and a Google
      # Cloud resource filter. Neither can wait for a later step.
      - name: the values the pipeline is built from are the shapes they claim
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            ''|*[!a-z0-9-]*)
              echo "environment is not an environment name: lowercase letters, digits and - only." >&2
              exit 1
              ;;
          esac
          case "$DEPLOY_SHA" in
            *[!0-9a-f]*)
              echo "the commit being deployed is not a lowercase-hex commit sha." >&2
              echo "Every image this pipeline pushes is tagged with exactly that, so anything else names a tag nothing downstream can resolve." >&2
              exit 1
              ;;
          esac
          if [ "${#DEPLOY_SHA}" -ne 40 ]; then
            echo "the commit being deployed is ${#DEPLOY_SHA} characters; a full 40-character commit sha is what every image is tagged with." >&2
            exit 1
          fi
          echo "deploying ${DEPLOY_SHA} to ${TARGET_ENVIRONMENT}"

      # Production is refused on every trigger, a person's dispatch included.
      # The step before this one has already held the value to one line of
      # lowercase letters, digits and `-`, so the comparison below is a
      # comparison and not a parser's first sight of somebody else's script.
      #
      # It used to fire only when the event was not `workflow_dispatch`
      # (`prod` was a dispatch choice), which left a human dispatch gated by
      # nothing but the `prod` GitHub environment's required reviewers: a
      # repository setting this file cannot create, read or prove
      # (docs/operations/external-dependencies.md). The rule in
      # .claude/rules/02-change-management.md says prod is refused by both
      # infra.yml and the deploy gate; a refusal that a button press skips is
      # not that. `prod` is also absent from the dispatch choices, so this
      # step is the second layer for a fork that adds it back, exactly as in
      # infra.yml. Production's project is still `unprovisioned`; lifting this
      # refusal is an ADR (0024 decision 3, 0036 decision 6), not an edit.
      - name: refuse a production deployment on every trigger
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" = "prod" ]; then
            echo "prod is never deployed from this workflow, automatically or by dispatch." >&2
            echo "Lifting this refusal needs an ADR (0024 decision 3, 0036 decision 6)." >&2
            exit 1
          fi

      # Whose commit this is, checked before its conclusion is believed.
      #
      # `workflow_run` fires for ANY completed run of `ci`, and `ci.yml`
      # triggers on `pull_request:` — so a pull request opened from a fork
      # starts a `ci` run, and this workflow wakes up when it finishes. The
      # `branches:` filter above does not stop that: it matches the triggering
      # run's HEAD branch, and a fork names its own branches, so a fork whose
      # branch is called `main` satisfies it exactly.
      #
      # What that reaches is the whole pipeline. This file comes from the
      # default branch and a fork cannot edit it — but `DEPLOY_SHA` is then the
      # fork's commit and every job below checks that commit out. The images
      # job runs `docker build` on the fork's Dockerfile and the fork's source,
      # pushes the result, and has the environment's Binary Authorization
      # attestor SIGN it, holding the WIF credential for `qip-ci-<env>` while it
      # does. A stranger's unreviewed commit would come out of that admissible
      # by the one policy rule that decides what may run at all. The `ci` gate
      # is no obstacle to somebody who also wrote the tests.
      #
      # Two facts on the event close it and both are checked, because either
      # alone leaves the door ajar: the triggering run was started by a push,
      # and its head repository is this repository.
      - name: the triggering ci run is this repository's own
        if: github.event_name == 'workflow_run'
        env:
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          THIS_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$TRIGGER_EVENT" in
            ''|*[!a-z_]*)
              echo "the triggering run names no event this workflow recognises." >&2
              exit 1
              ;;
          esac
          case "$TRIGGER_REPOSITORY" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "the triggering run's head repository is not a repository name." >&2
              exit 1
              ;;
          esac
          if [ "$TRIGGER_EVENT" != "push" ]; then
            echo "the ci run that triggered this was started by '${TRIGGER_EVENT}', not by a push to this repository." >&2
            echo "A pull request's run builds the code in the pull request, which is not this repository's own act; deploying it would sign a stranger's commit with the environment's attestor." >&2
            echo "Merge it, or dispatch this workflow against a commit ci has already passed." >&2
            exit 1
          fi
          if [ "$TRIGGER_REPOSITORY" != "$THIS_REPOSITORY" ]; then
            echo "the ci run that triggered this ran on ${TRIGGER_REPOSITORY}, not on ${THIS_REPOSITORY}." >&2
            exit 1
          fi
          echo "the triggering ci run is a push to ${THIS_REPOSITORY}"

      - name: the triggering ci run succeeded
        if: github.event_name == 'workflow_run'
        env:
          # Through the environment rather than pasted into the script. The
          # value is one of GitHub's own words today; an expression is source
          # text whatever it holds, and this one used to be substituted inside
          # a pair of single quotes, where one apostrophe ends the string.
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "ci concluded '${CI_CONCLUSION}'; nothing is deployed." >&2
            exit 1
          fi

      # On the manual path there is no triggering run to inspect, so ask for
      # the commit's own history. A dispatch against a commit whose tests never
      # passed is exactly the case this exists to refuse.
      #
      # `event=push`, because a pull request's ci run has the pull request's
      # head as its `head_sha` and succeeds like any other: without the
      # filter a dispatch naming a fork's commit found that run and went on
      # to sign the fork's code, the hole the workflow_run step above closes
      # on the automatic path (R12 CICD-9066).
      - name: ci succeeded for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs=$(gh api \
            "repos/${THIS_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&status=success&event=push" \
            --jq '.total_count')
          if [ "$runs" -lt 1 ]; then
            echo "no successful ci run for ${DEPLOY_SHA}; nothing is deployed." >&2
            exit 1
          fi
          echo "ci succeeded for ${DEPLOY_SHA}"

      # Static analysis passed, in the ci run being trusted (R12 CICD-9105).
      # `ci.yml` calls CodeQL as its `sast` job, so ci's success already
      # implies it — for a ci.yml that has the job. A commit from before it
      # did has a successful ci run with no analysis in it, and "ci passed"
      # would wave that commit through with SAST never having run. So the
      # jobs are read by name: at least one `sast / …` job, and every one of
      # them `success`. Zero is a refusal, not a pass.
      - name: static analysis passed in that ci run
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_REPOSITORY: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run_id="${TRIGGER_RUN_ID:-}"
          if [ -z "$run_id" ]; then
            run_id=$(gh api \
              "repos/${THIS_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&status=success&event=push" \
              --jq '.workflow_runs[0].id // empty')
          fi
          case "$run_id" in
            ''|*[!0-9]*)
              echo "no ci run id to read the static analysis from for ${DEPLOY_SHA}; nothing is deployed." >&2
              exit 1
              ;;
          esac
          conclusions=$(gh api --paginate \
            "repos/${THIS_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("sast / ")) | .conclusion')
          if [ -z "$conclusions" ]; then
            echo "ci run ${run_id} ran no static analysis (no 'sast / ...' job); nothing is deployed." >&2
            echo "Re-run ci on a commit whose ci.yml calls CodeQL, then deploy that commit." >&2
            exit 1
          fi
          if printf '%s\n' "$conclusions" | grep -qv '^success$'; then
            echo "static analysis in ci run ${run_id} did not succeed:" >&2
            printf '%s\n' "$conclusions" >&2
            exit 1
          fi
          echo "static analysis succeeded in ci run ${run_id} for ${DEPLOY_SHA}"

      # The agent boundary held for every commit this deployment ships (R12
      # GOV-9067, SEC-9068, ADR 0117). Each commit since the last successful
      # deployment is judged against its own files and the pull request it
      # arrived through: an agent-authored change that touched a protected
      # path — a workflow, the agents' own instructions, a gate or its
      # policy, the paper boundary's Terraform layer — needs a writer's
      # approval of that pull request's head; a commit declaring an
      # `Agent-Role` must lie inside that role's paths; and a protected change
      # with no agent marker needs a person's signature or the same approval.
      # This judged only the deployed commit's first-parent diff until
      # 2026-10-11, so when two pushes landed between deployments the earlier
      # one shipped unexamined. `agent-boundary.yml` says the same on each pull
      # request, but whether that check is required before merge is branch
      # protection, which this file cannot see; this step holds either way.
      - name: the agent boundary held for every commit since the last deployment
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/agent-boundary"
          mkdir -p "$work"
          # The base: the newest successful deployment of a different commit
          # that is an ancestor of this one. With none — a first deployment, or
          # a redeploy of the same commit — the deployed commit's first parent,
          # which was the whole of this check before.
          # Read into a variable first: a failing command substitution inside
          # `for … in $(…)` does not stop the step, and an API error would read
          # as "no earlier deployment" and shrink the range to one change.
          deployed="$(gh api "repos/${THIS_REPOSITORY}/actions/workflows/deploy.yml/runs?status=success&branch=main&per_page=30" --jq '.workflow_runs[].head_sha')"
          base=""
          for candidate in $deployed; do
            case "$candidate" in *[!0-9a-f]*|"$DEPLOY_SHA") continue ;; esac
            status="$(gh api "repos/${THIS_REPOSITORY}/compare/${candidate}...${DEPLOY_SHA}" --jq '.status')"
            if [ "$status" = "ahead" ]; then base="$candidate"; break; fi
          done
          if [ -z "$base" ]; then
            base="$(gh api "repos/${THIS_REPOSITORY}/commits/${DEPLOY_SHA}" --jq '.parents[0].sha // empty')"
            case "$base" in *[!0-9a-f]*) echo "the first parent of ${DEPLOY_SHA} is not a commit sha" >&2; exit 1 ;; esac
            if [ -z "$base" ]; then
              echo "${DEPLOY_SHA} has no parent and no earlier deployment; the agent boundary has no change to judge."
              exit 0
            fi
            echo "no earlier deployment is an ancestor of ${DEPLOY_SHA}; judging its first-parent change"
          fi
          echo "judging ${base}..${DEPLOY_SHA}"
          node .agent-guard/scripts/agent-guard.mjs gather \
            --repository "$THIS_REPOSITORY" --base "$base" --head "$DEPLOY_SHA" --out "$work/range.json"
          node .agent-guard/scripts/agent-guard.mjs range \
            --policy .agent-guard/scripts/agent-policy.json --range "$work/range.json" \
            --environment "$TARGET_ENVIRONMENT"

  # One image per deployed artefact. Four of the five are workspace binaries
  # built from the one Dockerfile, so those four cannot drift apart.
  #
  # The workspace builds seven binaries and this matrix names four of them.
  # Which ones deploy, and why the others do not, is decided in
  # docs/adr/0010-what-gets-deployed.md rather than here — a reason living only
  # in a matrix comment is a reason only the person editing the matrix reads.
  # Three of the four become Cloud Run services through catalogue.tf; the
  # fourth, `qip-edge-node`, is the attested artefact the execution node's
  # boot image is contracted to be built from, and runs bare under systemd.
  #
  # The fifth entry is not a binary at all. `qip-portal` is `frontend/portal`
  # — the console, the one part of this platform that is not Rust (ADR 0001)
  # — built from its own Dockerfile against the npm workspace as context, and
  # deployed by `gitops/envs/<env>/portal.yaml` behind the IAP front door
  # `modules/iap-edge` creates (ADR 0094). It is here rather than in the
  # out-of-band `scripts/deploy-frontends.sh` for one reason: a surface on the
  # internet has to go through the same Trivy gate, the same immutable tag and
  # the same attestor as everything else, and a shell script an operator runs
  # from their laptop is not that.
  #
  #   * `qip`, from `qip-cli`, is absent on purpose: it is an operator's tool,
  #     run by a person against a cluster rather than scheduled in one.
  #   * `qip-web` is absent because it is not a binary. It is the library
  #     `qip-api` links and renders from — `backend/crates/apps/qip-web` declares no
  #     `[[bin]]` and has no `main.rs` — so its pages are already served by the
  #     `qip-api` image, on `qip-api`'s port. An entry here would ask the
  #     Dockerfile for `cargo build --bin qip-web`, which has nothing to build.
  #
  # None of that is left as a claim.
  # backend/crates/tests/qip-acceptance/tests/infrastructure.rs checks it in every
  # direction that can be wrong: a binary that appears with no image fails, an
  # image nothing runs fails, a workload with no image fails, an exclusion
  # whose reason is not in the decision record fails, and `qip-web` gaining a
  # `main.rs` fails rather than quietly shipping a library nobody serves.
  images:
    name: build and push ${{ matrix.binary }}
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token. This is the whole reason there is no key.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        binary:
          - qip-api
          - qip-fastbrain
          - qip-deepbrain
          - qip-edge-node
          - qip-portal
        # How each image is built, where it differs from the default.
        #
        # An `include:` entry whose `binary` matches one already in the list
        # adds fields to that combination rather than creating a new one, so
        # this block changes no image the matrix builds. It exists because
        # `qip-portal` is not a cargo build: it is `frontend/portal` through
        # Next's standalone tracer, and the tracer needs the npm workspace
        # root as its context (see the Dockerfile's own first paragraph).
        # Everything else takes the defaults the build step applies.
        include:
          - binary: qip-portal
            dockerfile: infrastructure/docker/portal.Dockerfile
            context: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Everything this job authenticates with is derived from the
      # environment's committed tfvars, not from repository variables.
      #
      # The variables are written by the bootstrap's last step, and a bootstrap
      # that fails earlier never reaches it. Worse, one did reach it from a
      # shell whose `terraform` was Cloud Shell's install-advisory stub, so the
      # four Terraform-derived variables held several lines of apt
      # instructions — non-empty, and therefore past every check that only
      # asked whether they were set. Deriving instead means a pipeline that
      # cannot be poisoned by a broken bootstrap, and one less thing an
      # operator has to get right before the first deployment works.
      #
      # Every value below is fixed by the Terraform that creates it, so
      # constructing it here cannot drift from what exists:
      #   provider    modules/cicd names the pool qip-github-<env>
      #   deploy SA   modules/cicd names the account qip-ci-<env>
      #   attestor    modules/binaryauthorization names it qip-<env>-build
      #   key version the attestor key is version 1 of qip-<env>-attestor in
      #               the key ring qip-<env>
      - name: derive the identity from the tfvars
        id: identity
        run: |
          set -euo pipefail
          tfvars="infrastructure/environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          [ -f "$tfvars" ] || { echo "no tfvars at $tfvars" >&2; exit 1; }
          project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          number="$(sed -n 's/^project_number[[:space:]]*=[[:space:]]*\([0-9]*\)/\1/p' "$tfvars" | head -1)"
          region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          [ -n "$region" ] || region="europe-west2"   # the variable's default
          [ -n "$project" ] && [ -n "$number" ] || {
            echo "$tfvars carries no project_id/project_number" >&2
            exit 1
          }
          # `project_number = 0` beside a real project id is the marker a tfvars
          # carries between the project being declared and its number being recorded
          # (ADR 0118): Google assigns the number at creation, so it cannot be
          # committed before. Read through, it becomes `projects/0/…` and the OIDC
          # exchange fails naming an audience, which sends an operator to workload
          # identity federation for a problem that is one line in this file. The
          # `unprovisioned` marker carries 0 too and has its own refusal below.
          if [ "$number" = "0" ] && [ "$project" != "unprovisioned" ]; then
            echo "$tfvars records project_number = 0: the number Google assigned to $project has not been recorded yet." >&2
            echo "Run scripts/bootstrap-foundation.sh as the owner (docs/ops/runbooks/new-project-from-scratch.md), commit the number it writes, then dispatch this again." >&2
            exit 1
          fi

          # The character set of what was read, before any of it is pasted into
          # a gcloud argument, a registry path or a workload-identity audience.
          #
          # The tfvars are reviewed configuration — but this job reads them out
          # of the commit it was pointed at, not out of the reviewed branch, so
          # "reviewed" is a property of the file's history rather than of the
          # bytes in front of this step. A `project_id` carrying a quote and a
          # semicolon would reach the shells below as source text, because
          # `steps.identity.outputs.project` is substituted into four of
          # them before bash parses a byte. A project id and a region are
          # lowercase letters, digits and hyphens; anything else is not a
          # malformed name, it is somebody else's command. Emptiness is refused
          # above, which is why this arm does not repeat it.
          for value in "$project" "$region"; do
            case "$value" in
              *[!a-z0-9-]*)
                echo "$tfvars names a project or a region containing a character neither can contain: '$value'" >&2
                echo "Permitted: lowercase letters, digits and -" >&2
                exit 1
                ;;
            esac
          done
          # Refused before authenticating, not after. An environment still
          # carrying the marker has no project, so every value derived below —
          # the workload-identity audience, the service account, the attestor,
          # the key version — would be constructed from a name that exists
          # nowhere, and the run would die at the OIDC exchange with a message
          # about an audience rather than about the environment.
          if [ "$project" = "unprovisioned" ]; then
            echo "environment '${TARGET_ENVIRONMENT}' is not provisioned: its tfvars carry the 'unprovisioned' marker." >&2
            echo "Create a project for it (its own, never one another environment uses), record the id and number in $tfvars, then deploy." >&2
            exit 1
          fi
          ring="qip-${TARGET_ENVIRONMENT}"

          # The build registry, from the build environment's committed tfvars
          # and under the same refusals: the one repository every platform
          # image is built into and promoted from. `modules/registry` names
          # it qip-<env>, and grants the later environments' CI accounts and
          # Cloud Run agents read on it through `registry_promotion_readers`.
          build_tfvars="infrastructure/environments/${BUILD_ENVIRONMENT}/terraform.tfvars"
          [ -f "$build_tfvars" ] || { echo "no tfvars at $build_tfvars" >&2; exit 1; }
          build_project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$build_tfvars" | head -1)"
          build_region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$build_tfvars" | head -1)"
          [ -n "$build_region" ] || build_region="europe-west2"
          case "$build_project" in
            ''|unprovisioned|*[!a-z0-9-]*)
              echo "$build_tfvars names no provisioned project ('$build_project'); there is no build registry to build into or promote from." >&2
              exit 1
              ;;
          esac
          case "$build_region" in
            *[!a-z0-9-]*)
              echo "$build_tfvars names a region containing a character a region cannot: '$build_region'" >&2
              exit 1
              ;;
          esac

          # Where the build runs (R12 CICD-9097), from the same committed
          # file and never a repository variable: `true` submits the build
          # to the Cloud Build private pool `modules/build-pool` creates;
          # absent or `false` is the GitHub runner. A value that is present
          # and neither word is refused rather than read as false — a typo
          # that silently moved builds back onto a shared runner would be
          # the failure this setting exists to close.
          pool_line="$(grep -E '^[[:space:]]*cloud_build_private_pool_enabled[[:space:]]*=' "$build_tfvars" || true)"
          pool_enabled=false
          if [ -n "$pool_line" ]; then
            pool_enabled="$(printf '%s\n' "$pool_line" | head -1 | sed 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*#.*$//; s/[[:space:]]*$//')"
            case "$pool_enabled" in
              true|false) ;;
              *)
                echo "$build_tfvars sets cloud_build_private_pool_enabled to '$pool_enabled'; only true or false is read." >&2
                exit 1
                ;;
            esac
          fi
          {
            echo "project=$project"
            echo "region=$region"
            echo "provider=projects/$number/locations/global/workloadIdentityPools/qip-github-${TARGET_ENVIRONMENT}/providers/github"
            echo "account=qip-ci-${TARGET_ENVIRONMENT}@$project.iam.gserviceaccount.com"
            echo "attestor=${ring}-build"
            echo "key_version=projects/$project/locations/$region/keyRings/$ring/cryptoKeys/${ring}-attestor/cryptoKeyVersions/1"
            echo "registry_host=${build_region}-docker.pkg.dev"
            echo "registry=${build_region}-docker.pkg.dev/${build_project}/qip-${BUILD_ENVIRONMENT}"
            # The names modules/build-pool gives the pool, its identity and
            # its staging bucket: pure functions of the build project. Change
            # them there and here in one diff.
            echo "private_pool=${pool_enabled}"
            echo "pool_project=${build_project}"
            echo "pool_region=${build_region}"
            echo "pool_id=projects/${build_project}/locations/${build_region}/workerPools/qip-${BUILD_ENVIRONMENT}-build"
            echo "pool_account=projects/${build_project}/serviceAccounts/qip-build-${BUILD_ENVIRONMENT}@${build_project}.iam.gserviceaccount.com"
            echo "pool_staging=gs://${build_project}-qip-${BUILD_ENVIRONMENT}-build-source/source"
            echo "pool_output=gs://${build_project}-qip-${BUILD_ENVIRONMENT}-build-source/out"
          } >> "$GITHUB_OUTPUT"

      - name: authenticate without a key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.account }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: let docker push to artifact registry
        run: gcloud auth configure-docker "${{ steps.identity.outputs.registry_host }}" --quiet

      # Whether the registry already holds this commit's image.
      #
      # `modules/registry` makes tags immutable, and the builder stage is not
      # byte-reproducible (infrastructure/docker/Dockerfile names the one
      # line), so a second build of the same commit is different bytes and
      # the registry refuses to move `binary:<sha>` onto them. Without this
      # step every re-run for a commit already built failed at `push` — and a
      # rollback, which is nothing more than a dispatch against an earlier
      # commit, was impossible by construction. The bytes under `binary:<sha>`
      # can only have been put there by this job for this commit: the tag
      # cannot move and the account that pushes is the one this job
      # authenticates as. So an existing tag *is* the commit's image, and the
      # build and the push are skipped for it. The scan is not skipped: it
      # runs against the registry's copy, so old bytes that have since
      # acquired a finding stop the line the way new bytes would. The sign
      # step already treats an existing attestation as success.
      #
      # A describe that fails for any reason other than absence reads as
      # absence here and the job builds; the push then meets the immutable
      # tag and fails with the registry's own message, which is exactly
      # where it failed before this step existed and no worse.
      - name: whether the registry already holds this commit's image
        id: existing
        run: |
          set -euo pipefail
          prefix="${{ steps.identity.outputs.registry }}"
          digest="$(gcloud artifacts docker images describe \
            "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}" \
            --format='value(image_summary.digest)' 2>/dev/null || true)"
          if [ -n "$digest" ]; then
            echo "${{ matrix.binary }}:${DEPLOY_SHA} is already in the registry as ${digest}; build and push are skipped and the scan runs against it."
          else
            echo "${{ matrix.binary }}:${DEPLOY_SHA} is not in the registry; building it."
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # A promotion never rebuilds (R12 CICD-9112). Only the build
      # environment's run may produce bytes; a dispatch for any other
      # environment attests the digest the build environment's run already
      # pushed, or stops here. Rebuilding would hand test, stage or prod an
      # image nobody tested — a second build of one commit is a second set
      # of bytes unless the reproducibility step below has proved otherwise
      # for that commit, and it has only ever proved it in the build run.
      - name: a promotion attests the image built once and never builds one
        if: steps.existing.outputs.digest == '' && env.TARGET_ENVIRONMENT != env.BUILD_ENVIRONMENT
        run: |
          set -euo pipefail
          echo "${{ matrix.binary }}:${DEPLOY_SHA} is not in the build registry ${{ steps.identity.outputs.registry }}." >&2
          echo "${TARGET_ENVIRONMENT} is promoted the digest ${BUILD_ENVIRONMENT} built, never a build of its own." >&2
          echo "Let the ${BUILD_ENVIRONMENT} run for ${DEPLOY_SHA} finish, then dispatch this again." >&2
          exit 1

      # Labelled with the commit it was built from and the repository it came
      # from, in the OCI names Kargo and a person both read. The Dockerfile
      # sets no label; without these an image's only link to its source is
      # the tag, and a tag is a name. Kargo's warehouse refuses freight whose
      # three images carry different tags today; the label is what lets a
      # reader — or a later step — check the same fact against the bytes
      # rather than the name (ADR 0036 decision 6). An image built before
      # this line exists carries neither label, and that is visible rather
      # than assumed.
      #
      # Two shapes of build, and the default is the cargo one. A matrix entry
      # that names no `dockerfile` is a workspace binary from the one
      # Dockerfile with `BINARY=` and the repository root as context; an entry
      # that names one brings its own file and its own context and takes no
      # build argument, because `BINARY` means nothing to it and docker warns
      # about an argument no stage consumes. The branch is on whether the
      # matrix named a Dockerfile rather than on the image's name: a `case`
      # on `qip-portal` would be a second place the list of images lives.
      #
      # The image store the builds below need, switched on before they run.
      #
      # BuildKit honours `rewrite-timestamp` only in its own image exporters,
      # and the Docker daemon uses those only with the containerd image store.
      # The hosted runner's Docker (28.0.4 on ubuntu-24.04 20261004) uses
      # graphdriver (overlay2) storage, and there:
      #   - `--output type=docker` with no `dest` is committed by the daemon's
      #     own exporter, which ignores `rewrite-timestamp`: every file in
      #     every layer carries the build's clock, so two builds of one commit
      #     are two images (deploy runs 265 and 266: same /qip bytes, same
      #     config and history, different layer digests);
      #   - `--output type=docker,dest=…` is refused outright: "Docker
      #     exporter is not supported for the docker driver. Switch to a
      #     different driver, or turn on the containerd image store".
      # Both reproduced on 2026-10-13 against a daemon on overlay2 with the
      # pinned builder digest. With the containerd store the same two builds,
      # the second `--no-cache`, load as one image id, every file's time the
      # commit's epoch. The runner is ephemeral and builds nothing before
      # this step, so the switch costs a daemon restart and loses nothing;
      # the feature is merged into whatever daemon.json the image ships, and
      # the step refuses to go on unless the daemon reports the containerd
      # snapshotter, because a build on the wrong store fails later and less
      # clearly.
      - name: build with the containerd image store
        if: steps.existing.outputs.digest == '' && env.TARGET_ENVIRONMENT == env.BUILD_ENVIRONMENT
        run: |
          set -euo pipefail
          config=/etc/docker/daemon.json
          current="$(sudo cat "$config" 2>/dev/null || echo '{}')"
          printf '%s' "$current" | jq '.features["containerd-snapshotter"] = true' > "$RUNNER_TEMP/daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/daemon.json" "$config"
          sudo systemctl restart docker
          for _ in $(seq 1 30); do
            docker info >/dev/null 2>&1 && break
            sleep 1
          done
          status="$(docker info --format '{{json .DriverStatus}}')"
          case "$status" in
            *io.containerd.snapshotter*) echo "docker is on the containerd image store: $status" ;;
            *)
              echo "docker did not come back on the containerd image store: $status" >&2
              echo "The builds below need it for rewrite-timestamp; nothing is built." >&2
              exit 1
              ;;
          esac

      # `SOURCE_DATE_EPOCH` is the commit's own timestamp, never the clock's
      # (R12 CICD-9097). It was `$(date +%s)`, so two builds of one commit
      # embedded two different times and could never share a digest — the
      # pipeline's own input guaranteed the build was not reproducible.
      # BuildKit takes the build argument as the image's creation time, and
      # `rewrite-timestamp=true` clamps every file's mtime in every layer to
      # it, so neither the checkout's time nor the build's reaches the bytes.
      # Both shapes receive it; it is not a cargo-only concern.
      - name: build
        id: build
        if: steps.existing.outputs.digest == '' && env.TARGET_ENVIRONMENT == env.BUILD_ENVIRONMENT
        env:
          PRIVATE_POOL: ${{ steps.identity.outputs.private_pool }}
          POOL_ID: ${{ steps.identity.outputs.pool_id }}
          POOL_PROJECT: ${{ steps.identity.outputs.pool_project }}
          POOL_REGION: ${{ steps.identity.outputs.pool_region }}
          POOL_ACCOUNT: ${{ steps.identity.outputs.pool_account }}
          POOL_STAGING: ${{ steps.identity.outputs.pool_staging }}
          POOL_OUTPUT: ${{ steps.identity.outputs.pool_output }}
          BINARY: ${{ matrix.binary }}
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          prefix="${{ steps.identity.outputs.registry }}"
          epoch="$(git log -1 --format=%ct "${DEPLOY_SHA}")"
          case "$epoch" in
            ''|*[!0-9]*)
              echo "the commit time of ${DEPLOY_SHA} is not a number of seconds: '$epoch'" >&2
              exit 1
              ;;
          esac
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          dockerfile="${{ matrix.dockerfile }}"
          context="${{ matrix.context }}"

          # In the Cloud Build private pool (R12 CICD-9097), when the build
          # environment's committed tfvars say so. The recipe is
          # `infrastructure/cloudbuild/build-image.yaml`: this step's build
          # and the next step's uncached rebuild and image-id comparison,
          # moved rather than rewritten — same Dockerfile, same commit
          # epoch, same `rewrite-timestamp`, same labels. The pool pushes
          # nothing. It saves the one image both builds agreed on to the
          # staging bucket, with the id it computed, and this step loads it
          # and refuses unless the loaded id is that id; the push, the scan,
          # the signature and the attestation then run here exactly as on
          # the runner path, so the build identity needs no registry write
          # and a build can never attest its own output.
          #
          # A pool failure is never followed by a runner build: the tfvars
          # said the pool, and a silent fallback to a shared runner is the
          # gap this branch closes.
          if [ "${PRIVATE_POOL}" = "true" ]; then
            echo "where=pool" >> "$GITHUB_OUTPUT"
            reproducible=true
            [ -z "${dockerfile}" ] || reproducible=false
            out="${POOL_OUTPUT}/${DEPLOY_SHA}/${BINARY}"
            if ! gcloud builds submit . \
                --project "${POOL_PROJECT}" \
                --region "${POOL_REGION}" \
                --worker-pool "${POOL_ID}" \
                --service-account "${POOL_ACCOUNT}" \
                --gcs-source-staging-dir "${POOL_STAGING}" \
                --config infrastructure/cloudbuild/build-image.yaml \
                --substitutions "_IMAGE=${prefix}/${BINARY}:${DEPLOY_SHA},_BINARY=${BINARY},_DOCKERFILE=${dockerfile},_CONTEXT=${context},_EPOCH=${epoch},_REVISION=${DEPLOY_SHA},_SOURCE=${SOURCE_URL},_REPRODUCIBLE=${reproducible},_OUTPUT=${out}"; then
              echo "the private-pool build of ${BINARY} failed; nothing was built on the runner instead." >&2
              echo "If ${POOL_ID} does not exist yet, apply the plan that creates module.build_pool, or set cloud_build_private_pool_enabled = false." >&2
              exit 1
            fi
            gcloud storage cp "${out}/image.tar" "${out}/image.id" "${RUNNER_TEMP}/"
            docker load --input "${RUNNER_TEMP}/image.tar"
            expected="$(tr -d '[:space:]' < "${RUNNER_TEMP}/image.id")"
            loaded="$(docker image inspect --format '{{.Id}}' "${prefix}/${BINARY}:${DEPLOY_SHA}")"
            if [ -z "$expected" ] || [ "$loaded" != "$expected" ]; then
              echo "the image loaded from the pool is ${loaded}, not the ${expected:-<nothing>} the pool built; nothing is pushed." >&2
              exit 1
            fi
            echo "built ${BINARY} for ${DEPLOY_SHA} in ${POOL_ID}: ${loaded}"
            exit 0
          fi
          echo "where=runner" >> "$GITHUB_OUTPUT"

          recipe=(--build-arg "SOURCE_DATE_EPOCH=${epoch}")
          if [ -n "${dockerfile}" ]; then
            recipe+=(--file "${dockerfile}")
          else
            recipe+=(--file infrastructure/docker/Dockerfile --build-arg "BINARY=${{ matrix.binary }}" --build-arg "QIP_SOURCE_COMMIT=${DEPLOY_SHA}")
          fi
          # Exported to a tarball and loaded, never written straight into the
          # daemon's image store: on the containerd store, which the step
          # above switches to, `rewrite-timestamp` conflicts with the unpack
          # a direct load implies, so the tarball exporter is the path that
          # applies it, and `docker load` takes the layers as the tarball
          # holds them. The image id is then a function of the commit.
          docker buildx build \
            "${recipe[@]}" \
            --output "type=docker,dest=${RUNNER_TEMP}/${{ matrix.binary }}.tar,rewrite-timestamp=true" \
            --label "org.opencontainers.image.revision=${DEPLOY_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --tag "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}" \
            "${context:-.}"
          docker load --input "${RUNNER_TEMP}/${{ matrix.binary }}.tar"

      # The check R12 CICD-9097 asks for: build the commit a second time,
      # from nothing cached, and require the same image. A build that is not
      # reproducible cannot be verified against its source — nobody can
      # rebuild the commit and arrive at the bytes that ran — so a mismatch
      # stops the line here, before anything is pushed, rather than being
      # discovered by an auditor. The comparison is the image id, which is
      # the digest of the image's configuration and therefore of every
      # layer's content; the label and the tag are identical by
      # construction and do not hide a difference.
      #
      # The workspace binaries only, and the exception is stated rather than
      # hidden: `qip-portal` is a Next.js build, and Next stamps every build
      # with a random build id unless `generateBuildId` is pinned, which
      # `frontend/portal` does not do. Running this against it would fail
      # every portal build for a known reason and make the console
      # undeployable; skipping it silently would claim a property nobody
      # measured. So the portal is built with the commit's epoch like
      # everything else and its reproducibility is recorded as open work in
      # infrastructure/gitops/kargo/README.md.
      - name: a second build of the commit is the same image
        id: reproducibility
        # Not after a pool build: the pool ran this same rebuild and
        # comparison itself and refuses to hand back an image otherwise.
        if: steps.build.outcome == 'success' && matrix.dockerfile == '' && steps.build.outputs.where == 'runner'
        run: |
          set -euo pipefail
          prefix="${{ steps.identity.outputs.registry }}"
          docker buildx build \
            --no-cache \
            --build-arg "SOURCE_DATE_EPOCH=${{ steps.build.outputs.epoch }}" \
            --file infrastructure/docker/Dockerfile \
            --build-arg "BINARY=${{ matrix.binary }}" \
            --build-arg "QIP_SOURCE_COMMIT=${DEPLOY_SHA}" \
            --output "type=docker,dest=${RUNNER_TEMP}/${{ matrix.binary }}-rebuild.tar,rewrite-timestamp=true" \
            --label "org.opencontainers.image.revision=${DEPLOY_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --tag "qip-reproducibility/${{ matrix.binary }}:${DEPLOY_SHA}" \
            .
          docker load --input "${RUNNER_TEMP}/${{ matrix.binary }}-rebuild.tar"
          first="$(docker image inspect --format '{{.Id}}' "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}")"
          second="$(docker image inspect --format '{{.Id}}' "qip-reproducibility/${{ matrix.binary }}:${DEPLOY_SHA}")"
          if [ "$first" != "$second" ]; then
            echo "two builds of ${DEPLOY_SHA} produced two images: ${first} and ${second}." >&2
            echo "Nothing is pushed. An image nobody can rebuild from its commit cannot be verified against it." >&2
            # Say what differed. deploy run 265 (2026-10-12), the first run
            # to reach this step, failed it for all four binaries with the
            # two image ids above and nothing else, and a local double
            # build of qip-edge-node on glibc was byte-identical — so the
            # next failure has to name the layer, the config field or the
            # bytes of /qip that moved, or nobody can find it. Every diff
            # below is `|| true`: this step has already failed, and the
            # evidence is the point.
            diag="$RUNNER_TEMP/reproducibility"
            mkdir -p "$diag/first" "$diag/second"
            for which in first second; do
              ref="${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}"
              [ "$which" = first ] || ref="qip-reproducibility/${{ matrix.binary }}:${DEPLOY_SHA}"
              docker image inspect --format '{{json .RootFS.Layers}}' "$ref" > "$diag/$which/layers.json"
              docker image inspect --format '{{json .Config}}' "$ref" | jq -S . > "$diag/$which/config.json"
              docker image history --no-trunc --format '{{.CreatedAt}} {{.Size}} {{.CreatedBy}}' "$ref" > "$diag/$which/history.txt"
              container="$(docker create "$ref" /qip)"
              docker cp "$container:/qip" "$diag/$which/qip"
              docker rm "$container" >/dev/null
            done
            echo "::group::layers"; diff "$diag/first/layers.json" "$diag/second/layers.json" && echo "identical"; echo "::endgroup::"
            echo "::group::config"; diff "$diag/first/config.json" "$diag/second/config.json" && echo "identical"; echo "::endgroup::"
            echo "::group::history"; diff "$diag/first/history.txt" "$diag/second/history.txt" && echo "identical"; echo "::endgroup::"
            echo "::group::/qip"
            sha256sum "$diag/first/qip" "$diag/second/qip"
            if cmp -s "$diag/first/qip" "$diag/second/qip"; then
              echo "the binaries are identical; the difference is in the image, not the build"
            else
              echo "the binaries differ: $(cmp -l "$diag/first/qip" "$diag/second/qip" | wc -l) of $(stat -c %s "$diag/first/qip") bytes, first at $(cmp "$diag/first/qip" "$diag/second/qip" 2>&1 | head -1)"
              echo "section headers:"
              diff <(readelf -S -W "$diag/first/qip") <(readelf -S -W "$diag/second/qip") && echo "identical"
            fi
            echo "::endgroup::"
            exit 1
          fi
          echo "two builds of ${DEPLOY_SHA} are the same image: ${first}"

      # The two builds, kept for a week when they differ, so the bytes can
      # be compared off the runner with tools the runner does not have.
      - name: keep both builds when they differ
        if: failure() && steps.reproducibility.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-${{ matrix.binary }}-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/reproducibility
          retention-days: 7

      # Scan the image before it is pushed, signed, or attested. After the
      # push would be too late: a signed, attested, vulnerable image is
      # admissible.
      #
      # For the four binaries the image is a static binary on scratch, so
      # anything this finds is in that binary's own dependency graph — which
      # is serde and serde_json — and a finding is worth stopping the line
      # for. `qip-portal` is the one image here with an operating system and
      # an npm tree under it, so it is the one that can fail this gate on
      # somebody else's advisory; that is the cost of putting a browser
      # surface through the same gate as everything else, and it is the right
      # cost. The gate is not relaxed for it.
      - name: scan image
        run: |
          set -euo pipefail
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
          prefix="${{ steps.identity.outputs.registry }}"
          trivy image \
              --no-progress \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}"

      # Tagged by commit and never by `latest`. The registry refuses to move a
      # tag onto different bytes, so a tag names one image for ever and a
      # rollback is a tag somebody can still find — and, since the step
      # above, one this job finds for itself and reuses.
      - name: push
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          prefix="${{ steps.identity.outputs.registry }}"
          docker push "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}"

      # Sign it. This is the step that makes every service's
      # `binary_authorization { use_default = true }` mean something.
      #
      # The GKE runtime once enforced against no policy, so Google evaluated
      # the implicit one — default rule `ALWAYS_ALLOW` — and every image in
      # the registry was admissible.
      # `infrastructure/terraform/modules/binaryauthorization` makes the
      # default rule deny; this is what puts an image on the other side of it.
      #
      # By digest, never by tag. An attestation names bytes, and Binary
      # Authorization evaluates the digest a revision asks for and looks for
      # an attestation of *that*. The digest is read back from the registry
      # rather than from the local daemon, because what is signed has to be
      # what Cloud Run will pull.
      #
      # What this proves is that the pipeline pushed these bytes, and nothing
      # more: not that the source was reviewed, not that the dependencies were
      # the ones the lockfile names. The limits, and the two things a
      # deployment must still arrange, are in
      # infrastructure/terraform/modules/binaryauthorization/OUT-OF-BAND.md.
      - name: sign the pushed image
        env:
          BINAUTHZ_ATTESTOR: ${{ steps.identity.outputs.attestor }}
          BINAUTHZ_KEY_VERSION: ${{ steps.identity.outputs.key_version }}
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
          # The image is in the build registry for every environment; the
          # attestor and its key are the target environment's own, so each
          # environment's Binary Authorization policy still admits only what
          # its own attestor signed. One set of bytes, four signatures.
          BUILD_REGISTRY: ${{ steps.identity.outputs.registry }}
        run: |
          set -euo pipefail
          prefix="${BUILD_REGISTRY}"
          digest=$(gcloud artifacts docker images describe \
            "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}" \
            --format='value(image_summary.digest)')
          if [ -z "${digest}" ]; then
            echo "the registry reports no digest for ${{ matrix.binary }}:${DEPLOY_SHA}." >&2
            exit 1
          fi
          image="${prefix}/${{ matrix.binary }}@${digest}"

          # A re-run of this workflow for the same commit must not fail here.
          # `sign-and-create` refuses to write an attestation that already
          # exists, and a re-deploy of an unchanged commit is a normal thing to
          # do — so an existing attestation for these exact bytes is success,
          # not a conflict.
          existing=$(gcloud container binauthz attestations list \
            --project "${GCP_PROJECT}" \
            --attestor "${BINAUTHZ_ATTESTOR}" \
            --attestor-project "${GCP_PROJECT}" \
            --artifact-url "${image}" \
            --format='value(name)')
          if [ -n "${existing}" ]; then
            echo "${image} is already attested."
            exit 0
          fi

          # `sign-and-create` moved to the beta track in current gcloud;
          # the component is installed in the setup step above.
          gcloud beta container binauthz attestations sign-and-create \
            --project "${GCP_PROJECT}" \
            --artifact-url "${image}" \
            --attestor "${BINAUTHZ_ATTESTOR}" \
            --attestor-project "${GCP_PROJECT}" \
            --keyversion "${BINAUTHZ_KEY_VERSION}"

  # ── Record ─────────────────────────────────────────────────────────────
  #
  # What this job did until ADR 0036 — `gcloud run services update`, the
  # serving proof, the images.tfvars write and its commit — belongs to the
  # reconciler now. Kargo's warehouse on the environment's control plane
  # polls the registry and discovers the digest this run attested; its
  # promotion commits the digest into
  # infrastructure/gitops/envs/<env>/kustomization.yaml (automatically for
  # dev, on a person's approval for test and stage, never for prod); Argo CD
  # reconciles the commit through Config Connector; and the post-sync hook
  # in envs/<env>/prove-serving.yaml asks the two questions prove-serving.py
  # asked here — is the revision Ready, does the routed revision's workload
  # container run the digest — and fails the sync when the answer is no.
  # ADR 0024 decision 3's proof moved, and was not weakened.
  #
  # Nothing here talks to Kargo, and this comment is where that is said
  # rather than a step that would fail: Kargo's API server is a ClusterIP
  # service on a cluster whose endpoint is private, a GitHub runner has no
  # route to it, and the warehouse needs no notification — it polls.
  #
  # What stays: the record of what was pushed, in the run's summary, and the
  # execution node's rolling replacement (ADR 0036 decision 11), because the
  # node is not a Cloud Run service and is not moving. It runs a boot image,
  # not a container, and nothing in this repository bakes one yet —
  # modules/execution-node/README.md and ADR 0024 record that as the
  # remaining work. What this job does for a node is the rolling replacement
  # §41.4 describes, so that a node whose template Terraform already changed
  # is re-created from it under the group's surge-one, wait-for-health
  # policy. With `execution_nodes` empty in every environment the step finds
  # no group and says so.
  deploy:
    name: record what was pushed (${{ inputs.environment || 'dev' }})
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      # Read-only. This job no longer commits anything: Kargo's promotion
      # commit is the record.
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # The same derivation as the images job, from the same committed
      # tfvars, for the same reason: nothing here may depend on a repository
      # variable. Every value below is fixed by the Terraform that creates
      # it, so constructing it here cannot drift from what exists:
      #   registry  modules/registry names it qip-<env>
      #   node      modules/execution-node names the group qip-<env>-exec-<id>
      - name: derive the identity from the tfvars
        id: identity
        run: |
          set -euo pipefail
          tfvars="infrastructure/environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          [ -f "$tfvars" ] || { echo "no tfvars at $tfvars" >&2; exit 1; }
          project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          number="$(sed -n 's/^project_number[[:space:]]*=[[:space:]]*\([0-9]*\)/\1/p' "$tfvars" | head -1)"
          region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          [ -n "$region" ] || region="europe-west2"
          [ -n "$project" ] && [ -n "$number" ] || {
            echo "$tfvars carries no project_id/project_number" >&2
            exit 1
          }
          # `project_number = 0` beside a real project id is the marker a tfvars
          # carries between the project being declared and its number being recorded
          # (ADR 0118): Google assigns the number at creation, so it cannot be
          # committed before. Read through, it becomes `projects/0/…` and the OIDC
          # exchange fails naming an audience, which sends an operator to workload
          # identity federation for a problem that is one line in this file. The
          # `unprovisioned` marker carries 0 too and has its own refusal below.
          if [ "$number" = "0" ] && [ "$project" != "unprovisioned" ]; then
            echo "$tfvars records project_number = 0: the number Google assigned to $project has not been recorded yet." >&2
            echo "Run scripts/bootstrap-foundation.sh as the owner (docs/ops/runbooks/new-project-from-scratch.md), commit the number it writes, then dispatch this again." >&2
            exit 1
          fi

          # The character set of what was read, before any of it is pasted into
          # a gcloud argument, a registry path or a workload-identity audience.
          #
          # The tfvars are reviewed configuration — but this job reads them out
          # of the commit it was pointed at, not out of the reviewed branch, so
          # "reviewed" is a property of the file's history rather than of the
          # bytes in front of this step. A `project_id` carrying a quote and a
          # semicolon would reach the shells below as source text, because
          # `steps.identity.outputs.project` is substituted into four of
          # them before bash parses a byte. A project id and a region are
          # lowercase letters, digits and hyphens; anything else is not a
          # malformed name, it is somebody else's command. Emptiness is refused
          # above, which is why this arm does not repeat it.
          for value in "$project" "$region"; do
            case "$value" in
              *[!a-z0-9-]*)
                echo "$tfvars names a project or a region containing a character neither can contain: '$value'" >&2
                echo "Permitted: lowercase letters, digits and -" >&2
                exit 1
                ;;
            esac
          done
          if [ "$project" = "unprovisioned" ]; then
            echo "environment '${TARGET_ENVIRONMENT}' is not provisioned." >&2
            exit 1
          fi
          # The build registry, derived exactly as the images job derives it:
          # what is recorded is what was attested, which is in the one
          # registry every environment is promoted from.
          build_tfvars="infrastructure/environments/${BUILD_ENVIRONMENT}/terraform.tfvars"
          [ -f "$build_tfvars" ] || { echo "no tfvars at $build_tfvars" >&2; exit 1; }
          build_project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$build_tfvars" | head -1)"
          build_region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$build_tfvars" | head -1)"
          [ -n "$build_region" ] || build_region="europe-west2"
          case "$build_project" in
            ''|unprovisioned|*[!a-z0-9-]*)
              echo "$build_tfvars names no provisioned project ('$build_project')." >&2
              exit 1
              ;;
          esac
          case "$build_region" in
            *[!a-z0-9-]*)
              echo "$build_tfvars names a region containing a character a region cannot: '$build_region'" >&2
              exit 1
              ;;
          esac
          {
            echo "project=$project"
            echo "region=$region"
            echo "provider=projects/$number/locations/global/workloadIdentityPools/qip-github-${TARGET_ENVIRONMENT}/providers/github"
            echo "account=qip-ci-${TARGET_ENVIRONMENT}@$project.iam.gserviceaccount.com"
            echo "registry=${build_region}-docker.pkg.dev/${build_project}/qip-${BUILD_ENVIRONMENT}"
          } >> "$GITHUB_OUTPUT"

      - name: authenticate without a key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.account }}

      - uses: google-github-actions/setup-gcloud@v2

      # The catalogue's workloads, by the names catalogue.tf gives them, and
      # the binary each runs. Read out of the committed catalogue rather than
      # listed here, so a workload added there is recorded here without a
      # second edit — and a workload listed here that the catalogue does not
      # know is refused before anything is recorded.
      - name: read the catalogue
        id: catalogue
        run: |
          set -euo pipefail
          catalogue="infrastructure/terraform/catalogue.tf"
          # `    name = {` opens an entry; the `binary = "..."` inside it is
          # the image. Four-space indent is the catalogue's own shape and the
          # acceptance suite pins it.
          pairs="$(awk '
            /^    [a-z][a-z0-9-]* = \{$/ { name=$1 }
            /^      binary[[:space:]]*=/ { gsub(/"/, "", $3); print name "=" $3 }
          ' "$catalogue")"
          [ -n "$pairs" ] || { echo "no workload was read out of $catalogue" >&2; exit 1; }
          echo "$pairs"
          echo "pairs=$(echo "$pairs" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # The record: every catalogue workload's binary and the digest the
      # images job attested for this commit, read back from the registry
      # rather than from the build, because what was signed is what the
      # warehouse will find. Written to the run's summary, where the person
      # who dispatched the run reads it; a digest the registry does not hold
      # fails this step, since the images job was supposed to push it.
      - name: record the attested digests
        id: record
        env:
          BUILD_REGISTRY: ${{ steps.identity.outputs.registry }}
          PAIRS: ${{ steps.catalogue.outputs.pairs }}
        run: |
          set -euo pipefail
          prefix="${BUILD_REGISTRY}"
          {
            echo "## ${TARGET_ENVIRONMENT}: images attested for ${DEPLOY_SHA} by run ${GITHUB_RUN_ID}"
            echo
            echo "| workload | binary | digest |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in $PAIRS; do
            name="${pair%%=*}"
            binary="${pair#*=}"
            digest=$(gcloud artifacts docker images describe \
              "${prefix}/${binary}:${DEPLOY_SHA}" \
              --format='value(image_summary.digest)')
            if [ -z "$digest" ]; then
              echo "no digest for ${binary}:${DEPLOY_SHA}; the images job did not push it" >&2
              exit 1
            fi
            echo "| ${name} | ${binary} | \`${digest}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "${name}: ${prefix}/${binary}@${digest}"
          done
          {
            echo
            echo "Nothing was deployed by this run. The digests are in the one build"
            echo "registry (${prefix}); this run attested them for ${TARGET_ENVIRONMENT}."
            echo "The Kargo warehouse discovers them on its own poll and its promotions"
            echo "carry the same digests along dev, test, replay, paper, stage, prod —"
            echo "automatically into dev, on a person's approval for every later link,"
            echo "never into prod — and Argo CD's post-sync hook proves the routed"
            echo "revision serves them. Kargo's API is not reachable from a runner"
            echo "(the control plane's endpoint is private), so this run notified"
            echo "nothing and says so (ADR 0036)."
          } >> "$GITHUB_STEP_SUMMARY"

      # The execution nodes: a rolling replacement under the group's own
      # policy, for every group the environment has. None today — every
      # environment's `execution_nodes` is empty — and the step says so
      # rather than inventing a group to update.
      - name: replace every execution node under its group's rolling policy
        env:
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
        run: |
          set -euo pipefail
          groups="$(gcloud compute instance-groups managed list \
            --project "${GCP_PROJECT}" \
            --filter="name~^qip-${TARGET_ENVIRONMENT}-exec-" \
            --format='value(name,zone.basename())')"
          if [ -z "$groups" ]; then
            echo "no execution node group exists in ${TARGET_ENVIRONMENT}; nothing to replace."
            exit 0
          fi
          while read -r group zone; do
            [ -n "$group" ] || continue
            # Surge one, wait for the health check, retire the old machine —
            # the group's update policy, which Terraform set and this does
            # not override.
            gcloud compute instance-groups managed rolling-action replace "$group" \
              --project "${GCP_PROJECT}" --zone "$zone" \
              --max-surge 1 --max-unavailable 0 --quiet
            echo "replacing ${group} in ${zone} under its rolling policy"
          done <<< "$groups"
