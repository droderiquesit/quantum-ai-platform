# Build the images, then deploy them.
#
# Two rules shape everything below.
#
# **Nothing deploys that has not passed the test suite.** `ci.yml` is the gate;
# this workflow does not re-run it and does not have its own weaker copy. On the
# automatic path it is triggered by ci finishing and refuses to proceed unless
# ci succeeded. On the manual path it asks GitHub whether ci succeeded for the
# commit being deployed, because "somebody pressed the button" is not evidence.
#
# **Production is never automatic.** The automatic path deploys to `dev` and
# nowhere else. `test`, `stage` and `prod` need a person to dispatch the
# workflow, and the `prod` GitHub environment is expected to carry
# required reviewers — a repository setting, not something this file can
# create. See docs/operations/external-dependencies.md.
#
# There is no service-account key anywhere here. The pipeline authenticates by
# exchanging the OIDC token GitHub mints for one job, through the workload
# identity pool the `cicd` Terraform module creates. Two repository variables
# carry the result of that Terraform, and until they are set this workflow
# cannot authenticate and says so:
#
#   GCP_WORKLOAD_IDENTITY_PROVIDER   terraform output workload_identity_provider
#   GCP_DEPLOY_SERVICE_ACCOUNT       terraform output deploy_service_account
#   GCP_PROJECT                      the project the environment lives in
#   GCP_REGION                       the region it lives in
#
# Two more carry the result of the `binaryauthorization` module. The cluster
# refuses an image nothing has attested, so an unsigned image is one that
# pushes successfully and is refused at admission later, appearing as a pod
# that will not schedule rather than as a deployment that failed. The `images`
# job therefore refuses to build at all until both are set:
#
#   GCP_BINAUTHZ_ATTESTOR            terraform output binary_authorization_attestor
#   GCP_BINAUTHZ_KEY_VERSION         terraform output binary_authorization_key_version
name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    # The repository's default branch. It is not named `main`: the platform
    # was built on this branch and it became the default, so a filter on
    # `main` matched nothing and the automatic path could never fire — a
    # pipeline that looked complete and was unreachable. `main` stays listed
    # so a later rename to the conventional name does not silently re-break
    # this trigger in the other direction.
    branches:
      - "main"
      - "claude/autonomous-investment-platform-76gt4y"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy to. Production is never reached any other way."
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - stage
          - prod

# Read-only by default. The jobs that need to mint an OIDC token ask for it
# explicitly, so the blast radius of a compromised action is visible in the diff
# that granted it.
permissions:
  contents: read

concurrency:
  # One deployment at a time per environment. Two applies racing each other
  # produce a cluster in a state neither of them describes.
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  # The automatic path goes to dev and nowhere else.
  TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # The gate. Everything else needs this job, so a failure here stops the
  # pipeline rather than producing images nobody should deploy.
  gate:
    name: the test suite passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: refuse a production deployment that nobody dispatched
        if: env.TARGET_ENVIRONMENT == 'prod' && github.event_name != 'workflow_dispatch'
        run: |
          echo "prod is not deployed automatically." >&2
          exit 1

      - name: the triggering ci run succeeded
        if: github.event_name == 'workflow_run'
        run: |
          conclusion='${{ github.event.workflow_run.conclusion }}'
          if [ "$conclusion" != "success" ]; then
            echo "ci concluded '$conclusion'; nothing is deployed." >&2
            exit 1
          fi

      # On the manual path there is no triggering run to inspect, so ask for
      # the commit's own history. A dispatch against a commit whose tests never
      # passed is exactly the case this exists to refuse.
      - name: ci succeeded for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&status=success" \
            --jq '.total_count')
          if [ "$runs" -lt 1 ]; then
            echo "no successful ci run for ${DEPLOY_SHA}; nothing is deployed." >&2
            exit 1
          fi
          echo "ci succeeded for ${DEPLOY_SHA}"

  # One image per deployable binary, built from the one Dockerfile so the four
  # cannot drift apart.
  #
  # The workspace builds five binaries and this matrix names four. Which ones
  # deploy, and why the others do not, is decided in
  # docs/adr/0010-what-gets-deployed.md rather than here — a reason living only
  # in a matrix comment is a reason only the person editing the matrix reads.
  #
  #   * `qip`, from `qip-cli`, is absent on purpose: it is an operator's tool,
  #     run by a person against a cluster rather than scheduled in one.
  #   * `qip-web` is absent because it is not a binary. It is the library
  #     `qip-api` links and renders from — `crates/apps/qip-web` declares no
  #     `[[bin]]` and has no `main.rs` — so its pages are already served by the
  #     `qip-api` image, on `qip-api`'s port. An entry here would ask the
  #     Dockerfile for `cargo build --bin qip-web`, which has nothing to build.
  #
  # None of that is left as a claim.
  # crates/tests/qip-acceptance/tests/infrastructure.rs checks it in every
  # direction that can be wrong: a binary that appears with no image fails, an
  # image with no manifest fails, a manifest with no image fails, an exclusion
  # whose reason is not in the decision record fails, and `qip-web` gaining a
  # `main.rs` fails rather than quietly shipping a library nobody serves.
  images:
    name: build and push ${{ matrix.binary }}
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token. This is the whole reason there is no key.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        binary:
          - qip-api
          - qip-fastbrain
          - qip-deepbrain
          - qip-edge-node
    steps:
      # Refuse to build an image nothing will sign.
      #
      # First, before the checkout and before anything is built: the failure
      # this prevents is four images pushed to the registry that the cluster
      # will then refuse, and a pipeline that reports success up to the moment
      # somebody wonders why no pod is starting. Named variables, named
      # commands, so the fix is in the error rather than in a runbook.
      - name: the signing variables are set
        env:
          BINAUTHZ_ATTESTOR: ${{ vars.GCP_BINAUTHZ_ATTESTOR }}
          BINAUTHZ_KEY_VERSION: ${{ vars.GCP_BINAUTHZ_KEY_VERSION }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${BINAUTHZ_ATTESTOR}" ] || missing="${missing} GCP_BINAUTHZ_ATTESTOR"
          [ -n "${BINAUTHZ_KEY_VERSION}" ] || missing="${missing} GCP_BINAUTHZ_KEY_VERSION"
          if [ -n "${missing}" ]; then
            echo "unset repository variables:${missing}" >&2
            echo "set them from 'terraform output binary_authorization_attestor'" >&2
            echo "and 'terraform output binary_authorization_key_version'." >&2
            echo "Until they are, nothing attests these images and the cluster's" >&2
            echo "Binary Authorization policy refuses every one of them." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: authenticate without a key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: let docker push to artifact registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: build
        run: |
          set -euo pipefail
          prefix="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/qip-${TARGET_ENVIRONMENT}"
          docker build \
            --file infrastructure/docker/Dockerfile \
            --build-arg "BINARY=${{ matrix.binary }}" \
            --tag "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}" \
            .

      # Tagged by commit and never by `latest`. The registry refuses to move a
      # tag onto different bytes, so a tag names one image for ever and a
      # rollback is a tag somebody can still find.
      - name: push
        run: |
          set -euo pipefail
          prefix="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/qip-${TARGET_ENVIRONMENT}"
          docker push "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}"

      # Sign it. This is the step that makes the cluster's
      # `binary_authorization` block mean something.
      #
      # It was enforcing `PROJECT_SINGLETON_POLICY_ENFORCE` against no policy,
      # so Google evaluated the implicit one — default rule `ALWAYS_ALLOW` —
      # and every image in the registry was admissible.
      # `infrastructure/terraform/modules/binaryauthorization` makes the
      # default rule deny; this is what puts an image on the other side of it.
      #
      # By digest, never by tag. An attestation names bytes, and Binary
      # Authorization resolves whatever a manifest asks for to a digest and
      # looks for an attestation of *that*. The digest is read back from the
      # registry rather than from the local daemon, because what is signed has
      # to be what a node will pull.
      #
      # What this proves is that the pipeline pushed these bytes, and nothing
      # more: not that the source was reviewed, not that the dependencies were
      # the ones the lockfile names. The limits, and the two things a
      # deployment must still arrange, are in
      # infrastructure/terraform/modules/binaryauthorization/OUT-OF-BAND.md.
      - name: sign the pushed image
        env:
          BINAUTHZ_ATTESTOR: ${{ vars.GCP_BINAUTHZ_ATTESTOR }}
          BINAUTHZ_KEY_VERSION: ${{ vars.GCP_BINAUTHZ_KEY_VERSION }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/qip-${TARGET_ENVIRONMENT}"
          digest=$(gcloud artifacts docker images describe \
            "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}" \
            --format='value(image_summary.digest)')
          if [ -z "${digest}" ]; then
            echo "the registry reports no digest for ${{ matrix.binary }}:${DEPLOY_SHA}." >&2
            exit 1
          fi
          image="${prefix}/${{ matrix.binary }}@${digest}"

          # A re-run of this workflow for the same commit must not fail here.
          # `sign-and-create` refuses to write an attestation that already
          # exists, and a re-deploy of an unchanged commit is a normal thing to
          # do — so an existing attestation for these exact bytes is success,
          # not a conflict.
          existing=$(gcloud container binauthz attestations list \
            --project "${GCP_PROJECT}" \
            --attestor "${BINAUTHZ_ATTESTOR}" \
            --attestor-project "${GCP_PROJECT}" \
            --artifact-url "${image}" \
            --format='value(name)')
          if [ -n "${existing}" ]; then
            echo "${image} is already attested."
            exit 0
          fi

          gcloud container binauthz attestations sign-and-create \
            --project "${GCP_PROJECT}" \
            --artifact-url "${image}" \
            --attestor "${BINAUTHZ_ATTESTOR}" \
            --attestor-project "${GCP_PROJECT}" \
            --keyversion "${BINAUTHZ_KEY_VERSION}"

  deploy:
    name: deploy to ${{ inputs.environment || 'dev' }}
    needs: images
    runs-on: ubuntu-latest
    # The GitHub environment. Where required reviewers and deployment branch
    # rules are configured, which is why `prod` names one at all.
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: authenticate without a key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: credentials for the private cluster
        run: |
          gcloud container clusters get-credentials "qip-${TARGET_ENVIRONMENT}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT }}"

      # The manifests carry placeholders rather than values, so the same files
      # describe every environment and a diff between environments is a diff in
      # this substitution rather than in five copies of a Deployment.
      #
      # edge-cell.yaml is not applied here. A cell needs its cell id, its region
      # and its venue ranges, and bringing one up is a deliberate act with a
      # runbook — docs/operations/deploying-an-edge-cell.md — rather than
      # something a pipeline does unattended to a workload that trades.
      - name: render the manifests
        run: |
          set -euo pipefail
          prefix="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/qip-${TARGET_ENVIRONMENT}"
          mkdir -p rendered
          for manifest in infrastructure/kubernetes/base/*.yaml; do
            case "$(basename "$manifest")" in
              edge-cell.yaml) continue ;;
            esac
            sed \
              -e "s#IMAGE_PREFIX#${prefix}#g" \
              -e "s#IMAGE_TAG#${DEPLOY_SHA}#g" \
              -e "s#ENVIRONMENT#${TARGET_ENVIRONMENT}#g" \
              -e "s#PROJECT#${{ vars.GCP_PROJECT }}#g" \
              "$manifest" > "rendered/$(basename "$manifest")"
          done
          # Nothing may reach the cluster with a placeholder still in it. A
          # `cidr: VENUE_CIDR` would be rejected by the API server; a
          # `PROJECT` in a workload identity annotation would not be, and would
          # produce a pod that cannot authenticate.
          ! grep -RnE 'IMAGE_PREFIX|IMAGE_TAG|PROJECT|ENVIRONMENT|CELL_ID|CELL_REGION|CELL_VENUES|VENUE_CIDR|VENUE_PORT' rendered

      # A dry run against the live API server first. It catches a manifest the
      # cluster will reject — an admission policy, a bad field — without having
      # applied half of it.
      - name: check the manifests against the cluster
        run: kubectl apply --server-side --dry-run=server -f rendered/

      - name: apply
        run: kubectl apply --server-side -f rendered/

      # An apply that returns is not a deployment that worked. This is the step
      # that fails when the image does not start.
      #
      # The list is every Deployment the step above applied and nothing else.
      # `qip-edge-CELL_ID` is not on it because `edge-cell.yaml` was skipped,
      # and `kubectl rollout status` against a Deployment nobody created waits
      # until it times out rather than failing usefully. The correspondence is
      # checked by `the_rollout_waits_on_every_workload_the_pipeline_applies`,
      # so adding a manifest without adding it here fails the test suite rather
      # than producing a pipeline that reports success for a workload it never
      # looked at.
      #
      # Stated because it will be met on the first real run: two of these three
      # do not serve yet. `qip-fastbrain` and `qip-deepbrain` return from
      # `fn run`, so their containers exit and are restarted, and this step is
      # expected to time out against them until the serving loops land. That is
      # a known blocking gap, recorded with the others in
      # docs/operations/external-dependencies.md — not something to work around
      # by dropping them from this list.
      # Each entry is kind-qualified. `kubectl rollout status` needs the kind,
      # and a workload converted from a Deployment to a StatefulSet — which is
      # what any workload keeping a journal becomes — would otherwise leave
      # this step waiting on a Deployment that does not exist, until it times
      # out, reporting a failure that is not the real one.
      - name: wait for the rollout
        run: |
          set -euo pipefail
          for workload in deployment/qip-api deployment/qip-fastbrain deployment/qip-deepbrain; do
            kubectl rollout status "${workload}" \
              --namespace qip --timeout=5m
          done
