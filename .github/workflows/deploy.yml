# Build, scan, sign and attest the images, then move each Cloud Run service to
# the attested digest and prove it serves it.
#
# Two rules shape everything below.
#
# **Nothing deploys that has not passed the test suite.** `ci.yml` is the gate;
# this workflow does not re-run it and does not have its own weaker copy. On the
# automatic path it is triggered by ci finishing and refuses to proceed unless
# ci succeeded. On the manual path it asks GitHub whether ci succeeded for the
# commit being deployed, because "somebody pressed the button" is not evidence.
#
# **Production is never automatic.** The automatic path deploys to `dev` and
# nowhere else. `test`, `stage` and `prod` need a person to dispatch the
# workflow, and the `prod` GitHub environment is expected to carry
# required reviewers — a repository setting, not something this file can
# create. See docs/operations/external-dependencies.md.
#
# There is no service-account key anywhere here. The pipeline authenticates by
# exchanging the OIDC token GitHub mints for one job, through the workload
# identity pool the `cicd` Terraform module creates.
#
# **Nothing here is hand-configured.** Every value that authentication and
# attestation need — the provider audience, the CI service account, the
# Binary Authorization attestor and the key version that signs for it — is a
# pure function of the project id and project number recorded in
# `infrastructure/environments/<env>/terraform.tfvars`. The `derive the
# identity from the tfvars` step reads that file and constructs all six.
#
# They used to be repository variables a person pasted from `terraform
# output`. One of those pastes came from a shell whose `terraform` was a stub
# that printed apt install advice instead of a version; the advice landed in
# `GCP_WORKLOAD_IDENTITY_PROVIDER`, and every run afterwards failed with
# "Invalid value for audience" — a message naming neither the variable nor
# the shell that filled it. A value nothing re-derives is a value that stays
# wrong. `no_workflow_depends_on_a_repository_variable` in the acceptance
# suite keeps them from coming back.
name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    # The repository's default branch. It is not named `main`: the platform
    # was built on this branch and it became the default, so a filter on
    # `main` matched nothing and the automatic path could never fire — a
    # pipeline that looked complete and was unreachable. `main` stays listed
    # so a later rename to the conventional name does not silently re-break
    # this trigger in the other direction.
    branches:
      - "main"
      - "claude/autonomous-investment-platform-76gt4y"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy to. Production is never reached any other way."
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - stage
          - prod

# Read-only by default. The jobs that need to mint an OIDC token ask for it
# explicitly, so the blast radius of a compromised action is visible in the diff
# that granted it.
permissions:
  contents: read

concurrency:
  # One deployment at a time per environment. Two applies racing each other
  # produce a cluster in a state neither of them describes.
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  # The automatic path goes to dev and nowhere else.
  TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # The gate. Everything else needs this job, so a failure here stops the
  # pipeline rather than producing images nobody should deploy.
  gate:
    name: the test suite passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: refuse a production deployment that nobody dispatched
        if: env.TARGET_ENVIRONMENT == 'prod' && github.event_name != 'workflow_dispatch'
        run: |
          echo "prod is not deployed automatically." >&2
          exit 1

      - name: the triggering ci run succeeded
        if: github.event_name == 'workflow_run'
        run: |
          conclusion='${{ github.event.workflow_run.conclusion }}'
          if [ "$conclusion" != "success" ]; then
            echo "ci concluded '$conclusion'; nothing is deployed." >&2
            exit 1
          fi

      # On the manual path there is no triggering run to inspect, so ask for
      # the commit's own history. A dispatch against a commit whose tests never
      # passed is exactly the case this exists to refuse.
      - name: ci succeeded for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&status=success" \
            --jq '.total_count')
          if [ "$runs" -lt 1 ]; then
            echo "no successful ci run for ${DEPLOY_SHA}; nothing is deployed." >&2
            exit 1
          fi
          echo "ci succeeded for ${DEPLOY_SHA}"

  # One image per deployable binary, built from the one Dockerfile so the four
  # cannot drift apart.
  #
  # The workspace builds five binaries and this matrix names four. Which ones
  # deploy, and why the others do not, is decided in
  # docs/adr/0010-what-gets-deployed.md rather than here — a reason living only
  # in a matrix comment is a reason only the person editing the matrix reads.
  # Three of the four become Cloud Run services through catalogue.tf; the
  # fourth, `qip-edge-node`, is the attested artefact the execution node's
  # boot image is contracted to be built from, and runs bare under systemd.
  #
  #   * `qip`, from `qip-cli`, is absent on purpose: it is an operator's tool,
  #     run by a person against a cluster rather than scheduled in one.
  #   * `qip-web` is absent because it is not a binary. It is the library
  #     `qip-api` links and renders from — `backend/crates/apps/qip-web` declares no
  #     `[[bin]]` and has no `main.rs` — so its pages are already served by the
  #     `qip-api` image, on `qip-api`'s port. An entry here would ask the
  #     Dockerfile for `cargo build --bin qip-web`, which has nothing to build.
  #
  # None of that is left as a claim.
  # backend/crates/tests/qip-acceptance/tests/infrastructure.rs checks it in every
  # direction that can be wrong: a binary that appears with no image fails, an
  # image nothing runs fails, a workload with no image fails, an exclusion
  # whose reason is not in the decision record fails, and `qip-web` gaining a
  # `main.rs` fails rather than quietly shipping a library nobody serves.
  images:
    name: build and push ${{ matrix.binary }}
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token. This is the whole reason there is no key.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        binary:
          - qip-api
          - qip-fastbrain
          - qip-deepbrain
          - qip-edge-node
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # Everything this job authenticates with is derived from the
      # environment's committed tfvars, not from repository variables.
      #
      # The variables are written by the bootstrap's last step, and a bootstrap
      # that fails earlier never reaches it. Worse, one did reach it from a
      # shell whose `terraform` was Cloud Shell's install-advisory stub, so the
      # four Terraform-derived variables held several lines of apt
      # instructions — non-empty, and therefore past every check that only
      # asked whether they were set. Deriving instead means a pipeline that
      # cannot be poisoned by a broken bootstrap, and one less thing an
      # operator has to get right before the first deployment works.
      #
      # Every value below is fixed by the Terraform that creates it, so
      # constructing it here cannot drift from what exists:
      #   provider    modules/cicd names the pool qip-github-<env>
      #   deploy SA   modules/cicd names the account qip-ci-<env>
      #   attestor    modules/binaryauthorization names it qip-<env>-build
      #   key version the attestor key is version 1 of qip-<env>-attestor in
      #               the key ring qip-<env>
      - name: derive the identity from the tfvars
        id: identity
        run: |
          set -euo pipefail
          tfvars="infrastructure/environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          [ -f "$tfvars" ] || { echo "no tfvars at $tfvars" >&2; exit 1; }
          project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          number="$(sed -n 's/^project_number[[:space:]]*=[[:space:]]*\([0-9]*\)/\1/p' "$tfvars" | head -1)"
          region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          [ -n "$region" ] || region="europe-west2"   # the variable's default
          [ -n "$project" ] && [ -n "$number" ] || {
            echo "$tfvars carries no project_id/project_number" >&2
            exit 1
          }
          # Refused before authenticating, not after. An environment still
          # carrying the marker has no project, so every value derived below —
          # the workload-identity audience, the service account, the attestor,
          # the key version — would be constructed from a name that exists
          # nowhere, and the run would die at the OIDC exchange with a message
          # about an audience rather than about the environment.
          if [ "$project" = "unprovisioned" ]; then
            echo "environment '${TARGET_ENVIRONMENT}' is not provisioned: its tfvars carry the 'unprovisioned' marker." >&2
            echo "Create a project for it (its own, never one another environment uses), record the id and number in $tfvars, then deploy." >&2
            exit 1
          fi
          ring="qip-${TARGET_ENVIRONMENT}"
          {
            echo "project=$project"
            echo "region=$region"
            echo "provider=projects/$number/locations/global/workloadIdentityPools/qip-github-${TARGET_ENVIRONMENT}/providers/github"
            echo "account=qip-ci-${TARGET_ENVIRONMENT}@$project.iam.gserviceaccount.com"
            echo "attestor=${ring}-build"
            echo "key_version=projects/$project/locations/$region/keyRings/$ring/cryptoKeys/${ring}-attestor/cryptoKeyVersions/1"
          } >> "$GITHUB_OUTPUT"

      - name: authenticate without a key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.account }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: let docker push to artifact registry
        run: gcloud auth configure-docker "${{ steps.identity.outputs.region }}-docker.pkg.dev" --quiet

      - name: build
        run: |
          set -euo pipefail
          prefix="${{ steps.identity.outputs.region }}-docker.pkg.dev/${{ steps.identity.outputs.project }}/qip-${TARGET_ENVIRONMENT}"
          docker build \
            --file infrastructure/docker/Dockerfile \
            --build-arg "BINARY=${{ matrix.binary }}" \
            --tag "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}" \
            .

      # Scan the image before it is pushed, signed, or attested. The image is
      # a static binary on scratch, so anything this finds is in the binary's
      # own dependency graph — which is serde and serde_json — and a finding
      # here is worth stopping the line for. After the push would be too
      # late: a signed, attested, vulnerable image is admissible.
      - name: scan image
        run: |
          set -euo pipefail
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
          prefix="${{ steps.identity.outputs.region }}-docker.pkg.dev/${{ steps.identity.outputs.project }}/qip-${TARGET_ENVIRONMENT}"
          trivy image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}"

      # Tagged by commit and never by `latest`. The registry refuses to move a
      # tag onto different bytes, so a tag names one image for ever and a
      # rollback is a tag somebody can still find.
      - name: push
        run: |
          set -euo pipefail
          prefix="${{ steps.identity.outputs.region }}-docker.pkg.dev/${{ steps.identity.outputs.project }}/qip-${TARGET_ENVIRONMENT}"
          docker push "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}"

      # Sign it. This is the step that makes every service's
      # `binary_authorization { use_default = true }` mean something.
      #
      # The GKE runtime once enforced against no policy, so Google evaluated
      # the implicit one — default rule `ALWAYS_ALLOW` — and every image in
      # the registry was admissible.
      # `infrastructure/terraform/modules/binaryauthorization` makes the
      # default rule deny; this is what puts an image on the other side of it.
      #
      # By digest, never by tag. An attestation names bytes, and Binary
      # Authorization evaluates the digest a revision asks for and looks for
      # an attestation of *that*. The digest is read back from the registry
      # rather than from the local daemon, because what is signed has to be
      # what Cloud Run will pull.
      #
      # What this proves is that the pipeline pushed these bytes, and nothing
      # more: not that the source was reviewed, not that the dependencies were
      # the ones the lockfile names. The limits, and the two things a
      # deployment must still arrange, are in
      # infrastructure/terraform/modules/binaryauthorization/OUT-OF-BAND.md.
      - name: sign the pushed image
        env:
          BINAUTHZ_ATTESTOR: ${{ steps.identity.outputs.attestor }}
          BINAUTHZ_KEY_VERSION: ${{ steps.identity.outputs.key_version }}
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
          GCP_REGION: ${{ steps.identity.outputs.region }}
        run: |
          set -euo pipefail
          prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/qip-${TARGET_ENVIRONMENT}"
          digest=$(gcloud artifacts docker images describe \
            "${prefix}/${{ matrix.binary }}:${DEPLOY_SHA}" \
            --format='value(image_summary.digest)')
          if [ -z "${digest}" ]; then
            echo "the registry reports no digest for ${{ matrix.binary }}:${DEPLOY_SHA}." >&2
            exit 1
          fi
          image="${prefix}/${{ matrix.binary }}@${digest}"

          # A re-run of this workflow for the same commit must not fail here.
          # `sign-and-create` refuses to write an attestation that already
          # exists, and a re-deploy of an unchanged commit is a normal thing to
          # do — so an existing attestation for these exact bytes is success,
          # not a conflict.
          existing=$(gcloud container binauthz attestations list \
            --project "${GCP_PROJECT}" \
            --attestor "${BINAUTHZ_ATTESTOR}" \
            --attestor-project "${GCP_PROJECT}" \
            --artifact-url "${image}" \
            --format='value(name)')
          if [ -n "${existing}" ]; then
            echo "${image} is already attested."
            exit 0
          fi

          # `sign-and-create` moved to the beta track in current gcloud;
          # the component is installed in the setup step above.
          gcloud beta container binauthz attestations sign-and-create \
            --project "${GCP_PROJECT}" \
            --artifact-url "${image}" \
            --attestor "${BINAUTHZ_ATTESTOR}" \
            --attestor-project "${GCP_PROJECT}" \
            --keyversion "${BINAUTHZ_KEY_VERSION}"

  # ── Deploy ─────────────────────────────────────────────────────────────
  #
  # Move each Cloud Run service to the digest the images job just attested,
  # wait for the revision to serve, prove it is the one asked for, and
  # record the digest beside the environment's tfvars.
  #
  # `gcloud run services update --image` is the whole delivery mechanism
  # now. There is no reconciler, no chart and no values file to commit for
  # something else to apply (ADR 0024): the pipeline is the only writer to
  # a service's image, Terraform creates the service and ignores the image
  # thereafter (`modules/cloudrun` says why), and `images.tfvars` is written
  # here so the committed record and the running revision agree again as
  # soon as the commit lands.
  #
  # What this closes: the GitOps cut-over lost the rollout wait, so a build
  # that crash-looped on boot produced a green pipeline and
  # docs/operations/gitops-exceptions.md recorded the gap. `services update`
  # blocks until the new revision is ready and routing, and fails the job
  # when it is not; the describe afterwards is the second half, proving the
  # serving revision runs the digest that was signed rather than whatever
  # was there before. An apply that returns is not a deployment that worked;
  # a revision that is Ready and serving the attested bytes is.
  #
  # The execution node is not deployed here in the same sense. It runs a
  # boot image, not a container, and nothing in this repository bakes one
  # yet — modules/execution-node/README.md and ADR 0024 record that as the
  # remaining work. What this job does for a node is the rolling
  # replacement §41.4 describes, so that a node whose template Terraform
  # already changed is re-created from it under the group's surge-one,
  # wait-for-health policy. With `execution_nodes` empty in every
  # environment the step finds no group and says so.
  deploy:
    name: deploy to cloud run (${{ inputs.environment || 'dev' }})
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      # To record the deployed digests in images.tfvars.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          token: ${{ github.token }}

      # The same derivation as the images job, from the same committed
      # tfvars, for the same reason: nothing here may depend on a repository
      # variable. Every value below is fixed by the Terraform that creates
      # it, so constructing it here cannot drift from what exists:
      #   service   modules/cloudrun names it qip-<env>-<catalogue name>
      #   registry  modules/registry names it qip-<env>
      #   node      modules/execution-node names the group qip-<env>-exec-<id>
      - name: derive the identity from the tfvars
        id: identity
        run: |
          set -euo pipefail
          tfvars="infrastructure/environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          [ -f "$tfvars" ] || { echo "no tfvars at $tfvars" >&2; exit 1; }
          project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          number="$(sed -n 's/^project_number[[:space:]]*=[[:space:]]*\([0-9]*\)/\1/p' "$tfvars" | head -1)"
          region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          [ -n "$region" ] || region="europe-west2"
          [ -n "$project" ] && [ -n "$number" ] || {
            echo "$tfvars carries no project_id/project_number" >&2
            exit 1
          }
          if [ "$project" = "unprovisioned" ]; then
            echo "environment '${TARGET_ENVIRONMENT}' is not provisioned." >&2
            exit 1
          fi
          {
            echo "project=$project"
            echo "region=$region"
            echo "provider=projects/$number/locations/global/workloadIdentityPools/qip-github-${TARGET_ENVIRONMENT}/providers/github"
            echo "account=qip-ci-${TARGET_ENVIRONMENT}@$project.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: authenticate without a key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.account }}

      - uses: google-github-actions/setup-gcloud@v2

      # The catalogue's services, by the names catalogue.tf gives them, and
      # the binary each runs. Read out of the committed catalogue rather than
      # listed here, so a workload added there is deployed here without a
      # second edit — and a workload listed here that the catalogue does not
      # know is refused before anything is moved.
      - name: read the catalogue
        id: catalogue
        run: |
          set -euo pipefail
          catalogue="infrastructure/terraform/catalogue.tf"
          # `    name = {` opens an entry; the `binary = "..."` inside it is
          # the image. Four-space indent is the catalogue's own shape and the
          # acceptance suite pins it.
          pairs="$(awk '
            /^    [a-z][a-z0-9-]* = \{$/ { name=$1 }
            /^      binary[[:space:]]*=/ { gsub(/"/, "", $3); print name "=" $3 }
          ' "$catalogue")"
          [ -n "$pairs" ] || { echo "no workload was read out of $catalogue" >&2; exit 1; }
          echo "$pairs"
          echo "pairs=$(echo "$pairs" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # Move each service, wait for it, prove it.
      - name: move every service to the attested digest and prove it serves it
        id: rollout
        env:
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
          GCP_REGION: ${{ steps.identity.outputs.region }}
          PAIRS: ${{ steps.catalogue.outputs.pairs }}
        run: |
          set -euo pipefail
          # Selection by name, in one place. An index is what this step got
          # wrong; a gcloud projection filter is not something this
          # repository can test before it runs, and python3 is on every
          # runner. Each question fails loudly rather than returning an
          # empty string that a comparison would read as a mismatch it
          # cannot explain.
          cat > "${RUNNER_TEMP}/prove-serving.py" <<'PY'
          import json
          import sys

          question, path, wanted = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path, encoding="utf-8") as handle:
              described = json.load(handle)

          if question == "routed":
              status = described.get("status", {})
              conditions = status.get("conditions", [])
              ready = next((c for c in conditions if c.get("type") == "Ready"), None)
              if ready is None:
                  sys.exit(
                      f"{wanted} reports no Ready condition; it reports "
                      f"{[c.get('type') for c in conditions]}"
                  )
              if ready.get("status") != "True":
                  sys.exit(
                      f"{wanted} is not Ready: {ready.get('status')} — "
                      f"{ready.get('message', 'no message given')}"
                  )
              routed = [t for t in status.get("traffic", []) if t.get("percent")]
              if not routed:
                  sys.exit(f"{wanted} is Ready and routes traffic to no revision")
              for entry in routed:
                  revision = entry.get("revisionName")
                  if not revision:
                      sys.exit(f"{wanted} routes {entry.get('percent')}% to an unnamed revision")
                  print(revision)
          elif question == "image":
              containers = described.get("spec", {}).get("containers", [])
              named = [c for c in containers if c.get("name") == wanted]
              if not named:
                  sys.exit(
                      f"the revision runs no container named {wanted}; it runs "
                      f"{[c.get('name') for c in containers]}"
                  )
              print(named[0]["image"])
          else:
              sys.exit(f"prove-serving.py was asked an unknown question: {question}")
          PY

          prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/qip-${TARGET_ENVIRONMENT}"
          images_file="infrastructure/environments/${TARGET_ENVIRONMENT}/images.tfvars"
          {
            echo "# ${TARGET_ENVIRONMENT}'s deployed image digests — written by .github/workflows/deploy.yml."
            echo "#"
            echo "# Not hand-edited. Each digest below was built, scanned, signed and attested"
            echo "# by run ${GITHUB_RUN_ID} for ${DEPLOY_SHA}, moved onto its Cloud Run service,"
            echo "# and proven serving before this line was written. Terraform creates a"
            echo "# service at the digest recorded here and ignores the image thereafter;"
            echo "# modules/cloudrun says why."
            echo "image_digests = {"
          } > "$images_file"
          for pair in $PAIRS; do
            name="${pair%%=*}"
            binary="${pair#*=}"
            service="qip-${TARGET_ENVIRONMENT}-${name}"
            digest=$(gcloud artifacts docker images describe \
              "${prefix}/${binary}:${DEPLOY_SHA}" \
              --format='value(image_summary.digest)')
            if [ -z "$digest" ]; then
              echo "no digest for ${binary}:${DEPLOY_SHA}; the images job did not push it" >&2
              exit 1
            fi
            image="${prefix}/${binary}@${digest}"

            # By digest, never by tag, for the reason the sign step gives:
            # Binary Authorization evaluates the digest, and the attestation
            # names bytes. Blocks until the revision is Ready and routing,
            # and fails otherwise — which is the rollout wait the GitOps
            # cut-over lost.
            #
            # `--container` names the workload's own container, which
            # modules/cloudrun names after the catalogue entry. Every service
            # now has more than one — the egress proxy, the metrics collector
            # — and gcloud refuses an unqualified `--image` on a
            # multi-container service rather than guess which one to move.
            # Every global flag precedes `--container`. `--container` opens
            # a scope that only container-level flags may enter, so a global
            # one after it makes gcloud refuse the whole command with
            # `unrecognized arguments: --quiet` — which is how every
            # deployment failed between the sidecars landing and this fix.
            gcloud run services update "$service" \
              --project "${GCP_PROJECT}" --region "${GCP_REGION}" --quiet \
              --container "$name" \
              --image "$image"

            # The second half, and the claim the GitOps cut-over lost: the
            # revision that is *serving* runs the digest that was signed.
            # `services update` returning is not that, and neither is
            # reading `spec.template` — that is what was asked for, which a
            # traffic split that never moved satisfies just as well. So the
            # revisions read are the ones `status.traffic` routes to.
            #
            # Both selections are by name, never by position: every service
            # carries the egress sidecar and may carry the metrics
            # collector, so the first container is as likely to be a sidecar
            # as the workload, and nothing documents the first condition as
            # Ready.
            gcloud run services describe "$service" \
              --project "${GCP_PROJECT}" --region "${GCP_REGION}" \
              --format=json > "${RUNNER_TEMP}/service-${name}.json"
            routed=$(python3 "${RUNNER_TEMP}/prove-serving.py" \
              routed "${RUNNER_TEMP}/service-${name}.json" "$service")
            for revision in $routed; do
              gcloud run revisions describe "$revision" \
                --project "${GCP_PROJECT}" --region "${GCP_REGION}" \
                --format=json > "${RUNNER_TEMP}/revision-${revision}.json"
              serving=$(python3 "${RUNNER_TEMP}/prove-serving.py" \
                image "${RUNNER_TEMP}/revision-${revision}.json" "$name")
              if [ "$serving" != "$image" ]; then
                echo "${service} routes traffic to ${revision}, whose ${name} container runs '${serving}'; asked for ${image}" >&2
                exit 1
              fi
              echo "${service} serves ${image} from ${revision}"
            done
            echo "  ${binary} = \"${digest}\"" >> "$images_file"
          done
          echo "}" >> "$images_file"
          echo "wrote ${images_file}:"
          cat "$images_file"

      # The execution nodes: a rolling replacement under the group's own
      # policy, for every group the environment has. None today — every
      # environment's `execution_nodes` is empty — and the step says so
      # rather than inventing a group to update.
      - name: replace every execution node under its group's rolling policy
        env:
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
        run: |
          set -euo pipefail
          groups="$(gcloud compute instance-groups managed list \
            --project "${GCP_PROJECT}" \
            --filter="name~^qip-${TARGET_ENVIRONMENT}-exec-" \
            --format='value(name,zone.basename())')"
          if [ -z "$groups" ]; then
            echo "no execution node group exists in ${TARGET_ENVIRONMENT}; nothing to replace."
            exit 0
          fi
          while read -r group zone; do
            [ -n "$group" ] || continue
            # Surge one, wait for the health check, retire the old machine —
            # the group's update policy, which Terraform set and this does
            # not override.
            gcloud compute instance-groups managed rolling-action replace "$group" \
              --project "${GCP_PROJECT}" --zone "$zone" \
              --max-surge 1 --max-unavailable 0 --quiet
            echo "replacing ${group} in ${zone} under its rolling policy"
          done <<< "$groups"

      # Record what was deployed, beside the tfvars that describe the
      # environment. Nothing to commit means the digests are already current.
      - name: commit the deployed digests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "infrastructure/environments/${TARGET_ENVIRONMENT}/images.tfvars"
          git diff --cached --quiet && {
            echo "digests unchanged for ${TARGET_ENVIRONMENT}; nothing to commit."
            exit 0
          }
          git commit -m "Record the digests ${TARGET_ENVIRONMENT} now serves, from run ${GITHUB_RUN_ID}

          Written by .github/workflows/deploy.yml after each Cloud Run service was
          moved to the attested digest for ${DEPLOY_SHA} and proven serving it."
          git push
