# Build the stack up, and tear the expensive half down.
#
# This is the workflow that lets an operator — or an agent working for one —
# iterate the infrastructure from the repository: plan a change, apply it,
# and shut the cluster down when nobody is testing, which is where nearly all
# of the money goes. It authenticates by workload identity federation as the
# `qip-infra` account `modules/cicd` creates; no key exists anywhere in this
# path.
#
# **Manual dispatch only, and never prod.** The automatic paths belong to
# deploy.yml, which cannot touch infrastructure. Production infrastructure is
# applied by a person running `scripts/bootstrap-deploy.sh prod`, on purpose:
# an agent that can reshape prod is an agent one prompt injection away from
# reshaping prod.
#
# ## Why `down` is not `destroy`
#
# `down` destroys `module.cluster` — the GKE cluster and its node pools, the
# resources that bill by the hour — and leaves identity, KMS, secrets, the
# registry and the state bucket standing. That asymmetry is deliberate:
#
#   * KMS keys cannot be truly deleted — destroying them schedules key
#     versions for destruction and the key names stay claimed, so a full
#     destroy/apply cycle collides with its own remains ("CryptoKey already
#     exists"). The keys also cost nothing to keep.
#   * A workload identity pool is soft-deleted for thirty days, over which its
#     name cannot be reused. A full destroy would take this workflow's own
#     authentication down with it and the next apply could not put it back.
#   * The secrets hold seeded values a destroy would discard.
#
# So the cheap, safe iteration loop is `down` at the end of a session and
# `up` (a plain apply) at the start of the next. A true full teardown is a
# deliberate human act with `terraform destroy` and a reading of the KMS and
# WIF caveats above.
name: infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment. prod is refused — it is applied by a person, from the bootstrap script."
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - stage
      action:
        description: "plan (read-only), up (apply), down (destroy the cluster to stop the meter; everything else stands)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - up
          - down

permissions:
  contents: read

concurrency:
  # One infrastructure operation at a time per environment, and it queues
  # rather than cancels: half an apply is the worst of both.
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: refuse what this workflow must never do
        run: |
          set -euo pipefail
          # Defence in depth behind the choice list: a fork of this file with
          # prod added to the options still stops here.
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "prod infrastructure is never changed from this workflow." >&2
            echo "A person runs scripts/bootstrap-deploy.sh prod." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      # Everything this workflow needs to authenticate is derived from the
      # environment's tfvars, and deliberately not from repository variables.
      # The variables are set by the bootstrap's last step, which a failed
      # apply skips — and once they were set from a shell whose `terraform`
      # was Cloud Shell's install-advisory stub, so the workload-identity
      # variable held several lines of apt instructions. This workflow exists
      # to recover broken bootstraps, so it depends on nothing a broken
      # bootstrap produces: the tfvars are reviewed, committed configuration.
      - name: derive the identity from the tfvars
        id: identity
        run: |
          set -euo pipefail
          tfvars="infrastructure/environments/${{ inputs.environment }}/terraform.tfvars"
          project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          number="$(sed -n 's/^project_number[[:space:]]*=[[:space:]]*\([0-9]*\)/\1/p' "$tfvars" | head -1)"
          [ -n "$project" ] && [ -n "$number" ] || {
            echo "the tfvars carry no project_id/project_number; nothing to authenticate against" >&2
            exit 1
          }
          {
            echo "project=$project"
            echo "provider=projects/$number/locations/global/workloadIdentityPools/qip-github-${{ inputs.environment }}/providers/github"
            echo "account=qip-infra-${{ inputs.environment }}@$project.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.account }}

      - uses: google-github-actions/setup-gcloud@v2

      # Overwriting Terraform state needs storage.objects.delete, and the
      # project-level role this account holds deliberately lacks it so nothing
      # it runs can delete from the evidence bucket. The one exception is
      # granted here, scoped to the state bucket, by the account itself — its
      # custom role carries storage.buckets.setIamPolicy. Idempotent, and the
      # bootstrap script makes the same grant.
      - name: the state bucket grant
        run: |
          gcloud storage buckets add-iam-policy-binding \
            "gs://${{ steps.identity.outputs.project }}-qip-tfstate" \
            --member="serviceAccount:${{ steps.identity.outputs.account }}" \
            --role="roles/storage.objectAdmin" --quiet >/dev/null

      # Terraform refreshes existing state — reading the attestor's public
      # key, the attestor resource itself — before it applies anything, so a
      # role this same apply would grant declaratively is too late for the
      # refresh that needs it. Two roles have hit this so far, each read at
      # plan time by a resource that already exists from an earlier apply:
      # cloudkms.publicKeyViewer (the attestor's signing key) and
      # binaryauthorization.attestorsAdmin (the attestor itself, which needs
      # more than read — Terraform diffs it, not just refreshes it). The
      # account grants each to itself here — its projectIamAdmin makes that
      # possible; modules/cicd documents why that is accepted — waiting only
      # when a binding is new, since a fresh grant can take a minute to bite.
      # Both exist declaratively in modules/cicd too, so an environment
      # applied by the bootstrap (whose identity already holds project
      # owner) never takes this path at all.
      - name: the permissions the plan needs before it can grant them
        run: |
          set -euo pipefail
          account="${{ steps.identity.outputs.account }}"
          project="${{ steps.identity.outputs.project }}"
          for role in roles/cloudkms.publicKeyViewer roles/binaryauthorization.attestorsAdmin; do
            held="$(gcloud projects get-iam-policy "$project" \
              --flatten="bindings[].members" \
              --filter="bindings.role:$role AND bindings.members:serviceAccount:$account" \
              --format="value(bindings.role)")"
            if [ -z "$held" ]; then
              gcloud projects add-iam-policy-binding "$project" \
                --member="serviceAccount:$account" \
                --role="$role" --quiet >/dev/null
              echo "granted $role to $account; waiting for IAM to propagate"
              sleep 60
            fi
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform init
        run: |
          terraform -chdir=infrastructure/terraform init -input=false \
            -backend-config="bucket=${{ steps.identity.outputs.project }}-qip-tfstate"

      - name: plan
        if: inputs.action == 'plan'
        run: |
          terraform -chdir=infrastructure/terraform plan -input=false \
            -var-file="../environments/${{ inputs.environment }}/terraform.tfvars"

      # A tainted cluster is a deadlock, and which way out depends on
      # whether the cluster is actually broken.
      #
      # GKE creates a default node pool as part of cluster creation. When that
      # pool cannot get nodes — a quota ceiling, most likely — the create call
      # returns an error and Terraform marks the cluster tainted. Sometimes
      # the cluster object survives that and serves fine, and sometimes it
      # does not; the taint alone cannot tell you which.
      #
      # Either way Terraform is stuck, because `deletion_protection` is a
      # Terraform-side guard rather than a GKE one. The provider reads it from
      # *prior state* and refuses to issue the delete at all. The only thing
      # that writes a new value into state is an in-place update, and a
      # tainted resource is planned as destroy-then-create with no update
      # ahead of it — so the step that would clear the guard is exactly the
      # step taint skips. No edit to the tfvars can reach it.
      #
      # So ask GKE what the cluster is really doing, and take the matching
      # way out: untaint a healthy one, delete a broken one.
      - name: recover a cluster the taint has deadlocked
        if: inputs.action == 'up'
        run: |
          set -euo pipefail
          address='module.cluster.google_container_cluster.primary'
          project="${{ steps.identity.outputs.project }}"
          tfvars="infrastructure/environments/${{ inputs.environment }}/terraform.tfvars"

          tainted="$(terraform -chdir=infrastructure/terraform show -json \
            | jq -r --arg a "$address" '
                [.values.root_module.child_modules[]?.resources[]?
                 | select(.address == $a and .tainted == true)] | length')"
          if [ "$tainted" = "0" ]; then
            echo "no tainted cluster in state; nothing to recover"
            exit 0
          fi

          cluster="qip-${{ inputs.environment }}"
          info="$(gcloud container clusters list --project="$project" \
            --filter="name=${cluster}" --format='value(status,location)' | head -1)"
          status="$(printf '%s' "$info" | cut -f1)"
          location="$(printf '%s' "$info" | cut -f2)"
          echo "${cluster} is tainted in state; GKE reports status='${status:-<absent>}'"

          if [ -z "$status" ]; then
            echo "GKE has no such cluster, so the refresh will drop it from state"
            echo "and the apply will create it"
            exit 0
          fi

          if [ "$status" = "RUNNING" ]; then
            terraform -chdir=infrastructure/terraform untaint "$address"
            echo "untainted: the control plane is serving, so the taint recorded a"
            echo "failed create-wait rather than a broken cluster"
            exit 0
          fi

          # ERROR, DEGRADED, anything else: the cluster must be replaced, and
          # replacing it is precisely what Terraform cannot do. gcloud can,
          # because `deletion_protection` is not a field it has ever heard of.
          #
          # What authorises that is the environment's own committed
          # configuration: the delete happens only where the tfvars already
          # declare deletion protection off — a reviewed statement that this
          # cluster is disposable — and prod never reaches this workflow at
          # all. Without that declaration this stops and says so, rather than
          # deleting a cluster on its own judgement.
          if ! grep -q '^cluster_deletion_protection[[:space:]]*=[[:space:]]*false' "$tfvars"; then
            echo "the cluster is ${status} and must be replaced, but ${tfvars}" >&2
            echo "does not declare cluster_deletion_protection = false, so nothing" >&2
            echo "here is authorised to delete it. Set it, or delete by hand." >&2
            exit 1
          fi

          echo "deleting the ${status} cluster in ${location} so the apply can"
          echo "create a working one — this takes a few minutes"
          gcloud container clusters delete "$cluster" \
            --project="$project" --region="$location" --quiet
          terraform -chdir=infrastructure/terraform state rm "$address"
          echo "deleted and dropped from state; the apply will create it fresh"

      # -auto-approve because there is nobody at a prompt: the review is the
      # dispatch itself, recorded in the Actions log with who pressed it. The
      # prod refusal above is what keeps that acceptable.
      - name: up
        if: inputs.action == 'up'
        run: |
          terraform -chdir=infrastructure/terraform apply -input=false -auto-approve \
            -var-file="../environments/${{ inputs.environment }}/terraform.tfvars"

      - name: down
        if: inputs.action == 'down'
        run: |
          set -euo pipefail
          # Two steps, because `deletion_protection` is read from state during
          # a destroy and not from configuration. An environment whose tfvars
          # say false but whose state still says true — every environment that
          # has never been applied since the flag became a variable — refuses
          # its own teardown with "Cannot destroy cluster because
          # deletion_protection is set to true". The apply is what writes the
          # flag to state; it is targeted and almost always a no-op otherwise.
          terraform -chdir=infrastructure/terraform apply -input=false -auto-approve \
            -target=module.cluster \
            -var-file="../environments/${{ inputs.environment }}/terraform.tfvars"

          # Targeted on purpose — see the header for why a full destroy is a
          # trap. Terraform also destroys everything that depends on the
          # cluster (the backup plan, the workload identity bindings), which
          # `up` recreates.
          terraform -chdir=infrastructure/terraform destroy -input=false -auto-approve \
            -target=module.cluster \
            -var-file="../environments/${{ inputs.environment }}/terraform.tfvars"

      - name: what exists now
        if: always()
        run: |
          terraform -chdir=infrastructure/terraform state list | wc -l | \
            xargs -I{} echo "{} resources in ${{ inputs.environment }} state"
