# Build the stack up, and tear the expensive half down.
#
# This is the workflow that lets an operator — or an agent working for one —
# iterate the infrastructure from the repository: plan a change, apply it,
# and shut the execution nodes down when nobody is testing.
#
# **Two things in this estate bill while idle, and `down` reaches neither of
# them.** This paragraph said `down` was "where most of the money goes" and
# that "every Cloud Run service scales to zero and costs nothing standing",
# and both halves were false in the same direction — the cheerful one:
#
#   * `execution_nodes = {}` in every environment, so `module.execution_node`
#     is empty and `down` destroys nothing at all. It is a no-op today.
#   * Two of the four Cloud Run services are pinned always-on, and the
#     catalogue says why in each entry's `always_on_justification`: the fast
#     brain and the deep brain each run a loop on their own clock over one
#     hash-chained log, nothing requests them, so a zero floor is a research
#     loop that ran until the first idle retirement and never again.
#     `gitops/envs/<env>/{fastbrain,deepbrain}.yaml` carry
#     `minInstanceCount: 1` and a `maxInstanceCount: 1` ceiling, which is the
#     other half of the same argument — a second instance forks the chain.
#     6 vCPU and 10 GiB stand allocated whenever those services exist.
#   * The control-plane cluster of ADR 0036: Autopilot bills for the
#     controllers it schedules and for its regional control plane while idle.
#     `down` deliberately leaves it standing, because tearing it down takes
#     Argo CD, Kargo and both App credentials with it. That standing cost is
#     named in the ADR rather than hidden here, and ADR 0093 records the day
#     it was suspended in dev and why.
#
# So `down` stops the meter only in an environment that declares execution
# nodes, and none does. **`suspend` is the action that reaches the thing
# which actually bills**: a targeted destroy of the control-plane cluster
# alone, leaving the etcd key, the controller identities and the registry
# zones in state. It is deliberately not `gitops_enabled = false` — closing
# that flag takes the module's `count` to zero, which plans a destroy of an
# etcd key declaring `prevent_destroy`, and Terraform aborts the plan. The
# guard is right and is not weakened for this; the step's own comment and
# ADR 0093 carry the argument and the durable fix. The other standing cost,
# the always-on floors in `gitops/envs/<env>/{fastbrain,deepbrain}.yaml`, is
# not an action here at all. The workflow authenticates by
# workload identity federation as the `qip-infra` account `modules/cicd`
# creates; no key exists anywhere in this path.
#
# **Manual dispatch only, and never prod.** The automatic paths belong to
# deploy.yml, which cannot touch infrastructure. Production infrastructure is
# applied by a person running `scripts/bootstrap-deploy.sh prod`, on purpose:
# an agent that can reshape prod is an agent one prompt injection away from
# reshaping prod.
#
# ## Why `down` is not `destroy`
#
# `down` destroys `module.execution_node` — the C3 machines, which bill by
# the hour whenever an environment declares any — and leaves the Cloud Run
# services, identity, KMS, secrets, the registry and the state bucket
# standing. That asymmetry is deliberate. What it is *not* is a claim that
# what it leaves is free: this sentence used to say the services "bill by
# the request", and two of the four bill by the second whether or not a
# request ever arrives. See the header above.
#
#   * KMS keys cannot be truly deleted — destroying them schedules key
#     versions for destruction and the key names stay claimed, so a full
#     destroy/apply cycle collides with its own remains ("CryptoKey already
#     exists"). The keys also cost nothing to keep.
#   * A workload identity pool is soft-deleted for thirty days, over which its
#     name cannot be reused. A full destroy would take this workflow's own
#     authentication down with it and the next apply could not put it back.
#   * The secrets hold seeded values a destroy would discard.
#
# So the cheap, safe iteration loop is `down` at the end of a session and
# `up` (a plain apply) at the start of the next. A true full teardown is a
# deliberate human act with `terraform destroy` and a reading of the KMS and
# WIF caveats above.
#
# ## `teardown` — that act, dispatched by name
#
# Added 2026-09-13 on the owner's instruction to delete every Google Cloud
# resource (ADR 0040 decision 13). It is not `down` and it is not a plain
# `terraform destroy`, for the reasons above, and it does four things in
# order: deletes the Cloud Run services (released from state under ADR 0036,
# so only `gcloud` reaches them); deletes the control-plane cluster and takes
# it out of state (its `deletion_protection` in state would otherwise refuse
# the destroy); takes out of state every resource the module sources declare
# `prevent_destroy = true` (a destroy that plans one aborts before touching
# anything else — run 41 did exactly that on the evidence bucket, and a key
# cannot be deleted anyway, only scheduled) and every bucket declared
# `force_destroy = false` (it refuses while it holds objects this identity
# may not delete); then runs a *targeted* destroy of every module except
# two. `module.services` is left because
# disabling an API while its resources are still being deleted fails the
# rest, and an enabled API costs nothing. `module.cicd` is left because it
# holds the identity running this very job — destroy the account and its
# token is revoked mid-run with the remainder stranded — and a pool and an
# account cost nothing standing. The five `force_destroy = false` buckets
# and the keys stay, out of state, holding a few files and no meter. The
# step prints what it deleted and the
# `what exists now` step prints what remains; that list, not this comment,
# is the record. Nothing here is recoverable once run: unlike a project
# deletion, there is no thirty-day window.
#
# ## `up` after a `teardown` — putting the remains back into state
#
# The bullet at the top of this header says a full destroy/apply cycle
# collides with its own remains, and then `teardown` performed one. What it
# leaves is worse than the header describes, because the resources it keeps it
# also *removes from state*: Terraform afterwards believes nine crypto keys, a
# key ring and five buckets do not exist and plans to create them. Run 44
# (`plan`, `dev`, 2026-09-15) returned `Plan: 184 to add, 0 to change, 0 to
# destroy` over 55 surviving entries, with the attestor's key version and the
# GitOps `etcd_key` both moving to `(known after apply)`.
#
# So `up` reclaims before it applies. The `reclaim what the teardown left
# standing` step plans, asks which of those creates would collide with
# something still in the project, asks Google whether each one is actually
# there, and imports only the ones that are. It creates nothing: an object the
# probe does not find is skipped, so a first-ever apply into a clean project
# proceeds exactly as before. Its list comes from
# `scripts/terraform-undeletable.py`, the same parse `teardown` removes by,
# because the step that decides what to leave behind and the step that decides
# what to put back cannot be allowed to hold two different lists.
name: infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment. prod is refused — it is applied by a person, from the bootstrap script."
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - stage
      action:
        description: "plan (read-only), up (apply), suspend (destroy the control-plane cluster and nothing else — the one resource that bills while idle; a later up recreates it), down (destroy the execution nodes; no environment declares any, so it is a no-op today), teardown (delete the environment: cluster, services, then a targeted destroy of every module but the identity running this job — the owner's act, by name), force-unlock (release a state lock a cancelled run left behind; requires its id)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - up
          - suspend
          - down
          - teardown
          - force-unlock
      lock_id:
        description: "Only for force-unlock: the lock ID Terraform printed. Required, and deliberately not defaulted — see the step."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # One infrastructure operation at a time per environment, and it queues
  # rather than cancels: half an apply is the worst of both.
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: refuse what this workflow must never do
        env:
          # Through the environment, never pasted into the script below. An
          # environment value reaches bash as data; an expression reaches it as
          # source text, and the difference is whether a newline in the value
          # is a character or a second command.
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # Character set first, and it must come before anything else reads
          # the value — including the prod refusal below.
          #
          # That refusal used to read `[ "<inputs.environment>" = "prod" ]`,
          # spelled with the runner's own `${`+`{ }` expression syntax,
          # and the runner substitutes that text into this script before bash
          # parses a byte of it. A value whose first line was `dev"` and whose
          # second line was a command of its own would have run that command
          # *inside the step whose whole job is to refuse prod* — with the WIF
          # credential for `qip-infra-<env>`, which carries compute.admin,
          # projectIamAdmin, secretmanager.admin and container.clusterAdmin.
          # Seven further uses of the same value are below this line.
          #
          # `environment` is a `choice`, so GitHub's own dispatch validation is
          # what stopped that in practice. A guard that depends on a validation
          # this file does not perform is a guard on loan, and one edit from
          # `type: choice` to `type: string` calls the loan in on all eight
          # uses at once. `image.yml` argues the same point about its own
          # choice input, and the acceptance suite pins it there.
          #
          # This step refuses before any other runs, so the guard holds for the
          # whole job: nothing below it runs after a non-zero exit, and the one
          # step carrying `always()` is additionally gated on an init that
          # never happened.
          case "$ENVIRONMENT" in
            ''|*[!a-z0-9-]*)
              echo "environment is not an environment name: lowercase letters, digits and - only." >&2
              exit 1
              ;;
          esac
          # Defence in depth behind the choice list: a fork of this file with
          # prod added to the options still stops here.
          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "prod infrastructure is never changed from this workflow." >&2
            echo "A person runs scripts/bootstrap-deploy.sh prod." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      # Everything this workflow needs to authenticate is derived from the
      # environment's tfvars, and deliberately not from repository variables.
      # The variables are set by the bootstrap's last step, which a failed
      # apply skips — and once they were set from a shell whose `terraform`
      # was Cloud Shell's install-advisory stub, so the workload-identity
      # variable held several lines of apt instructions. This workflow exists
      # to recover broken bootstraps, so it depends on nothing a broken
      # bootstrap produces: the tfvars are reviewed, committed configuration.
      - name: derive the identity from the tfvars
        id: identity
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          tfvars="infrastructure/environments/${ENVIRONMENT}/terraform.tfvars"
          project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          number="$(sed -n 's/^project_number[[:space:]]*=[[:space:]]*\([0-9]*\)/\1/p' "$tfvars" | head -1)"
          [ -n "$project" ] && [ -n "$number" ] || {
            echo "the tfvars carry no project_id/project_number; nothing to authenticate against" >&2
            exit 1
          }
          # The character set of what was read, before any of it is pasted
          # anywhere. The tfvars are reviewed configuration, but this step reads
          # them out of the tree the dispatch checked out rather than out of the
          # reviewed branch, and `steps.identity.outputs.project` is
          # substituted into five scripts below as source text. A project id is
          # lowercase letters, digits and hyphens; anything else is not a
          # malformed project id, it is somebody else's command. Emptiness is
          # refused above.
          case "$project" in
            *[!a-z0-9-]*)
              echo "$tfvars names a project containing a character no project id contains: '$project'" >&2
              echo "Permitted: lowercase letters, digits and -" >&2
              exit 1
              ;;
          esac
          # An environment still carrying the marker is refused here, before
          # anything authenticates. deploy.yml and vendor.yml already did this;
          # this workflow did not, and the argument for leaving it out was real
          # enough to be worth answering rather than deleting.
          #
          # The objection: `infra.yml` exists to recover a broken bootstrap. It
          # deliberately reads nothing a failed bootstrap sets — no repository
          # variable, only the committed tfvars — precisely so that an
          # environment in a bad state can still be planned and applied from
          # here. A refusal keyed on the tfvars looks like exactly the kind of
          # gate that locks the recovery tool out of the case it was built for.
          #
          # The answer: `unprovisioned` is not a broken bootstrap. It is the
          # state of an environment that has never had one, and every single
          # thing this job needs is created *by* the bootstrap it has not had.
          # `modules/cicd` creates the pool `qip-github-<env>` and the account
          # `qip-infra-<env>`, so the audience two steps below and the identity
          # beside it name resources that do not exist. The backend this job
          # would initialise against further down is `<project>-qip-tfstate`, a
          # bucket `scripts/bootstrap-deploy.sh` creates because state cannot
          # bootstrap itself. And the plan itself would refuse anyway:
          # `variables.tf`
          # rejects `project_id == "unprovisioned"` by name. There is no action
          # — not `plan`, not `up`, not `down` — that this workflow could
          # complete for such an environment, so refusing costs no recovery
          # path. It only moves where the run dies.
          #
          # Where it died mattered. A probe of this workflow emitted
          # `account=qip-infra-dev@unprovisioned.iam.gserviceaccount.com` and
          # the run then failed at the OIDC exchange with a message about an
          # invalid audience — the same class of message an install advisory in
          # a repository variable once produced, and the reason this workflow
          # derives its identity from the tfvars at all. An operator reading it
          # goes looking at workload identity federation, which is working. The
          # truth is cheaper than that and it is in the file in front of them.
          #
          # The recovery path for this state is unchanged and named below: a
          # person creates a project, records its id and number here, and runs
          # `scripts/bootstrap-deploy.sh <env>`, which refuses the marker too
          # rather than half-provisioning against a project that is not there.
          # After that this workflow is the tool again, marker gone.
          if [ "$project" = "unprovisioned" ]; then
            echo "environment '${ENVIRONMENT}' is not provisioned: $tfvars carries the 'unprovisioned' marker." >&2
            echo "There is nothing this workflow can plan, apply or tear down for it: the workload-identity pool and the qip-infra account it would authenticate with, and the state bucket it would init against, are all created by the first bootstrap, and terraform refuses this project id at plan time in any case." >&2
            echo "Create a project for it (its own, never one another environment uses), record the id and number in $tfvars, then run scripts/bootstrap-deploy.sh ${ENVIRONMENT} as a person. Dispatch this workflow after that." >&2
            exit 1
          fi
          {
            echo "project=$project"
            echo "provider=projects/$number/locations/global/workloadIdentityPools/qip-github-${ENVIRONMENT}/providers/github"
            echo "account=qip-infra-${ENVIRONMENT}@$project.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.account }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          # The bootstrap's kubectl authenticates to GKE through this plugin;
          # gcloud no longer embeds the credential in the kubeconfig itself.
          install_components: gke-gcloud-auth-plugin

      # Overwriting Terraform state needs storage.objects.delete, and the
      # project-level role this account holds deliberately lacks it so nothing
      # it runs can delete from the evidence bucket. The one exception is
      # granted here, scoped to the state bucket, by the account itself — its
      # custom role carries storage.buckets.setIamPolicy. Idempotent, and the
      # bootstrap script makes the same grant.
      - name: the state bucket grant
        run: |
          gcloud storage buckets add-iam-policy-binding \
            "gs://${{ steps.identity.outputs.project }}-qip-tfstate" \
            --member="serviceAccount:${{ steps.identity.outputs.account }}" \
            --role="roles/storage.objectAdmin" --quiet >/dev/null

      # Run 25 found the second bucket this same reasoning applies to: every
      # rendering of the egress bootstrap (envoy.yaml, keyed by its own
      # content hash) is a new object in `modules/egress-proxy`'s bucket, and
      # a changed bootstrap makes Terraform delete the old one —
      #
      #   Error deleting contents of object envoy-16bc4c53e18e7501.yaml:
      #   googleapi: Error 403: ...does not have storage.objects.delete
      #   access to the Google Cloud Storage object.
      #
      # The state bucket grant above does not cover this bucket; it is a
      # second bucket with the same missing permission, not a wider deny that
      # one grant already closed. Idempotent, same shape as the grant above.
      - name: the egress bootstrap bucket grant
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          gcloud storage buckets add-iam-policy-binding \
            "gs://qip-egress-${ENVIRONMENT}-${{ steps.identity.outputs.project }}" \
            --member="serviceAccount:${{ steps.identity.outputs.account }}" \
            --role="roles/storage.objectAdmin" --quiet >/dev/null

      # Terraform refreshes existing state — reading the attestor's public
      # key, the attestor resource itself — before it applies anything, so a
      # role this same apply would grant declaratively is too late for the
      # refresh that needs it. Roles have hit this before, each read at plan
      # time by a resource that already exists from an earlier apply:
      # cloudkms.publicKeyViewer (the attestor's signing key),
      # binaryauthorization.attestorsAdmin (the attestor itself, which needs
      # more than read — Terraform diffs it, not just refreshes it), and —
      # new with the Cloud Run runtime — run.admin and dns.admin, which the
      # first plan against an environment applied before ADR 0024 reads
      # nothing with, but which every plan afterwards refreshes the services
      # and the private zone with. Then two the first such plan found, both
      # on resources the GKE runtime left in state: iap.admin, because the
      # console's IAP access binding cannot be read — and so cannot be
      # destroyed — without `iap.webTypes.getIamPolicy`, and
      # identityplatform.admin, because the Identity Platform config the
      # blueprint keeps is refreshed on every plan and answered 403 to a
      # caller holding nothing on it. Then a seventh the apply after them
      # found: container.clusterAdmin, for the teardown of the runtime ADR
      # 0024 retires. It was reached in two steps, and the second is why the
      # role is an admin one. First the account could issue the node pool
      # delete but not poll the operation it returned — `Required
      # "container.operations.get"` — so a delete GKE had accepted was
      # reported as a failure. clusterViewer closed that, the pool went, and
      # the cluster delete behind it answered `Required
      # "container.clusters.delete"`: this same teardown had already destroyed
      # the declarative grant carrying it, so the apply was removing the
      # account's own ability to finish itself. clusterAdmin manages clusters
      # and node pools and nothing inside them, which is the whole of what a
      # teardown does; container.admin would add full access to the Kubernetes
      # API objects of the cluster being deleted, and a test refuses it. The
      # account grants each to itself here —
      # its projectIamAdmin makes that possible; modules/cicd documents why
      # that is accepted — waiting only when a binding is new, since a fresh
      # grant can take a minute to bite.
      #
      # Four of the seven — cloudkms.publicKeyViewer,
      # binaryauthorization.attestorsAdmin, run.admin, dns.admin — also exist
      # declaratively in modules/cicd, so an environment applied by the
      # bootstrap (whose identity already holds project owner) never takes
      # this path for those. The other three — iap.admin,
      # identityplatform.admin, container.clusterAdmin — exist *only* here,
      # and this comment previously claimed all of them were declared. That
      # mattered: a reader trusting it would conclude this loop is a
      # belt-and-braces convenience and could be deleted, when for three
      # roles it is the sole grant and deleting it breaks the plan.
      - name: the permissions the plan needs before it can grant them
        run: |
          set -euo pipefail
          account="${{ steps.identity.outputs.account }}"
          project="${{ steps.identity.outputs.project }}"
          # No secret role is self-granted here, and the seeding step below
          # deliberately does not add one.
          #
          # A first draft of that step granted itself
          # `roles/secretmanager.secretVersionManager` and said in a comment
          # that it therefore "must never be able to read a payload back".
          # That was false when it was written: `modules/cicd` grants this
          # same account `roles/secretmanager.admin` declaratively
          # (`modules/cicd/main.tf`, the `infra_roles` set), and admin
          # includes `secretmanager.versions.access`. The narrower role added
          # no permission the account lacked and removed none it held, so the
          # sentence described a boundary that did not exist -- protection by
          # assertion, which is the thing this repository refuses most often.
          # It is gone rather than reworded, because a redundant grant that
          # exists to make a comment true is worse than no grant at all.
          for role in roles/cloudkms.publicKeyViewer roles/binaryauthorization.attestorsAdmin roles/run.admin roles/dns.admin roles/iap.admin roles/identityplatform.admin roles/container.clusterAdmin; do
            held="$(gcloud projects get-iam-policy "$project" \
              --flatten="bindings[].members" \
              --filter="bindings.role:$role AND bindings.members:serviceAccount:$account" \
              --format="value(bindings.role)")"
            if [ -z "$held" ]; then
              gcloud projects add-iam-policy-binding "$project" \
                --member="serviceAccount:$account" \
                --role="$role" --quiet >/dev/null
              echo "granted $role to $account; waiting for IAM to propagate"
              sleep 60
            fi
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform init
        id: init
        run: |
          terraform -chdir=infrastructure/terraform init -input=false \
            -backend-config="bucket=${{ steps.identity.outputs.project }}-qip-tfstate"

      # One var-file: the reviewed configuration. There used to be a second,
      # images.tfvars, holding the digests deploy.yml last moved the
      # services to; the services are Config Connector's now and the digest
      # is in infrastructure/gitops/envs/<env>/kustomization.yaml (ADR 0036),
      # so Terraform is not told a digest at all and cannot plan a service
      # at one.
      #
      # The three steps that consume this read it from their own `env:` and
      # expand it unquoted, which is deliberate on both counts. Unquoted,
      # because a second var-file would be a second word and quoting would
      # hand terraform one argument containing a space. From the environment,
      # because that is what makes the unquoted expansion safe: an environment
      # value is data, so word splitting and globbing apply to it and command
      # substitution does not. The same text substituted as `${{ … }}` would be
      # script.
      - name: the var-files this environment has
        id: vars
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          files="-var-file=../environments/${ENVIRONMENT}/terraform.tfvars"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # Release a state lock a cancelled run left behind.
      #
      # Cancelling a run mid-apply orphans the lock: Terraform is killed
      # before it can release, and every later run then dies in `init` or
      # `plan` on a 412 from the lock object. Run 55 did exactly this — I
      # cancelled a destroy 34 seconds in, and run 56 could not reclaim,
      # plan or apply anything afterwards.
      #
      # **The lock id is required and deliberately has no default.** Terraform
      # guards `force-unlock` the same way, for the same reason: a lock is
      # sometimes held by an apply that is genuinely still running, and
      # breaking that one lets two applies write the same state. Naming the
      # id means reading the error that printed it, which means looking at
      # what holds the lock before breaking it. An unlock that takes no
      # argument is an unlock nobody had to think about.
      - name: force-unlock
        if: inputs.action == 'force-unlock'
        env:
          LOCK_ID: ${{ inputs.lock_id }}
        run: |
          set -euo pipefail
          # Character set before the value reaches a command line. A lock id
          # is a decimal integer; anything else is either a mistake or an
          # injection, and both are refused here rather than interpreted.
          case "${LOCK_ID}" in
            "") echo "force-unlock needs the lock id from the error that reported it." >&2
                echo "Read it from the failing run: 'Lock Info:' names ID, Who, Operation and Created." >&2
                echo "Check that the operation is not one still running before you break its lock." >&2
                exit 1 ;;
            *[!0-9]*) echo "lock id '${LOCK_ID}' is not a decimal integer." >&2; exit 1 ;;
          esac
          terraform -chdir=infrastructure/terraform force-unlock -force "${LOCK_ID}"
          echo "released ${LOCK_ID}; the next apply can acquire the lock."

      - name: plan
        if: inputs.action == 'plan'
        env:
          VAR_FILES: ${{ steps.vars.outputs.files }}
        run: |
          terraform -chdir=infrastructure/terraform plan -input=false \
            ${VAR_FILES}

      # There is no "repair a tainted service" step here any more. It untainted
      # a `google_cloud_run_v2_service` Cloud Run still had, so an apply
      # updated it in place rather than being refused by its deletion
      # protection. Terraform declares no such resource since ADR 0036 — the
      # service is a Config Connector manifest and the root's `removed`
      # blocks release the ones state held — so a step that untaints one is
      # dead, and its presence would be the first sign of a service being
      # put back into Terraform. The deadlock it closed is recorded in the
      # acceptance suite's history; the deletion guard it kept is now
      # `cnrm.cloud.google.com/deletion-policy: abandon` on every manifest.

      # Seed a first version into a secret that terraform declared and
      # nothing has ever written to.
      #
      # This exists because the apply that created the OpenObserve service
      # failed on `Secret .../versions/latest was not found`: terraform
      # creates the secret as a container, a Cloud Run `secret_key_ref`
      # resolves a *version*, and no step between the two ever put one there.
      # Thirteen of fifteen resources landed and the one service that needed
      # a credential did not.
      #
      # The value is generated here and this step reads it back nowhere: not
      # echoed, not written to the log, not carried out through a workflow
      # output. It reaches gcloud as a mode-600 file in a private directory
      # removed on every exit path, never as an argument, because an argument
      # is visible in `ps` for as long as the call takes.
      #
      # State plainly what that is and is not. It is a property of this step,
      # not a boundary around the workflow: the account running it holds
      # `roles/secretmanager.admin` from `modules/cicd`, so it *could* read
      # any secret in the project, this one included. Nothing here prevents
      # that; this step simply does not do it. Anyone narrowing the blast
      # radius of `infra.yml` should start at that declarative grant, and
      # should not read the care taken below as evidence the grant is already
      # narrow.
      #
      # Seeding only when a secret has no enabled version is what makes this
      # safe to run on every `up`: a rotated or operator-set credential is
      # left alone, so this can never silently replace a password somebody
      # is using. A secret terraform has not created yet is skipped rather
      # than treated as an error, because on a first apply the container does
      # not exist until the apply below runs — that environment needs a
      # second `up`, and this comment is where that is recorded rather than
      # discovered.
      - name: seed any credential that has no version
        if: inputs.action == 'up'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          project="${{ steps.identity.outputs.project }}"
          suffix="${ENVIRONMENT}"
          seeded=0
          umask 077
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          for secret in qip-openobserve-root-email qip-openobserve-root-password; do
            name="$secret-$suffix"
            if ! gcloud secrets describe "$name" --project "$project" >/dev/null 2>&1; then
              echo "$name does not exist yet; the apply below creates it and the next up seeds it"
              continue
            fi
            existing="$(gcloud secrets versions list "$name" --project "$project" \
              --filter="state:ENABLED" --format="value(name)" --limit=1)"
            if [ -n "$existing" ]; then
              echo "$name already has an enabled version; leaving it alone"
              continue
            fi
            case "$secret" in
              *-email)
                # Not a real mailbox and deliberately not a person's address:
                # OpenObserve wants this to parse, nothing delivers to it,
                # and an operator identifier does not belong in a committed
                # file.
                value="admin@algorik.internal" ;;
              *-password)
                value="$(openssl rand -base64 30)" ;;
            esac
            printf '%s' "$value" > "$scratch/payload"
            gcloud secrets versions add "$name" --project "$project" \
              --data-file="$scratch/payload" >/dev/null
            rm -f "$scratch/payload"
            echo "seeded $name with a first version"
            seeded=1
          done
          if [ "$seeded" = 1 ]; then
            echo "A generated credential was written. This step did not log it; read it with:"
            echo "  gcloud secrets versions access latest --secret qip-openobserve-root-password-$suffix --project $project"
          fi

      # Put back into state what the teardown deliberately left in the
      # project, before the apply below plans to create it a second time.
      #
      # The teardown takes every `prevent_destroy = true` resource and every
      # `force_destroy = false` bucket *out of state* and leaves them standing
      # — the header says why, and the reason is sound. What nothing did was
      # the other half. Terraform then believes those objects do not exist:
      # run 44 (`plan`, `dev`, 2026-09-15) returned `Plan: 184 to add, 0 to
      # change, 0 to destroy` against 55 surviving entries, with
      # `binary_authorization_key_version` and the GitOps `etcd_key` moving
      # from a concrete `//cloudkms.googleapis.com/...` path to `(known after
      # apply)`. A crypto key cannot be deleted, only scheduled for
      # destruction, and a key ring has no delete method at all, so those
      # creates answer "already exists" — partway through 184 resources, with
      # the rest created and billing and no clean way back. The header
      # predicted exactly this collision and then only defended against it by
      # never doing a full destroy; the teardown did one.
      #
      # So: plan, ask which creates would collide, ask Google whether each of
      # those objects is actually there, and import the ones that are.
      #
      # **This step creates nothing, and each part of that is deliberate.**
      # `terraform plan` creates nothing. `gcloud ... describe` creates
      # nothing. `terraform import` creates nothing — it writes state and
      # fails if the object is absent. And an object the probe does not find
      # is skipped rather than imported, so a first-ever apply into a clean
      # project finds nothing, imports nothing and proceeds; that is the case
      # a step written as "import and ignore the error" would quietly break,
      # because it cannot tell an absent object from a denied one.
      #
      # A probe that fails for any reason other than "not found" stops the
      # job. The message gcloud prints names the permission, and the answer is
      # to grant that one permission — never to widen a role until the error
      # goes away. Nothing here needs a grant today: `roles/cloudkms.admin`
      # carries `cloudkms.keyRings.get` and `cloudkms.cryptoKeys.get`, and
      # `modules/cicd`'s custom `infra_storage` role carries
      # `storage.buckets.get`, all three already held by this account.
      #
      # The identifier handed to `import` is built from the plan's own
      # intended attributes, never from a name written down in a workflow, so
      # what is reclaimed is by construction the object this apply was about
      # to create. The addresses come from the same parse the teardown removes
      # by. Neither is typed; a typed list is what missed the evidence bucket
      # in run 41.
      #
      # Why a loop rather than one pass: a crypto key's import identifier
      # contains its key ring's resource path, and while the ring is itself
      # only planned that path is `(known after apply)`. Importing the ring
      # makes the next plan know it. Each round imports what it can resolve
      # and stops when a round resolves nothing new; a key still unresolved
      # when the loop settles is a key whose ring genuinely does not exist,
      # and a key cannot exist under a ring that does not.
      #
      # Addresses are printed, never values — the same reason the teardown's
      # remainder step prints addresses rather than a count.
      - name: reclaim what the teardown left standing
        if: inputs.action == 'up'
        env:
          VAR_FILES: ${{ steps.vars.outputs.files }}
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
        run: |
          set -euo pipefail
          tf() { terraform -chdir=infrastructure/terraform "$@"; }
          plan="${RUNNER_TEMP}/reclaim.tfplan"
          rendered="${RUNNER_TEMP}/reclaim.json"
          lines="${RUNNER_TEMP}/reclaim.txt"
          denial="${RUNNER_TEMP}/reclaim.err"
          settled=0
          for round in 1 2 3 4; do
            echo "── reclaim round ${round}: planning ──"
            tf plan -input=false -out="$plan" ${VAR_FILES}
            tf show -json "$plan" > "$rendered"
            rm -f "$plan"
            python3 scripts/terraform-undeletable.py imports \
              --plan "$rendered" --project "$GCP_PROJECT" > "$lines"
            imported=0
            while IFS="$(printf '\t')" read -r verb address probe identifier; do
              [ -n "${verb:-}" ] || continue
              if [ "$verb" != import ]; then
                echo "${verb}: ${address} — ${probe}"
                continue
              fi
              IFS='|' read -r kind one two three four <<< "$probe"
              case "$kind" in
                keyring) ask=(gcloud kms keyrings describe "$three"
                              --project "$one" --location "$two") ;;
                key)     ask=(gcloud kms keys describe "$four"
                              --project "$one" --location "$two" --keyring "$three") ;;
                bucket)  ask=(gcloud storage buckets describe "gs://${two}"
                              --project "$one") ;;
                # Identity Platform's configuration cannot be deleted and the
                # API stays on through a teardown by decision, so an `up` over
                # a rebuilt environment is refused outright rather than
                # colliding on a name. `services list` is the proxy the script
                # documents: it answers whether the API is on, which is the
                # first half of "a configuration exists". Standard gcloud, the
                # same surface the other probes use.
                identity) ask=(gcloud services list --enabled --project "$one"
                               --filter=config.name:identitytoolkit.googleapis.com) ;;
                *) echo "no probe for ${kind} at ${address}" >&2; exit 1 ;;
              esac
              if "${ask[@]}" --format='value(name)' >/dev/null 2>"$denial" </dev/null; then
                tf import -input=false ${VAR_FILES} "$address" "$identifier" </dev/null
                echo "reclaimed: ${address}"
                imported=$((imported + 1))
              elif grep -qiE 'NOT_FOUND|not found|404|does not exist' "$denial"; then
                echo "absent: ${address} — nothing to reclaim"
              else
                echo "could not tell whether ${address} exists. gcloud said:" >&2
                cat "$denial" >&2
                echo "This step will not apply on a question it could not ask: an" >&2
                echo "object that is there and unseen is the collision this step" >&2
                echo "exists to prevent. If the message names a missing" >&2
                echo "permission, grant that one permission — not a wider role." >&2
                exit 1
              fi
            done < "$lines"
            if [ "$imported" = 0 ]; then
              settled=1
              echo "round ${round} reclaimed nothing further; state and project agree"
              break
            fi
          done
          if [ "$settled" != 1 ]; then
            echo "four plans in and this step was still importing. That is not a" >&2
            echo "teardown's remains, which are a fixed set; something is being" >&2
            echo "imported and lost again. Refusing to apply into that." >&2
            exit 1
          fi

      # -auto-approve because there is nobody at a prompt: the review is the
      # dispatch itself, recorded in the Actions log with who pressed it. The
      # prod refusal above is what keeps that acceptable.
      - name: up
        if: inputs.action == 'up'
        env:
          VAR_FILES: ${{ steps.vars.outputs.files }}
        run: |
          terraform -chdir=infrastructure/terraform apply -input=false -auto-approve \
            ${VAR_FILES}

      # ── The GitOps bootstrap (ADR 0036) ─────────────────────────────────
      #
      # After `up`, and only where the tfvars say `gitops_enabled = true`:
      # reach the control-plane cluster and apply infrastructure/gitops/
      # bootstrap/ in the order its README gives — cert-manager, Argo CD,
      # Kargo, the Config Connector operator, then Config Connector's one
      # object — then the two App-key Secrets,
      # then the environment's Argo CD project and Application and its Kargo
      # chain. A cluster that is absent is refused, never created: the
      # cluster is Terraform's, and a bootstrap that found none has been
      # dispatched before the apply that makes one, or that apply failed and
      # its output says why.
      #
      # Through the fleet's Connect gateway, because the endpoint is private
      # and its only authorised network is the management zone's. ADR 0036
      # decision 2 says `gcloud container clusters get-credentials`; that
      # writes an address this runner cannot route to, and the gateway is
      # the same identity reaching the same API server by the one path that
      # exists — a Google API call, authorised by roles/gkehub.gatewayEditor
      # and the custom role modules/gitops-control-plane grants this
      # account, carrying the container.* verbs these manifests need and not
      # roles/container.admin. Stated here and not yet proven: no bootstrap
      # has run.
      #
      # Server-side apply throughout, because Argo CD's ApplicationSet CRD
      # is larger than the last-applied annotation client-side apply would
      # have to write to record it, and Kubernetes refuses the annotation.
      #
      # The two App-key Secrets are the one place a value moves. Each is
      # read from Secret Manager into a mode-600 file in a private directory
      # removed on every exit path, turned into a Kubernetes Secret by a
      # script that reads the file and writes another, applied, and
      # removed. Nothing is echoed, nothing reaches a step output or the
      # summary. What the account running this can do is the same honest
      # statement the seeding step makes: it holds secretmanager.admin from
      # modules/cicd and could read any secret; this step reads two.
      - name: bootstrap the GitOps controllers
        id: bootstrap
        if: inputs.action == 'up'
        env:
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          tfvars="infrastructure/environments/${ENVIRONMENT}/terraform.tfvars"
          if ! grep -Eq '^gitops_enabled[[:space:]]*=[[:space:]]*true' "$tfvars"; then
            echo "gitops_enabled is not true in ${tfvars}; this environment has no control plane and nothing to bootstrap."
            exit 0
          fi
          region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          repository="$(sed -n 's/^github_repository[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          [ -n "$region" ] && [ -n "$repository" ] || {
            echo "the tfvars name no region or no github_repository; the bootstrap cannot say which cluster or which repository" >&2
            exit 1
          }
          # modules/gitops-control-plane names the cluster; derived here the
          # way every other name is, so nothing is pasted from an output.
          cluster="qip-${ENVIRONMENT}-control-plane"
          if ! gcloud container clusters describe "$cluster" \
            --project "${GCP_PROJECT}" --region "$region" --format='value(name)' >/dev/null 2>&1; then
            echo "${cluster} does not exist in ${GCP_PROJECT}/${region}." >&2
            echo "Terraform creates the control-plane cluster; this step only bootstraps one the apply above created. Read the apply's output for why it did not." >&2
            exit 1
          fi
          gcloud container fleet memberships get-credentials "$cluster" \
            --project "${GCP_PROJECT}" --location "$region"

          # Read the cluster on the way out, once, when it has just failed.
          #
          # Every bootstrap failure so far was diagnosed hours later from a
          # message naming the wrong component: `cert-manager-webhook
          # exceeded its progress deadline` was an Argo CD scan result three
          # steps upstream, and it cost a day. A pod stuck on
          # ImagePullBackOff and a pod refused by Binary Authorization read
          # identically in a rollout timeout, and the difference is in the
          # events below.
          #
          # An ERR trap rather than a step of its own, deliberately: it runs
          # with the kubeconfig already fetched above, needs no second
          # credential call, and cannot drift away from the step it explains.
          # It is armed only after `get-credentials`, because before that
          # there is no cluster to read and the reason is in this log already.
          #
          # Nothing here prints a Secret or a container log. `get pods`,
          # `describe pod` and `get events` carry object state; a log could
          # carry a token the process was handed. Every command is `|| true`
          # and the trap re-raises the original status, so a diagnostic can
          # never convert a failure into a different one — or into a pass.
          diagnose() {
            status=$?
            set +e
            echo "::error title=bootstrap failed::reading ${cluster} before giving up."
            for ns in cert-manager argocd kargo configconnector-operator-system cnrm-system qip-run qip; do
              echo "::group::${ns}"
              kubectl -n "$ns" get pods -o wide 2>&1 | head -40
              kubectl -n "$ns" get events --sort-by=.lastTimestamp 2>&1 | tail -25
              echo "::endgroup::"
            done
            echo "::group::applications"
            kubectl -n argocd get applications -o wide 2>&1 | head -20
            kubectl -n argocd get "application/qip-${ENVIRONMENT}" \
              -o jsonpath='{.status.sync.status}{"  "}{.status.health.status}{"\n"}{range .status.conditions[*]}{.type}{": "}{.message}{"\n"}{end}' 2>&1 | head -30
            echo "::endgroup::"
            echo "ImagePullBackOff means the registry holds no such digest: re-run vendor.yml." >&2
            echo "A Binary Authorization denial means the digest is mirrored and NOT attested, which is what the CRITICAL gate does to an image with an open finding. That is the gate working. Remove the vulnerable bytes; never exempt the image." >&2
            exit "$status"
          }
          trap diagnose ERR

          gitops="infrastructure/gitops"
          apply() {
            kubectl apply --server-side --force-conflicts --field-manager=qip-bootstrap -k "$1"
          }

          # The order below is a dependency order, and it was not.
          #
          # cert-manager used to be phase 1 and Argo CD phase 2, so a
          # cert-manager that would not finish — which is what runs 58, 59
          # and 60 each hit — stopped Argo CD being installed at all. Argo CD
          # does not depend on cert-manager. Its entire mention of it is one
          # line in a ConfigMap telling Argo CD *not to watch*
          # `cert-manager.io/CertificateRequest`, which is an exclusion, not
          # a dependency.
          #
          # What needs cert-manager is Kargo, whose chart provisions its
          # admission webhooks' TLS as a cert-manager `Certificate` — the
          # README beside this tree explains why that is cheaper than an
          # operator-supplied keypair nobody rotates.
          #
          # So Argo CD, Config Connector and the Application go first and are
          # proven; cert-manager and Kargo follow. A Kargo problem still
          # fails this run — it is not made non-fatal, because a run that
          # reports success having installed half the control plane is the
          # thing this file has been correcting all day — but it fails with
          # Argo CD already up and reconciling, which is what an operator
          # needs when the two are independent.
          # 1. Argo CD, which depends on nothing below it.
          apply "${gitops}/bootstrap/argocd/overlays/${ENVIRONMENT}"
          kubectl -n argocd rollout status deployment/argocd-server --timeout=300s
          kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=300s
          # 2. The Config Connector operator, vendored, and its CRDs. Run 34
          #    found the addon refused on Autopilot (`addons
          #    {"config-connector"} are not supported for Autopilot
          #    clusters`), so the operator arrives here like the three
          #    controllers above it. Its `ConfigConnector` CRD must be
          #    established before the object below names it, or the apply
          #    fails on a kind the API server does not know yet.
          apply "${gitops}/bootstrap/config-connector-operator/overlays/${ENVIRONMENT}"
          kubectl -n configconnector-operator-system rollout status statefulset/configconnector-operator --timeout=300s
          kubectl wait --for=condition=Established crd/configconnectors.core.cnrm.cloud.google.com --timeout=300s
          # 3. Config Connector's one object, and the namespace the manifests
          #    land in; then wait for the controller the operator installs to
          #    pick up the identity. The four cnrm-system images are the
          #    operator's own, from gcr.io/gke-release, and this wait is
          #    where an admission policy that does not admit them says so —
          #    bootstrap/config-connector-operator/SOURCE.md.
          apply "${gitops}/bootstrap/config-connector/overlays/${ENVIRONMENT}"
          # The ConfigConnector object's own condition first, and only then
          # the pods it causes to exist.
          #
          # `kubectl wait` on a *label selector* returns immediately with
          # "no matching resources found" when nothing matches yet, and the
          # operator has not created the controller pods at the instant this
          # line is reached. So the wait below was a wait that could succeed
          # by finding nothing — the exact shape of control this repository
          # calls a defect rather than a spare part, and it would have handed
          # the next command a controller that was not running.
          # Fifteen minutes, not five, and the reason is Autopilot.
          #
          # Run 62 timed out here at 300s — and the diagnostic then showed
          # every cnrm pod `1/1 Running`, aged 4m12s, on a node named
          # `gk3-...-nap-...`. That `nap` is node auto-provisioning:
          # Autopilot had no node these pods fitted on, so it built one, and
          # the clock a fixed cluster would spend scheduling is spent
          # provisioning instead. The wait was correct and the budget was
          # wrong, which is a different defect from the four before it — the
          # condition being waited on was the right one.
          kubectl wait --for=condition=Healthy configconnector/configconnector.core.cnrm.cloud.google.com --timeout=900s
          kubectl -n cnrm-system rollout status statefulset/cnrm-controller-manager --timeout=900s
          # 4. Argo CD's App credential, from Secret Manager, as a
          #    Kubernetes Secret. Kargo's is read at the same time and
          #    applied in phase 11, because the namespace it lands in does
          #    not exist until Kargo's Project controller makes one.
          umask 077
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          for controller in argocd kargo; do
            gcloud secrets versions access latest \
              --secret "qip-github-app-${controller}-${ENVIRONMENT}" \
              --project "${GCP_PROJECT}" --out-file "${scratch}/${controller}.json"
          done
          python3 - "$scratch" "https://github.com/${repository}.git" <<'PY'
          import json, sys
          scratch, repo_url = sys.argv[1], sys.argv[2]
          def read(controller):
              with open(f"{scratch}/{controller}.json", encoding="utf-8") as handle:
                  payload = json.load(handle)
              for key in ("app_id", "installation_id", "private_key"):
                  if not payload.get(key):
                      sys.exit(f"the {controller} App payload carries no {key}; seed it as bootstrap/README.md describes")
              return payload
          argocd = read("argocd")
          kargo = read("kargo")
          secrets = [
              {"apiVersion": "v1", "kind": "Secret",
               "metadata": {"name": "qip-repository", "namespace": "argocd",
                            "labels": {"argocd.argoproj.io/secret-type": "repository"}},
               "stringData": {"type": "git", "url": repo_url,
                              "githubAppID": str(argocd["app_id"]),
                              "githubAppInstallationID": str(argocd["installation_id"]),
                              "githubAppPrivateKey": argocd["private_key"]}},
              {"apiVersion": "v1", "kind": "Secret",
               "metadata": {"name": "qip-repository", "namespace": "qip",
                            "labels": {"kargo.akuity.io/cred-type": "git"}},
               "stringData": {"repoURL": repo_url,
                              "githubAppID": str(kargo["app_id"]),
                              "githubAppInstallationID": str(kargo["installation_id"]),
                              "githubAppPrivateKey": kargo["private_key"]}},
          ]
          # Two files, not one, because the two land at different times.
          # Argo CD's goes into `argocd`, which exists now. Kargo's goes into
          # `qip`, which does not exist until Kargo's own Project controller
          # creates it — and that is now after Argo CD is proven, so applying
          # both here would fail on a namespace nobody had made yet.
          for name, item in (("argocd", secrets[0]), ("kargo", secrets[1])):
              with open(f"{scratch}/secret-{name}.json", "w", encoding="utf-8") as handle:
                  json.dump(item, handle)
          PY
          kubectl apply --server-side --force-conflicts --field-manager=qip-bootstrap \
            -f "${scratch}/secret-argocd.json" >/dev/null
          rm -f "${scratch}/argocd.json" "${scratch}/kargo.json" "${scratch}/secret-argocd.json"
          echo "projected the Argo CD App credential into argocd/qip-repository; the value was not printed."

          # 5. Argo CD's admin credential, if this environment publishes a
          #     front door and somebody has seeded one.
          #
          # The overlay that adds a load balancer also sets
          # `admin.enabled: "true"`, because IAP authenticates a person and
          # then hands them an Argo CD with no account to be. This projects
          # the credential that account uses.
          #
          # **An unseeded secret disables the account rather than defaulting
          # it.** Argo CD with `admin.enabled` true and no `admin.password`
          # in `argocd-secret` generates one into a Secret on first start,
          # which is a credential nobody chose, nobody rotates and nobody
          # knows — behind a front door that is already published. So the
          # absence of a version turns the flag back off, and the operator
          # gets a control plane nobody can log into, which is the failure
          # they can diagnose rather than the one they cannot see.
          #
          # The value is a bcrypt hash, seeded out of band like every other
          # secret here, and is never printed: `--format` is not used, the
          # value is piped, and only its presence is reported.
          admin_secret="qip-argocd-admin-password-${ENVIRONMENT}"
          if [ -d "${gitops}/bootstrap/gateway/overlays/${ENVIRONMENT}" ]; then
            if gcloud secrets versions list "$admin_secret" --project "${GCP_PROJECT}" \
                 --filter='state:ENABLED' --format='value(name)' 2>/dev/null | grep -q .; then
              hash="$(gcloud secrets versions access latest --secret "$admin_secret" --project "${GCP_PROJECT}")"
              kubectl -n argocd patch secret argocd-secret --type=merge -p \
                "{\"stringData\":{\"admin.password\":\"${hash}\",\"admin.passwordMtime\":\"$(date -u +%FT%TZ)\"}}" >/dev/null
              unset hash
              echo "projected the Argo CD admin credential from ${admin_secret}; the value was not printed."
            else
              echo "::warning title=no Argo CD admin credential::${admin_secret} holds no enabled version, so the local admin account is being disabled rather than left with a password nobody chose."
              kubectl -n argocd patch configmap argocd-cm --type=merge -p \
                '{"data":{"admin.enabled":"false"}}' >/dev/null
              echo "Seed it and re-run: printf '%s' '<bcrypt-hash>' | gcloud secrets versions add ${admin_secret} --project ${GCP_PROJECT} --data-file=-"
            fi
          fi

          # 6. The Argo CD project and this environment's Application.
          apply "${gitops}/argocd/overlays/${ENVIRONMENT}"

          # 7. The front door, if this environment has one.
          #
          # Applied last because it is the only part that publishes anything:
          # a Gateway in front of controllers that are not yet running would
          # serve 502 to an operator who then has to work out whether the
          # load balancer or the controller is at fault. Applied at all only
          # where the overlay exists, so an environment without a front door
          # needs no flag here — the absence of the directory is the
          # statement, and it cannot drift from the tfvars that reserved the
          # address, because the apply simply has nothing to do.
          #
          # What this makes reachable is two controller UIs behind Identity-
          # Aware Proxy. It does not touch the API server, the nodes or the
          # private endpoint, and an operator who has not been granted
          # `roles/iap.httpsResourceAccessor` is refused by Google's front
          # end before the request reaches the cluster.
          if [ -d "${gitops}/bootstrap/gateway/overlays/${ENVIRONMENT}" ]; then
            apply "${gitops}/bootstrap/gateway/overlays/${ENVIRONMENT}"
            echo "the ${ENVIRONMENT} GitOps front door is applied; the load balancer takes a few minutes to program and the managed certificate stays in PROVISIONING until its A records resolve."
          else
            echo "no gateway overlay for ${ENVIRONMENT}; the control plane stays reachable only through the Connect gateway."
          fi

          # 8. Prove the sync rather than announcing it.
          #
          # This step used to end by printing "Argo CD reconciles ... from
          # here on" and exiting zero, without one check that the Application
          # had been admitted, that the repository credential worked, or that
          # a single manifest had synced. A step whose last line is a claim
          # about the future is the thing `.claude/rules/00-enterprise-governance.md`
          # exists to refuse: "never report that a check passed unless you ran
          # it and read its output". This job was reporting a successful
          # bootstrap on the strength of the last `kubectl apply` returning
          # zero, which says only that the API server accepted the document.
          #
          # `wait --for=jsonpath` is used rather than a poll loop because a
          # loop that gives up has to decide what to do next, and there is
          # only one right answer: fail, and say which half is wrong.
          echo "waiting for the ${ENVIRONMENT} Application to sync and report healthy..."
          if ! kubectl -n argocd wait --for=jsonpath='{.status.sync.status}'=Synced \
              "application/qip-${ENVIRONMENT}" --timeout=600s; then
            echo "::error title=Application never synced::qip-${ENVIRONMENT} did not reach Synced." >&2
            kubectl -n argocd get "application/qip-${ENVIRONMENT}" \
              -o jsonpath='{.status.sync.status}{"\n"}{.status.conditions}{"\n"}' >&2 || true
            exit 1
          fi
          if ! kubectl -n argocd wait --for=jsonpath='{.status.health.status}'=Healthy \
              "application/qip-${ENVIRONMENT}" --timeout=600s; then
            echo "::error title=Application synced but is not healthy::qip-${ENVIRONMENT} reached Synced and not Healthy." >&2
            echo "Synced means Argo CD applied what the manifests say; Healthy means the objects it applied came up. A sync that is not healthy is a reconciler that did its job over manifests that cannot run." >&2
            kubectl -n argocd get "application/qip-${ENVIRONMENT}" \
              -o jsonpath='{.status.health.status}{"\n"}{.status.conditions}{"\n"}' >&2 || true
            exit 1
          fi
          echo "bootstrapped ${cluster}; qip-${ENVIRONMENT} is Synced and Healthy, and Argo CD reconciles ${gitops}/envs/${ENVIRONMENT} from here on."

          # --- From here on: Kargo, and the cert-manager it needs ----------
          #
          # Everything above is Argo CD's path and is now proven. What
          # follows is independent of it, and a failure below leaves an
          # operator with a working Argo CD and a named Kargo problem rather
          # than neither.
          # 9. cert-manager, and wait for its webhook: Kargo's render names a
          #    Certificate the webhook must admit.
          apply "${gitops}/bootstrap/cert-manager/overlays/${ENVIRONMENT}"
          # All three, not just the webhook. The webhook is what admits the
          # Certificate Kargo declares; the *controller* is what issues it
          # and the cainjector is what puts the CA where the API server
          # reads it. Waiting on one of the three and depending on all
          # three is a wait that passes and then fails somebody else.
          kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=300s
          kubectl -n cert-manager rollout status deployment/cert-manager --timeout=300s
          kubectl -n cert-manager rollout status deployment/cert-manager-cainjector --timeout=300s
          # And then wait for the cainjector to have actually done its job.
          #
          # Three rollouts being complete says the pods are running. It does
          # not say the cainjector has patched cert-manager's CA into the
          # webhook configurations, and until it has, the API server cannot
          # verify the webhook's certificate — so every later apply that
          # touches a resource cert-manager validates fails with
          #
          #   failed calling webhook "webhook.cert-manager.io": ...
          #   x509: certificate signed by unknown authority
          #
          # which run 58 hit on Kargo's Certificate, three phases downstream.
          # This is the same defect as the label-selector wait two phases up
          # wearing different clothes: a readiness check that passes before
          # the thing it gates is ready, and hands the failure to whoever
          # runs next.
          #
          # A poll rather than `kubectl wait`, because the condition is "this
          # field is non-empty" and `--for=jsonpath=` can only match an exact
          # value.
          # Make the cainjector re-read the world before waiting on it.
          #
          # The webhook configurations carry
          # `cert-manager.io/inject-ca-from-secret: cert-manager/cert-manager-webhook-ca`,
          # the webhook pod generates that Secret itself
          # (`--dynamic-serving-ca-secret-name`), and the cainjector copies
          # the CA out of it into the two configurations.
          #
          # The step above applies those configurations with `--server-side
          # --force-conflicts`, and the vendored manifest declares no
          # `caBundle` — so each apply takes ownership of that field and
          # *removes* whatever the cainjector put there. The cainjector
          # watches the **Secret**, not the configuration, so a caBundle
          # deleted underneath it produces no event it reacts to, and it
          # waits for its own resync. Runs 58 and 59 both sat there: three
          # healthy pods, an empty caBundle, and nothing that was going to
          # change either.
          #
          # A restart is the smallest thing that makes it reconcile now.
          # On a first install it costs one pod cycle and changes nothing;
          # on a re-apply it is the difference between working and hanging.
          kubectl -n cert-manager rollout restart deployment/cert-manager-cainjector
          kubectl -n cert-manager rollout status deployment/cert-manager-cainjector --timeout=300s

          # Wait for what the next phase actually needs: a webhook that
          # answers and whose certificate the API server can verify.
          #
          # The previous version of this waited for a `caBundle` to appear on
          # the ValidatingWebhookConfiguration, which is *how* that usually
          # becomes true rather than *whether* it is. Runs 59 and 60 both
          # timed out on it with three healthy pods and a freshly restarted
          # cainjector, and the poll could say nothing about why — it was
          # watching one implementation detail of a mechanism with several.
          #
          # A server-side dry-run of a Certificate goes through admission,
          # so it calls the webhook and verifies its certificate, and
          # creates nothing. That is precisely the operation Kargo's own
          # Certificate performs three phases later, which is where this
          # kept failing. If the dry-run succeeds, that apply will too; if it
          # never does, the message below is the one the operator needs
          # rather than a fact about a field.
          echo "waiting for cert-manager's webhook to answer a validation request..."
          probe="$(mktemp)"
          # printf rather than a heredoc: a heredoc terminator has to sit at
          # the start of its line, and this script is a YAML block scalar
          # whose every line is indented. The first draft of this put
          # `CERTPROBE` at column zero and ended the scalar in the middle of
          # a shell command, which `yaml.safe_load` refused.
          printf '%s\n' \
            'apiVersion: cert-manager.io/v1' \
            'kind: Certificate' \
            'metadata:' \
            '  name: qip-bootstrap-webhook-probe' \
            '  namespace: cert-manager' \
            'spec:' \
            '  secretName: qip-bootstrap-webhook-probe' \
            '  dnsNames: [probe.qip-bootstrap.invalid]' \
            '  issuerRef:' \
            '    name: qip-bootstrap-probe' \
            '    kind: Issuer' > "$probe"
          answered=0
          probe_error=""
          for _ in $(seq 60); do
            if probe_error="$(kubectl apply --dry-run=server -f "$probe" 2>&1)"; then
              answered=1
              break
            fi
            sleep 5
          done
          rm -f "$probe"
          if [ "${answered}" -ne 1 ]; then
            echo "::error title=cert-manager's webhook never answered::a server-side dry-run of a Certificate still fails after five minutes, so every later apply that cert-manager validates will fail too." >&2
            echo "${probe_error}" >&2
            kubectl -n cert-manager get pods -o wide >&2 || true
            # Read objects, not logs and not events: `kubectl logs` needs
            # `container.pods.getLogs` and `get events` needs
            # `container.events.list`, neither of which this identity holds.
            # Run 59 and run 60 each lost their whole diagnostic to that, and
            # `.claude/rules/domains/infrastructure.md` refuses widening a
            # grant to make an error go away. Ask what this identity can
            # already answer.
            echo "the CA secret the webhook generates:" >&2
            kubectl -n cert-manager get secret cert-manager-webhook-ca -o name >&2 \
              || echo "  absent — the webhook has not generated its serving CA" >&2
            echo "the injection annotation and the bundle on the webhook configuration:" >&2
            kubectl get validatingwebhookconfiguration cert-manager-webhook \
              -o jsonpath='{.metadata.annotations}' >&2 || true
            echo "" >&2
            kubectl get validatingwebhookconfiguration cert-manager-webhook \
              -o jsonpath='{.webhooks[0].clientConfig.caBundle}' >&2 || true
            echo "" >&2
            exit 1
          fi
          echo "cert-manager's webhook answers and its certificate verifies."
          # 10. Kargo, which is what cert-manager above is for.
          apply "${gitops}/bootstrap/kargo/overlays/${ENVIRONMENT}"
          kubectl -n kargo rollout status deployment/kargo-api --timeout=300s
          kubectl -n kargo rollout status deployment/kargo-controller --timeout=300s
          # The webhooks server admits the Project applied in phase 6 and the
          # management controller is what reconciles it into a namespace.
          # Neither was waited for, and both are depended on two phases
          # later by `kubectl wait --for=condition=Ready project/qip`, which
          # would then wait out its own timeout on a resource nothing was
          # running to reconcile.
          kubectl -n kargo rollout status deployment/kargo-webhooks-server --timeout=300s
          kubectl -n kargo rollout status deployment/kargo-management-controller --timeout=300s

          # 11. Kargo's Project, the credential that lands in the namespace
          #     it creates, and the promotion chain.
          kubectl apply --server-side --force-conflicts --field-manager=qip-bootstrap \
            -f "${gitops}/kargo/base/project.yaml"
          kubectl wait --for=condition=Ready project/qip --timeout=300s

          # Kargo's own App credential, now that the namespace its Project
          # controller creates actually exists.
          kubectl apply --server-side --force-conflicts --field-manager=qip-bootstrap \
            -f "${scratch}/secret-kargo.json" >/dev/null
          rm -f "${scratch}/secret-kargo.json"
          echo "projected the Kargo App credential into qip/qip-repository; the value was not printed."

          # The Kargo chain, into the namespace the project created.
          apply "${gitops}/kargo/overlays/${ENVIRONMENT}"
          echo "bootstrapped Kargo; its chain promotes into ${gitops}/envs/${ENVIRONMENT} from here on."

      - name: suspend
        if: inputs.action == 'suspend'
        env:
          VAR_FILES: ${{ steps.vars.outputs.files }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # Destroy the control-plane cluster and nothing else.
          #
          # It is the one resource in this estate that bills while idle. A
          # regional Autopilot control plane is charged whether or not a Pod
          # runs; `execution_nodes = {}` everywhere so `down` reaches nothing;
          # and the Cloud Run services are manifests this cluster reconciles,
          # so they do not exist while it cannot start. What is left after
          # this step — KMS key versions, fourteen secret versions, one DNS
          # zone, a small registry, a few buckets, a NAT with no instances
          # behind it — is single-digit dollars a month at list price.
          #
          # **Why this is not `gitops_enabled = false`, which is the switch a
          # reader expects.** That closes the module's `count`, and the plan
          # then destroys `google_kms_crypto_key.etcd`, which declares
          # `prevent_destroy` because losing it makes every Secret in etcd
          # unreadable at the next control-plane restart rather than now.
          # Terraform aborts the whole plan. That guard is right and is not
          # weakened here; the durable fix is to move the key out of the gated
          # module, which is a `moved` block and a module interface change and
          # belongs in its own commit. ADR 0093 records both.
          #
          # **The cost of this shape, said plainly**: the configuration still
          # says there should be a cluster, so a later plain `up` recreates it
          # and the meter restarts. This action is a deliberate act with a
          # deliberate undo, in the same way `down` and `up` are for the
          # execution nodes — not a durable posture. The tfvars comment beside
          # `gitops_enabled` says the same thing where the switch is.
          #
          # The address is targeted rather than the module, so the etcd key,
          # the three controller identities and the registry DNS zones stay in
          # state and come back with the cluster.
          terraform -chdir=infrastructure/terraform destroy -input=false -auto-approve \
            -target='module.gitops_control_plane[0].google_container_cluster.control_plane' \
            ${VAR_FILES}
          echo "the ${ENVIRONMENT} control-plane cluster is gone; everything else in its module stands."

      - name: down
        if: inputs.action == 'down'
        env:
          VAR_FILES: ${{ steps.vars.outputs.files }}
        run: |
          set -euo pipefail
          # Targeted on purpose — see the header for why a full destroy is a
          # trap. The node's group, template, subnet, identity and rules go
          # together and `up` recreates them from the same tfvars — in shadow
          # mode, as always.
          #
          # This comment used to say the execution nodes were "the only thing
          # here that bills while idle", and that a Cloud Run service at zero
          # instances costs nothing. The second clause is true and does not
          # describe this estate: the fast brain and the deep brain are pinned
          # at a floor of one, on the argument in their catalogue entries, so
          # they are never at zero. The first clause is false twice over —
          # the control-plane cluster bills while idle by ADR 0036's own
          # account, and `execution_nodes = {}` in every environment, so this
          # step destroys nothing at all and stops no meter. It is kept
          # because an environment may declare nodes tomorrow; it is not a
          # cost control today, and reading it as one is how the estate went
          # on billing for a cluster nobody had looked at.
          terraform -chdir=infrastructure/terraform destroy -input=false -auto-approve \
            -target=module.execution_node \
            ${VAR_FILES}

      - name: teardown
        if: inputs.action == 'teardown'
        env:
          VAR_FILES: ${{ steps.vars.outputs.files }}
          ENVIRONMENT: ${{ inputs.environment }}
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
        run: |
          set -euo pipefail
          # See the header's `teardown` section for the order and the two
          # modules deliberately left standing.
          tfvars="infrastructure/environments/${ENVIRONMENT}/terraform.tfvars"
          region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          [ -n "$region" ] || {
            echo "the tfvars name no region; nothing here can be addressed." >&2
            exit 1
          }
          tf() { terraform -chdir=infrastructure/terraform "$@"; }

          # 1. Cloud Run services. Released from state by ADR 0036's `removed`
          #    blocks, so Terraform cannot see them; bounded to this
          #    environment's prefix so no other environment's service is named.
          services="$(gcloud run services list --project "$GCP_PROJECT" --region "$region" \
            --format='value(metadata.name)' --filter="metadata.name~^qip-${ENVIRONMENT}-" || true)"
          for service in $services; do
            gcloud run services delete "$service" --project "$GCP_PROJECT" --region "$region" --quiet
            echo "deleted Cloud Run service ${service}"
          done
          [ -n "$services" ] || echo "no qip-${ENVIRONMENT}-* Cloud Run service exists"

          # 2. The control-plane cluster, by gcloud, because its
          #    `deletion_protection` is true in state and a tainted cluster is
          #    only ever planned as a replace (module comment says why).
          cluster="qip-${ENVIRONMENT}-control-plane"
          if gcloud container clusters describe "$cluster" --project "$GCP_PROJECT" --region "$region" \
              --format='value(name)' >/dev/null 2>&1; then
            gcloud container clusters delete "$cluster" --project "$GCP_PROJECT" --region "$region" --quiet
            echo "deleted cluster ${cluster}"
          else
            echo "cluster ${cluster} does not exist"
          fi

          # 3. Out of state, not destroyed: the cluster entry (now deleted
          #    above, or never created) and every resource this identity
          #    cannot or must not delete. Derived from the module sources,
          #    not typed: any resource declared with `prevent_destroy = true`
          #    (a destroy that plans one aborts at plan time before touching
          #    anything else — run 41 stopped on the evidence *bucket*, which
          #    a hand-typed pattern for keys had missed) and any bucket
          #    declared `force_destroy = false` (it refuses while it holds
          #    objects, and this identity holds no project-wide right to
          #    delete objects). A KMS key cannot be deleted, only scheduled;
          #    the buckets hold a few files; both are listed as remaining.
          #    Objects inside those buckets go with them: run 42 destroyed
          #    146 of 172 and stopped on `storage.objects.delete`, which
          #    this identity does not hold and this action does not grant —
          #    an object in a bucket that stays is a few kilobytes in a
          #    bucket that stays.
          #
          #    The parse used to be a heredoc here. It is
          #    `scripts/terraform-undeletable.py` now, unchanged, because the
          #    `reclaim what the teardown left standing` step above needs the
          #    same list read the same way: this step decides what to leave in
          #    the project and that one decides what to put back into state,
          #    and two copies of one parse drift into two different lists.
          #    They drifted already — the copy that existed was only this one,
          #    so `up` had no list at all and run 44 planned 184 creates over
          #    the remains.
          python3 scripts/terraform-undeletable.py addresses > "${RUNNER_TEMP}/kept.txt"
          echo "declared undeletable or refusing, taken out of state:"; cat "${RUNNER_TEMP}/kept.txt"
          for address in $(tf state list | grep -E 'google_container_cluster\.' || true); do
            tf state rm "$address"
          done
          while read -r kept; do
            [ -n "$kept" ] || continue
            # Anchored on the address's own type.name, followed by an
            # instance key or the end, so `bucket.evidence` cannot take
            # `bucket.evidence_x` with it.
            for address in $(tf state list | grep -E "\.${kept}(\[|$)" || true); do
              tf state rm "$address"
            done
          done < "${RUNNER_TEMP}/kept.txt"

          # 4. Targeted, per the header: every module but module.services and
          #    module.cicd. A refusal (a non-empty bucket with force_destroy
          #    false) stops Terraform's scheduling but not this step; what is
          #    left is printed by `what exists now` below.
          tf destroy -input=false -auto-approve \
            -target=module.execution_node \
            -target=module.gitops_control_plane \
            -target=module.cloud_run \
            -target=module.openobserve \
            -target=module.network \
            -target=module.trust_zones \
            -target=module.connectivity \
            -target=module.egress_proxy \
            -target=module.registry \
            -target=module.image_bake \
            -target=module.secrets \
            -target=module.evidence \
            -target=module.backup \
            -target=module.data \
            -target=module.ai \
            -target=module.observability \
            -target=module.binary_authorization \
            -target=module.scc \
            -target=module.identity \
            ${VAR_FILES} \
            || echo "the destroy stopped before the end; the remainder is listed below and the refusal is in the log above." >&2
          echo "teardown finished; module.services and module.cicd were left standing by design."

      # Only where init succeeded, and only counting what was actually
      # listed. `state list | wc -l` printed 0 for a backend that could not
      # be read exactly as it did for an environment holding nothing, and
      # `always()` ran it after the prod refusal, before terraform was even
      # installed — so the step could report a number nobody computed, or
      # bury the real failure under its own. Now a listing that fails stops
      # the step with terraform's own message.
      - name: what exists now
        if: always() && steps.init.outcome == 'success'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          listed="$(terraform -chdir=infrastructure/terraform state list)"
          count="$(printf '%s\n' "$listed" | grep -c . || true)"
          echo "${count} resources in ${ENVIRONMENT} state"
          # The addresses, not only the count: after a teardown this list is
          # the record of what remains, and a count of 78 says nothing about
          # which 78. Addresses carry no secret; values are never listed.
          printf '%s\n' "$listed"
