# Build the stack up, and tear the expensive half down.
#
# This is the workflow that lets an operator — or an agent working for one —
# iterate the infrastructure from the repository: plan a change, apply it,
# and shut the execution nodes down when nobody is testing, which is where
# most of the money goes — every Cloud Run service scales to zero and costs
# nothing standing. The control-plane cluster of ADR 0036 does not: Autopilot
# bills for the controllers it schedules and for its control plane while
# idle, and `down` deliberately leaves it standing, because tearing it down
# takes Argo CD, Kargo and both App credentials with it. That standing cost
# is named in the ADR rather than hidden here. The workflow authenticates by
# workload identity federation as the `qip-infra` account `modules/cicd`
# creates; no key exists anywhere in this path.
#
# **Manual dispatch only, and never prod.** The automatic paths belong to
# deploy.yml, which cannot touch infrastructure. Production infrastructure is
# applied by a person running `scripts/bootstrap-deploy.sh prod`, on purpose:
# an agent that can reshape prod is an agent one prompt injection away from
# reshaping prod.
#
# ## Why `down` is not `destroy`
#
# `down` destroys `module.execution_node` — the C3 machines, the resources
# that bill by the hour — and leaves the Cloud Run services (which bill by
# the request), identity, KMS, secrets, the registry and the state bucket
# standing. That asymmetry is deliberate:
#
#   * KMS keys cannot be truly deleted — destroying them schedules key
#     versions for destruction and the key names stay claimed, so a full
#     destroy/apply cycle collides with its own remains ("CryptoKey already
#     exists"). The keys also cost nothing to keep.
#   * A workload identity pool is soft-deleted for thirty days, over which its
#     name cannot be reused. A full destroy would take this workflow's own
#     authentication down with it and the next apply could not put it back.
#   * The secrets hold seeded values a destroy would discard.
#
# So the cheap, safe iteration loop is `down` at the end of a session and
# `up` (a plain apply) at the start of the next. A true full teardown is a
# deliberate human act with `terraform destroy` and a reading of the KMS and
# WIF caveats above.
name: infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment. prod is refused — it is applied by a person, from the bootstrap script."
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - stage
      action:
        description: "plan (read-only), up (apply), down (destroy the execution nodes to stop the meter; everything else stands)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - up
          - down

permissions:
  contents: read

concurrency:
  # One infrastructure operation at a time per environment, and it queues
  # rather than cancels: half an apply is the worst of both.
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: refuse what this workflow must never do
        run: |
          set -euo pipefail
          # Defence in depth behind the choice list: a fork of this file with
          # prod added to the options still stops here.
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "prod infrastructure is never changed from this workflow." >&2
            echo "A person runs scripts/bootstrap-deploy.sh prod." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      # Everything this workflow needs to authenticate is derived from the
      # environment's tfvars, and deliberately not from repository variables.
      # The variables are set by the bootstrap's last step, which a failed
      # apply skips — and once they were set from a shell whose `terraform`
      # was Cloud Shell's install-advisory stub, so the workload-identity
      # variable held several lines of apt instructions. This workflow exists
      # to recover broken bootstraps, so it depends on nothing a broken
      # bootstrap produces: the tfvars are reviewed, committed configuration.
      - name: derive the identity from the tfvars
        id: identity
        run: |
          set -euo pipefail
          tfvars="infrastructure/environments/${{ inputs.environment }}/terraform.tfvars"
          project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          number="$(sed -n 's/^project_number[[:space:]]*=[[:space:]]*\([0-9]*\)/\1/p' "$tfvars" | head -1)"
          [ -n "$project" ] && [ -n "$number" ] || {
            echo "the tfvars carry no project_id/project_number; nothing to authenticate against" >&2
            exit 1
          }
          {
            echo "project=$project"
            echo "provider=projects/$number/locations/global/workloadIdentityPools/qip-github-${{ inputs.environment }}/providers/github"
            echo "account=qip-infra-${{ inputs.environment }}@$project.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.account }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          # The bootstrap's kubectl authenticates to GKE through this plugin;
          # gcloud no longer embeds the credential in the kubeconfig itself.
          install_components: gke-gcloud-auth-plugin

      # Overwriting Terraform state needs storage.objects.delete, and the
      # project-level role this account holds deliberately lacks it so nothing
      # it runs can delete from the evidence bucket. The one exception is
      # granted here, scoped to the state bucket, by the account itself — its
      # custom role carries storage.buckets.setIamPolicy. Idempotent, and the
      # bootstrap script makes the same grant.
      - name: the state bucket grant
        run: |
          gcloud storage buckets add-iam-policy-binding \
            "gs://${{ steps.identity.outputs.project }}-qip-tfstate" \
            --member="serviceAccount:${{ steps.identity.outputs.account }}" \
            --role="roles/storage.objectAdmin" --quiet >/dev/null

      # Run 25 found the second bucket this same reasoning applies to: every
      # rendering of the egress bootstrap (envoy.yaml, keyed by its own
      # content hash) is a new object in `modules/egress-proxy`'s bucket, and
      # a changed bootstrap makes Terraform delete the old one —
      #
      #   Error deleting contents of object envoy-16bc4c53e18e7501.yaml:
      #   googleapi: Error 403: ...does not have storage.objects.delete
      #   access to the Google Cloud Storage object.
      #
      # The state bucket grant above does not cover this bucket; it is a
      # second bucket with the same missing permission, not a wider deny that
      # one grant already closed. Idempotent, same shape as the grant above.
      - name: the egress bootstrap bucket grant
        run: |
          gcloud storage buckets add-iam-policy-binding \
            "gs://qip-egress-${{ inputs.environment }}-${{ steps.identity.outputs.project }}" \
            --member="serviceAccount:${{ steps.identity.outputs.account }}" \
            --role="roles/storage.objectAdmin" --quiet >/dev/null

      # Terraform refreshes existing state — reading the attestor's public
      # key, the attestor resource itself — before it applies anything, so a
      # role this same apply would grant declaratively is too late for the
      # refresh that needs it. Roles have hit this before, each read at plan
      # time by a resource that already exists from an earlier apply:
      # cloudkms.publicKeyViewer (the attestor's signing key),
      # binaryauthorization.attestorsAdmin (the attestor itself, which needs
      # more than read — Terraform diffs it, not just refreshes it), and —
      # new with the Cloud Run runtime — run.admin and dns.admin, which the
      # first plan against an environment applied before ADR 0024 reads
      # nothing with, but which every plan afterwards refreshes the services
      # and the private zone with. Then two the first such plan found, both
      # on resources the GKE runtime left in state: iap.admin, because the
      # console's IAP access binding cannot be read — and so cannot be
      # destroyed — without `iap.webTypes.getIamPolicy`, and
      # identityplatform.admin, because the Identity Platform config the
      # blueprint keeps is refreshed on every plan and answered 403 to a
      # caller holding nothing on it. Then a seventh the apply after them
      # found: container.clusterAdmin, for the teardown of the runtime ADR
      # 0024 retires. It was reached in two steps, and the second is why the
      # role is an admin one. First the account could issue the node pool
      # delete but not poll the operation it returned — `Required
      # "container.operations.get"` — so a delete GKE had accepted was
      # reported as a failure. clusterViewer closed that, the pool went, and
      # the cluster delete behind it answered `Required
      # "container.clusters.delete"`: this same teardown had already destroyed
      # the declarative grant carrying it, so the apply was removing the
      # account's own ability to finish itself. clusterAdmin manages clusters
      # and node pools and nothing inside them, which is the whole of what a
      # teardown does; container.admin would add full access to the Kubernetes
      # API objects of the cluster being deleted, and a test refuses it. The
      # account grants each to itself here —
      # its projectIamAdmin makes that possible; modules/cicd documents why
      # that is accepted — waiting only when a binding is new, since a fresh
      # grant can take a minute to bite.
      #
      # Four of the seven — cloudkms.publicKeyViewer,
      # binaryauthorization.attestorsAdmin, run.admin, dns.admin — also exist
      # declaratively in modules/cicd, so an environment applied by the
      # bootstrap (whose identity already holds project owner) never takes
      # this path for those. The other three — iap.admin,
      # identityplatform.admin, container.clusterAdmin — exist *only* here,
      # and this comment previously claimed all of them were declared. That
      # mattered: a reader trusting it would conclude this loop is a
      # belt-and-braces convenience and could be deleted, when for three
      # roles it is the sole grant and deleting it breaks the plan.
      - name: the permissions the plan needs before it can grant them
        run: |
          set -euo pipefail
          account="${{ steps.identity.outputs.account }}"
          project="${{ steps.identity.outputs.project }}"
          # No secret role is self-granted here, and the seeding step below
          # deliberately does not add one.
          #
          # A first draft of that step granted itself
          # `roles/secretmanager.secretVersionManager` and said in a comment
          # that it therefore "must never be able to read a payload back".
          # That was false when it was written: `modules/cicd` grants this
          # same account `roles/secretmanager.admin` declaratively
          # (`modules/cicd/main.tf`, the `infra_roles` set), and admin
          # includes `secretmanager.versions.access`. The narrower role added
          # no permission the account lacked and removed none it held, so the
          # sentence described a boundary that did not exist -- protection by
          # assertion, which is the thing this repository refuses most often.
          # It is gone rather than reworded, because a redundant grant that
          # exists to make a comment true is worse than no grant at all.
          for role in roles/cloudkms.publicKeyViewer roles/binaryauthorization.attestorsAdmin roles/run.admin roles/dns.admin roles/iap.admin roles/identityplatform.admin roles/container.clusterAdmin; do
            held="$(gcloud projects get-iam-policy "$project" \
              --flatten="bindings[].members" \
              --filter="bindings.role:$role AND bindings.members:serviceAccount:$account" \
              --format="value(bindings.role)")"
            if [ -z "$held" ]; then
              gcloud projects add-iam-policy-binding "$project" \
                --member="serviceAccount:$account" \
                --role="$role" --quiet >/dev/null
              echo "granted $role to $account; waiting for IAM to propagate"
              sleep 60
            fi
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform init
        id: init
        run: |
          terraform -chdir=infrastructure/terraform init -input=false \
            -backend-config="bucket=${{ steps.identity.outputs.project }}-qip-tfstate"

      # One var-file: the reviewed configuration. There used to be a second,
      # images.tfvars, holding the digests deploy.yml last moved the
      # services to; the services are Config Connector's now and the digest
      # is in infrastructure/gitops/envs/<env>/kustomization.yaml (ADR 0036),
      # so Terraform is not told a digest at all and cannot plan a service
      # at one.
      - name: the var-files this environment has
        id: vars
        run: |
          set -euo pipefail
          files="-var-file=../environments/${{ inputs.environment }}/terraform.tfvars"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: plan
        if: inputs.action == 'plan'
        run: |
          terraform -chdir=infrastructure/terraform plan -input=false \
            ${{ steps.vars.outputs.files }}

      # There is no "repair a tainted service" step here any more. It untainted
      # a `google_cloud_run_v2_service` Cloud Run still had, so an apply
      # updated it in place rather than being refused by its deletion
      # protection. Terraform declares no such resource since ADR 0036 — the
      # service is a Config Connector manifest and the root's `removed`
      # blocks release the ones state held — so a step that untaints one is
      # dead, and its presence would be the first sign of a service being
      # put back into Terraform. The deadlock it closed is recorded in the
      # acceptance suite's history; the deletion guard it kept is now
      # `cnrm.cloud.google.com/deletion-policy: abandon` on every manifest.

      # Seed a first version into a secret that terraform declared and
      # nothing has ever written to.
      #
      # This exists because the apply that created the OpenObserve service
      # failed on `Secret .../versions/latest was not found`: terraform
      # creates the secret as a container, a Cloud Run `secret_key_ref`
      # resolves a *version*, and no step between the two ever put one there.
      # Thirteen of fifteen resources landed and the one service that needed
      # a credential did not.
      #
      # The value is generated here and this step reads it back nowhere: not
      # echoed, not written to the log, not carried out through a workflow
      # output. It reaches gcloud as a mode-600 file in a private directory
      # removed on every exit path, never as an argument, because an argument
      # is visible in `ps` for as long as the call takes.
      #
      # State plainly what that is and is not. It is a property of this step,
      # not a boundary around the workflow: the account running it holds
      # `roles/secretmanager.admin` from `modules/cicd`, so it *could* read
      # any secret in the project, this one included. Nothing here prevents
      # that; this step simply does not do it. Anyone narrowing the blast
      # radius of `infra.yml` should start at that declarative grant, and
      # should not read the care taken below as evidence the grant is already
      # narrow.
      #
      # Seeding only when a secret has no enabled version is what makes this
      # safe to run on every `up`: a rotated or operator-set credential is
      # left alone, so this can never silently replace a password somebody
      # is using. A secret terraform has not created yet is skipped rather
      # than treated as an error, because on a first apply the container does
      # not exist until the apply below runs — that environment needs a
      # second `up`, and this comment is where that is recorded rather than
      # discovered.
      - name: seed any credential that has no version
        if: inputs.action == 'up'
        run: |
          set -euo pipefail
          project="${{ steps.identity.outputs.project }}"
          suffix="${{ inputs.environment }}"
          seeded=0
          umask 077
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          for secret in qip-openobserve-root-email qip-openobserve-root-password; do
            name="$secret-$suffix"
            if ! gcloud secrets describe "$name" --project "$project" >/dev/null 2>&1; then
              echo "$name does not exist yet; the apply below creates it and the next up seeds it"
              continue
            fi
            existing="$(gcloud secrets versions list "$name" --project "$project" \
              --filter="state:ENABLED" --format="value(name)" --limit=1)"
            if [ -n "$existing" ]; then
              echo "$name already has an enabled version; leaving it alone"
              continue
            fi
            case "$secret" in
              *-email)
                # Not a real mailbox and deliberately not a person's address:
                # OpenObserve wants this to parse, nothing delivers to it,
                # and an operator identifier does not belong in a committed
                # file.
                value="admin@algorik.internal" ;;
              *-password)
                value="$(openssl rand -base64 30)" ;;
            esac
            printf '%s' "$value" > "$scratch/payload"
            gcloud secrets versions add "$name" --project "$project" \
              --data-file="$scratch/payload" >/dev/null
            rm -f "$scratch/payload"
            echo "seeded $name with a first version"
            seeded=1
          done
          if [ "$seeded" = 1 ]; then
            echo "A generated credential was written. This step did not log it; read it with:"
            echo "  gcloud secrets versions access latest --secret qip-openobserve-root-password-$suffix --project $project"
          fi

      # -auto-approve because there is nobody at a prompt: the review is the
      # dispatch itself, recorded in the Actions log with who pressed it. The
      # prod refusal above is what keeps that acceptable.
      - name: up
        if: inputs.action == 'up'
        run: |
          terraform -chdir=infrastructure/terraform apply -input=false -auto-approve \
            ${{ steps.vars.outputs.files }}

      # ── The GitOps bootstrap (ADR 0036) ─────────────────────────────────
      #
      # After `up`, and only where the tfvars say `gitops_enabled = true`:
      # reach the control-plane cluster and apply infrastructure/gitops/
      # bootstrap/ in the order its README gives — cert-manager, Argo CD,
      # Kargo, the Config Connector operator, then Config Connector's one
      # object — then the two App-key Secrets,
      # then the environment's Argo CD project and Application and its Kargo
      # chain. A cluster that is absent is refused, never created: the
      # cluster is Terraform's, and a bootstrap that found none has been
      # dispatched before the apply that makes one, or that apply failed and
      # its output says why.
      #
      # Through the fleet's Connect gateway, because the endpoint is private
      # and its only authorised network is the management zone's. ADR 0036
      # decision 2 says `gcloud container clusters get-credentials`; that
      # writes an address this runner cannot route to, and the gateway is
      # the same identity reaching the same API server by the one path that
      # exists — a Google API call, authorised by roles/gkehub.gatewayEditor
      # and the custom role modules/gitops-control-plane grants this
      # account, carrying the container.* verbs these manifests need and not
      # roles/container.admin. Stated here and not yet proven: no bootstrap
      # has run.
      #
      # Server-side apply throughout, because Argo CD's ApplicationSet CRD
      # is larger than the last-applied annotation client-side apply would
      # have to write to record it, and Kubernetes refuses the annotation.
      #
      # The two App-key Secrets are the one place a value moves. Each is
      # read from Secret Manager into a mode-600 file in a private directory
      # removed on every exit path, turned into a Kubernetes Secret by a
      # script that reads the file and writes another, applied, and
      # removed. Nothing is echoed, nothing reaches a step output or the
      # summary. What the account running this can do is the same honest
      # statement the seeding step makes: it holds secretmanager.admin from
      # modules/cicd and could read any secret; this step reads two.
      - name: bootstrap the GitOps controllers
        if: inputs.action == 'up'
        env:
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          tfvars="infrastructure/environments/${ENVIRONMENT}/terraform.tfvars"
          if ! grep -Eq '^gitops_enabled[[:space:]]*=[[:space:]]*true' "$tfvars"; then
            echo "gitops_enabled is not true in ${tfvars}; this environment has no control plane and nothing to bootstrap."
            exit 0
          fi
          region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          repository="$(sed -n 's/^github_repository[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          [ -n "$region" ] && [ -n "$repository" ] || {
            echo "the tfvars name no region or no github_repository; the bootstrap cannot say which cluster or which repository" >&2
            exit 1
          }
          # modules/gitops-control-plane names the cluster; derived here the
          # way every other name is, so nothing is pasted from an output.
          cluster="qip-${ENVIRONMENT}-control-plane"
          if ! gcloud container clusters describe "$cluster" \
            --project "${GCP_PROJECT}" --region "$region" --format='value(name)' >/dev/null 2>&1; then
            echo "${cluster} does not exist in ${GCP_PROJECT}/${region}." >&2
            echo "Terraform creates the control-plane cluster; this step only bootstraps one the apply above created. Read the apply's output for why it did not." >&2
            exit 1
          fi
          gcloud container fleet memberships get-credentials "$cluster" \
            --project "${GCP_PROJECT}" --location "$region"

          gitops="infrastructure/gitops"
          apply() {
            kubectl apply --server-side --force-conflicts --field-manager=qip-bootstrap -k "$1"
          }

          # 1. cert-manager, and wait for its webhook: Kargo's render names a
          #    Certificate the webhook must admit.
          apply "${gitops}/bootstrap/cert-manager/overlays/${ENVIRONMENT}"
          kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=300s
          # 2. Argo CD.
          apply "${gitops}/bootstrap/argocd/overlays/${ENVIRONMENT}"
          kubectl -n argocd rollout status deployment/argocd-server --timeout=300s
          kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=300s
          # 3. Kargo.
          apply "${gitops}/bootstrap/kargo/overlays/${ENVIRONMENT}"
          kubectl -n kargo rollout status deployment/kargo-api --timeout=300s
          kubectl -n kargo rollout status deployment/kargo-controller --timeout=300s
          # 4. The Config Connector operator, vendored, and its CRDs. Run 34
          #    found the addon refused on Autopilot (`addons
          #    {"config-connector"} are not supported for Autopilot
          #    clusters`), so the operator arrives here like the three
          #    controllers above it. Its `ConfigConnector` CRD must be
          #    established before the object below names it, or the apply
          #    fails on a kind the API server does not know yet.
          apply "${gitops}/bootstrap/config-connector-operator/overlays/${ENVIRONMENT}"
          kubectl -n configconnector-operator-system rollout status statefulset/configconnector-operator --timeout=300s
          kubectl wait --for=condition=Established crd/configconnectors.core.cnrm.cloud.google.com --timeout=300s
          # 5. Config Connector's one object, and the namespace the manifests
          #    land in; then wait for the controller the operator installs to
          #    pick up the identity. The four cnrm-system images are the
          #    operator's own, from gcr.io/gke-release, and this wait is
          #    where an admission policy that does not admit them says so —
          #    bootstrap/config-connector-operator/SOURCE.md.
          apply "${gitops}/bootstrap/config-connector/overlays/${ENVIRONMENT}"
          kubectl -n cnrm-system wait --for=condition=Ready pod \
            -l cnrm.cloud.google.com/component=cnrm-controller-manager --timeout=300s

          # 6. The two credentials, from Secret Manager, as Kubernetes
          #    Secrets. Kargo's lands in the project's namespace, so the
          #    project goes first and is waited for.
          kubectl apply --server-side --force-conflicts --field-manager=qip-bootstrap \
            -f "${gitops}/kargo/base/project.yaml"
          kubectl wait --for=condition=Ready project/qip --timeout=300s
          umask 077
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          for controller in argocd kargo; do
            gcloud secrets versions access latest \
              --secret "qip-github-app-${controller}-${ENVIRONMENT}" \
              --project "${GCP_PROJECT}" --out-file "${scratch}/${controller}.json"
          done
          python3 - "$scratch" "https://github.com/${repository}.git" <<'PY'
          import json, sys
          scratch, repo_url = sys.argv[1], sys.argv[2]
          def read(controller):
              with open(f"{scratch}/{controller}.json", encoding="utf-8") as handle:
                  payload = json.load(handle)
              for key in ("app_id", "installation_id", "private_key"):
                  if not payload.get(key):
                      sys.exit(f"the {controller} App payload carries no {key}; seed it as bootstrap/README.md describes")
              return payload
          argocd = read("argocd")
          kargo = read("kargo")
          secrets = [
              {"apiVersion": "v1", "kind": "Secret",
               "metadata": {"name": "qip-repository", "namespace": "argocd",
                            "labels": {"argocd.argoproj.io/secret-type": "repository"}},
               "stringData": {"type": "git", "url": repo_url,
                              "githubAppID": str(argocd["app_id"]),
                              "githubAppInstallationID": str(argocd["installation_id"]),
                              "githubAppPrivateKey": argocd["private_key"]}},
              {"apiVersion": "v1", "kind": "Secret",
               "metadata": {"name": "qip-repository", "namespace": "qip",
                            "labels": {"kargo.akuity.io/cred-type": "git"}},
               "stringData": {"repoURL": repo_url,
                              "githubAppID": str(kargo["app_id"]),
                              "githubAppInstallationID": str(kargo["installation_id"]),
                              "githubAppPrivateKey": kargo["private_key"]}},
          ]
          with open(f"{scratch}/secrets.json", "w", encoding="utf-8") as handle:
              json.dump({"apiVersion": "v1", "kind": "List", "items": secrets}, handle)
          PY
          kubectl apply --server-side --force-conflicts --field-manager=qip-bootstrap \
            -f "${scratch}/secrets.json" >/dev/null
          rm -f "${scratch}"/*.json
          echo "projected the two App credentials into argocd/qip-repository and qip/qip-repository; neither value was printed."

          # 7. The Argo CD project and this environment's Application.
          apply "${gitops}/argocd/overlays/${ENVIRONMENT}"
          # 8. The Kargo chain, into the namespace the project created.
          apply "${gitops}/kargo/overlays/${ENVIRONMENT}"
          echo "bootstrapped ${cluster}; Argo CD reconciles ${gitops}/envs/${ENVIRONMENT} from here on."

      - name: down
        if: inputs.action == 'down'
        run: |
          set -euo pipefail
          # Targeted on purpose — see the header for why a full destroy is a
          # trap. The execution nodes are the only thing here that bills
          # while idle: a Cloud Run service at zero instances costs nothing,
          # and its `deletion_protection` refuses a destroy in any case. The
          # node's group, template, subnet, identity and rules go together
          # and `up` recreates them from the same tfvars — in shadow mode,
          # as always.
          terraform -chdir=infrastructure/terraform destroy -input=false -auto-approve \
            -target=module.execution_node \
            ${{ steps.vars.outputs.files }}

      # Only where init succeeded, and only counting what was actually
      # listed. `state list | wc -l` printed 0 for a backend that could not
      # be read exactly as it did for an environment holding nothing, and
      # `always()` ran it after the prod refusal, before terraform was even
      # installed — so the step could report a number nobody computed, or
      # bury the real failure under its own. Now a listing that fails stops
      # the step with terraform's own message.
      - name: what exists now
        if: always() && steps.init.outcome == 'success'
        run: |
          set -euo pipefail
          listed="$(terraform -chdir=infrastructure/terraform state list)"
          count="$(printf '%s\n' "$listed" | grep -c . || true)"
          echo "${count} resources in ${{ inputs.environment }} state"
