# GitHub CodeQL analysis for security vulnerabilities.
#
# CodeQL performs static analysis to detect potential security vulnerabilities
# and code quality issues, beside the Trivy container scan and the
# dependency audits.
#
# **It gates acceptance; it does not run beside it** (R12 CICD-9105). Until
# 2026-10-11 this workflow triggered itself on push and pull request, as a
# separate workflow, and `deploy.yml` waited only on `ci` — so a commit with
# a CodeQL finding was built, signed and attested exactly as one without.
# Now `ci.yml` calls this file as its `sast` job (`workflow_call` below), so
# `ci` cannot succeed unless CodeQL does, and `deploy.yml`'s gate also
# checks the `sast` jobs of the ci run it is about to trust, by name. The
# Since R2.8 a CodeQL *finding* fails the job too, not only a failed
# analysis: see the last step. The
# push and pull_request triggers are gone because ci runs it on both; a
# second, independent run would be a second result nobody gates on. The
# daily schedule stays, for advisories published against code that has
# not changed.
#
# The workflow uses the language matrix to analyze supported languages.
# For each language, CodeQL initializes its analysis database, attempts to
# build the project (for compiled languages), and then performs analysis.

name: CodeQL Analysis

on:
  workflow_call:
  schedule:
    # Run analysis at 09:00 UTC daily to detect new vulnerabilities
    - cron: '0 9 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["rust", "typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Optional: specify queries to customize CodeQL's analysis
          queries: security-and-quality
          # vendor/templates holds licensed third-party template packages kept
          # byte-for-byte as delivered (ADR 0015) and shipped by no image,
          # workflow or frontend build. Their findings are the vendors' code,
          # not ours, and are fixed by updating the package, never by editing
          # it; scanning them only blocked every commit on code nobody here
          # may change. ADR 0117 Amendment 2.
          config: |
            paths-ignore:
              - vendor/templates

      - name: Setup Rust toolchain (Rust only)
        if: matrix.language == 'rust'
        run: rustup show active-toolchain || rustup toolchain install

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # The repository's own CodeQL model pack, for the Rust analysis only
      # (ADR 0117 Amendment 3; `.github/codeql/qip-models/README.md` holds
      # every row's claim and its evidence). It tells the analyser which
      # name-matched values carry no printable secret, so that one
      # `from_secret(..)?` inside a constructor no longer marks every field of
      # every `Platform` as sensitive and every test assertion printing an
      # order id as a leak — 33 such findings turned `sast` red on 2026-10-18.
      #
      # Why this route: the action's `packs` input and the `packs` key of its
      # config accept only `scope/name[@version]` from a registry
      # (init/action.yml), so a pack that lives in the checkout cannot go
      # there. `CODEQL_ACTION_EXTRA_OPTIONS` is the action's hook for extra
      # CLI options, read by `getExtraOptionsEnvParam` (src/util.ts) and
      # applied per command by `getExtraOptions` (src/codeql.ts);
      # `database run-queries` is the command that resolves model packs, and
      # these are the two flags `codeql database analyze` takes locally for
      # the same effect. Unset, the action reads `{}`, which is what the
      # TypeScript matrix entry gets.
      #
      # `sast` runs only on a push to `main` (ci.yml), so the merge that
      # carries this step is the first run that exercises it. If the pack does
      # not load, `run-queries` fails and the job is red; if the options were
      # ignored, the 33 findings return and the gate below is red. Neither is
      # worse than today, and the fix for either is in this file and the pack,
      # both reviewed paths.
      - name: Load the repository's CodeQL model pack (Rust only)
        if: matrix.language == 'rust'
        run: |
          printf 'CODEQL_ACTION_EXTRA_OPTIONS={"database":{"run-queries":["--additional-packs=%s/.github/codeql/qip-models","--model-packs=qip/rust-models"]}}\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # The SARIF is written to a directory as well as uploaded, so the next
      # step can read what the analysis found rather than only whether it
      # ran.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      # **A finding blocks; finishing does not pass** (R12 CICD-9105). The
      # analyze step uploads its alerts and succeeds whatever they are, so
      # until this step a `sast` job's success meant only that CodeQL ran —
      # and `deploy.yml`'s gate, which refuses a ci run whose `sast / …` jobs
      # did not all succeed, was reading a result that could not fail on a
      # finding. This fails the job on any alert whose rule carries a
      # security-severity at or above the threshold committed in
      # `scripts/sast-policy.json` (7.0, CodeQL's "high" band — the same band
      # the Trivy gates stop on), and on an analysis that wrote no SARIF.
      # The threshold has no input and no override here: lowering it is an
      # edit to that file, reviewed like any other. `deploy.yml` needs no
      # change to honour it — it already reads these jobs by name.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: refuse a finding at or above the committed severity
        run: node scripts/sast-gate.mjs --policy scripts/sast-policy.json sarif-results
