# Run one development-agent lane's acceptance in a sandbox (R12 SEC-9068,
# SEC-9084, CICD-9076, CICD-9082, CICD-9083).
#
# An agent lane is a branch an agent wrote. Its acceptance is the commands
# the orchestrator committed for it in a lane manifest on the default
# branch — never the lane's own opinion of whether it is done — and they run
# here, in a job that holds nothing worth stealing:
#
#   * `permissions: contents: read` and nothing else. No `id-token`, so no
#     OIDC token and no route to a cloud credential; no `environment`, so no
#     environment secret and no deployment approval; no `secrets.` reference
#     anywhere in this file, so GitHub injects none. `scripts/agent-guard.mjs
#     sandbox` refuses this file if any of that changes, and ci's
#     agent-boundary job runs it on every push.
#   * The lane's checkout does not keep the token (`persist-credentials:
#     false`), so code on the lane's branch cannot push with it.
#   * A time limit taken from the lane's own budget, enforced twice: the
#     job's `timeout-minutes`, and `agent-lanes.mjs accept`, which kills a
#     command that runs past what the budget has left.
#   * The lane's diff is held to the paths it owns. Two lanes owning one
#     boundary are refused at `validate` unless one waits for the other, and
#     `check-diff` catches a lane that edited outside its plot anyway.
#   * Its network is one proxy (SEC-9077, ADR 0117). The lane's commands run
#     under the group `lane-egress`, which the runner's firewall lets reach
#     loopback and nothing else, DNS included, and with `no_new_privs`, so
#     the runner's own password-less `sudo` cannot lift them out of it. The
#     only route off the machine is `scripts/agent-egress.mjs`, run as root
#     from a read-only copy: HTTPS to `sandbox.egress_allow` in the policy,
#     within its request and byte quotas, and no model provider at all
#     (SEC-9078's development half). Any refusal fails the run.
#   * The verdict is taken in the same step that ran the lane, after every
#     process in `lane-egress` is killed, by root-owned copies of node and the
#     scripts reading a root-owned log. A later step would not do: a lane can
#     write `$GITHUB_ENV` (`BASH_ENV`, `NODE_OPTIONS`) and own every step that
#     follows it. The step body is one brace group so bash has parsed all of
#     it before the lane runs and cannot be handed a rewritten script.
#
# The trusted half — the scripts, the policy and the manifest — is checked
# out from the default branch, so a lane cannot rewrite the rules it is
# judged by. Manual dispatch only; nothing here deploys, and `deploy.yml`,
# `infra.yml` and `fleet.yml` refuse an agent actor outright.
name: agent sandbox

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "The lane manifest, a path on the default branch (for example docs/lanes/round-2.json)."
        required: true
        type: string
      lane:
        description: "The lane id in that manifest."
        required: true
        type: string
      ref:
        description: "The lane's branch."
        required: true
        type: string

permissions:
  contents: read

# One run per lane at a time. Overlapping lanes are serialised by the
# manifest's own dependency order, which `validate` enforces.
concurrency:
  group: agent-sandbox-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  plan:
    name: the lane plan is valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      minutes: ${{ steps.budget.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Shapes before use: each value becomes a path, an argument or a ref.
      - name: the inputs are the shapes they claim
        env:
          MANIFEST: ${{ inputs.manifest }}
          LANE: ${{ inputs.lane }}
          LANE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "$MANIFEST" in
            ''|/*|*..*|*[!A-Za-z0-9._/-]*) echo "manifest is not a repository-relative path" >&2; exit 1 ;;
          esac
          case "$LANE" in
            ''|*[!a-z0-9-]*) echo "lane is not a lane id" >&2; exit 1 ;;
          esac
          case "$LANE_REF" in
            ''|-*|*..*|*[!A-Za-z0-9._/-]*) echo "ref is not a branch name" >&2; exit 1 ;;
          esac
      - name: validate the manifest and read the lane's budget
        id: budget
        env:
          MANIFEST: ${{ inputs.manifest }}
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          node scripts/agent-lanes.mjs validate --policy scripts/agent-policy.json --manifest "$MANIFEST"
          minutes="$(node scripts/agent-lanes.mjs budget --policy scripts/agent-policy.json --manifest "$MANIFEST" --lane "$LANE")"
          case "$minutes" in ''|*[!0-9.]*) echo "the lane's budget is not a number of minutes" >&2; exit 1 ;; esac
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

  accept:
    name: the lane meets its acceptance within budget
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.minutes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: lane
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: the lane changed only what it owns
        env:
          MANIFEST: ${{ inputs.manifest }}
          LANE: ${{ inputs.lane }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git -C lane diff --name-only "origin/${DEFAULT_BRANCH}...HEAD" > "$RUNNER_TEMP/changed.txt"
          node trusted/scripts/agent-lanes.mjs check-diff --policy trusted/scripts/agent-policy.json \
            --manifest "trusted/$MANIFEST" --lane "$LANE" --files "$RUNNER_TEMP/changed.txt"
      # Before any of the lane's code runs: everything the verdict relies on is
      # copied where the lane, as an unprivileged member of `lane-egress`,
      # cannot write it.
      - name: stage the trusted half read-only and start the egress proxy
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          sudo install -d -m 755 /opt/agent-trusted /var/lib/agent-egress
          sudo cp -r trusted/scripts /opt/agent-trusted/scripts
          sudo install -D -m 644 "trusted/$MANIFEST" "/opt/agent-trusted/$MANIFEST"
          sudo install -m 755 "$(command -v node)" /opt/agent-trusted/node
          sudo chown -R root:root /opt/agent-trusted
          sudo chmod -R go-w /opt/agent-trusted
          sudo groupadd --system lane-egress
          for table in iptables ip6tables; do
            sudo "$table" -A OUTPUT -m owner --gid-owner lane-egress -p udp --dport 53 -j REJECT
            sudo "$table" -A OUTPUT -m owner --gid-owner lane-egress -p tcp --dport 53 -j REJECT
            sudo "$table" -A OUTPUT -m owner --gid-owner lane-egress -o lo -j ACCEPT
            sudo "$table" -A OUTPUT -m owner --gid-owner lane-egress -j REJECT
          done
          sudo nohup /opt/agent-trusted/node /opt/agent-trusted/scripts/agent-egress.mjs serve \
            --policy /opt/agent-trusted/scripts/agent-policy.json --port 3128 \
            --log /var/lib/agent-egress/egress.jsonl --ready /var/lib/agent-egress/ready \
            > "$RUNNER_TEMP/egress-proxy.out" 2>&1 &
          for _ in $(seq 50); do
            if sudo test -s /var/lib/agent-egress/ready; then break; fi
            sleep 0.2
          done
          sudo test -s /var/lib/agent-egress/ready || { cat "$RUNNER_TEMP/egress-proxy.out" >&2; echo "the egress proxy did not start" >&2; exit 1; }
      - name: run the lane's acceptance commands inside the egress limit, then judge its egress
        env:
          MANIFEST: ${{ inputs.manifest }}
          LANE: ${{ inputs.lane }}
        run: |
          {
            set -uo pipefail
            lane_gid="$(getent group lane-egress | cut -d: -f3)"
            proxy=http://127.0.0.1:3128
            sudo setpriv --reuid="$(id -u)" --regid="$lane_gid" --clear-groups --no-new-privs -- \
              env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 \
                HTTPS_PROXY="$proxy" https_proxy="$proxy" HTTP_PROXY="$proxy" http_proxy="$proxy" \
                NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost \
              /opt/agent-trusted/node /opt/agent-trusted/scripts/agent-lanes.mjs accept \
                --policy /opt/agent-trusted/scripts/agent-policy.json \
                --manifest "/opt/agent-trusted/$MANIFEST" --lane "$LANE" --cwd lane
            accepted=$?
            sudo pkill -KILL -G lane-egress || true
            sudo /opt/agent-trusted/node /opt/agent-trusted/scripts/agent-egress.mjs verdict \
              --policy /opt/agent-trusted/scripts/agent-policy.json --log /var/lib/agent-egress/egress.jsonl
            judged=$?
            if [ "$accepted" -ne 0 ] || [ "$judged" -ne 0 ]; then exit 1; fi
            exit 0
          }

      # The compromise drill's sandbox half (R12-SEC-10157): a process with
      # the lane's identity tries what a hijacked agent would — read a
      # secret, open a connection around the proxy, reach a host the policy
      # does not allow, find a token in the checkouts — and every attempt
      # must be refused. It runs after the verdict so its own refused
      # requests are not judged as the lane's. A boundary that let one
      # through fails the job, so the drill cannot pass silently.
      - name: a hostile process with the lane's identity is refused
        run: |
          set -uo pipefail
          lane_gid="$(getent group lane-egress | cut -d: -f3)"
          proxy=http://127.0.0.1:3128
          planted=/var/lib/agent-egress/planted-secret
          echo "drill-canary-$(date +%s%N)" | sudo tee "$planted" > /dev/null
          sudo chmod 600 "$planted"
          as_lane() {
            sudo setpriv --reuid="$(id -u)" --regid="$lane_gid" --clear-groups --no-new-privs -- \
              env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 \
                HTTPS_PROXY="$proxy" https_proxy="$proxy" "$@"
          }
          breached=0
          if as_lane cat "$planted" > /dev/null 2>&1; then
            echo "BREACH: the lane read a root-only secret" >&2; breached=1
          else echo "held: secret read refused"; fi
          if as_lane curl --silent --max-time 10 --noproxy '*' https://example.com/ -o /dev/null; then
            echo "BREACH: the lane opened a connection around the egress proxy" >&2; breached=1
          else echo "held: direct connection refused"; fi
          if as_lane curl --silent --fail --max-time 10 https://example.com/ -o /dev/null; then
            echo "BREACH: the proxy let the lane reach a host outside egress_allow" >&2; breached=1
          else echo "held: off-list host refused by the proxy"; fi
          if as_lane bash -c 'env | grep -E "^(GITHUB_TOKEN|ACTIONS_ID_TOKEN_REQUEST_TOKEN|ACTIONS_RUNTIME_TOKEN)="' > /dev/null; then
            echo "BREACH: a runner token is in the lane's environment" >&2; breached=1
          else echo "held: no runner token in the lane's environment"; fi
          if as_lane bash -c 'grep -rqi "extraheader" lane/.git/config trusted/.git/config 2>/dev/null'; then
            echo "BREACH: a checkout kept the repository token" >&2; breached=1
          else echo "held: no checkout kept the token"; fi
          sudo rm -f "$planted"
          exit "$breached"
