# Mirror and attest the third-party images the platform adopts.
#
# Binary Authorization's default rule denies what the platform's attestor has
# not signed. That leaves two ways to run a third-party controller: an
# `exempt_image_patterns` entry, which admits an upstream repository unsigned
# for ever, or this — copy the reviewed digest into the platform's own
# registry, prove the bytes survived the copy, scan them with the same gate
# the platform's images pass, and attest them with the same attestor. The
# policy keeps exactly one rule, and the answer to "which foreign code runs
# on this platform" is the git history of infrastructure/egress/vendored-images.txt.
#
# The identity that signs is the same CI service account deploy.yml signs
# with, holding the same five narrow grants. Deliberately no new identity:
# "the pipeline signs" stays the single doctrine, and the review surface for
# a vendored image is the commit that added its digest to the list.
#
# One image is vendored today: the Envoy egress proxy every Cloud Run service
# that needs egress runs as a sidecar (infrastructure/egress/envoy.yaml,
# modules/egress-proxy). The GitOps controllers this workflow used to mirror
# left with the cluster (ADR 0024).
#
# The copy is done with crane, not docker. `docker pull` of a multi-arch
# index dereferences it to one platform's manifest, and pushing that back
# produces a different digest than was reviewed — the attestation would then
# name bytes the manifest list never mentions. crane copies the index
# byte-for-byte, and the digest-equality check below is what proves it did.
name: vendor

on:
  # A change to the list mirrors into dev automatically — same branch gating
  # as the deploy pipeline's automatic path.
  push:
    branches:
      - "main"
    paths:
      - "infrastructure/egress/vendored-images.txt"
      - ".github/workflows/vendor.yml"
  # Other environments are a person's deliberate act, like deploying to them.
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment's registry and attestor to vendor into."
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - stage
          - prod

permissions:
  contents: read

env:
  TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  CRANE_VERSION: v0.22.0
  CRANE_SHA256: edb74d53fad9a596860f59d1c5d04a43dfb5f441dc71f57060dd0bf39483c833

jobs:
  mirror:
    name: mirror and attest into ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Identical derivation to deploy.yml, for the identical reason: every
      # value authentication and attestation need is a pure function of the
      # committed tfvars, so nothing here can be poisoned by a stale
      # repository variable.
      - name: derive the identity from the tfvars
        id: identity
        run: |
          set -euo pipefail
          # Character set first, before the value names a path or a registry
          # repository. `environment` is a `choice`, so GitHub's own dispatch
          # validation is what normally holds it — and a guard that depends on
          # a validation this file does not perform is a guard on loan.
          # `image.yml` says the same of its own choice input for the same
          # reason: one edit turning `type: choice` into `type: string` arms
          # every use below at once, and the account this workflow holds signs
          # with the environment's attestor.
          case "$TARGET_ENVIRONMENT" in
            ''|*[!a-z0-9-]*)
              echo "environment is not an environment name: lowercase letters, digits and - only." >&2
              exit 1
              ;;
          esac
          tfvars="infrastructure/environments/${TARGET_ENVIRONMENT}/terraform.tfvars"
          [ -f "$tfvars" ] || { echo "no tfvars at $tfvars" >&2; exit 1; }
          project="$(sed -n 's/^project_id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          number="$(sed -n 's/^project_number[[:space:]]*=[[:space:]]*\([0-9]*\)/\1/p' "$tfvars" | head -1)"
          region="$(sed -n 's/^region[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$tfvars" | head -1)"
          [ -n "$region" ] || region="europe-west2"   # the variable's default
          [ -n "$project" ] && [ -n "$number" ] || {
            echo "$tfvars carries no project_id/project_number" >&2
            exit 1
          }
          # The character set of what was read, before any of it is pasted into
          # a gcloud argument or a registry path. `steps.identity.outputs.region`
          # is substituted into the next step's script as source text, so a
          # region carrying a quote and a semicolon is a command rather than a
          # malformed region — and this job holds the key version that signs
          # for the environment's attestor. Emptiness is refused above.
          for value in "$project" "$region"; do
            case "$value" in
              *[!a-z0-9-]*)
                echo "$tfvars names a project or a region containing a character neither can contain: '$value'" >&2
                echo "Permitted: lowercase letters, digits and -" >&2
                exit 1
                ;;
            esac
          done
          # Refused before authenticating, not after. An environment still
          # carrying the marker has no project, so every value derived below —
          # the workload-identity audience, the service account, the attestor,
          # the key version — would be constructed from a name that exists
          # nowhere, and the run would die at the OIDC exchange with a message
          # about an audience rather than about the environment.
          if [ "$project" = "unprovisioned" ]; then
            echo "environment '${TARGET_ENVIRONMENT}' is not provisioned: its tfvars carry the 'unprovisioned' marker." >&2
            echo "Create a project for it (its own, never one another environment uses), record the id and number in $tfvars, then deploy." >&2
            exit 1
          fi
          ring="qip-${TARGET_ENVIRONMENT}"
          {
            echo "project=$project"
            echo "region=$region"
            echo "provider=projects/$number/locations/global/workloadIdentityPools/qip-github-${TARGET_ENVIRONMENT}/providers/github"
            echo "account=qip-ci-${TARGET_ENVIRONMENT}@$project.iam.gserviceaccount.com"
            echo "attestor=${ring}-build"
            echo "key_version=projects/$project/locations/$region/keyRings/$ring/cryptoKeys/${ring}-attestor/cryptoKeyVersions/1"
          } >> "$GITHUB_OUTPUT"

      - name: authenticate without a key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.provider }}
          service_account: ${{ steps.identity.outputs.account }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: let crane push to artifact registry
        run: gcloud auth configure-docker "${{ steps.identity.outputs.region }}-docker.pkg.dev" --quiet

      # Pinned by version and checksum, like every other tool this pipeline
      # downloads. A mirroring tool is exactly the wrong place to trust a
      # moving tag.
      - name: install crane
        run: |
          set -euo pipefail
          curl -sSLo /tmp/crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tar.gz" | sha256sum -c -
          sudo tar -C /usr/local/bin -xzf /tmp/crane.tar.gz crane

      - name: install trivy
        run: |
          set -euo pipefail
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy

      - name: mirror, verify, scan, attest
        id: mirror
        env:
          BINAUTHZ_ATTESTOR: ${{ steps.identity.outputs.attestor }}
          BINAUTHZ_KEY_VERSION: ${{ steps.identity.outputs.key_version }}
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
          GCP_REGION: ${{ steps.identity.outputs.region }}
        run: |
          set -euo pipefail
          prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/qip-${TARGET_ENVIRONMENT}"
          mirrored=0
          # Destinations the CRITICAL gate refused. Collected rather than fatal
          # at the first one, and the run fails on them after the loop; the
          # scan below says why the difference is worth a variable.
          refused=""
          while read -r source dest tag; do
            case "$source" in ""|\#*) continue ;; esac
            source_digest="${source#*@}"
            case "$source_digest" in
              sha256:*) ;;
              *) echo "$source names no sha256 digest; a tag is whatever its owner says it is today." >&2; exit 1 ;;
            esac
            dest_ref="${prefix}/${dest}:${tag}"

            crane copy "$source" "$dest_ref"

            # The property the whole file promises: the bytes in our registry
            # are the bytes that were reviewed. crane preserves the index
            # digest; this is the proof rather than the assumption.
            mirrored_digest="$(crane digest "$dest_ref")"
            if [ "$mirrored_digest" != "$source_digest" ]; then
              echo "the copy of $source arrived as $mirrored_digest; refusing to scan or sign it." >&2
              exit 1
            fi
            image="${prefix}/${dest}@${source_digest}"

            # Two scans, and the split is a policy stated out loud rather
            # than a loophole. The platform's own images gate on
            # CRITICAL,HIGH because they are a static binary on scratch and
            # anything found is in serde's dependency graph. A vendored
            # third-party image is different weather — a distroless Envoy
            # still carries a Go-free but non-trivial dependency surface —
            # and a gate that always fails is not a gate: it is how
            # exempt_image_patterns entries get added. So the full
            # CRITICAL,HIGH report goes in every run's log for the record,
            # and the *blocking* gate is CRITICAL, where every finding is
            # resolved by pinning a newer digest in a new commit. There is
            # deliberately no per-image acknowledgement file any more: the
            # one that existed acknowledged findings in Argo CD's bundled
            # tools, and an acknowledgement written for one build silently
            # covering the next is how a suppression file becomes a
            # blindfold.
            trivy image \
              --severity CRITICAL,HIGH \
              --exit-code 0 \
              --ignore-unfixed \
              "$image"
            # The blocking gate is recorded rather than fatal *on the spot*,
            # and the run still fails at the end. Nothing is softened: an
            # image that fails here is not attested, so Binary Authorization
            # denies it wherever a manifest names it, and the job exits
            # non-zero.
            #
            # What changes is that one refused image no longer starves the
            # rest of the list. Under `set -euo pipefail` the first failing
            # scan ended the whole step, and Argo CD is the first
            # control-plane line — so redis, Kargo, cert-manager's three, the
            # Config Connector operator and the google-cloud-cli were never
            # copied at all. The registry then held no cert-manager images,
            # and `infra.yml`'s bootstrap died on `deployment
            # "cert-manager-webhook" exceeded its progress deadline`: a
            # failure three steps downstream of its cause, naming a component
            # that was never the problem.
            #
            # A gate that also decides which *other* images exist is two
            # controls wearing one name. This is the second one removed.
            if ! trivy image \
              --severity CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              "$image"; then
              echo "::error title=CRITICAL finding::${dest} (${source}) fails the CRITICAL gate; mirrored, not attested."
              refused="${refused} ${dest}"
              continue
            fi

            # The index digest, and every platform manifest under it.
            #
            # Attesting the index alone is what a reviewer would expect to be
            # enough, and on GKE it was: the pod spec names the index and
            # Binary Authorization checks that digest. Cloud Run resolves the
            # index to the manifest for the platform it runs and evaluates
            # *that*, so the first Cloud Run apply was refused —
            #
            #   Image .../vendor/envoy@sha256:c8fecdf5... denied by attestor
            #   qip-dev-build: No attestations found that were valid and
            #   signed by a key trusted by the attestor
            #
            # — naming a digest that appears nowhere in the vendored list,
            # because it is the linux/amd64 child of the digest that does.
            # These are not extra bytes: a child manifest is part of the
            # index that was reviewed, and crane copied the whole index
            # byte-for-byte, so signing the children signs bytes this file's
            # git history already accounts for. A single-manifest source has
            # no children and the loop then signs exactly the one digest, as
            # before.
            children="$(crane manifest "$image" | jq -r '.manifests[]?.digest // empty')"
            for digest in ${source_digest} ${children}; do
              artifact="${prefix}/${dest}@${digest}"
              # Idempotent for the same reason deploy.yml's sign step is:
              # re-running for an unchanged list is normal, and an existing
              # attestation for these exact bytes is success.
              existing=$(gcloud container binauthz attestations list \
                --project "${GCP_PROJECT}" \
                --attestor "${BINAUTHZ_ATTESTOR}" \
                --attestor-project "${GCP_PROJECT}" \
                --artifact-url "${artifact}" \
                --format='value(name)')
              if [ -n "${existing}" ]; then
                echo "${artifact} is already attested."
              elif ! signing="$(gcloud beta container binauthz attestations sign-and-create \
                  --project "${GCP_PROJECT}" \
                  --artifact-url "${artifact}" \
                  --attestor "${BINAUTHZ_ATTESTOR}" \
                  --attestor-project "${GCP_PROJECT}" \
                  --keyversion "${BINAUTHZ_KEY_VERSION}" 2>&1)"; then
                # The lookup above is not sufficient on its own, and run 19
                # is the proof: it returned nothing for a
                # cert-manager-cainjector child and the create then came back
                # `Resource in projects [algorik-dev] is the subject of a
                # conflict: Could not create occurrence ID ...`.
                #
                # An occurrence id is a deterministic function of the attestor
                # and the artifact, so a conflict means an attestation for
                # *these exact bytes by this exact attestor* is already
                # there — which the comment above already calls success. The
                # list is a Container Analysis query and is eventually
                # consistent with the create; two paths to the same fact will
                # disagree for a moment, and the loser must not be a failed
                # deployment.
                #
                # Narrow on purpose. Only a conflict is absorbed: a denied
                # key, a missing attestor or a refused artifact still fails
                # the run, because each of those means nothing was signed.
                case "${signing}" in
                  *"subject of a conflict"*|*"ALREADY_EXISTS"*)
                    echo "${artifact} was attested concurrently; the existing attestation is these bytes signed by this attestor."
                    ;;
                  *)
                    echo "${signing}" >&2
                    exit 1
                    ;;
                esac
              else
                echo "${signing}"
              fi
            done
            mirrored=$((mirrored + 1))
          done < infrastructure/egress/vendored-images.txt
          # The refusal check comes before the empty-run check, because a list
          # whose every line was refused also mirrors nothing and would
          # otherwise be reported as a parse regression — the wrong cause,
          # stated confidently.
          # The refusal is *recorded* here and judged at the end of the job,
          # after the derive step below has had its chance. A base image this
          # pipeline patches is expected to fail this gate — that is why it is
          # patched — and failing the job here would mean the fix could never
          # run. Later is not softer: `the gate's verdict` refuses anything
          # still unresolved, and runs on `always()` so a derive step that
          # dies cannot take its base's judgement down with it.
          echo "${refused}" > "${RUNNER_TEMP}/refused.txt"
          # An empty run means the list parsed to nothing, which is far more
          # likely a format regression than a decision to vendor nothing.
          [ "$mirrored" -gt 0 ] || { echo "no images were mirrored; the list parsed to nothing." >&2; exit 1; }
          echo "mirrored and attested ${mirrored} image(s)."
          [ -z "${refused}" ] || echo "refused by the CRITICAL gate, pending the derive step:${refused}"

      # Build the images whose fix is to remove the vulnerable bytes.
      #
      # An upstream image can carry a finding with no upstream remedy:
      # CVE-2025-68121 lives in two third-party binaries Argo CD *downloads*
      # rather than builds, so no Argo CD release fixes it and no newer
      # kustomize exists to pin. The choice is then to suppress the finding
      # or to remove the bytes. This does the second, and the derived image
      # goes through the identical CRITICAL gate and the identical attestor,
      # so a patch that did not work is refused exactly as its base was.
      - name: derive, scan and attest the patched images
        id: derive
        if: always() && steps.mirror.outcome != 'skipped'
        env:
          BINAUTHZ_ATTESTOR: ${{ steps.identity.outputs.attestor }}
          BINAUTHZ_KEY_VERSION: ${{ steps.identity.outputs.key_version }}
          GCP_PROJECT: ${{ steps.identity.outputs.project }}
          GCP_REGION: ${{ steps.identity.outputs.region }}
        run: |
          set -euo pipefail
          prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/qip-${TARGET_ENVIRONMENT}"
          list=infrastructure/egress/derived-images.txt
          : > "${RUNNER_TEMP}/resolved.txt"
          [ -f "$list" ] || { echo "no derived images declared."; exit 0; }
          resolved=""
          while read -r base dockerfile dest tag; do
            case "$base" in ""|\#*) continue ;; esac
            # The base digest is read out of the reviewed list rather than
            # typed here: one source of truth for what is being patched, so
            # this file and that list cannot disagree.
            base_digest="$(awk -v p="$base" '$2==p {print $1}' infrastructure/egress/vendored-images.txt | head -1)"
            base_digest="${base_digest#*@}"
            case "$base_digest" in
              sha256:*) ;;
              *) echo "$base names no reviewed digest in vendored-images.txt" >&2; exit 1 ;;
            esac
            base_ref="${prefix}/${base}@${base_digest}"
            # The tag carries a fingerprint of everything that determines the
            # bytes: the reviewed base digest and the Dockerfile that patches
            # it. Two reasons, and the second is the one that bit.
            #
            # The registry has tag immutability enabled, so re-pushing a
            # fixed tag fails with `manifest invalid: cannot update tag ...`
            # — run 25 died exactly there, having already built and scanned a
            # perfectly good image. A fingerprinted tag never collides with a
            # different build and always collides with an identical one.
            #
            # And it makes "already built" decidable. A container build is
            # not reproducible byte-for-byte, so rebuilding unchanged inputs
            # would mint a new digest every run and invalidate the digest
            # pinned in the overlays on every single vendor run. With this,
            # the digest moves when the inputs move and not otherwise.
            fingerprint="$( { printf '%s\n' "${base_digest}"; cat "$dockerfile"; } | sha256sum | cut -c1-12)"
            dest_ref="${prefix}/${dest}:${tag}-${fingerprint}"
            if existing_digest="$(crane digest "$dest_ref" 2>/dev/null)" && [ -n "${existing_digest}" ]; then
              echo "${dest_ref} already exists at ${existing_digest}; the base and the Dockerfile are unchanged."
            else
              echo "::group::building ${dest} from ${base}@${base_digest}"
              docker build \
                --build-arg "ARGOCD_BASE=${base_ref}" \
                -f "$dockerfile" \
                -t "$dest_ref" \
                infrastructure/docker
              echo "::endgroup::"
              docker push "$dest_ref"
            fi

            # The same two scans the mirror loop runs, same flags, same
            # order. Run on EVERY pass, including one that skipped the build:
            # a vulnerability database moves under a fixed image, so an
            # image clean last week is not thereby clean today, and a gate
            # that only examines what it just built stops being a gate the
            # moment a build is cached. The blocking one is fatal on the spot
            # here, because there is nothing downstream to catch it.
            trivy image --severity CRITICAL,HIGH --exit-code 0 --ignore-unfixed "$dest_ref"
            trivy image --severity CRITICAL --exit-code 1 --ignore-unfixed "$dest_ref"

            digest="$(crane digest "$dest_ref")"
            case "$digest" in
              sha256:*) ;;
              *) echo "could not read a digest back for ${dest_ref}" >&2; exit 1 ;;
            esac
            artifact="${prefix}/${dest}@${digest}"
            existing=$(gcloud container binauthz attestations list \
              --project "${GCP_PROJECT}" --attestor "${BINAUTHZ_ATTESTOR}" \
              --attestor-project "${GCP_PROJECT}" --artifact-url "${artifact}" \
              --format='value(name)')
            if [ -n "${existing}" ]; then
              echo "${artifact} is already attested."
            elif ! signing="$(gcloud beta container binauthz attestations sign-and-create \
                --project "${GCP_PROJECT}" --artifact-url "${artifact}" \
                --attestor "${BINAUTHZ_ATTESTOR}" --attestor-project "${GCP_PROJECT}" \
                --keyversion "${BINAUTHZ_KEY_VERSION}" 2>&1)"; then
              case "${signing}" in
                *"subject of a conflict"*|*"ALREADY_EXISTS"*)
                  echo "${artifact} was attested concurrently." ;;
                *) echo "${signing}" >&2; exit 1 ;;
              esac
            fi
            resolved="${resolved} ${base}"
            echo "::notice title=derived image ready::${dest} = ${digest}"
            echo "PIN THIS DIGEST in the bootstrap overlay for ${dest}: ${digest}"
          done < "$list"
          echo "${resolved}" > "${RUNNER_TEMP}/resolved.txt"

      # The gate's verdict, once every remedy has had its chance.
      - name: the gate's verdict
        if: always() && steps.mirror.outcome != 'skipped'
        run: |
          set -euo pipefail
          refused="$(cat "${RUNNER_TEMP}/refused.txt" 2>/dev/null || echo '')"
          resolved="$(cat "${RUNNER_TEMP}/resolved.txt" 2>/dev/null || echo '')"
          still=""
          for dest in ${refused}; do
            case " ${resolved} " in
              *" ${dest} "*) echo "${dest} failed the gate and was replaced by an attested derived image." ;;
              *) still="${still} ${dest}" ;;
            esac
          done
          if [ -n "${still}" ]; then
            echo "the CRITICAL gate refused, with no remedy:${still}" >&2
            echo "Each was copied into the registry and deliberately not attested, so Binary" >&2
            echo "Authorization denies it wherever a manifest names it." >&2
            echo "Resolve by removing the vulnerable bytes: a newer upstream digest, or an" >&2
            echo "entry in infrastructure/egress/derived-images.txt so this pipeline builds," >&2
            echo "scans and attests a patched image. Never an ignore file." >&2
            exit 1
          fi
          echo "every vendored image is attested, or superseded by an attested derived image."
