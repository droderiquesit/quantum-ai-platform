# The development-agent boundary, on the pull request (R12 GOV-9067,
# SEC-9068, CICD-9082).
#
# Answers, for every pull request and every review of one: is this change
# agent-authored, and if so does it stay inside the role its commits
# declare, and has a person approved its head commit where it touches a
# protected path? And, for a change with no agent marker that touches a
# protected path, is every commit signed by a person's key or the head
# approved by a person (GOV-9067, ADR 0117)? The rules are
# `scripts/agent-policy.json` and the judge is `scripts/agent-guard.mjs`,
# both read from the default branch — never from
# the pull request, which could otherwise rewrite the rule it is judged by.
#
# It re-runs on `pull_request_review`, because approval is what changes the
# answer and a check that only ran on push would stay red after a person
# approved. Whether this check is *required* before merge is a branch
# protection setting this file cannot create; `deploy.yml`'s gate re-judges
# the deployed commit the same way, so the boundary holds at deployment
# whatever that setting is.
#
# Read-only, no secret, no credential: it reads the pull request through
# the API with the run's own token and checks out no code from the branch.
name: agent boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  boundary:
    name: agent boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: judge the pull request against the agent policy
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$PR" in ''|*[!0-9]*) echo "no pull request number" >&2; exit 1 ;; esac
          case "$HEAD_SHA" in ''|*[!0-9a-f]*) echo "the head is not a commit sha" >&2; exit 1 ;; esac
          work="${RUNNER_TEMP}/agent-boundary"
          mkdir -p "$work"
          flatten='let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.stringify(JSON.parse(s).flat())))'
          gh api --paginate --slurp "repos/${THIS_REPOSITORY}/pulls/${PR}/files?per_page=100" | node -e "$flatten" > "$work/files.json"
          gh api --paginate --slurp "repos/${THIS_REPOSITORY}/pulls/${PR}/commits?per_page=100" | node -e "$flatten" > "$work/commits.json"
          gh api --paginate --slurp "repos/${THIS_REPOSITORY}/pulls/${PR}/reviews?per_page=100" | node -e "$flatten" > "$work/reviews.json"
          node scripts/agent-guard.mjs change --policy scripts/agent-policy.json \
            --head-ref "$HEAD_REF" --head-sha "$HEAD_SHA" \
            --files "$work/files.json" --commits "$work/commits.json" --reviews "$work/reviews.json"
