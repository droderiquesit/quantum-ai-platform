# The TLS-terminating egress proxy: one bootstrap, and the closed list of
# hosts it may reach.
#
# This file is the allowlist. It is read by `file()` in
# `infrastructure/terraform/modules/egress-proxy`, published once per
# environment, and mounted read-only by every rendering of the proxy; there
# is no second copy of it anywhere in the repository, and the acceptance suite
# (`backend/crates/tests/qip-acceptance/tests/egress.rs`) carries its own copy of the
# host list precisely so that widening this one is two edits and a reviewer
# who sees both.
#
# ## The gap this closes
#
# The dependency policy (`scripts/check-dependencies.sh`) permits `serde` and
# `serde_json` and nothing else, so `qip_transport::http` is a hand-written
# HTTP/1.1 client with no TLS stack. It refuses the `https` scheme by name
# rather than downgrading it. Every outbound adapter in the workspace therefore
# says the same thing in its own error message — `qip_quantum::provider`,
# `qip_training::vertex`, `qip_storage::gcp::{storage,bigquery}`,
# `qip_market_ingestion::{rest,depth,narrative,alternative}`,
# `qip_brokers::rest`, `qip_chain::rpc` — and what they all ask for is one
# thing: an `http://host[:port]` next to the process that terminates TLS and
# speaks HTTPS onward. The Kubernetes chart described such a proxy and never
# ran it (its Deployment was committed commented out; ADR 0020's corrections
# record that), so this is the first proxy on this platform that exists.
#
# ## Why it is co-located, and bound to loopback
#
# The proxy is not a service of its own. It runs as a sidecar container in
# the Cloud Run service that needs it, and as a systemd unit beside the
# binary on the execution node, and every listener below binds `127.0.0.1`.
# Two reasons, both structural:
#
#   * A Cloud Run service is reachable only at an HTTPS `run.app` name, which
#     the client refuses by construction, so a proxy that was a service of its
#     own would need a load-balancer tier in front of it that this platform
#     has never built — one forwarding rule per listener, because a URL map
#     routes on host and path and the whole argument below is that the port
#     chooses the destination.
#   * Loopback is a topology rather than a rule. No other workload can reach
#     this proxy at all, in any tier, without a policy existing to forbid it;
#     the control that used to be four NetworkPolicies is now the absence of
#     an address.
#
# ## Why this is a reverse proxy and not a forward proxy
#
# This is the part that decides the whole shape, and it is not a preference.
# `HttpRequest::encode` in `backend/crates/libs/qip-transport/src/http.rs` writes an
# origin-form request line — `GET /storage/v1/... HTTP/1.1` — and a `host:`
# header carrying whatever authority the configured base URL had. It never
# emits `CONNECT`, and it never emits an absolute-form URI. A conventional
# forward proxy has nothing to route on: it would receive a request for a path
# with `host: 127.0.0.1:9101` and no statement of where it was meant to go.
#
# So the destination is chosen here, not by the caller. Each listener below
# has exactly one meaning, the client selects it by connecting to a port, and
# the proxy rewrites the authority and originates TLS. A process cannot reach
# a host by asking for it, because there is no field in the request in which a
# host can be asked for. That is a stronger property than a host allowlist on
# a CONNECT proxy, which is a filter over something the client controls.
#
# ## Why Envoy rather than nginx
#
#   1. `QIP_GCP_ENDPOINT` is a single address for two different vendor hosts.
#      `qip_storage::gcp` builds `/storage/v1/...`, `/upload/storage/v1/...`
#      and `/bigquery/v2/...` against one base URL, so the proxy has to pick
#      the upstream from the path. Envoy's route table does prefix-to-cluster
#      natively.
#   2. Upstream TLS is opt-in and explicit. Envoy will not speak TLS to a
#      cluster that has no `transport_socket`, and a `validation_context` with
#      `match_typed_subject_alt_names` states, per cluster, which certificate
#      name is acceptable. nginx's `proxy_ssl_verify` defaults to `off`: a
#      missing directive there is a proxy that accepts any certificate, which
#      is the failure mode where a TLS-terminating proxy is worse than none.
#   3. The destinations are a closed set of named clusters in one file. There
#      is no configuration below in which Envoy dials a host that is not
#      written here as a `cluster`.
#   4. The distroless image runs as uid 65532 with no shell and needs nothing
#      writable.
#
# ## The allowlist, and where each entry came from
#
# Derived from the adapters, not from a guess about what a trading platform
# might want to reach:
#
#   * `storage.googleapis.com` — named in `qip_storage::gcp::storage`'s own
#     requirement string. Reached through `QIP_GCP_ENDPOINT` on the `gcp`
#     listener, path `/storage/v1/`.
#   * `bigquery.googleapis.com` — named in `qip_storage::gcp::bigquery`'s
#     requirement string. Same listener, path `/bigquery/v2/`.
#   * `europe-west2-aiplatform.googleapis.com` — `qip_training::vertex`
#     documents its upstream as `{region}-aiplatform.googleapis.com`. One
#     region, deliberately not a wildcard: `*-aiplatform.googleapis.com` would
#     be every region including the ones this platform has no data residency
#     story for.
#   * `quantum.cloud.ibm.com` — the endpoint `HostedConfig` carries in
#     `backend/crates/libs/qip-quantum/tests/hosted.rs`, the current IBM
#     Quantum Platform API.
#   * `api.quantum.ibm.com` — the endpoint the same `HostedConfig` carries in
#     `backend/crates/libs/qip-quantum/tests/quantum.rs` and in
#     `backend/crates/services/qip-optimization-engine/tests/optimization.rs`.
#   * `api.frankfurter.app` — named by the shipped manifest of the
#     `frankfurter-ecb-reference-rates` connector,
#     `backend/crates/services/qip-market-ingestion/src/connectors/manifests/frankfurter-ecb-reference-rates.json`,
#     which `connector_feed.rs`'s bridge can open by name. The first
#     destination here that is a vendor rather than a cloud this platform
#     already runs on. Reached through `QIP_CONNECTOR_BASE_URL` on the
#     `frankfurter` listener, path `/latest`, method GET.
#
# ## What is deliberately absent, which matters more than what is present
#
#   * **No venue and no broker.** A route to a venue is a live-order
#     submission path, and every environment's ceiling is `paper_trading`.
#     Adding one is a decision for whoever owns the execution path, taken with
#     `docs/operations/enabling-live-trading.md` open.
#   * **No chain RPC and no prediction venue.** One market-data vendor is
#     present — `api.frankfurter.app` above — and the bar it cleared is the
#     bar for the next one, not a precedent for skipping it: a shipped
#     manifest in this workspace names the host, so nothing was guessed, and
#     its licensing posture was evaluated before the source could be used
#     (`qip-fastbrain/src/licensing.rs`), which is the ordering
#     `.claude/rules/domains/data-and-streaming.md` requires. Putting a
#     hostname nobody has read the licence for into a security control is
#     still the failure this paragraph exists to prevent.
#   * **Not `api.exchange.coinbase.com`**, the other connector this build
#     carries. Its licensing class is `internal` rather than `public`, and
#     the host contains the substring `exchange`, which
#     `modules/egress-proxy/variables.tf` refuses at plan time as a host
#     naming a venue. Configuring that connector is an architecture question
#     about what this proxy may reach, not an edit to this file.
#
# ## One file, every rendering
#
# The same bootstrap is mounted by every workload that carries the proxy, so
# a workload's sidecar declares the IBM listeners whether or not its trust
# zone may reach IBM. What stops a cognition-zone workload reaching IBM is
# the zone's egress firewall (`modules/trust-zones`: only `optimisation` may
# declare an `ibm-quantum` destination), not the absence of a listener. Two
# controls, and the network one is the one that binds today.
#
# ## What this does not close
#
#   * **The proxy sees every request in clear text.** That is what
#     terminating TLS means, and it is the cost of a workspace with no TLS
#     stack. It holds no identity, mounts no secret, has no shell, and logs no
#     header.
#   * **A firewall rule cannot tell one Google API from another.** The
#     restricted VIP carries all of them; the route table above is what
#     distinguishes them. VPC Service Controls would close it and this
#     configuration does not create the perimeter.
#   * **Nothing here checks the vendor's answer.** The adapters do.
# Static configuration only. There is no xDS management server in this
# deployment, and there must not be one added casually: a control plane
# that can push clusters is a control plane that can add destinations, and
# the whole argument for this file being reviewable is that the set of
# reachable hosts is decided in a diff rather than at runtime.
node:
  id: qip-egress
  cluster: qip-egress

admin:
  # Loopback, never an interface address. The admin interface serves
  # `/quitquitquit`, `/config_dump` and a mutable log level; bound to
  # 0.0.0.0 it is an unauthenticated stop button and a dump of every
  # upstream this proxy knows about, reachable by anything with a route to
  # the instance. Loopback means a shell on the instance is required, and
  # the image has no shell.
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    # --- the supervisor's probe target ----------------------------------
    #
    # A separate listener rather than the admin interface's `/ready`. On
    # Cloud Run the sidecar's startup probe hits it, and the workload
    # container is held back until it answers; on the execution node the
    # unit's health check does the same. It answers 200 on one path and 404
    # on everything else, and it forwards to no cluster at all.
    #
    # The one listener here that is not loopback, and the exception is
    # narrow and was paid for. Every listener below binds 127.0.0.1 because
    # only the co-located workload calls it, and that is the whole point of
    # this shape. This one is reached by Cloud Run's startup probe, which is
    # issued from outside the container's network namespace — so against a
    # loopback bind it does not get a 404, it gets nothing:
    #
    #   STARTUP HTTP probe failed 15 times consecutively for container
    #   "qip-egress" on port 9900 path "/healthz". The instance was not
    #   started.
    #   Connection failed with status ERROR_CONNECTION_FAILED.
    #
    # Envoy was up and had loaded this file when that was logged; nothing
    # could reach the socket. The earlier comment here reasoned that "a
    # startup probe runs inside the instance", which is true of the execution
    # node's systemd check and false of Cloud Run's, and the two share this
    # one bootstrap.
    #
    # What the wider bind exposes is this listener and nothing else: it
    # answers 200 on `/healthz`, 404 on every other path, and forwards to no
    # cluster at all, so reaching it buys a caller no route anywhere. Cloud
    # Run does not route ingress to a sidecar's port, and on the execution
    # node the machine has no external address and the firewall is default
    # deny — `no_zone_or_node_has_an_egress_rule_that_bypasses_the_proxy`
    # holds that line separately.
    - name: health
      address:
        socket_address: { address: 0.0.0.0, port_value: 9900 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: health
                route_config:
                  name: health
                  virtual_hosts:
                    - name: health
                      domains: ["*"]
                      routes:
                        - match: { path: "/healthz" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok" }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # --- Google Cloud Storage and BigQuery ------------------------------
    #
    # One listener for two upstreams, because `qip_storage::gcp` gives both
    # adapters the same `QIP_GCP_ENDPOINT` and distinguishes them by path.
    # This is the only listener here with more than one cluster behind it,
    # and the prefixes are the exact ones the adapters build:
    # `CloudStorageBlobStore` writes `/storage/v1/b/{bucket}/o/{object}`
    # and `/upload/storage/v1/b/{bucket}/o`, and `BigQueryWarehouse` writes
    # `/bigquery/v2/projects/{p}/datasets/{d}/tables/{t}/insertAll` and
    # `/bigquery/v2/projects/{p}/queries`.
    #
    # There is no catch-all route. A path this platform does not build gets
    # a 404 from the proxy, which is a loud failure at the boundary rather
    # than a request forwarded somewhere nobody intended.
    - name: gcp
      address:
        socket_address: { address: 127.0.0.1, port_value: 9101 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: gcp
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "egress %UPSTREAM_CLUSTER% %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%ms %BYTES_RECEIVED%/%BYTES_SENT%\n"
                route_config:
                  name: gcp
                  virtual_hosts:
                    - name: gcp
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/storage/v1/" }
                          route:
                            cluster: storage_googleapis_com
                            host_rewrite_literal: storage.googleapis.com
                            timeout: 30s
                        - match: { prefix: "/upload/storage/v1/" }
                          route:
                            cluster: storage_googleapis_com
                            host_rewrite_literal: storage.googleapis.com
                            timeout: 30s
                        - match: { prefix: "/bigquery/v2/" }
                          route:
                            cluster: bigquery_googleapis_com
                            host_rewrite_literal: bigquery.googleapis.com
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # --- Vertex AI ------------------------------------------------------
    - name: vertex
      address:
        socket_address: { address: 127.0.0.1, port_value: 9102 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: vertex
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "egress %UPSTREAM_CLUSTER% %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%ms %BYTES_RECEIVED%/%BYTES_SENT%\n"
                route_config:
                  name: vertex
                  virtual_hosts:
                    - name: vertex
                      domains: ["*"]
                      routes:
                        # `qip_training::vertex` builds `/v1/{parent}/...`
                        # where the parent is
                        # `projects/{p}/locations/{region}`. The prefix is
                        # narrowed to `/v1/projects/` so that the discovery
                        # and IAM surfaces of the same host are not
                        # reachable through this listener.
                        - match: { prefix: "/v1/projects/" }
                          route:
                            cluster: vertex_aiplatform
                            host_rewrite_literal: europe-west2-aiplatform.googleapis.com
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # --- IBM Quantum, current API ---------------------------------------
    - name: ibm-quantum
      address:
        socket_address: { address: 127.0.0.1, port_value: 9103 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ibm_quantum
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "egress %UPSTREAM_CLUSTER% %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%ms %BYTES_RECEIVED%/%BYTES_SENT%\n"
                route_config:
                  name: ibm_quantum
                  virtual_hosts:
                    - name: ibm_quantum
                      domains: ["*"]
                      routes:
                        # A job is submitted and then polled, and
                        # `HostedTransport` bounds the poll count itself.
                        # 60s is longer than the 30s the Google listeners
                        # get because a submit to a queued backend answers
                        # slowly and a timeout here would be reported to
                        # the operator as a failed submit for a job that is
                        # queued and billing.
                        - match: { prefix: "/" }
                          route:
                            cluster: quantum_cloud_ibm_com
                            host_rewrite_literal: quantum.cloud.ibm.com
                            timeout: 60s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # --- IBM Quantum, legacy API ----------------------------------------
    #
    # A second listener rather than a second route on the one above,
    # because the two are different hosts with different certificates and
    # the port is what selects them. This one exists only because
    # `qip-optimization-engine` and `qip-quantum` both carry a
    # `HostedConfig` naming it; it should be deleted the day nothing does.
    - name: ibm-legacy
      address:
        socket_address: { address: 127.0.0.1, port_value: 9104 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ibm_legacy
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "egress %UPSTREAM_CLUSTER% %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%ms %BYTES_RECEIVED%/%BYTES_SENT%\n"
                route_config:
                  name: ibm_legacy
                  virtual_hosts:
                    - name: ibm_legacy
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: api_quantum_ibm_com
                            host_rewrite_literal: api.quantum.ibm.com
                            timeout: 60s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # --- Frankfurter, ECB euro reference rates ---------------------------
    #
    # The first market-data path this platform has had. Chosen for what it
    # does not drag onto the boundary: licensing class `public` and
    # `auth: { scheme: none }`, so nothing crosses this clear-text proxy that
    # a credential could be read out of, and admitting it needed no secret
    # mount. The proxy sees every request in clear text — that is what
    # terminating TLS means — and this is the one upstream where that costs
    # nothing.
    #
    # One route, one prefix. The connector builds exactly one request,
    # `/latest?base=EUR&symbols=USD,GBP,JPY`, from `endpoint.path` and
    # `endpoint.query` in
    # `connectors/manifests/frankfurter-ecb-reference-rates.json`, and its
    # `health_path` is the same `/latest`. There is deliberately no catch-all
    # here — unlike the two IBM listeners, whose `prefix: "/"` predates this
    # discipline — so the rest of the vendor's surface, `/currencies` and the
    # dated endpoints, 404s at the boundary instead of being forwarded
    # somewhere nobody intended.
    #
    # The `:method` matcher is what makes "this path cannot carry an order" a
    # property of the proxy rather than of the vendor's product range.
    # `HttpSourceTransport` issues `Method::Get` and only that
    # (`connector/transport.rs`), so anything else arriving on 9105 is
    # not this connector, and it gets a 404 before a socket is opened
    # upstream. If a legitimate GET ever 404s here, the matcher is the first
    # thing to read — the failure direction is loud and at the boundary,
    # which is the safe one.
    #
    # 30s, matching the Google listeners rather than IBM's 60s: nothing is
    # queued behind this call. It is a single unauthenticated GET of a table
    # the vendor regenerates once a day, polled hourly against a four-day
    # freshness SLA, so an answer abandoned here costs one poll, whereas a
    # long timeout is a thread parked on a vendor nobody has an SLA with.
    - name: frankfurter
      address:
        socket_address: { address: 127.0.0.1, port_value: 9105 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: frankfurter
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "egress %UPSTREAM_CLUSTER% %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%ms %BYTES_RECEIVED%/%BYTES_SENT%\n"
                route_config:
                  name: frankfurter
                  virtual_hosts:
                    - name: frankfurter
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/latest"
                            headers:
                              - name: ":method"
                                string_match: { exact: GET }
                          route:
                            cluster: api_frankfurter_app
                            host_rewrite_literal: api.frankfurter.app
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # --- the destinations ---------------------------------------------------
  #
  # Six clusters, six hosts, and nothing reachable that is not one of
  # them. Each carries its own `UpstreamTlsContext`: without one Envoy
  # speaks plaintext to port 443 and every request fails, which is the safe
  # direction for a missing block to fail in.
  #
  # `match_typed_subject_alt_names` is the part worth not deleting. Without
  # it, verification checks that the certificate chains to a trusted root
  # and nothing about who it was issued to, so any host holding any
  # publicly-trusted certificate satisfies it — which, on a proxy whose job
  # is to carry an API token, means a DNS answer is enough to redirect a
  # credential. With it, a certificate that does not carry the exact name
  # written here is refused and the connection fails closed. If a vendor
  # rotates to a certificate under a different name, the fix is to correct
  # the matcher, never to remove it.
  clusters:
    - name: storage_googleapis_com
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      load_assignment:
        cluster_name: storage_googleapis_com
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: storage.googleapis.com, port_value: 443 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: storage.googleapis.com
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_2
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: { exact: storage.googleapis.com }

    - name: bigquery_googleapis_com
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      load_assignment:
        cluster_name: bigquery_googleapis_com
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: bigquery.googleapis.com, port_value: 443 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: bigquery.googleapis.com
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_2
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: { exact: bigquery.googleapis.com }

    - name: vertex_aiplatform
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      load_assignment:
        cluster_name: vertex_aiplatform
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: europe-west2-aiplatform.googleapis.com, port_value: 443 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: europe-west2-aiplatform.googleapis.com
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_2
            validation_context:
              trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
