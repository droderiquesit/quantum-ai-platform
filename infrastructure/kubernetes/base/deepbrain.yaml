# The Deep Brain: world model, discovery, reasoning, simulation, optimisation
# and learning.
#
# The slow half of the platform. It is the one workload that may call a
# language model, and the one that may not reach a venue — the binary checks
# the second at start-up by refusing to run if any agent it hosts holds a
# market-touching capability.
#
# One replica. The intelligence loop is not horizontally scalable as written:
# two of these would each run the cycle and each write evidence, and the
# duplicate records would be indistinguishable from a replay.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qip-deepbrain
  namespace: qip
  annotations:
    iam.gke.io/gcp-service-account: qip-deepbrain-ENVIRONMENT@PROJECT.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qip-deepbrain
  namespace: qip
  labels:
    app: qip-deepbrain
spec:
  replicas: 1
  # Recreate rather than RollingUpdate: with one replica a rolling update would
  # briefly run two, and two deep brains each running the cycle write two
  # copies of the same evidence.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qip-deepbrain
  template:
    metadata:
      labels:
        app: qip-deepbrain
    spec:
      serviceAccountName: qip-deepbrain
      automountServiceAccountToken: false
      # A cycle that is part way through should finish rather than leave a
      # half-written run behind.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qip-deepbrain
          image: IMAGE_PREFIX/qip-deepbrain:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness and readiness are deliberately different endpoints, and the
          # numbers below are deliberately not the Fast Brain's.
          #
          # /health says the process is alive, and on this node that is the only
          # question a liveness probe may ask. A deep-brain cycle runs research,
          # causal reasoning, simulation and optimisation, and the agents it
          # hosts may consult a language model, so a cycle legitimately takes
          # minutes. A liveness probe that could go red while one is in flight
          # would restart the node in the middle of every long analysis and it
          # would never finish one. failureThreshold is 6 rather than the
          # default 3: at a 30-second period that is three minutes of missed
          # probes before a restart, which is a wedged process rather than a
          # busy one.
          #
          # /ready says the node is worth consulting. It returns 503 while the
          # node is stopping, halted, stalled, persistently failing its cycles,
          # or still warming — that last one being the state with no fast-path
          # equivalent, because until the first cycle lands there is no world
          # model to consult. Note what does NOT make it unready: being slow.
          # initialDelaySeconds is 10 and the node will report `warming` for as
          # long as its first cycle takes, which is correct and needs no
          # startupProbe: readiness failing during warm-up removes the pod from
          # a Service, and liveness is not watching readiness.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            # The health surface this node serves. QIP_API_ADDRESS is not read
            # by this binary — it serves its own listener, not the API's.
            - name: QIP_DEEPBRAIN_HEALTH_ADDRESS
              value: "0.0.0.0:8080"
            - name: QIP_API_ADDRESS
              value: "0.0.0.0:8080"
            - name: QIP_AUTONOMY_CEILING
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: autonomy_ceiling
            - name: QIP_CYCLE_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: cycle_interval_seconds
            - name: QIP_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: log_level
          resources:
            # Burstable rather than Guaranteed: a backtest wants whatever the
            # node has spare, and unlike the fast path it does not care about
            # being throttled for a few milliseconds.
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /var/lib/qip
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # Scratch space for a simulation run. Bounded, and emptyDir rather than
        # a claim on purpose: nothing written here is authoritative, and
        # anything that is goes to the evidence bucket.
        - name: work
          emptyDir:
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qip-deepbrain
  namespace: qip
spec:
  selector:
    app: qip-deepbrain
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qip-deepbrain
  namespace: qip
spec:
  # maxUnavailable rather than minAvailable, because this workload has one
  # replica: `minAvailable: 1` on a single replica means no voluntary eviction
  # is ever allowed, which makes the node it lands on undrainable and turns
  # every cluster upgrade into an incident.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: qip-deepbrain
