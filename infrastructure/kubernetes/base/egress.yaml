# The TLS-terminating egress proxy, and the closed list of hosts it may reach.
#
# ## The gap this closes
#
# The dependency policy (`scripts/check-dependencies.sh`) permits `serde` and
# `serde_json` and nothing else, so `qip_transport::http` is a hand-written
# HTTP/1.1 client with no TLS stack. It refuses the `https` scheme by name
# rather than downgrading it. Every outbound adapter in the workspace therefore
# says the same thing in its own error message — `qip_quantum::provider`,
# `qip_training::vertex`, `qip_storage::gcp::{storage,bigquery}`,
# `qip_market_ingestion::{rest,depth,narrative,alternative}`,
# `qip_brokers::rest`, `qip_chain::rpc` — and what they all ask for is one
# thing: an `http://host[:port]` inside the cluster that terminates TLS and
# speaks HTTPS onward. Nothing in `infrastructure/` provided one, so every one
# of those adapters is inert in a deployed cluster: not failing, not falling
# back, refusing at construction and saying why.
#
# ## Why this is a reverse proxy and not a forward proxy
#
# This is the part that decides the whole shape, and it is not a preference.
# `HttpRequest::encode` in `crates/libs/qip-transport/src/http.rs` writes an
# origin-form request line — `GET /storage/v1/... HTTP/1.1` — and a `host:`
# header carrying whatever authority the configured base URL had. It never
# emits `CONNECT`, and it never emits an absolute-form URI. A conventional
# forward proxy has nothing to route on: it would receive a request for a path
# with `host: qip-egress.qip.svc.cluster.local:9101` and no statement of where
# it was meant to go.
#
# So the destination is chosen here, not by the caller. Each listener below has
# exactly one meaning, the client selects it by connecting to a port, and the
# proxy rewrites the authority and originates TLS. A pod cannot reach a host by
# asking for it, because there is no field in the request in which a host can
# be asked for. That is a stronger property than a host allowlist on a
# CONNECT proxy, which is a filter over something the client controls.
#
# ## Why Envoy rather than nginx
#
# Four reasons, in the order they mattered:
#
#   1. `QIP_GCP_ENDPOINT` is a single address for two different vendor hosts.
#      `qip_storage::gcp` builds `/storage/v1/...`, `/upload/storage/v1/...`
#      and `/bigquery/v2/...` against one base URL, so the proxy has to pick
#      the upstream from the path. Envoy's route table does prefix-to-cluster
#      natively; nginx would need a `location` block per prefix with a literal
#      `proxy_pass`, which works and is harder to read as a list of permitted
#      destinations.
#   2. Upstream TLS is opt-in and explicit. Envoy will not speak TLS to a
#      cluster that has no `transport_socket`, and a `validation_context` with
#      `match_typed_subject_alt_names` states, per cluster, which certificate
#      name is acceptable. nginx's `proxy_ssl_verify` defaults to `off`: a
#      missing directive there is a proxy that accepts any certificate, which
#      is the failure mode where a TLS-terminating proxy is worse than none —
#      the credential is encrypted to whoever answered.
#   3. The destinations are a closed set of named clusters in one file. There
#      is no configuration below in which Envoy dials a host that is not
#      written here as a `cluster`.
#   4. The published image runs as uid 65532 with no shell and needs nothing
#      writable, which is what `readOnlyRootFilesystem: true` and the
#      namespace's `restricted` pod security standard require. The official
#      nginx image starts as root and needs `/var/cache/nginx` writable.
#
# ## The allowlist, and where each entry came from
#
# Derived from the adapters, not from a guess about what a trading platform
# might want to reach:
#
#   * `storage.googleapis.com` — named in
#     `qip_storage::gcp::storage`'s own requirement string. Reached through
#     `QIP_GCP_ENDPOINT` on the `gcp` listener, path `/storage/v1/`.
#   * `bigquery.googleapis.com` — named in `qip_storage::gcp::bigquery`'s
#     requirement string. Same listener, path `/bigquery/v2/`.
#   * `europe-west2-aiplatform.googleapis.com` — `qip_training::vertex`
#     documents its upstream as `{region}-aiplatform.googleapis.com`, and all
#     four files in `infrastructure/environments` set `region = "europe-west2"`.
#     A deployment in another region edits this one line and the SNI beside it;
#     it is deliberately not a wildcard, because `*-aiplatform.googleapis.com`
#     would be every region including the ones this platform has no data
#     residency story for.
#   * `quantum.cloud.ibm.com` — the endpoint `HostedConfig` carries in
#     `crates/libs/qip-quantum/tests/hosted.rs`, which is the current IBM
#     Quantum Platform API.
#   * `api.quantum.ibm.com` — the endpoint the same `HostedConfig` carries in
#     `crates/libs/qip-quantum/tests/quantum.rs` and in
#     `crates/services/qip-optimization-engine/tests/optimization.rs`. Two
#     entries rather than one because two are configured in the workspace, and
#     an allowlist that omits one of them turns a working configuration into a
#     404 from a proxy the operator will not think to suspect.
#
# ## What is deliberately absent, which matters more than what is present
#
#   * **No venue and no broker.** `qip_brokers::rest` and the edge node's
#     `QIP_SANDBOX_VENUE_ENDPOINT` / `QIP_DROP_COPY_ENDPOINT` also want a
#     TLS-terminating proxy, and they are not here. A route from this cluster
#     to a venue is a live-order submission path, and the shipped autonomy
#     ceiling in `config.yaml` is `paper_trading`. Adding one is a decision for
#     whoever owns the execution path, taken with
#     `docs/operations/enabling-live-trading.md` open, and not a side effect of
#     a commit about egress.
#   * **No market-data vendor.** `qip_market_ingestion` ships
#     `LicensingClass::Synthetic` data and every adapter's `base_url` is
#     `None`. There is no vendor host anywhere in the workspace to derive, and
#     inventing one would put a hostname nobody has a licence for into a
#     security control.
#   * **No chain RPC and no prediction venue.** `QIP_CHAIN_RPC_ENDPOINT` and
#     `QIP_PREDICTION_API_ENDPOINT` name provider-specific addresses that exist
#     in no file here. Same reasoning: an allowlist entry that was guessed is
#     an allowlist entry that is wrong.
#
# Each of those is a listener somebody will want to add. The shape to copy is
# the one below: one listener, one cluster, one upstream host, one SNI, one
# subject-alternative-name matcher. Do not add a second upstream to an existing
# listener unless the paths distinguish them the way `gcp` does.
#
# ## What is committed live here, and what is not
#
# Everything except the pod. The bootstrap, the Service, and the network
# policies are applied by the pipeline; the ServiceAccount, Deployment and
# PodDisruptionBudget are written out in full at the foot of this file and
# committed commented out, in the same shape and for the same kind of reason as
# the VolumeSnapshotClass in `journal-storage.yaml` and the
# VerticalPodAutoscaler in `deepbrain.yaml`. The four things that must be true
# before uncommenting are listed there. They are all edits to files this change
# does not own, and `docs/operations/egress.md` carries them as a procedure.
#
# A Service with no endpoints and policies permitting a flow to a pod that does
# not exist are inert, and that is the point: the allowlist is reviewable now,
# in a diff, rather than written under time pressure on the day somebody has a
# vendor contract in hand.
---
# The bootstrap. This file *is* the allowlist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qip-egress-envoy
  namespace: qip
  labels:
    app.kubernetes.io/part-of: qip
    app.kubernetes.io/component: egress
data:
  envoy.yaml: |
    # Static configuration only. There is no xDS management server in this
    # deployment, and there must not be one added casually: a control plane
    # that can push clusters is a control plane that can add destinations, and
    # the whole argument for this file being reviewable is that the set of
    # reachable hosts is decided in a diff rather than at runtime.
    node:
      id: qip-egress
      cluster: qip-egress

    admin:
      # Loopback, never the pod address. The admin interface serves
      # `/quitquitquit`, `/config_dump` and a mutable log level; bound to
      # 0.0.0.0 it is an unauthenticated stop button and a dump of every
      # upstream this proxy knows about, reachable by anything the network
      # policy lets in. Loopback means a shell in this container is required,
      # and this image has no shell.
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }

    static_resources:
      listeners:
        # --- the kubelet's probe target -------------------------------------
        #
        # A separate listener rather than the admin interface's `/ready`,
        # because reaching the admin interface from the kubelet would mean
        # binding admin to the pod address, which the note above refuses. This
        # one answers 200 on one path and 404 on everything else, and it
        # forwards to no cluster at all.
        - name: health
          address:
            socket_address: { address: 0.0.0.0, port_value: 9900 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: health
                    route_config:
                      name: health
                      virtual_hosts:
                        - name: health
                          domains: ["*"]
                          routes:
                            - match: { path: "/healthz" }
                              direct_response:
                                status: 200
                                body: { inline_string: "ok" }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        # --- Google Cloud Storage and BigQuery ------------------------------
        #
        # One listener for two upstreams, because `qip_storage::gcp` gives both
        # adapters the same `QIP_GCP_ENDPOINT` and distinguishes them by path.
        # This is the only listener here with more than one cluster behind it,
        # and the prefixes are the exact ones the adapters build:
        # `CloudStorageBlobStore` writes `/storage/v1/b/{bucket}/o/{object}`
        # and `/upload/storage/v1/b/{bucket}/o`, and `BigQueryWarehouse` writes
        # `/bigquery/v2/projects/{p}/datasets/{d}/tables/{t}/insertAll` and
        # `/bigquery/v2/projects/{p}/queries`.
        #
        # There is no catch-all route. A path this platform does not build gets
        # a 404 from the proxy, which is a loud failure at the boundary rather
        # than a request forwarded somewhere nobody intended.
        - name: gcp
          address:
            socket_address: { address: 0.0.0.0, port_value: 9101 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: gcp
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            text_format_source:
                              inline_string: "egress %UPSTREAM_CLUSTER% %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%ms %BYTES_RECEIVED%/%BYTES_SENT%\n"
                    route_config:
                      name: gcp
                      virtual_hosts:
                        - name: gcp
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/storage/v1/" }
                              route:
                                cluster: storage_googleapis_com
                                host_rewrite_literal: storage.googleapis.com
                                timeout: 30s
                            - match: { prefix: "/upload/storage/v1/" }
                              route:
                                cluster: storage_googleapis_com
                                host_rewrite_literal: storage.googleapis.com
                                timeout: 30s
                            - match: { prefix: "/bigquery/v2/" }
                              route:
                                cluster: bigquery_googleapis_com
                                host_rewrite_literal: bigquery.googleapis.com
                                timeout: 30s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        # --- Vertex AI ------------------------------------------------------
        - name: vertex
          address:
            socket_address: { address: 0.0.0.0, port_value: 9102 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: vertex
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            text_format_source:
                              inline_string: "egress %UPSTREAM_CLUSTER% %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%ms %BYTES_RECEIVED%/%BYTES_SENT%\n"
                    route_config:
                      name: vertex
                      virtual_hosts:
                        - name: vertex
                          domains: ["*"]
                          routes:
                            # `qip_training::vertex` builds `/v1/{parent}/...`
                            # where the parent is
                            # `projects/{p}/locations/{region}`. The prefix is
                            # narrowed to `/v1/projects/` so that the discovery
                            # and IAM surfaces of the same host are not
                            # reachable through this listener.
                            - match: { prefix: "/v1/projects/" }
                              route:
                                cluster: vertex_aiplatform
                                host_rewrite_literal: europe-west2-aiplatform.googleapis.com
                                timeout: 30s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        # --- IBM Quantum, current API ---------------------------------------
        - name: ibm-quantum
          address:
            socket_address: { address: 0.0.0.0, port_value: 9103 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ibm_quantum
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            text_format_source:
                              inline_string: "egress %UPSTREAM_CLUSTER% %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%ms %BYTES_RECEIVED%/%BYTES_SENT%\n"
                    route_config:
                      name: ibm_quantum
                      virtual_hosts:
                        - name: ibm_quantum
                          domains: ["*"]
                          routes:
                            # A job is submitted and then polled, and
                            # `HostedTransport` bounds the poll count itself.
                            # 60s is longer than the 30s the Google listeners
                            # get because a submit to a queued backend answers
                            # slowly and a timeout here would be reported to
                            # the operator as a failed submit for a job that is
                            # queued and billing.
                            - match: { prefix: "/" }
                              route:
                                cluster: quantum_cloud_ibm_com
                                host_rewrite_literal: quantum.cloud.ibm.com
                                timeout: 60s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        # --- IBM Quantum, legacy API ----------------------------------------
        #
        # A second listener rather than a second route on the one above,
        # because the two are different hosts with different certificates and
        # the port is what selects them. This one exists only because
        # `qip-optimization-engine` and `qip-quantum` both carry a
        # `HostedConfig` naming it; it should be deleted the day nothing does.
        - name: ibm-legacy
          address:
            socket_address: { address: 0.0.0.0, port_value: 9104 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ibm_legacy
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            text_format_source:
                              inline_string: "egress %UPSTREAM_CLUSTER% %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%ms %BYTES_RECEIVED%/%BYTES_SENT%\n"
                    route_config:
                      name: ibm_legacy
                      virtual_hosts:
                        - name: ibm_legacy
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route:
                                cluster: api_quantum_ibm_com
                                host_rewrite_literal: api.quantum.ibm.com
                                timeout: 60s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      # --- the destinations ---------------------------------------------------
      #
      # Five clusters, five hosts, and nothing reachable that is not one of
      # them. Each carries its own `UpstreamTlsContext`: without one Envoy
      # speaks plaintext to port 443 and every request fails, which is the safe
      # direction for a missing block to fail in.
      #
      # `match_typed_subject_alt_names` is the part worth not deleting. Without
      # it, verification checks that the certificate chains to a trusted root
      # and nothing about who it was issued to, so any host holding any
      # publicly-trusted certificate satisfies it — which, on a proxy whose job
      # is to carry an API token, means a DNS answer is enough to redirect a
      # credential. With it, a certificate that does not carry the exact name
      # written here is refused and the connection fails closed. If a vendor
      # rotates to a certificate under a different name, the fix is to correct
      # the matcher, never to remove it.
      clusters:
        - name: storage_googleapis_com
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          connect_timeout: 5s
          load_assignment:
            cluster_name: storage_googleapis_com
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: storage.googleapis.com, port_value: 443 }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: storage.googleapis.com
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                validation_context:
                  trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: { exact: storage.googleapis.com }

        - name: bigquery_googleapis_com
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          connect_timeout: 5s
          load_assignment:
            cluster_name: bigquery_googleapis_com
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: bigquery.googleapis.com, port_value: 443 }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: bigquery.googleapis.com
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                validation_context:
                  trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: { exact: bigquery.googleapis.com }

        - name: vertex_aiplatform
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          connect_timeout: 5s
          load_assignment:
            cluster_name: vertex_aiplatform
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: europe-west2-aiplatform.googleapis.com, port_value: 443 }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: europe-west2-aiplatform.googleapis.com
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                validation_context:
                  trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: { exact: europe-west2-aiplatform.googleapis.com }

        - name: quantum_cloud_ibm_com
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          connect_timeout: 5s
          load_assignment:
            cluster_name: quantum_cloud_ibm_com
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: quantum.cloud.ibm.com, port_value: 443 }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: quantum.cloud.ibm.com
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                validation_context:
                  trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: { exact: quantum.cloud.ibm.com }

        - name: api_quantum_ibm_com
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          connect_timeout: 5s
          load_assignment:
            cluster_name: api_quantum_ibm_com
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: api.quantum.ibm.com, port_value: 443 }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: api.quantum.ibm.com
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                validation_context:
                  trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher: { exact: api.quantum.ibm.com }
---
# The addresses the adapters are configured with.
#
# A named resource rather than a literal in each Deployment, for the reason
# `config.yaml` gives about the autonomy ceiling: changing where a workload
# sends its outbound traffic should appear in a diff and in an audit log, in
# one place, rather than being a string repeated across four manifests that
# drift.
#
# Every value is `http`, and that is the contract rather than an oversight.
# `qip_transport::http` refuses `https` by name, so an operator who "fixes"
# one of these to point straight at the vendor gets a construction error naming
# the variable — which is the correct failure, because the alternative is an
# API token crossing the internet in clear text.
#
# The keys are snake_case to match `qip-config`; the comment on each names the
# environment variable a Deployment should bind it to, because those two names
# are set in different files and the pairing is the thing that gets lost.
#
# Nothing consumes this yet. Wiring it means adding a `configMapKeyRef` to
# `api.yaml` and `deepbrain.yaml`, which this change does not own — the
# procedure is in docs/operations/egress.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qip-egress-endpoints
  namespace: qip
  labels:
    app.kubernetes.io/part-of: qip
    app.kubernetes.io/component: egress
data:
  # Bind to QIP_GCP_ENDPOINT. Read by `qip_storage::gcp::GcpAccess`, and shared
  # by the Cloud Storage and BigQuery adapters — the proxy tells them apart by
  # path, which is why there is one address here and not two.
  gcp_endpoint: "http://qip-egress.qip.svc.cluster.local:9101"

  # `qip_training::vertex::VertexTransport::base_url`. No environment variable
  # names it today: nothing in the workspace constructs a `VertexTransport`,
  # so the composition root that eventually does is the thing that will choose
  # the variable. The address is here so that when it does, the answer is not
  # invented at the keyboard.
  vertex_endpoint: "http://qip-egress.qip.svc.cluster.local:9102"

  # `qip_quantum::provider::HostedTransport::base_url`, current API.
  ibm_quantum_endpoint: "http://qip-egress.qip.svc.cluster.local:9103"

  # The same field against the legacy API, for a `HostedConfig` that still
  # names `api.quantum.ibm.com`.
  ibm_quantum_legacy_endpoint: "http://qip-egress.qip.svc.cluster.local:9104"
---
# One Service, one port per destination.
#
# The port is the destination selector, which is the whole security argument
# for this design: a workload permitted to reach 9101 can reach Cloud Storage
# and BigQuery and has no way to express a wish to reach anything else, and a
# NetworkPolicy can say that in a form Kubernetes actually enforces. A single
# port with host-based routing would have moved the choice into a header the
# client controls.
#
# The health listener is deliberately not published here. The kubelet probes
# the pod directly, and a probe endpoint on the Service is a thing that ends up
# in a load balancer.
apiVersion: v1
kind: Service
metadata:
  name: qip-egress
  namespace: qip
  labels:
    app.kubernetes.io/part-of: qip
    app.kubernetes.io/component: egress
spec:
  selector:
    app: qip-egress
  ports:
    - name: gcp
      port: 9101
      targetPort: gcp
    - name: vertex
      port: 9102
      targetPort: vertex
    - name: ibm-quantum
      port: 9103
      targetPort: ibm-quantum
    - name: ibm-legacy
      port: 9104
      targetPort: ibm-legacy
---
# Who may reach the proxy, and on which port.
#
# Named per workload rather than as one rule with three selectors, because the
# interesting part is the asymmetry: the deep brain gets everything, the API
# gets storage only, and two workloads get nothing at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-proxy-ingress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-egress
  policyTypes:
    - Ingress
  ingress:
    # The deep brain is the research workload: it is the one that may call a
    # language model at all (ADR 0008), it hosts the training port that reaches
    # Vertex, and it holds the analytical and evidence stores. It is therefore
    # the only workload with a route to every listener.
    - from:
        - podSelector:
            matchLabels:
              app: qip-deepbrain
      ports:
        - protocol: TCP
          port: 9101
        - protocol: TCP
          port: 9102
        - protocol: TCP
          port: 9103
        - protocol: TCP
          port: 9104
    # The API writes the audit chain and reads it back. Storage and BigQuery,
    # nothing else: it has no reason to submit a training job or a quantum
    # circuit, and a port it cannot reach is a capability it cannot be tricked
    # into using.
    - from:
        - podSelector:
            matchLabels:
              app: qip-api
      ports:
        - protocol: TCP
          port: 9101
    # Absent, and each absence is the point:
    #
    #   * `qip-fastbrain`. It links `qip-ai` transitively through `qip-kernel`
    #     and `qip-agents`, so the only things stopping the fast path
    #     consulting a model are its start-up roster check and the fact that it
    #     can reach nothing that serves one. Port 9102 is exactly such a thing.
    #     ADR 0008, consequence 3, is why this rule does not exist, and
    #     `the_fast_brain_cannot_reach_anything_that_could_serve_a_language_model`
    #     in the acceptance suite is what fails if somebody adds it to
    #     `allow-fastbrain-egress` instead.
    #   * `qip-edge-node`. A cell is deliberately independent and reaches the
    #     central plane's API and its venues and nothing else. A shared egress
    #     proxy in the central plane is a dependency that a partition cuts, on
    #     the one workload whose whole design is that a partition does not stop
    #     it.
---
# Where the proxy itself may go.
#
# Private Google access only: one /30 that carries every Google API, reached
# without leaving the VPC. It is the same range `allow-api-egress` and
# `allow-deepbrain-egress` already use, and the same limitation applies — a
# NetworkPolicy cannot tell `storage.googleapis.com` from
# `aiplatform.googleapis.com`, and closing that needs the VPC Service Controls
# perimeter `docs/operations/external-dependencies.md` names.
#
# What does distinguish them here is the Envoy route table above, which is a
# different kind of control and worth being explicit about: the network layer
# says "this /30", the proxy config says "these five hosts and these paths",
# and a pod holds neither. Two independent statements, both of which have to be
# wrong before a pod reaches somewhere it should not.
#
# Deliberately *not* `0.0.0.0/0` with the private ranges excepted, which is the
# shape a general forward proxy would need. A pod that can reach the internet
# can exfiltrate the position history it was trained on, and this pod is
# reachable from two workloads that hold credentials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-proxy-google
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-egress
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 199.36.153.8/30
      ports:
        - protocol: TCP
          port: 443
---
# The API's route to the proxy.
#
# A second policy rather than an edit to `allow-api-egress`, because network
# policies are additive and the existing rule is load-bearing for three
# different flows. Splitting the egress proxy out means the day somebody
# revokes it, the revocation is a deleted document rather than a careful edit
# inside a rule that also carries the API's route to the brains.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress-to-proxy
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: qip-egress
      ports:
        - protocol: TCP
          port: 9101
---
# The deep brain's route to the proxy. Same reasoning as the API's above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-deepbrain-egress-to-proxy
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-deepbrain
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: qip-egress
      ports:
        - protocol: TCP
          port: 9101
        - protocol: TCP
          port: 9102
        - protocol: TCP
          port: 9103
        - protocol: TCP
          port: 9104
# ---------------------------------------------------------------------------
# The pod, and the four things that must be true before it can be committed
# live.
#
# This is written out in full rather than left to be reinvented, and it is
# commented out rather than applied, because every one of the four is an edit
# to a file this change does not own. Committing it live today does not produce
# a proxy; it produces four failing acceptance tests and a rollout that reports
# success for a workload nobody waited on.
#
#   1. **A Binary Authorization exemption.** The cluster enforces the
#      project's singleton policy, and `modules/binaryauthorization` gives
#      that policy a default rule and a cluster rule of `REQUIRE_ATTESTATION`
#      with `ENFORCED_BLOCK_AND_AUDIT_LOG`. The image
#      below is published by the Envoy project and this pipeline has never
#      signed it, so admission refuses it and the ReplicaSet reports
#      `FAILED_PRECONDITION` on every attempt.
#
#      The module already has the correct mechanism —
#      `var.exempt_image_patterns`, whose validation refuses `*` and `*/*`
#      precisely so that the fix for this is not "turn the policy off". Nothing
#      passes it: the root module calls `modules/binaryauthorization` without
#      the argument, so it takes the empty default. Closing that is a variable
#      in `infrastructure/terraform/variables.tf`, one argument in
#      `infrastructure/terraform/main.tf`, and one line per environment file:
#
#        exempt_image_patterns = ["docker.io/envoyproxy/envoy"]
#
#      Name the repository and not a prefix above it. `docker.io/envoyproxy`
#      would admit anything that organisation ever publishes under any name.
#
#      The alternative that needs no exemption is to mirror this exact digest
#      into the platform's own Artifact Registry and have the pipeline attest
#      it. That is better — it makes the platform's signature the only thing
#      admission trusts — and it is a change to `deploy.yml`, which this change
#      also does not own.
#
#   2. **A rollout entry.** `deploy.yml` waits on
#      `deployment/qip-api deployment/qip-fastbrain deployment/qip-deepbrain`,
#      and `the_rollout_waits_on_every_workload_the_pipeline_applies` checks
#      both directions of that correspondence. `deployment/qip-egress` joins
#      the list in the same commit that uncomments this.
#
#   3. **Two acceptance exemptions.** `every_manifest_pulls_from_the_repository
#      _the_pipeline_pushes_to` requires every workload image to be pulled
#      from the prefix the pipeline pushes to, at the commit being deployed,
#      and
#      `every_deployment_runs_a_binary_that_exists` requires the image to name
#      a binary this workspace builds. A third-party proxy is neither, and both
#      tests are correct about first-party workloads — the suite is written on
#      the assumption that everything scheduled here is a binary this pipeline
#      built and signed, and this pod is the first thing that is not. Whoever
#      lands it records that decision where the other deployment exclusions
#      live, in `docs/adr/0010-what-gets-deployed.md`, and adds the exemption
#      beside `NOT_IN_THE_IMAGE_MATRIX` rather than loosening the check.
#
#   4. **A service account.** `every_service_account_terraform_creates_is_used
#      _by_exactly_one_workload` requires a workload's `serviceAccountName` to
#      be one the root module's `service_accounts` map creates. `qip-egress`
#      needs a Kubernetes service account and *no* Google one: this pod
#      authenticates to nothing, holds no credential, and reads no secret. That
#      is unlike every other workload here and is the reason the map needs a
#      deliberate entry rather than a copied one.
#
# On the image: pinned by digest, and the digest is the multi-architecture
# index digest for `distroless-v1.38.3` so that the tag is documentation and
# the digest is the thing admission and the kubelet actually resolve. A tag is
# a name somebody can move; an admission policy that trusts a tag is trusting
# whoever can push it. The distroless variant runs as uid 65532, has no shell,
# and carries the CA bundle at `/etc/ssl/certs/ca-certificates.crt` that the
# clusters above verify against.
#
# apiVersion: v1
# kind: ServiceAccount
# metadata:
#   name: qip-egress
#   namespace: qip
#   labels:
#     app.kubernetes.io/part-of: qip
#     app.kubernetes.io/component: egress
#   # No `iam.gke.io/gcp-service-account` annotation, deliberately. Every other
#   # workload here binds to a Google identity through workload identity; this
#   # one must not. It carries no credential, calls no Google API on its own
#   # behalf, and forwards a bearer token its client supplied. Binding it to a
#   # Google identity would give the one pod that talks to the internet an
#   # identity in the project.
# ---
# apiVersion: apps/v1
# kind: Deployment
# metadata:
#   name: qip-egress
#   namespace: qip
#   labels:
#     app: qip-egress
# spec:
#   # Two, and here that is a straightforward availability decision rather than
#   # the argument the brains have. This pod holds no state, consumes no feed
#   # and writes no journal, so two of them cannot diverge — there is nothing
#   # to diverge. What two buys is that a node drain does not take the only
#   # route to Cloud Storage away from the workload writing the audit chain.
#   replicas: 2
#   strategy:
#     type: RollingUpdate
#     rollingUpdate:
#       maxUnavailable: 0
#       maxSurge: 1
#   selector:
#     matchLabels:
#       app: qip-egress
#   template:
#     metadata:
#       labels:
#         app: qip-egress
#       annotations:
#         # Roll the pods when the allowlist changes. Envoy reads its bootstrap
#         # once at start-up, so without this a change to the ConfigMap above
#         # updates the projected file and changes nothing about what the
#         # running proxy will reach — a revoked destination that is still
#         # reachable, with a diff saying it was revoked.
#         qip.dev/config-checksum: "set by the operator or by kustomize; see docs/operations/egress.md"
#     spec:
#       serviceAccountName: qip-egress
#       automountServiceAccountToken: false
#       terminationGracePeriodSeconds: 30
#       topologySpreadConstraints:
#         - maxSkew: 1
#           topologyKey: topology.kubernetes.io/zone
#           # ScheduleAnyway, for the reason every other manifest here gives: a
#           # hard skew on a three-zone pool refuses to place a replacement pod
#           # during the outage that made it necessary.
#           whenUnsatisfiable: ScheduleAnyway
#           labelSelector:
#             matchLabels:
#               app: qip-egress
#       securityContext:
#         runAsNonRoot: true
#         # 65532 because that is the uid the distroless image was built with.
#         # Not 10001 like the platform's own images: the config and the CA
#         # bundle in this image are readable by any uid, but matching the image
#         # is what keeps a future layer that does care from breaking silently.
#         runAsUser: 65532
#         runAsGroup: 65532
#         fsGroup: 65532
#         seccompProfile:
#           type: RuntimeDefault
#       containers:
#         - name: envoy
#           image: docker.io/envoyproxy/envoy:distroless-v1.38.3@sha256:574348fada8eb1130b448132287d76626dfb07525b16668075382f8e154a45a8
#           imagePullPolicy: IfNotPresent
#           args:
#             - "-c"
#             - "/etc/envoy/envoy.yaml"
#             - "--service-cluster"
#             - "qip-egress"
#             # Warn, not info. An info-level Envoy logs a line per connection,
#             # and the access log above already carries what an operator needs
#             # without carrying a path or a header — which is where a query
#             # string with an API key in it would end up in the log archive.
#             - "--log-level"
#             - "warn"
#           ports:
#             - name: gcp
#               containerPort: 9101
#             - name: vertex
#               containerPort: 9102
#             - name: ibm-quantum
#               containerPort: 9103
#             - name: ibm-legacy
#               containerPort: 9104
#             - name: health
#               containerPort: 9900
#           securityContext:
#             allowPrivilegeEscalation: false
#             readOnlyRootFilesystem: true
#             capabilities:
#               drop: ["ALL"]
#           # Both probes hit the dedicated health listener rather than the
#           # admin interface, which is bound to loopback. They answer the same
#           # question here, unlike the brains': this process either has its
#           # listeners up or it does not, and there is no state in which it is
#           # alive and should not be sent work.
#           livenessProbe:
#             httpGet:
#               path: /healthz
#               port: health
#             initialDelaySeconds: 3
#             periodSeconds: 10
#           readinessProbe:
#             httpGet:
#               path: /healthz
#               port: health
#             initialDelaySeconds: 1
#             periodSeconds: 5
#           resources:
#             requests:
#               cpu: "100m"
#               memory: 128Mi
#             limits:
#               cpu: "500m"
#               memory: 256Mi
#           volumeMounts:
#             - name: bootstrap
#               mountPath: /etc/envoy
#               readOnly: true
#             - name: tmp
#               mountPath: /tmp
#       volumes:
#         - name: bootstrap
#           configMap:
#             name: qip-egress-envoy
#         # The root filesystem is read-only, so anything needing to write gets
#         # an explicit, size-bounded volume.
#         - name: tmp
#           emptyDir:
#             sizeLimit: 16Mi
# ---
# apiVersion: policy/v1
# kind: PodDisruptionBudget
# metadata:
#   name: qip-egress
#   namespace: qip
# spec:
#   # maxUnavailable rather than minAvailable, matching the rest of this
#   # repository: at two replicas either would permit a drain, and this one
#   # keeps permitting it if somebody drops the count to one, instead of making
#   # that pod undrainable and stalling the next node auto-upgrade.
#   maxUnavailable: 1
#   selector:
#     matchLabels:
#       app: qip-egress
# ---------------------------------------------------------------------------
# What this does not close, stated here rather than left to be discovered.
#
#   * **The proxy sees every request in clear text.** That is what terminating
#     TLS means, and it is the cost of a workspace with no TLS stack. A bearer
#     token for Vertex and an API token for IBM both pass through this process
#     in the clear. It is a smaller surface than the alternative — the token on
#     the public internet in the clear — and it is not nothing: this pod is now
#     the highest-value target in the namespace, which is why it holds no
#     identity, mounts no secret, has no shell, and logs no header.
#   * **A NetworkPolicy still cannot tell one Google API from another.** The
#     `199.36.153.8/30` above carries all of them. The Envoy route table is
#     what distinguishes them, and it is a control inside the pod rather than
#     one the network enforces. VPC Service Controls is the layer that would
#     close it and this configuration does not create the perimeter.
#   * **Nothing here checks the vendor's answer.** The adapters do — bounded
#     bodies, explicit timeouts, a `content-type` that is not trusted to pick a
#     code path — and that work is not duplicated here.
