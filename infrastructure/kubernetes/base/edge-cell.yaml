# An edge cell.
#
# One of these per cell. `CELL_ID`, `CELL_REGION` and `CELL_VENUES` are
# substituted at deploy time, the same way `ENVIRONMENT`, `PROJECT` and
# `IMAGE_TAG` are — see docs/operations/deploying-an-edge-cell.md.
#
# ADR 0008: the cell holds the whole hot path and decides without asking the
# central plane. What keeps that safe is that it never decides how much it may
# risk — it acts inside a `CapitalEnvelope` that is signed, bounded,
# venue-scoped and expiring. `QIP_CAPITAL_ENVELOPE_KEY` is the key it verifies
# that signature against, and it is the single most security-relevant value in
# this file: whoever can replace it can mint envelopes, which is the one way a
# cell's bound widens without the central plane agreeing.
#
# A cell that has lost contact with the centre keeps trading inside the
# envelope it already holds. The network policy therefore permits the central
# plane rather than requiring it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qip-edge-CELL_ID
  namespace: qip
  annotations:
    # Matches the workload identity binding the edge-cell Terraform module
    # creates for `qip/qip-edge-CELL_ID`.
    iam.gke.io/gcp-service-account: qip-edge-CELL_ID-ENVIRONMENT@PROJECT.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qip-edge-CELL_ID
  namespace: qip
  labels:
    app: qip-edge-node
    qip.io/cell: CELL_ID
spec:
  # A StatefulSet rather than a Deployment, for one reason: the journal.
  # A cell's hash-chained decision record is evidence — the answer to "why did
  # this cell trade" after the fact — and evidence that lives on ephemeral pod
  # storage is evidence that disappears on the first restart. Stable identity
  # gives each replica its own journal volume that outlives its pod.
  #
  # Book and feature state stays on emptyDir below, deliberately: a cell
  # rebuilds its books from the feed, and state that survived a restart would
  # be state nobody reconciled against the venue.
  serviceName: qip-edge-CELL_ID
  # Cells are independent; there is no leader to elect and no ordering to
  # respect, so replicas start together rather than one at a time.
  podManagementPolicy: Parallel
  # Fixed at two, and there is deliberately no HorizontalPodAutoscaler for a
  # cell. Scaling a cell is not a capacity decision, it is a risk one.
  #
  # A `CapitalEnvelope` is scoped to a *cell*: it carries a `cell` field, a
  # `gross_limit` that is the most that may be at risk at once, and an
  # `order_limit` per order. Each pod verifies that envelope and then enforces
  # it against the book it holds in its own memory — the book is rebuilt from
  # the feed into the emptyDir below, and nothing reconciles one pod's book
  # against another's. So a cell running N pods can hold N times its gross
  # limit at risk while every individual pod is correctly inside the envelope
  # it was handed, and the central plane, which signed one envelope, is
  # reasoning about a bound that no longer describes the exposure.
  #
  # That is precisely the failure the header of this file names as the one
  # that matters — a cell's bound widening without the central plane agreeing.
  # An autoscaler here would hand that widening to a CPU threshold, and let
  # load rather than an approver decide how much may be at risk.
  #
  # Two further consequences, either enough on its own:
  #
  #   * The central plane cannot tell the pods apart. A cell report is keyed
  #     by cell id, and every pod here is started with the same `QIP_CELL_ID`,
  #     so the second pod's report replaces the first pod's rather than adding
  #     to it. More pods do not produce more cells; they produce one cell that
  #     speaks with several voices and is heard as one.
  #   * Every replica takes its own journal claim from the template below, and
  #     the retention policy is Retain in both directions on purpose. An
  #     autoscaler would mint evidence volumes on a load spike and orphan them
  #     on the way back down, permanently, because nothing deletes a retained
  #     claim.
  #
  # A cell that needs more capacity gets a new cell — its own id, its own
  # envelope, its own subnet and its own venue rules, all of which the
  # edge-cell Terraform module already takes as a single map entry. That is
  # the scaling unit here, and it is deliberately something a person decides
  # rather than something a threshold decides.
  replicas: 2
  selector:
    matchLabels:
      app: qip-edge-node
      qip.io/cell: CELL_ID
  template:
    metadata:
      labels:
        app: qip-edge-node
        qip.io/cell: CELL_ID
    spec:
      serviceAccountName: qip-edge-CELL_ID
      automountServiceAccountToken: false
      # Long enough to cancel every resting order and write the cell's closing
      # evidence. A cell killed with orders live leaves the book holding risk
      # nobody is watching.
      terminationGracePeriodSeconds: 60
      # Two replicas of a latency-sensitive workload on the same node share a
      # failure and a network card, and gain nothing.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: qip-edge-node
                  qip.io/cell: CELL_ID
              topologyKey: kubernetes.io/hostname
      # And across zones as well as across nodes. The rule above already keeps
      # the two pods off one machine; this keeps them out of one zone, which is
      # the failure that takes both at once. A cell holds the whole hot path,
      # so losing every pod of one is losing the ability to trade — and to
      # cancel — for the venues that cell owns.
      #
      # `ScheduleAnyway`, and here the reason is sharper than elsewhere: the
      # anti-affinity above is `required`, so a hard zone rule on top of it
      # would mean a replacement pod needs a free node in a specific zone or it
      # does not start at all. During a zone outage that is the difference
      # between a cell running degraded on one pod and a cell running on none.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: qip-edge-node
              # The cell as well as the workload, for the same reason the rule
              # above and the policies below name it: two cells in one
              # namespace selected only by `app` would be spread against each
              # other, and one cell's placement would depend on another's.
              qip.io/cell: CELL_ID
      # This one serves, unlike the two central-plane workloads. `qip-edge-node`
      # binds `QIP_HEALTH_PORT` and answers every request with the cell's state,
      # so the probes below point at something that exists rather than at the
      # shape a workload is being built towards.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qip-edge-node
          image: IMAGE_PREFIX/qip-edge-node:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The node serves a health surface on QIP_HEALTH_PORT and nothing
          # else. It is deliberately not the platform's HTTP server: a cell
          # whose liveness probe depends on the API crate has coupled the two,
          # and this probe is what tells the orchestrator the cell is alive.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: QIP_HEALTH_PORT
              value: "8080"
            # The same config-map keys every other workload reads.
            - name: QIP_STORAGE_TARGET
              value: "engine"
            - name: QIP_STORAGE_ROOT
              value: "/var/lib/qip/journal"
            - name: QIP_AUTONOMY_CEILING
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: autonomy_ceiling
            - name: QIP_CYCLE_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: cycle_interval_seconds
            - name: QIP_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: log_level
            # Which cell this is. It must match the `cell` field of every
            # envelope the central plane grants here, because the cell refuses
            # one addressed elsewhere.
            - name: QIP_CELL_ID
              value: "CELL_ID"
            - name: QIP_CELL_REGION
              value: "CELL_REGION"
            # The venues this cell is configured for. `qip-edge-node` refuses to
            # start without it and refuses an empty list — a cell with no venue
            # has nothing to do, and one that started anyway would report itself
            # healthy while being unable to trade.
            #
            # This is what the cell is configured for; the Terraform `venues`
            # map and the egress rule below are what it may actually reach. All
            # three are substituted from the same map, so they cannot name
            # different venues, and the narrowest of them wins: a venue named
            # here with no firewall rule is a venue the cell cannot open.
            - name: QIP_VENUES
              value: "CELL_VENUES"
            # The key capital envelopes are verified against. From a secret
            # reference, never from the image and never from a literal.
            # Where the hash-chained journal is shipped. Without it the node
            # warns at startup and holds the record in memory only, which is
            # the state this StatefulSet exists to end.
            - name: QIP_MIRROR_PATH
              value: /var/lib/qip/journal
            - name: QIP_CAPITAL_ENVELOPE_KEY
              valueFrom:
                secretKeyRef:
                  name: qip-capital-envelope-key
                  key: verification_key
          resources:
            # Requests equal limits, for the same reason as the fast brain:
            # this is a hot path, and a hot path that is throttled or evicted
            # is not one.
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /var/lib/qip/state
            - name: journal
              mountPath: /var/lib/qip/journal
          # The cell is the one workload with a volume that outlives its pod,
          # so it is the one that names a durable store. The journal drains
          # here through `StoreMirror`, and the retention policy on the claim
          # is Retain: a cell that has been removed still has to account for
          # what it did while it ran.
          #
          # QIP_MIRROR_PATH used to select this destination on its own. The
          # node now refuses to start if it is set, rather than ignoring it,
          # because a cell deployed with the old variable would write its
          # journal nowhere while its configuration still claimed a path.
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # Local book and feature state. emptyDir on purpose: a cell rebuilds
        # its books from the feed on start, and state that survived a restart
        # would be state nobody reconciled against the venue.
        - name: state
          emptyDir:
            sizeLimit: 4Gi
  # The journal, per replica, outliving the pod that wrote it. Retained on
  # scale-down rather than deleted: a cell that is removed still has to be able
  # to answer for what it did while it ran.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: journal
        labels:
          app: qip-edge-node
          qip.io/cell: CELL_ID
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qip-edge-CELL_ID
  namespace: qip
spec:
  selector:
    app: qip-edge-node
    qip.io/cell: CELL_ID
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qip-edge-CELL_ID
  namespace: qip
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: qip-edge-node
      qip.io/cell: CELL_ID
---
# An edge cell accepts traffic from the API and nothing else.
#
# These two policies live here rather than in namespace.yaml because they
# are per-cell: the egress rule names this cell's venues. namespace.yaml is
# applied by the pipeline unrendered, and a placeholder in it would be
# rejected by the API server.
#
# The central plane reaches a cell to deliver a capital envelope and to recall
# one. Both are things the centre initiates; the cell asks for nothing, which
# is what lets it keep trading when the centre is unreachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-ingress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-edge-node
      # The cell as well as the workload. Two cells in one namespace selected
      # only by `app` would each get the other's venue rule, which is a wider
      # grant than either was given.
      qip.io/cell: CELL_ID
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: qip-api
      ports:
        - protocol: TCP
          port: 8080
---
# What an edge cell may reach. The most security-relevant rule in this file.
#
# A cell holds the whole hot path: feed handlers, books, compiled strategies,
# local risk and the venue gateway. It decides without asking anyone. The only
# things standing between a compromised cell and an arbitrary outbound
# connection are this policy and the egress firewall the edge-cell Terraform
# module writes for the same cell.
#
# Three destinations, and the list is exhaustive:
#
#   1. Its own venues. `VENUE_CIDR_*` and `VENUE_PORT_*` are substituted per
#      cell from the same `venues` map the Terraform module takes, so the pod
#      policy and the firewall rule cannot name different things. A cell whose
#      venue map is empty ships with this rule absent and reaches no venue,
#      which is the correct state for a cell nobody has confirmed
#      connectivity for.
#   2. The central plane, for evidence and aggregate exposure. Permitted, not
#      required: a cell that cannot reach it keeps trading inside the envelope
#      it holds.
#   3. Google's private API endpoint, for the envelope verification key and
#      for telemetry.
#
# It may not reach the deep brain, another cell, or the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-egress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-edge-node
      # The cell as well as the workload. Two cells in one namespace selected
      # only by `app` would each get the other's venue rule, which is a wider
      # grant than either was given.
      qip.io/cell: CELL_ID
  policyTypes:
    - Egress
  egress:
    # 1. Its venues.
    - to:
        - ipBlock:
            cidr: VENUE_CIDR
      ports:
        - protocol: TCP
          port: VENUE_PORT
    # 2. The central plane.
    - to:
        - podSelector:
            matchLabels:
              app: qip-api
      ports:
        - protocol: TCP
          port: 8080
    # 3. Google APIs, through private access.
    - to:
        - ipBlock:
            cidr: 199.36.153.8/30
      ports:
        - protocol: TCP
          port: 443
