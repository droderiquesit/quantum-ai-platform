# Where a journal's disk comes from, and what would let it be snapshotted.
#
# Two objects, and only the first is live. The StorageClass is a core kind and
# the pipeline applies it. The VolumeSnapshotClass at the foot of this file is
# a CRD that nothing in this repository provisions, so it is committed
# commented out — the same shape, and for the same reason, as the
# VerticalPodAutoscaler at the foot of deepbrain.yaml.
#
# ## What this closes
#
# docs/operations/disaster-recovery.md names the journal claims as `Retain` and
# says retained is not backed up. `Retain` there is
# `persistentVolumeClaimRetentionPolicy` in edge-cell.yaml, and it governs the
# *claim*: it stops Kubernetes deleting the PersistentVolumeClaim when the
# StatefulSet is deleted or scaled down. It says nothing about the disk.
#
# What happens to the disk when the claim finally goes is the StorageClass's
# `reclaimPolicy`, and until this file existed the journals used whatever class
# the cluster defaults to. On GKE that is `standard-rwo`, whose reclaim policy
# is `Delete`. So the state being described as retained was: a claim that
# outlives its StatefulSet, backed by a disk that is destroyed the moment
# anybody deletes that claim, with no copy of it anywhere.
#
# The runbook's own "to take a cell out" step is exactly that deletion. It
# reads as friction — delete the claims deliberately, after the journal has
# been archived — and under a `Delete` class the deliberate step and the
# irreversible one are the same keystroke, with nothing between them.
#
# ## What it does not close
#
# A reclaim policy is not a backup. It keeps the disk when the claim goes; it
# does nothing about a failed disk, a deleted project or a lost region, which
# are the three failures the disaster-recovery page is actually about. That
# needs snapshots, which needs the class at the foot of this file, which needs
# a CSI driver this repository does not yet declare.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: qip-journal
  labels:
    app.kubernetes.io/part-of: qip
  # Deliberately **not** annotated `storageclass.kubernetes.io/is-default-class`.
  # A default class is what an unannotated claim silently gets, and this one
  # retains disks: making it the default would quietly give every future claim
  # in the cluster — a cache, a scratch volume, something nobody thought about
  # — a disk that nothing ever deletes. Retention is correct for evidence and
  # wrong for everything else, so it is asked for by name in
  # edge-cell.yaml rather than inherited.
provisioner: pd.csi.storage.gke.io
# The whole point of the file.
#
# `Retain` leaves the PersistentVolume and the underlying disk in place when
# the claim is deleted. The volume goes to `Released` and is not reused, so
# recovering from it is a deliberate act — which is the correct amount of
# effort for a decision record that has to answer for what a cell did.
#
# The cost is real and is an operator's to carry: a released volume is an
# orphaned disk that nothing reclaims and that bills until somebody deletes it.
# That is the trade, taken knowingly, because the alternative failure is
# unrecoverable and this one is a line item.
reclaimPolicy: Retain
# The disk is created when a pod that wants it is scheduled, not before.
#
# With `Immediate` the provisioner picks a zone before the scheduler has said
# anything, and the pod is then pinned to whatever zone the disk landed in.
# edge-cell.yaml's pod anti-affinity is `required` on hostname, so a disk
# created in a zone where the cell's other pod already holds the only free node
# produces a pod that can never be scheduled and a disk that is never used —
# and the pod stays `Pending` for a reason that reads as capacity and is
# actually ordering. Binding on first consumer lets the scheduler choose the
# node and the provisioner follow it.
volumeBindingMode: WaitForFirstConsumer
# The journal does not trim. `ChainArchive` says so in its own documentation:
# "an archive that expired its own entries would be deleting the evidence it
# exists to hold", so retention is an operator's decision about the store and
# never a default in the code. A 16Gi journal therefore fills rather than
# rolls, and the only remedies are a bigger disk or deleting evidence.
#
# Expansion is what makes the first one available. Without it, the disk of a
# cell that has been running longer than anybody sized for cannot be grown at
# all, and the cell stops being able to journal — which, for a workload whose
# journal is the reason it is a StatefulSet, is the cell failing at the one
# thing this storage exists for.
allowVolumeExpansion: true
parameters:
  # The same disk type GKE's own default class uses, deliberately. This class
  # changes what happens to a journal disk when its claim goes and what can be
  # snapshotted from it; it is not a performance change, and picking a
  # different type here would make it one without a measurement behind it.
  type: pd-balanced
  # The handle the snapshot schedule finds these disks by.
  #
  # This is the one field that has to agree with something outside Kubernetes,
  # so it is worth being explicit about why it is a label and not a name. A
  # Compute Engine snapshot schedule is a `google_compute_resource_policy`, and
  # a resource policy is attached to a *disk*. The disks under these claims are
  # named `pvc-<uuid>` and are created when a cell's pod is first scheduled —
  # after any `terraform apply`, with a name nothing could have predicted. So
  # Terraform can create the schedule and cannot attach it, and the attachment
  # is a step somebody runs once per cell against a disk they have to be able
  # to find.
  #
  # These labels are how they find it:
  #
  #   gcloud compute disks list --filter="labels.qip-journal=true"
  #
  # See docs/operations/disaster-recovery.md for the attachment step, and
  # docs/operations/multi-region.md for what this does not buy.
  labels: qip-journal=true,qip-environment=ENVIRONMENT
# ---------------------------------------------------------------------------
# The snapshot class, and why it is not committed live.
#
# A `VolumeSnapshot` needs a `VolumeSnapshotClass`, and its `driver` must be
# the same driver that provisioned the volume — a snapshot class naming a
# driver that did not create the disk does not fall back, it fails. That is
# why this object and the StorageClass above are in one file: `driver` here and
# `provisioner` there are one decision written twice, and two files is how they
# would come to disagree.
#
# It is commented out, and that is the correct committed state rather than a
# draft. `VolumeSnapshotClass` is a CustomResourceDefinition, and the deploy
# pipeline runs `kubectl apply --server-side --dry-run=server` over the whole
# rendered directory before it applies anything: an unknown kind fails that
# gate for *every* manifest in the directory. Committing this live before the
# CRD exists would not add snapshots, it would stop the platform deploying.
#
# Three things must be true before uncommenting:
#
#   1. The cluster runs the Compute Engine persistent disk CSI driver, and the
#      snapshot CRDs that come with it. The cluster module now asserts the
#      driver (`gce_persistent_disk_csi_driver_config`), so on a cluster this
#      repository built, the first command below is a formality. The snapshot
#      CRDs are still the driver's to install, so both are still worth running
#      rather than found out from a failed deploy:
#
#        kubectl get csidriver pd.csi.storage.gke.io
#        kubectl get crd volumesnapshotclasses.snapshot.storage.k8s.io
#
#      If the first is empty, the StorageClass above provisions nothing either
#      and a cell's journal claim sits `Pending` — so this check belongs before
#      the first cell, not before the first snapshot.
#
#   2. Something creates the snapshots. A class is not a schedule: Kubernetes
#      has no built-in periodic snapshotter, so this object grants a capability
#      and takes nothing. Either the Compute Engine snapshot schedule is
#      attached to the disks — the `labels` parameter above is how they are
#      found — or a controller creates `VolumeSnapshot` objects on a cadence.
#      A snapshot class with neither is a manifest that reads as a backup.
#
#   3. Somebody has restored from one. An untested restore is a belief, and the
#      one place that belief gets tested for the first time should not be an
#      incident. docs/operations/disaster-recovery.md carries the procedure.
#
# `deletionPolicy: Retain` is the same argument as `reclaimPolicy` above, one
# layer up: deleting the `VolumeSnapshot` object leaves the Compute Engine
# snapshot in place. `Delete` would mean a `kubectl delete` of a namespaced
# object — the kind of thing a cleanup script does — destroying the only
# off-disk copy of a cell's decision record.
#
# apiVersion: snapshot.storage.k8s.io/v1
# kind: VolumeSnapshotClass
# metadata:
#   name: qip-journal-snapshot
#   labels:
#     app.kubernetes.io/part-of: qip
# driver: pd.csi.storage.gke.io
# deletionPolicy: Retain
