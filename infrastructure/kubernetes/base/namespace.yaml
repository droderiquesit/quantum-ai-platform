# The namespace, and the network policy that governs it.
#
# The default is deny. Every flow the platform needs is named below, and
# anything not named cannot happen — which is what keeps a compromised research
# pod from reaching the execution pod directly.
apiVersion: v1
kind: Namespace
metadata:
  name: qip
  labels:
    name: qip
    # Enforce the restricted pod security standard: no privileged containers,
    # no host namespaces, no running as root.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Deny everything, then permit what is needed. Declared first so that a
# manifest applied out of order fails closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: qip
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# DNS, which everything needs and which the default deny would otherwise break.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: qip
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The API accepts traffic from the ingress controller and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# The deep brain may reach Google APIs for secrets and telemetry. It may not
# reach a venue: it hosts no agent that could use one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-deepbrain-egress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-deepbrain
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            # Private Google access. Reaching Google APIs without leaving the
            # VPC, and without a route to anywhere else.
            cidr: 199.36.153.8/30
      ports:
        - protocol: TCP
          port: 443
---
# The fast brain is the only central-plane workload permitted to reach a venue,
# and only where the environment's egress policy allows it at the network level
# too.
#
# Note what is *not* here: no rule permits the fast brain to reach the deep
# brain. The deep brain is the one workload that may call a language model, so
# an egress rule to it would be a route from the fast path to a model by way of
# a component that has one. ADR 0008, consequence 3: nothing on the hot path
# consults a model.
#
# What this layer cannot promise, stated plainly rather than left to be
# discovered: 199.36.153.8/30 is private Google access, and it is one address
# range for *every* Google API, Vertex AI included. A network policy cannot
# tell `secretmanager.googleapis.com` from `aiplatform.googleapis.com`. Closing
# that needs a VPC Service Controls perimeter, which this configuration does
# not create — see docs/operations/external-dependencies.md, which names the
# exact perimeter and the services it must exclude. Until then the guarantee
# rests on the binary's own start-up check and on there being no model
# credential in this deployment to call one with.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastbrain-egress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-fastbrain
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 199.36.153.8/30
      ports:
        - protocol: TCP
          port: 443
---
# The market-data vendor, for the workloads that ingest from one.
#
# Commented out, and that is the correct committed state. The platform now has
# a live REST market-data adapter (`qip_market_ingestion::rest`), and under the
# default deny above it can reach nothing: an unconfigured adapter refuses at
# start-up and says so, but a *configured* one against a denied egress produces
# a connection that hangs rather than an error naming the policy. That is the
# worst of the three outcomes, so the rule is written out here ready to be
# uncommented rather than left to be reinvented during an incident.
#
# Two things must be true before uncommenting:
#
#   1. `VENDOR_CIDR` is the address range the vendor *publishes*. A range
#      resolved from a DNS lookup is a firewall rule that works until the
#      vendor moves a host, and `0.0.0.0/0` is not a vendor range — it is the
#      internet, and a workload that can reach the internet can exfiltrate the
#      position history it was trained on.
#   2. Egress goes to a TLS-terminating proxy, not to the vendor directly.
#      `qip_transport::http` has no TLS stack and refuses `https` by name, so a
#      credential sent straight to a public vendor would cross the internet in
#      clear text. Point this rule at the proxy and let the proxy hold the
#      vendor's certificate.
#
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: allow-market-data-egress
#   namespace: qip
# spec:
#   podSelector:
#     matchLabels:
#       app: qip-fastbrain
#   policyTypes:
#     - Egress
#   egress:
#     - to:
#         - ipBlock:
#             cidr: VENDOR_CIDR
#       ports:
#         - protocol: TCP
#           port: VENDOR_PORT
---
# The API reaches the three workloads behind it, and Google's APIs. Nothing
# else.
#
# Without this the API has no egress policy at all, which under the default
# deny above means it can reach neither Secret Manager for its tokens nor the
# workloads it fronts. A default-deny namespace with no matching egress rule
# does not produce an error anywhere; it produces a connection that hangs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: qip-fastbrain
        - podSelector:
            matchLabels:
              app: qip-deepbrain
        - podSelector:
            matchLabels:
              app: qip-edge-node
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            # Private Google access: Google APIs without leaving the VPC, and
            # without a route to anywhere else.
            cidr: 199.36.153.8/30
      ports:
        - protocol: TCP
          port: 443
---
# The mesh backbone's ingress: a cell reaching the centre.
#
# A separate policy rather than a port added to `allow-api-ingress` above,
# for the reason egress.yaml gives for splitting the proxy's route out of
# `allow-api-egress` — policies are additive, and the day somebody revokes the
# mesh the revocation should be a deleted document rather than a careful edit
# inside a rule that also carries the operator interface's only way in.
#
# Without this the mesh is configured and dead. `mesh_cells` in config.yaml
# tells `qip-api` to bind a listener for each cell and `mesh_peer_<cell>` tells
# each cell where to dial, and the namespace's default deny drops the flow
# regardless: an unpermitted flow here does not error, it hangs, and a cell
# whose publish hangs reports a circuit-open breaker rather than a policy. The
# cell's own half of this pair is in edge-cell.yaml, which permits the egress;
# both are needed, and the egress alone is what this namespace had.
#
# ## What this rule cannot express, stated because it is a real residual
#
# The port is the cell's identity on this transport, so a pod that can reach
# port 9110 can drain london-1's capital inbox — a poll is a destructive read
# with a single cursor, so a grant read by anybody else is a grant london-1
# never receives. This selector is `app: qip-edge-node`, every cell, because
# namespace.yaml is applied unrendered and cannot carry CELL_ID; a per-cell
# rule needs the cell's port as a literal beside a `qip.io/cell` selector,
# which is a per-cell document and a placeholder the cell runbook does not
# substitute today.
#
# What the residual is and is not: a stolen envelope cannot be *used*, because
# it is signed and carries the cell it is scoped to, and a cell refuses one
# addressed elsewhere. The exposure is denial — a cell starved of capital by
# another cell in the same namespace — and it needs a compromised cell pod to
# reach at all. The narrower rule is the right one to write when a cell's port
# can be rendered per cell; widening this to a port *range* to save an edit
# when a second cell arrives would be the opposite move, and is why the port
# is named one at a time.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-mesh-ingress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: qip-edge-node
      ports:
        # One per cell in `mesh_cells`. A cell whose port is missing here
        # publishes into a connection that hangs.
        - protocol: TCP
          port: 9110
---
# The fast brain accepts traffic from the API and nothing else.
#
# The API is how an operator trips the kill switch, so this is the path a halt
# travels down. It is deliberately the only one: nothing else in the namespace
# has any business instructing the execution path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastbrain-ingress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-fastbrain
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: qip-api
      ports:
        - protocol: TCP
          port: 8080
---
# The deep brain accepts traffic from the API and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-deepbrain-ingress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-deepbrain
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: qip-api
      ports:
        - protocol: TCP
          port: 8080
