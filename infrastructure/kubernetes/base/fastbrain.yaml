# The Fast Brain: market data, microstructure, real-time risk and execution.
#
# The latency-sensitive one, and the only workload permitted to reach a venue.
# Two things about it are different from every other workload here, and both
# are deliberate:
#
#   * Its requests equal its limits. That puts the pod in the Guaranteed
#     quality-of-service class, which is what keeps the kubelet from evicting
#     it under node pressure and stops the CFS quota throttling it at a
#     boundary it did not choose. A fast path that is descheduled at the wrong
#     moment is not a fast path.
#   * It mounts no secret at all. The venue credential is read from Secret
#     Manager through workload identity, so in an environment whose autonomy
#     ceiling is paper trading — where that IAM binding does not exist — the
#     read fails rather than the deployment quietly holding a credential it
#     should not have.
#
# There is deliberately no HorizontalPodAutoscaler here. The reasoning is at
# the foot of this file, next to the replica count it also calls into question,
# because that is where somebody would go to add one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qip-fastbrain
  namespace: qip
  annotations:
    # Bound to the Google service account by workload identity, so no key file
    # ever exists on disk.
    iam.gke.io/gcp-service-account: qip-fastbrain-ENVIRONMENT@PROJECT.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qip-fastbrain
  namespace: qip
  labels:
    app: qip-fastbrain
spec:
  # One replica, and the reason is correctness rather than cost.
  #
  # This said 2 for as long as the binary validated its agent roster and
  # exited, where two processes doing that were harmless. It now runs a loop —
  # poll the feed, observe, run a cycle, archive at the boundary — over a
  # `Platform` it constructs per process. Two replicas are therefore two
  # independent feed consumers building two divergent world models, and the
  # replica count was never revisited when the binary started serving.
  #
  # The decisive one is the audit trail. Pointed at a durable
  # `QIP_STORAGE_TARGET`, both replicas hand records to the same
  # `ChainArchive`, which assigns its own dense positions as they arrive. Two
  # independent event sequences interleave into one chain that still *verifies*
  # — every entry links to the one before it — while describing a history that
  # never happened, with nothing recording which replica emitted what. A chain
  # that verifies and is wrong is worse than one that fails.
  #
  # This costs the redundancy of the most latency-sensitive workload here, and
  # that is a real loss, not a rounding error. It is accepted because two
  # brains that disagree are not redundancy: there is no arbiter between them,
  # so a second replica adds a second answer rather than a spare.
  #
  # The fix that would earn the second replica back is leader election — a
  # lease, a fenced hand-off, and a rule for the cycle in flight — and it
  # exists nowhere in this repository. Until it does, one replica that restarts
  # in seconds is strictly safer than two that diverge.
  replicas: 1
  # A rolling update of a singleton would briefly run the old pod and the new
  # one together, which is the two-replica case arriving through the back door.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qip-fastbrain
  template:
    metadata:
      labels:
        app: qip-fastbrain
    spec:
      serviceAccountName: qip-fastbrain
      # No automatic token mount: the workload authenticates through workload
      # identity, and a mounted token is a credential nothing needs.
      automountServiceAccountToken: false
      # The fast path is not worth restarting slowly. Thirty seconds is enough
      # to finish in-flight work and cancel resting orders.
      terminationGracePeriodSeconds: 30
      # Spread the replicas that exist across zones.
      #
      # This is worth doing whatever is decided about the count at the foot of
      # this file: two replicas in one zone are two replicas that fail
      # together, and the fast path is the half of the platform that holds
      # resting orders. A zone going away with both of them in it leaves those
      # orders live at the venue with nothing watching them, which is the state
      # `terminationGracePeriodSeconds` above exists to avoid on a planned
      # exit and cannot help with on an unplanned one.
      #
      # `ScheduleAnyway`, for the same reason as everywhere else here: a hard
      # skew on a three-zone pool refuses to place a replacement pod during the
      # outage that made it necessary. It is also the only safe choice next to
      # the pod anti-affinity a fast-path workload wants — a hard host rule and
      # a hard zone rule together can leave nothing schedulable at all.
      # No zone spread constraint, deliberately: one pod cannot be spread
      # across zones, and a constraint here would read as zone redundancy this
      # workload does not have. It becomes correct the day leader election
      # earns the second replica back — see the replica count above.
      # This binary serves. It validates its agent roster first — no hosted
      # agent may hold `call_language_model` or a budget beyond the fast-path
      # ceiling — and then runs its ingest-and-cycle loop behind real probes,
      # declared further down.
      #
      # This comment used to say the opposite, and said it directly above the
      # probes that had since been added. A manifest describing a binary two
      # changes ago is worse than an undocumented one, because the reader who
      # checks the comment instead of the code is the reader in a hurry.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qip-fastbrain
          image: IMAGE_PREFIX/qip-fastbrain:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness and readiness are deliberately different endpoints, because
          # for this node they answer different questions. /health says the
          # process is alive and answers 200 even while a cycle is running
          # slowly — restarting a node that is merely slow makes the problem
          # worse. /ready says it is fast enough to be sent work, and returns
          # 503 once cycles have breached the fast-path ceiling for longer than
          # the breach tolerance, so a node that is alive and not fast leaves
          # rotation instead of being killed.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            # The health surface this node serves. QIP_API_ADDRESS is not read
            # by this binary — it serves its own listener, not the API's.
            - name: QIP_FASTBRAIN_HEALTH_ADDRESS
              value: "0.0.0.0:8080"
            # The autonomy ceiling. From the config map, so changing what the
            # platform is permitted to do is a change to a named resource that
            # appears in a diff and in an audit log.
            # No volume outlives this pod, so this says so rather than
            # naming a durable store it has nowhere to write. The Fast Brain holds
            # no source of record: its state is rebuilt from the feed and the
            # central plane, and what it must not lose — the event log's hash
            # chain — needs either a volume of its own or the Cloud Storage
            # adapter that `StorageTarget::CloudStorage` still refuses.
            #
            # Set explicitly rather than left to the binary's default, because
            # a durability question answered by omission is one nobody
            # revisits when a volume finally exists.
            - name: QIP_STORAGE_TARGET
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: storage_target
            - name: QIP_AUTONOMY_CEILING
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: autonomy_ceiling
            - name: QIP_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: log_level
            # There is deliberately no model endpoint, no model credential and
            # no secret of any kind here. Nothing on the fast path may consult
            # a language model — ADR 0008, consequence 3 — and the binary
            # refuses to start if an agent it would host holds
            # `call_language_model`. This is the deployment saying the same
            # thing: there is nothing here to call one with.
          resources:
            # Requests equal limits. See the note at the top of the file.
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The root filesystem is read-only, so anything needing to write gets
        # an explicit, size-bounded volume.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: qip-fastbrain
  namespace: qip
spec:
  selector:
    app: qip-fastbrain
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qip-fastbrain
  namespace: qip
spec:
  # `maxUnavailable: 1`, not `minAvailable: 1`. At one replica the two are
  # opposites: `minAvailable: 1` requires the only pod to stay up, so a node
  # drain blocks forever and an unattended auto-upgrade stalls. The manifest's
  # own note called for this the moment the replica count dropped.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: qip-fastbrain
# ---------------------------------------------------------------------------
# Why there is no HorizontalPodAutoscaler here, and a question about `replicas`
# that this file cannot answer on its own.
#
# An autoscaler assumes one thing: that adding a replica reduces what each
# existing replica has to do. That is true of a server and it is false of this
# binary. `qip-fastbrain` does not serve work — its HTTP surface is `/`,
# `/health`, `/ready` and a `/quiesce` that is refused unless it arrives over
# loopback, so nothing the Service in this file routes to it is work to share.
# What it actually does is run a loop: poll the feed, hand the platform what
# passed validation, run a cycle, sleep out the rest of the interval, repeat.
# Every replica runs that whole loop at that whole cadence, for itself.
#
# So the feedback the autoscaler depends on never arrives. Add a replica and
# per-replica CPU does not fall, because no work moved; the target stays
# breached, so the autoscaler adds another, and it ratchets to `maxReplicas`
# and stays pinned there. A CPU-targeted autoscaler on this workload is not a
# scaling policy, it is an instruction to run as many brains as the ceiling
# allows.
#
# And running several of them is not a capacity decision, it is a correctness
# one. Each replica constructs its own `Platform` and its own `Feed`, so two
# replicas are two independent consumers of the same market and two in-process
# world models built from separately-timed polls. That produces:
#
#   * two sets of observations of the same market, counted twice wherever the
#     two are aggregated;
#   * two divergent views, because the polls are not synchronised and neither
#     replica sees what the other absorbed;
#   * two sets of decisions from those views — and this is the one workload
#     permitted to reach a venue, so on a live ceiling that is two order flows
#     against one position with no shared book between them;
#   * two event-log hash chains, each internally consistent and neither the
#     record of what the platform did, which is the same duplicate-evidence
#     problem the Deep Brain's manifest refuses one replica to avoid.
#
# Resolved above: the replica count is now 1. What follows is why, so that a
# later reader restoring a second replica knows what it costs. The original
# note read: this Deployment already sets `replicas: 2`, so
# the above is a description of what is deployed today rather than of a
# hypothetical. It was left at 2 rather than changed here because dropping the
# fast path to a single replica removes the redundancy of the most
# latency-sensitive workload on the platform, and that is a decision for
# whoever owns the execution path, not a side effect of adding autoscaling.
# The two honest resolutions are:
#
#   1. One replica and `strategy: Recreate`, exactly as `deepbrain.yaml` does
#      it and for exactly the same reason — a rolling update of a singleton
#      briefly runs two, which is the thing being avoided. This costs
#      redundancy and makes a node drain a gap in the fast path.
#   2. Leader election, so several replicas run and one owns the feed and the
#      cycle while the others stand by. That is real work in the binary — a
#      lease, a fenced hand-off, and a story for the orders the outgoing
#      leader had resting — and naming it here is not the same as having it.
#      Nothing in this repository implements it today.
#
# Until one of those is chosen, the PodDisruptionBudget above is correct as it
# stands: at two replicas `minAvailable: 1` permits exactly one voluntary
# eviction, so a node drain proceeds and never blocks. If the count drops to
# one, that budget must become `maxUnavailable: 1` the way the Deep Brain's
# did, or the single pod becomes undrainable and the next node auto-upgrade
# stalls against it.
