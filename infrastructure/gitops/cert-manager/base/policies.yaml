# What cert-manager may reach and what may reach it. Upstream ships no
# network policies at all; under this platform's posture that means writing
# them is part of adopting the component, not an optional hardening pass.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# DNS, in the two-rule form the argocd namespace proved: the selector rule
# for a cluster without NodeLocal DNSCache, and the kube-dns service VIP
# (service_cidr's tenth address) for this cluster, where the cache's
# NOTRACK interception keeps the VIP as the destination no selector can
# match. See infrastructure/kubernetes/base/namespace.yaml for the full
# story, including the probe that proved it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.8.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Every cert-manager pod's whole job is watching and writing the Kubernetes
# API — certificates, secrets, and the CRDs that describe them — so the
# namespace-wide egress is the control plane and nothing else. Deliberately
# absent: any route to the internet. ACME (Let's Encrypt) would need one,
# and this platform issues from an internal CA for Kargo's webhooks;
# turning ACME on some day means granting that egress here in the same
# commit, and until then a misconfigured ACME issuer fails at the network
# rather than silently phoning out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-egress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 172.16.0.0/28
      ports:
        - protocol: TCP
          port: 443
---
# The API server calls the webhook on 10250 to validate and convert
# cert-manager resources. In this private cluster that call arrives through
# the konnectivity tunnel — pods in kube-system — with the master range
# kept alongside for the direct path some GKE versions use. Both sources,
# one port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-ingress
  namespace: cert-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: webhook
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 172.16.0.0/28
      ports:
        - protocol: TCP
          port: 10250
