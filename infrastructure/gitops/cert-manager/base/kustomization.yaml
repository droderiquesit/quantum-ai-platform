# cert-manager, vendored verbatim at its version plus the network posture
# upstream does not ship. Exists for exactly one consumer today: Kargo's
# webhook certificates (ADR 0017 named this prerequisite). Overlays
# substitute the vendored image digests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream/cert-manager-v1.21.1.yaml
  - policies.yaml
patches:
  # Upstream's Namespace carries no pod-security posture; this platform's
  # namespaces enforce restricted, and cert-manager's own securityContexts
  # comply.
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cert-manager
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
