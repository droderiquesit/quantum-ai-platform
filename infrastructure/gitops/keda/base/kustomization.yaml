# KEDA, vendored verbatim at its version plus the network posture upstream
# does not ship. Adopted for event-driven autoscaling; today's only
# candidate consumer is qip-api's HPA (see SCALING-NOTES.md for why that
# replacement waits for an event-driven trigger). Overlays substitute the
# vendored image digests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream/keda-v2.20.2.yaml
  - policies.yaml
patches:
  # Upstream's Namespace carries no pod-security posture; this platform's
  # namespaces enforce restricted, and KEDA's own securityContexts comply
  # (runAsNonRoot, seccomp RuntimeDefault, all capabilities dropped, no
  # privilege escalation — checked against the v2.20.2 manifest).
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: keda
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
