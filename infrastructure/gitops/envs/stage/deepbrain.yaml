# Generated shape, reviewed content. One file per environment rather than a
# kustomize base with replacements, so a reader — and the acceptance suite's
# parity test, which reads these files without a kustomize binary — sees
# every concrete value the running service must carry. The catalogue entry
# in infrastructure/terraform/catalogue.tf is the source of truth for each
# value here; a disagreement fails the build, not the sync (ADR 0036).
apiVersion: run.cnrm.cloud.google.com/v1beta1
kind: RunService
metadata:
  name: qip-stage-deepbrain
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
    cnrm.cloud.google.com/project-id: unprovisioned
  labels:
    platform: qip
    environment: stage
    managed_by: config-connector
    live_capable: 'false'
    qip-plane: cognition
    qip-trust-zone: cognition
    qip-traffic-class: platform
    qip-workload: deepbrain
spec:
  projectRef:
    external: projects/unprovisioned
  location: europe-west2
  ingress: INGRESS_TRAFFIC_INTERNAL_ONLY
  binaryAuthorization:
    useDefault: true
  template:
    serviceAccountRef:
      external: qip-deepbrain-stage@unprovisioned.iam.gserviceaccount.com
    vpcAccess:
      egress: ALL_TRAFFIC
      networkInterfaces:
      - networkRef:
          external: projects/unprovisioned/global/networks/qip-stage-service
        subnetworkRef:
          external: projects/unprovisioned/regions/europe-west2/subnetworks/qip-stage-tz-cognition
        tags:
        - qip-stage-tz-cognition
    scaling:
      minInstanceCount: 1
      maxInstanceCount: 1
    maxInstanceRequestConcurrency: 1
    timeout: 300s
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    containers:
    - name: deepbrain
      image: qip-deepbrain
      dependsOn:
      - qip-egress
      ports:
      - containerPort: 8080
      resources:
        limits:
          cpu: '4'
          memory: 8Gi
        cpuIdle: false
        startupCpuBoost: true
      env:
      - name: QIP_AUTONOMY_CEILING
        value: paper_trading
      - name: QIP_CAPITAL_ENVELOPE_KEY_FILE
        value: /var/run/secrets/qip/capital-envelope-key/capital-envelope-key
      - name: QIP_CYCLE_INTERVAL_SECONDS
        value: '300'
      - name: QIP_DEEPBRAIN_HEALTH_ADDRESS
        value: 0.0.0.0:8080
      - name: QIP_DEPLOYMENT
        value: stage
      - name: QIP_STORAGE_TARGET
        value: memory
      - name: QIP_UNIVERSE_PATH
        value: /etc/qip/931c5fe44d20d1d9/universe.json
      volumeMounts:
      - name: capital-envelope-key
        mountPath: /var/run/secrets/qip/capital-envelope-key
      - name: config-files
        mountPath: /etc/qip/931c5fe44d20d1d9
      startupProbe:
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 2
        failureThreshold: 10
        httpGet:
          path: /health
          port: 8080
      livenessProbe:
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
        httpGet:
          path: /health
          port: 8080
    - name: qip-egress
      image: envoy
      args:
      - -c
      - /etc/envoy/envoy-760e37df4041e228.yaml
      - --service-cluster
      - qip-egress
      - --log-level
      - warn
      resources:
        limits:
          cpu: '1'
          memory: 256Mi
      volumeMounts:
      - name: egress-bootstrap
        mountPath: /etc/envoy
      startupProbe:
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 15
        httpGet:
          path: /healthz
          port: 9900
    volumes:
    - name: capital-envelope-key
      secret:
        secretRef:
          external: qip-capital-envelope-key-stage
        defaultMode: 256
        items:
        - path: capital-envelope-key
          mode: 256
          versionRef:
            external: latest
    # The committed Envoy bootstrap as a secret volume, for the reason
    # config-files gives below: the CRD has no `gcs`, the field was pruned, and
    # infra.yml run 117 (2026-10-13) found this sidecar dying on
    # `Invalid path: /etc/envoy/envoy-760e37df4041e228.yaml`. Mode 292 (0444):
    # Envoy runs as its image's non-root user, and the bytes are a reviewed
    # file, not a credential.
    - name: egress-bootstrap
      secret:
        secretRef:
          external: qip-egress-bootstrap-stage
        defaultMode: 292
        items:
        - path: envoy-760e37df4041e228.yaml
          mode: 292
          versionRef:
            external: latest
    # The committed universe.json, projected flat by a secret volume, so the
    # hash directory QIP_UNIVERSE_PATH names is the mount point itself. It was
    # a `gcs` volume: the RunService CRD (v1.156.0, byte-identical at master)
    # admits only cloudSqlInstance, emptyDir and secret, so the API server
    # pruned the field, no revision ever held the file, and infra.yml run 117
    # (2026-10-13) found the fast brain exiting 78 unable to read the path
    # (ADR 0036, amendment of 2026-10-13). Mode 292 (0444) rather than the
    # credentials' 256 (0400): the bytes are a committed, reviewed file, not
    # a credential, and the image runs as a non-root user.
    - name: config-files
      secret:
        secretRef:
          external: qip-universe-catalogue-stage
        defaultMode: 292
        items:
        - path: universe.json
          mode: 292
          versionRef:
            external: latest
  traffic:
  - type: TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST
    percent: 100
