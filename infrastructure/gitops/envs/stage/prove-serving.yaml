# Generated shape, reviewed content. One file per environment rather than a
# kustomize base with replacements, so a reader — and the acceptance suite's
# parity test, which reads these files without a kustomize binary — sees
# every concrete value the running service must carry. The catalogue entry
# in infrastructure/terraform/catalogue.tf is the source of truth for each
# value here; a disagreement fails the build, not the sync (ADR 0036).
# ADR 0036 decision 7, the proof: after every sync, read the revision each
# service routes traffic to and fail the sync unless its workload container
# runs the digest the manifest names. Runs the vendored google-cloud-cli as
# the Argo CD identity, which holds run.viewer and nothing that writes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qip-prove-serving
  annotations:
    iam.gke.io/gcp-service-account: qip-stage-argocd@unprovisioned.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qip-prove-serving
rules:
- apiGroups:
  - run.cnrm.cloud.google.com
  resources:
  - runservices
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qip-prove-serving
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qip-prove-serving
subjects:
- kind: ServiceAccount
  name: qip-prove-serving
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qip-prove-serving
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: qip-prove-serving
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prove
        image: google-cloud-cli
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          # The two questions deploy.yml's prove-serving.py asked, asked again by the
          # reconciler (ADR 0036 decision 7): is every RunService in this namespace
          # Ready, and does the revision traffic actually routes to run, in the
          # workload's own container, the digest the manifest names? Read by name,
          # never by position: every service may carry the egress sidecar.
          # The read itself is in python, below, because it happens more than
          # once: a shell curl into a file can only be the first look.
          python3 - <<'PY'
          import json, subprocess, sys, time
          
          # This hook runs PostSync, which is immediately after Argo CD applies the
          # manifests and some seconds before Config Connector has finished asking
          # Cloud Run for anything. Checking once, at that instant, asks a controller
          # a question it cannot yet answer and then reports the non-answer as a
          # refusal -- and with backoffLimit 0 there is no second attempt.
          #
          # So it waits. The deadline is the hook's own, not the sync's: Argo CD will
          # wait for this Job, and a Job that decides in five seconds turns a slow
          # reconcile into a failed deployment.
          DEADLINE = 300
          INTERVAL = 10
          
          SERVICE_ACCOUNT = "/var/run/secrets/kubernetes.io/serviceaccount"
          RUNSERVICES = ("https://kubernetes.default.svc/apis/run.cnrm.cloud.google.com"
                         "/v1beta1/namespaces/{}/runservices")
          
          def read_runservices():
              """Ask the API server, every time, rather than re-reading one stale file.
          
              The bottom of the wait loop used to re-open /tmp/runservices.json under
              a comment saying it re-read the RunServices "so a Config Connector
              condition that changes while this loop runs is seen rather than held
              from the first read". A shell curl wrote that file once, before python
              started, so every pass re-tested the conditions from second zero: a
              service that became Ready at second 11 was still reported unready at
              second 300, and the hook failed the sync it was watching succeed.
          
              Observing a change is the entire purpose of waiting, and that loop
              could observe none. The token is re-read with it because a projected
              service-account token is rotated, and re-reading costs nothing.
              """
              with open(SERVICE_ACCOUNT + "/namespace") as handle:
                  namespace = handle.read().strip()
              with open(SERVICE_ACCOUNT + "/token") as handle:
                  token = handle.read().strip()
              return json.loads(subprocess.check_output([
                  "curl", "-sSf", "--cacert", SERVICE_ACCOUNT + "/ca.crt",
                  "-H", "Authorization: Bearer " + token,
                  RUNSERVICES.format(namespace)])).get("items", [])
          
          def run_json(argv):
              """The argv is written out at each call site rather than assembled here.
          
              `gitops.rs` asserts this hook describes the routed revision, and it does
              that by looking for the literal call. A helper that builds the command
              from parts satisfies the behaviour and defeats the check -- so the parts
              stay at the call sites and this function only parses what comes back.
              """
              return json.loads(subprocess.check_output(argv))
          
          def conditions(obj, path):
              node = obj
              for key in path:
                  node = (node or {}).get(key) or {}
              return node if isinstance(node, list) else (obj.get("conditions") or [])
          
          def why_not_serving(name, project, region):
              """What Cloud Run itself says, when there is no revision serving traffic.
          
              The previous version of this hook reported "routes traffic to no
              revision" and stopped, which names the symptom and withholds the cause:
              a revision that failed to start, a revision that was never created, and
              a service nobody has asked to serve all read identically. Three runs
              were spent guessing between them.
              """
              detail = []
              try:
                  service = run_json(["gcloud", "run", "services", "describe", name,
                                      "--project", project, "--region", region, "--format=json"])
                  for condition in service.get("status", {}).get("conditions", []) or []:
                      if condition.get("status") != "True":
                          detail.append("service {}={}: {}".format(
                              condition.get("type"), condition.get("status"),
                              condition.get("message") or condition.get("reason") or "no message"))
                  latest = (service.get("status", {}).get("latestCreatedRevisionName")
                            or service.get("status", {}).get("latestReadyRevisionName"))
                  if not latest:
                      detail.append("no revision has ever been created for this service")
                      return detail
                  detail.append("latest revision is {}".format(latest))
                  revision = run_json(["gcloud", "run", "revisions", "describe", latest,
                                       "--project", project, "--region", region, "--format=json"])
                  for condition in revision.get("status", {}).get("conditions", []) or []:
                      if condition.get("status") != "True":
                          detail.append("revision {}={}: {}".format(
                              condition.get("type"), condition.get("status"),
                              condition.get("message") or condition.get("reason") or "no message"))
              except subprocess.CalledProcessError as error:
                  detail.append("could not read the service back: {}".format(error))
              return detail or ["Cloud Run reports no failing condition, so nothing has asked it to serve"]
          
          try:
              items = read_runservices()
          except (OSError, ValueError, subprocess.CalledProcessError) as error:
              sys.exit("could not read the RunServices from the API server: {}".format(error))
          if not items:
              sys.exit("no RunService exists in this namespace; the sync applied nothing this hook can prove")
          
          pending = {}
          for item in items:
              name = item["metadata"]["name"]
              workload = item["metadata"]["labels"]["qip-workload"]
              pending[name] = {
                  "project": item["spec"]["projectRef"]["external"].split("/")[-1],
                  "region": item["spec"]["location"],
                  "workload": workload,
                  "wanted": next(c["image"] for c in item["spec"]["template"]["containers"]
                                 if c["name"] == workload),
                  "item": item,
                  "last": "not checked yet",
              }
          
          started = time.time()
          while True:
              for name in list(pending):
                  state = pending[name]
                  workload, wanted = state["workload"], state["wanted"]
                  project, region = state["project"], state["region"]
                  ready = next((c for c in state["item"].get("status", {}).get("conditions", [])
                                if c.get("type") == "Ready"), None)
                  if ready is None or ready.get("status") != "True":
                      state["last"] = "Config Connector reports {}".format(ready)
                      continue
                  try:
                      described = run_json(["gcloud", "run", "services", "describe", name,
                                            "--project", project, "--region", region, "--format=json"])
                  except subprocess.CalledProcessError as error:
                      state["last"] = "gcloud could not describe the service: {}".format(error)
                      continue
                  routed = [t for t in described.get("status", {}).get("traffic", []) if t.get("percent")]
                  if not routed:
                      state["last"] = "Ready and routes traffic to no revision; " + "; ".join(
                          why_not_serving(name, project, region))
                      continue
                  mismatch = None
                  for entry in routed:
                      revision = entry.get("revisionName")
                      rev = run_json(["gcloud", "run", "revisions", "describe", revision,
                                      "--project", project, "--region", region, "--format=json"])
                      containers = rev.get("spec", {}).get("containers", [])
                      named = [c for c in containers if c.get("name") == workload]
                      if not named:
                          mismatch = "{} runs no container named {}; it runs {}".format(
                              revision, workload, [c.get("name") for c in containers])
                          break
                      serving = named[0]["image"]
                      if serving != wanted:
                          mismatch = "{} serves {}; the manifest names {}".format(revision, serving, wanted)
                          break
                  if mismatch:
                      state["last"] = mismatch
                      continue
                  print("{} serves {} from {}".format(name, wanted, routed[0].get("revisionName")))
                  del pending[name]
              if not pending:
                  break
              if time.time() - started > DEADLINE:
                  break
              print("still converging after {:.0f}s: {}".format(time.time() - started, ", ".join(sorted(pending))))
              sys.stdout.flush()
              time.sleep(INTERVAL)
              # Ask the API server again. This is the one read whose answer can differ
              # from the last, so holding it still is what made the wait pointless.
              # A failed re-read is reported and the loop continues on what it holds:
              # one refused request inside the deadline is not a failed deployment,
              # and the deadline still ends the wait.
              try:
                  refreshed = read_runservices()
              except (OSError, ValueError, subprocess.CalledProcessError) as error:
                  print("could not re-read the RunServices: {}".format(error))
                  sys.stdout.flush()
                  refreshed = []
              for item in refreshed:
                  if item["metadata"]["name"] in pending:
                      pending[item["metadata"]["name"]]["item"] = item
          
          if pending:
              sys.exit("\n".join("{}: {}".format(name, pending[name]["last"]) for name in sorted(pending)))
          PY
        # gcloud writes a configuration directory before it will run a
        # single command, and it derives the path from $HOME. This pod runs
        # `runAsNonRoot: true, runAsUser: 65532` with no HOME set, so HOME
        # is `/`, and the hook died on
        #
        #   ERROR: (gcloud.run.services.describe) Could not create
        #   directory [/.config/gcloud]: Permission denied.
        #
        # — nothing to do with Cloud Run, the digests, or any Google
        # permission, which is what the failure had been read as for three
        # runs. The Job reported only "reached the specified backoff limit",
        # because `backoffLimit: 0` plus `hook-delete-policy:
        # BeforeHookCreation` deletes the pod that failed before the next
        # attempt.
        #
        # CLOUDSDK_CONFIG names the directory directly rather than relying
        # on HOME, and HOME is set beside it because the SDK is not the only
        # thing here that may want one. Both point at the emptyDir below
        # rather than at a path in the image: the volume is writable by any
        # uid, so this does not depend on the vendored image's ownership,
        # and it survives that image being re-mirrored.
        env:
        - name: CLOUDSDK_CONFIG
          value: /tmp/gcloud
        - name: HOME
          value: /tmp
        volumeMounts:
        - name: scratch
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      volumes:
      # Writable scratch for the SDK's configuration directory, and nothing
      # else. `emptyDir` rather than a path in the image because the pod is
      # non-root and the image's directories are not its to write.
      - name: scratch
        emptyDir: {}
