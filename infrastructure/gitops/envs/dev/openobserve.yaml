# Generated shape, reviewed content. One file per environment rather than a
# kustomize base with replacements, so a reader — and the acceptance suite's
# parity test, which reads these files without a kustomize binary — sees
# every concrete value the running service must carry. The catalogue entry
# in infrastructure/terraform/catalogue.tf is the source of truth for each
# value here; a disagreement fails the build, not the sync (ADR 0036).
apiVersion: run.cnrm.cloud.google.com/v1beta1
kind: RunService
metadata:
  name: qip-dev-openobserve
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
    cnrm.cloud.google.com/project-id: algorik-dev
  labels:
    platform: qip
    environment: dev
    managed_by: config-connector
    live_capable: 'false'
    qip-plane: data-and-observability
    qip-trust-zone: management
    qip-traffic-class: platform
    qip-workload: openobserve
spec:
  projectRef:
    external: projects/algorik-dev
  location: us-east4
  # ADR 0033's authenticated posture, as modules/openobserve derives it
  # (`run_service_ingress`, instantiated from catalogue.tf as
  # `module.openobserve_access`): a load balancer is the only thing admitted
  # from outside the VPC, so the service's own run.app URL is no route around
  # the Identity-Aware Proxy that load balancer is to carry. No such load
  # balancer exists yet, and `invokers.yaml` names no invoker on this service,
  # so today OpenObserve answers nobody. That is the failure direction ADR 0033
  # chose: reachable by nobody until the front door is built, never reachable
  # by anybody. This line was `INGRESS_TRAFFIC_ALL` under ADR 0030, beside an
  # anonymous invoker, which made a store of the desk's cycle, refusal and
  # order telemetry anonymously writable the moment the reconciler ran.
  ingress: INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER
  binaryAuthorization:
    useDefault: true
  template:
    serviceAccountRef:
      external: qip-openobserve-dev@algorik-dev.iam.gserviceaccount.com
    vpcAccess:
      egress: ALL_TRAFFIC
      networkInterfaces:
      - networkRef:
          external: projects/algorik-dev/global/networks/qip-dev
        subnetworkRef:
          external: projects/algorik-dev/regions/us-east4/subnetworks/qip-dev-tz-management
        tags:
        - qip-dev-tz-management
    scaling:
      minInstanceCount: 0
      maxInstanceCount: 4
    maxInstanceRequestConcurrency: 20
    timeout: 300s
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    containers:
    - name: openobserve
      image: openobserve
      ports:
      - containerPort: 5080
      resources:
        limits:
          cpu: '2'
          memory: 2Gi
        cpuIdle: true
        startupCpuBoost: true
      env:
      - name: ZO_LOCAL_MODE
        value: 'true'
      - name: ZO_LOCAL_MODE_STORAGE
        value: disk
      - name: ZO_ROOT_USER_EMAIL
        valueSource:
          secretKeyRef:
            secretRef:
              external: qip-openobserve-root-email-dev
            versionRef:
              external: latest
      - name: ZO_ROOT_USER_PASSWORD
        valueSource:
          secretKeyRef:
            secretRef:
              external: qip-openobserve-root-password-dev
            versionRef:
              external: latest
      startupProbe:
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 2
        failureThreshold: 10
        httpGet:
          path: /healthz
          port: 5080
      livenessProbe:
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
        httpGet:
          path: /healthz
          port: 5080
  traffic:
  - type: TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST
    percent: 100
