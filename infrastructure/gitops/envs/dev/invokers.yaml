# Generated shape, reviewed content. One file per environment rather than a
# kustomize base with replacements, so a reader — and the acceptance suite's
# parity test, which reads these files without a kustomize binary — sees
# every concrete value the running service must carry. The catalogue entry
# in infrastructure/terraform/catalogue.tf is the source of truth for each
# value here; a disagreement fails the build, not the sync (ADR 0036).
# Who may call each service. Nothing, unless a member is named here: the
# module's invoker binding left with the service (ADR 0036 decision 5), and
# these are its manifest form.
#
# OpenObserve has no binding here, and that is ADR 0033 applied rather than
# an omission. Its invoker set is `module.openobserve_access.invoker_members`
# in catalogue.tf — the named principals under the authenticated posture, and
# nobody while none is named — and `infrastructure.rs` holds this file to it.
# Until 2026-09-26 a binding here gave the anonymous principal
# `roles/run.invoker` on qip-dev-openobserve under ADR 0030, which made the
# store holding the desk's cycle, refusal and order telemetry writable by
# anyone the moment the reconciler ran. No grant means OpenObserve answers
# nobody until an operator is named, which is the direction ADR 0033 chose.
# `gitops.rs` refuses any manifest under envs/ that names either anonymous
# principal, annotations included, so a `qip.algorik.ai/why` below must not
# spell one; this comment is not parsed and may describe it.
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: qip-dev-api-invoker-qip-dev-console
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
    qip.algorik.ai/why: The console reaches the API as its named invoker over the VPC (ADR 0018); catalogue.tf's
      api.invokers.
spec:
  member: serviceAccount:qip-dev-console@algorik-dev.iam.gserviceaccount.com
  role: roles/run.invoker
  resourceRef:
    apiVersion: run.cnrm.cloud.google.com/v1beta1
    kind: RunService
    name: qip-dev-api
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: qip-dev-portal-invoker-iap
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
    qip.algorik.ai/why: Identity-Aware Proxy forwards as its own service agent, so the portal
      requires authentication and IAP is the one identity that may invoke it (ADR 0094, and
      unchanged by ADR 0095 — IAP forwards as its agent whether it sits on a load balancer or on
      the service itself, and Google's own Cloud Run IAP instructions ask for exactly this grant).
      Without this, IAP authenticates the caller correctly and the service answers 403, which
      reads as an access-list problem and is not one. The alternative — an anonymous invoker, which
      ADR 0030 once granted OpenObserve and ADR 0033 withdrew — is what makes ingress
      INGRESS_TRAFFIC_ALL safe here by its absence — with no anonymous grant a browser cannot reach
      this service without passing IAP, and an unenabled gate is a console nobody can reach rather
      than one anybody can. (The anonymous principal is deliberately not named in this sentence.
      `gitops.rs` counts the manifests under this directory whose serialised text names that
      identifier and admits none, so writing it here would fail the test by documenting it — the same trap
      `infrastructure.rs` names about the accessor role.) The principal below is written out
      rather than derived because a manifest has no variables; it is the agent Google creates for
      this project number, and `console_route.rs` rebuilds it from the tfvars and compares.
spec:
  member: serviceAccount:service-95200532413@gcp-sa-iap.iam.gserviceaccount.com
  role: roles/run.invoker
  resourceRef:
    apiVersion: run.cnrm.cloud.google.com/v1beta1
    kind: RunService
    name: qip-dev-portal
