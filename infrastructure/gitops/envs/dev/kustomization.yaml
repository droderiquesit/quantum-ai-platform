# What runs in dev, by digest.
#
# Every `image:` in the manifests beside this file is a logical name —
# `qip-api`, `envoy`, `openobserve` — and this `images` block is where each
# becomes a registry path and a digest. One place, on purpose: it is the
# file Kargo's promotion commit edits (`kustomize-set-image`, ADR 0036
# decision 6), it is what the parity test reads for "by digest, never a
# tag", and it is the record of what dev serves that images.tfvars used to
# be. A tag here is refused by the test; `TO-PIN` marks an environment
# nothing has ever built for, and stays until the first promotion into it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qip-run
resources:
- api.yaml
- fastbrain.yaml
- deepbrain.yaml
- openobserve.yaml
- invokers.yaml
- prove-serving.yaml
images:
- name: qip-api
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/qip-api
  digest: sha256:e648888dfaf156e1843fea6acc9462853d075fb29250c2749b45627a05dc089a
- name: qip-fastbrain
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/qip-fastbrain
  digest: sha256:209e9f2cd98672d9f61dd47e9a160593e0e17cbbbd7f7787d14688d1a75ece01
- name: qip-deepbrain
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/qip-deepbrain
  digest: sha256:23d11234ef9a068e727ad5ab85534220f7e4a9dfcb95931e313806d361a8797c
- name: openobserve
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/vendor/openobserve
  digest: sha256:88fb692ac791d3eaff69653a4a4686f1c7eceb9e105491d58d29ac2739560b3b
- name: envoy
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/vendor/envoy
  digest: sha256:574348fada8eb1130b448132287d76626dfb07525b16668075382f8e154a45a8
- name: google-cloud-cli
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/vendor/google-cloud-cli
  digest: sha256:0673a69a1e178abb079941b326e718aedf3f57bdf5343465e365d826472edd83
