# What runs in dev, by digest.
#
# Every `image:` in the manifests beside this file is a logical name —
# `qip-api`, `envoy`, `openobserve` — and this `images` block is where each
# becomes a registry path and a digest. One place, on purpose: it is the
# file Kargo's promotion commit edits (`kustomize-set-image`, ADR 0036
# decision 6), it is what the parity test reads for "by digest, never a
# tag", and it is the record of what dev serves that images.tfvars used to
# be. A tag here is refused by the test; `TO-PIN` marks an environment
# nothing has ever built for, and stays until the first promotion into it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qip-run
resources:
- api.yaml
- fastbrain.yaml
- deepbrain.yaml
- openobserve.yaml
- portal.yaml
- invokers.yaml
- prove-serving.yaml
images:
- name: qip-api
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/qip-api
  digest: sha256:14fd83be4ed0357212723e9248edec0a4e7d105623ccece040014e454ae39175
- name: qip-fastbrain
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/qip-fastbrain
  digest: sha256:c9f2cb45c72165beb6ada19f88ac7fefcdb9dfe4c50420557e3328142e2dd25c
- name: qip-deepbrain
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/qip-deepbrain
  digest: sha256:ab01314a2b2ff156df2663622beab6984cfeb7fd4eb4cc24b46710f3af6edd19
# The console (ADR 0094). `TO-PIN` rather than a digest, and it is the honest
# value rather than a placeholder somebody forgot: `deploy.yml` gained the
# portal's build in the same commit as this line, and no run of it has
# happened, so this repository has never held bytes for `qip-portal` and there
# is no digest to write. Argo CD will not reconcile a service whose image is
# this string, which is the correct behaviour — a console that deploys from a
# name nobody attested is exactly what Binary Authorization exists to stop.
# It goes when a `deploy.yml` run has built, scanned and attested the image
# and the digest is reviewed. Wiring `qip-portal` into Kargo's warehouse, so a
# promotion keeps it pinned the way it keeps the three binaries pinned, is
# named in ADR 0094 as the follow-on and is deliberately not done here.
- name: qip-portal
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/qip-portal
  digest: TO-PIN
- name: openobserve
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/vendor/openobserve
  digest: sha256:88fb692ac791d3eaff69653a4a4686f1c7eceb9e105491d58d29ac2739560b3b
- name: envoy
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/vendor/envoy
  digest: sha256:574348fada8eb1130b448132287d76626dfb07525b16668075382f8e154a45a8
- name: google-cloud-cli
  newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/vendor/google-cloud-cli
  digest: sha256:0673a69a1e178abb079941b326e718aedf3f57bdf5343465e365d826472edd83
