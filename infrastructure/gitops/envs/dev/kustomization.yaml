# What runs in dev, by digest.
#
# Every `image:` in the manifests beside this file is a logical name —
# `qip-api`, `envoy`, `openobserve` — and this `images` block is where each
# becomes a registry path and a digest. One place, on purpose: it is the
# file Kargo's promotion commit edits (`kustomize-set-image`, ADR 0036
# decision 6), it is what the parity test reads for "by digest, never a
# tag", and it is the record of what dev serves that images.tfvars used to
# be. A tag here is refused by the test; `TO-PIN` marks an environment
# nothing has ever built for, and stays until the first promotion into it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qip-run
resources:
- api.yaml
- fastbrain.yaml
- deepbrain.yaml
- openobserve.yaml
- portal.yaml
- invokers.yaml
- prove-serving.yaml
images:
- name: qip-api
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/qip-api
  digest: sha256:abf392d2925a8bfc4be340745d1b1b8ff922e4afd31717c89d8251e513c0105a
- name: qip-fastbrain
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/qip-fastbrain
  digest: sha256:c61ae84d8cab85caeb0eb7c3fcddbdb3c5aefe01e9aaff9a73812312b6150ca9
- name: qip-deepbrain
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/qip-deepbrain
  digest: sha256:3d1bd51e93a2d0efd23af257cd8b292d81646f5d4471876452d746aa3c4c4bcb
# The console (ADR 0094). Pinned by hand to the first digest any run has
# produced: deploy.yml run 268 (2026-10-13, commit 0053f401) built, scanned,
# pushed and attested it — `docker push` reported this digest and the run's
# attestation step signed it under the dev attestor. Until that run this was
# `TO-PIN`, because the repository had never held bytes for `qip-portal`.
# By hand, and not by Kargo, because wiring `qip-portal` into Kargo's
# warehouse is ADR 0094's named follow-on and is still not done: until it
# is, every later portal digest is a reviewed edit of this line.
- name: qip-portal
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/qip-portal
  digest: sha256:11183f8dbfa530921c312acd4e75197511b7105b27f78059a1f75618ccb9f0f8
- name: openobserve
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/vendor/openobserve
  digest: sha256:88fb692ac791d3eaff69653a4a4686f1c7eceb9e105491d58d29ac2739560b3b
- name: envoy
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/vendor/envoy
  digest: sha256:574348fada8eb1130b448132287d76626dfb07525b16668075382f8e154a45a8
- name: google-cloud-cli
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/vendor/google-cloud-cli
  digest: sha256:0673a69a1e178abb079941b326e718aedf3f57bdf5343465e365d826472edd83
