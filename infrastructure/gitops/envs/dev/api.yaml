# Generated shape, reviewed content. One file per environment rather than a
# kustomize base with replacements, so a reader — and the acceptance suite's
# parity test, which reads these files without a kustomize binary — sees
# every concrete value the running service must carry. The catalogue entry
# in infrastructure/terraform/catalogue.tf is the source of truth for each
# value here; a disagreement fails the build, not the sync (ADR 0036).
apiVersion: run.cnrm.cloud.google.com/v1beta1
kind: RunService
metadata:
  name: qip-dev-api
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
    cnrm.cloud.google.com/project-id: algorik-qip-dev
  labels:
    platform: qip
    environment: dev
    managed_by: config-connector
    live_capable: 'false'
    qip-plane: experience-and-identity
    qip-trust-zone: application-identity
    qip-traffic-class: customer
    qip-workload: api
spec:
  projectRef:
    external: projects/algorik-qip-dev
  location: us-east4
  ingress: INGRESS_TRAFFIC_INTERNAL_ONLY
  binaryAuthorization:
    useDefault: true
  template:
    serviceAccountRef:
      external: qip-api-dev@algorik-qip-dev.iam.gserviceaccount.com
    vpcAccess:
      egress: ALL_TRAFFIC
      networkInterfaces:
      - networkRef:
          external: projects/algorik-qip-dev/global/networks/qip-dev-service
        subnetworkRef:
          external: projects/algorik-qip-dev/regions/us-east4/subnetworks/qip-dev-tz-application-identity
        tags:
        - qip-dev-tz-application-identity
    scaling:
      minInstanceCount: 0
      maxInstanceCount: 4
    maxInstanceRequestConcurrency: 80
    timeout: 300s
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    containers:
    - name: api
      image: qip-api
      dependsOn:
      - qip-egress
      ports:
      - containerPort: 8080
      resources:
        limits:
          cpu: '2'
          memory: 1Gi
        cpuIdle: true
        startupCpuBoost: true
      env:
      - name: QIP_ALPACA_API_KEY_ID_FILE
        value: /var/run/secrets/qip/alpaca-api-key-id/alpaca-api-key-id
      - name: QIP_ALPACA_API_SECRET_KEY_FILE
        value: /var/run/secrets/qip/alpaca-api-secret-key/alpaca-api-secret-key
      - name: QIP_API_ADDRESS
        value: 0.0.0.0:8080
      - name: QIP_AUTONOMY_CEILING
        value: paper_trading
      - name: QIP_CAPITAL_ENVELOPE_KEY_FILE
        value: /var/run/secrets/qip/capital-envelope-key/capital-envelope-key
      - name: QIP_DEPLOYMENT
        value: dev
      - name: QIP_STORAGE_TARGET
        value: memory
      - name: QIP_TOKEN_ANALYST_FILE
        value: /var/run/secrets/qip/token-analyst/token-analyst
      - name: QIP_TOKEN_MONITOR_FILE
        value: /var/run/secrets/qip/token-monitor/token-monitor
      - name: QIP_TOKEN_OPERATOR_FILE
        value: /var/run/secrets/qip/token-operator/token-operator
      - name: QIP_TOKEN_VIEWER_FILE
        value: /var/run/secrets/qip/token-viewer/token-viewer
      - name: QIP_UNIVERSE_PATH
        value: /etc/qip/931c5fe44d20d1d9/universe.json
      volumeMounts:
      - name: alpaca-api-key-id
        mountPath: /var/run/secrets/qip/alpaca-api-key-id
      - name: alpaca-api-secret-key
        mountPath: /var/run/secrets/qip/alpaca-api-secret-key
      - name: capital-envelope-key
        mountPath: /var/run/secrets/qip/capital-envelope-key
      - name: token-analyst
        mountPath: /var/run/secrets/qip/token-analyst
      - name: token-monitor
        mountPath: /var/run/secrets/qip/token-monitor
      - name: token-operator
        mountPath: /var/run/secrets/qip/token-operator
      - name: token-viewer
        mountPath: /var/run/secrets/qip/token-viewer
      - name: config-files
        mountPath: /etc/qip/931c5fe44d20d1d9
      startupProbe:
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 2
        failureThreshold: 10
        httpGet:
          path: /api/v1
          port: 8080
      livenessProbe:
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
        httpGet:
          path: /api/v1
          port: 8080
    - name: qip-egress
      image: envoy
      args:
      - -c
      - /etc/envoy/envoy-760e37df4041e228.yaml
      - --service-cluster
      - qip-egress
      - --log-level
      - warn
      resources:
        limits:
          cpu: '1'
          memory: 256Mi
      volumeMounts:
      - name: egress-bootstrap
        mountPath: /etc/envoy
      startupProbe:
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 15
        httpGet:
          path: /healthz
          port: 9900
    volumes:
    - name: alpaca-api-key-id
      secret:
        secretRef:
          external: qip-alpaca-api-key-id-dev
        defaultMode: 256
        items:
        - path: alpaca-api-key-id
          mode: 256
          versionRef:
            external: latest
    - name: alpaca-api-secret-key
      secret:
        secretRef:
          external: qip-alpaca-api-secret-key-dev
        defaultMode: 256
        items:
        - path: alpaca-api-secret-key
          mode: 256
          versionRef:
            external: latest
    - name: capital-envelope-key
      secret:
        secretRef:
          external: qip-capital-envelope-key-dev
        defaultMode: 256
        items:
        - path: capital-envelope-key
          mode: 256
          versionRef:
            external: latest
    - name: token-analyst
      secret:
        secretRef:
          external: qip-token-analyst-dev
        defaultMode: 256
        items:
        - path: token-analyst
          mode: 256
          versionRef:
            external: latest
    - name: token-monitor
      secret:
        secretRef:
          external: qip-token-monitor-dev
        defaultMode: 256
        items:
        - path: token-monitor
          mode: 256
          versionRef:
            external: latest
    - name: token-operator
      secret:
        secretRef:
          external: qip-token-operator-dev
        defaultMode: 256
        items:
        - path: token-operator
          mode: 256
          versionRef:
            external: latest
    - name: token-viewer
      secret:
        secretRef:
          external: qip-token-viewer-dev
        defaultMode: 256
        items:
        - path: token-viewer
          mode: 256
          versionRef:
            external: latest
    # The committed Envoy bootstrap as a secret volume, for the reason
    # config-files gives below: the CRD has no `gcs`, the field was pruned, and
    # infra.yml run 117 (2026-10-13) found this sidecar dying on
    # `Invalid path: /etc/envoy/envoy-760e37df4041e228.yaml`. Mode 292 (0444):
    # Envoy runs as its image's non-root user, and the bytes are a reviewed
    # file, not a credential.
    - name: egress-bootstrap
      secret:
        secretRef:
          external: qip-egress-bootstrap-dev
        defaultMode: 292
        items:
        - path: envoy-760e37df4041e228.yaml
          mode: 292
          versionRef:
            external: latest
    # The committed universe.json, projected flat by a secret volume, so the
    # hash directory QIP_UNIVERSE_PATH names is the mount point itself. It was
    # a `gcs` volume: the RunService CRD (v1.156.0, byte-identical at master)
    # admits only cloudSqlInstance, emptyDir and secret, so the API server
    # pruned the field, no revision ever held the file, and infra.yml run 117
    # (2026-10-13) found the fast brain exiting 78 unable to read the path
    # (ADR 0036, amendment of 2026-10-13). Mode 292 (0444) rather than the
    # credentials' 256 (0400): the bytes are a committed, reviewed file, not
    # a credential, and the image runs as a non-root user.
    - name: config-files
      secret:
        secretRef:
          external: qip-universe-catalogue-dev
        defaultMode: 292
        items:
        - path: universe.json
          mode: 292
          versionRef:
            external: latest
  traffic:
  - type: TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST
    percent: 100
