# Generated shape, reviewed content. One file per environment rather than a
# kustomize base with replacements, so a reader — and the acceptance suite's
# parity test, which reads these files without a kustomize binary — sees
# every concrete value the running service must carry. The catalogue entry
# in infrastructure/terraform/catalogue.tf is the source of truth for each
# value here; a disagreement fails the build, not the sync (ADR 0036).
apiVersion: run.cnrm.cloud.google.com/v1beta1
kind: RunService
metadata:
  name: qip-dev-api
  annotations:
    cnrm.cloud.google.com/deletion-policy: abandon
    cnrm.cloud.google.com/project-id: algorik-dev
  labels:
    platform: qip
    environment: dev
    managed_by: config-connector
    live_capable: 'false'
    qip-plane: experience-and-identity
    qip-trust-zone: application-identity
    qip-traffic-class: customer
    qip-workload: api
spec:
  projectRef:
    external: projects/algorik-dev
  location: us-east4
  ingress: INGRESS_TRAFFIC_INTERNAL_ONLY
  binaryAuthorization:
    useDefault: true
  template:
    serviceAccountRef:
      external: qip-api-dev@algorik-dev.iam.gserviceaccount.com
    vpcAccess:
      egress: ALL_TRAFFIC
      networkInterfaces:
      - networkRef:
          external: projects/algorik-dev/global/networks/qip-dev
        subnetworkRef:
          external: projects/algorik-dev/regions/us-east4/subnetworks/qip-dev-tz-application-identity
        tags:
        - qip-dev-tz-application-identity
    scaling:
      minInstanceCount: 0
      maxInstanceCount: 4
    maxInstanceRequestConcurrency: 80
    timeout: 300s
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    containers:
    - name: api
      image: qip-api
      dependsOn:
      - qip-egress
      ports:
      - containerPort: 8080
      resources:
        limits:
          cpu: '2'
          memory: 1Gi
        cpuIdle: true
        startupCpuBoost: true
      env:
      - name: QIP_API_ADDRESS
        value: 0.0.0.0:8080
      - name: QIP_AUTONOMY_CEILING
        value: paper_trading
      - name: QIP_CAPITAL_ENVELOPE_KEY_FILE
        value: /var/run/secrets/qip/capital-envelope-key/capital-envelope-key
      - name: QIP_STORAGE_TARGET
        value: memory
      - name: QIP_TOKEN_ANALYST_FILE
        value: /var/run/secrets/qip/token-analyst/token-analyst
      - name: QIP_TOKEN_APPROVER_FILE
        value: /var/run/secrets/qip/token-approver/token-approver
      - name: QIP_TOKEN_MONITOR_FILE
        value: /var/run/secrets/qip/token-monitor/token-monitor
      - name: QIP_TOKEN_OPERATOR_FILE
        value: /var/run/secrets/qip/token-operator/token-operator
      - name: QIP_TOKEN_VIEWER_FILE
        value: /var/run/secrets/qip/token-viewer/token-viewer
      - name: QIP_UNIVERSE_PATH
        value: /etc/qip/7ec25303c3f3ecac/universe.json
      volumeMounts:
      - name: capital-envelope-key
        mountPath: /var/run/secrets/qip/capital-envelope-key
      - name: token-analyst
        mountPath: /var/run/secrets/qip/token-analyst
      - name: token-approver
        mountPath: /var/run/secrets/qip/token-approver
      - name: token-monitor
        mountPath: /var/run/secrets/qip/token-monitor
      - name: token-operator
        mountPath: /var/run/secrets/qip/token-operator
      - name: token-viewer
        mountPath: /var/run/secrets/qip/token-viewer
      - name: config-files
        mountPath: /etc/qip
      startupProbe:
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 2
        failureThreshold: 10
        httpGet:
          path: /api/v1
          port: 8080
      livenessProbe:
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
        httpGet:
          path: /api/v1
          port: 8080
    - name: qip-egress
      image: envoy
      args:
      - -c
      - /etc/envoy/envoy-fc9574203f973d2d.yaml
      - --service-cluster
      - qip-egress
      - --log-level
      - warn
      resources:
        limits:
          cpu: '1'
          memory: 256Mi
      volumeMounts:
      - name: egress-bootstrap
        mountPath: /etc/envoy
      startupProbe:
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 15
        httpGet:
          path: /healthz
          port: 9900
    volumes:
    - name: capital-envelope-key
      secret:
        secretRef:
          external: qip-capital-envelope-key-dev
        defaultMode: 256
        items:
        - path: capital-envelope-key
          mode: 256
          versionRef:
            external: latest
    - name: token-analyst
      secret:
        secretRef:
          external: qip-token-analyst-dev
        defaultMode: 256
        items:
        - path: token-analyst
          mode: 256
          versionRef:
            external: latest
    - name: token-approver
      secret:
        secretRef:
          external: qip-token-approver-dev
        defaultMode: 256
        items:
        - path: token-approver
          mode: 256
          versionRef:
            external: latest
    - name: token-monitor
      secret:
        secretRef:
          external: qip-token-monitor-dev
        defaultMode: 256
        items:
        - path: token-monitor
          mode: 256
          versionRef:
            external: latest
    - name: token-operator
      secret:
        secretRef:
          external: qip-token-operator-dev
        defaultMode: 256
        items:
        - path: token-operator
          mode: 256
          versionRef:
            external: latest
    - name: token-viewer
      secret:
        secretRef:
          external: qip-token-viewer-dev
        defaultMode: 256
        items:
        - path: token-viewer
          mode: 256
          versionRef:
            external: latest
    - name: egress-bootstrap
      gcs:
        bucket: qip-egress-dev-algorik-dev
        readOnly: true
    - name: config-files
      gcs:
        bucket: qip-config-dev-api-algorik-dev
        readOnly: true
  traffic:
  - type: TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST
    percent: 100
