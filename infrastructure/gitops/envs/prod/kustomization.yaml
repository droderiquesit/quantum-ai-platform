# What runs in prod, by digest.
#
# Every `image:` in the manifests beside this file is a logical name —
# `qip-api`, `envoy`, `openobserve` — and this `images` block is where each
# becomes a registry path and a digest. One place, on purpose: it is the
# file Kargo's promotion commit edits (`kustomize-set-image`, ADR 0036
# decision 6), it is what the parity test reads for "by digest, never a
# tag", and it is the record of what prod serves that images.tfvars used to
# be. A tag here is refused by the test; `TO-PIN` marks an environment
# nothing has ever built for, and stays until the first promotion into it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qip-run
resources:
- api.yaml
- fastbrain.yaml
- deepbrain.yaml
- invokers.yaml
- prove-serving.yaml
#
# The three platform images come from the one build registry, `qip-dev`,
# not from prod's own: `deploy.yml` builds each commit once and the digest
# is promoted, never rebuilt, so prod would run exactly the bytes every
# earlier stage ran (R12 CICD-9112). Nothing promotes into prod today — its
# Kargo stage refuses. The vendored images below are mirrored per
# environment and stay in prod's registry.
images:
- name: qip-api
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/qip-api
  digest: TO-PIN
- name: qip-fastbrain
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/qip-fastbrain
  digest: TO-PIN
- name: qip-deepbrain
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/qip-deepbrain
  digest: TO-PIN
- name: envoy
  newName: europe-west2-docker.pkg.dev/unprovisioned/qip-prod/vendor/envoy
  digest: sha256:574348fada8eb1130b448132287d76626dfb07525b16668075382f8e154a45a8
- name: google-cloud-cli
  newName: europe-west2-docker.pkg.dev/unprovisioned/qip-prod/vendor/google-cloud-cli
  digest: sha256:0673a69a1e178abb079941b326e718aedf3f57bdf5343465e365d826472edd83
