# Config Connector's one object. The operator itself is the GKE addon
# `modules/gitops-control-plane` enables — nothing here installs it — and this
# is what turns it on: cluster mode, acting as one Google identity for every
# namespace. The overlay names the identity; the namespace the RunService
# manifests land in is the overlay's too, because its project annotation is
# the environment's.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configconnector.yaml
