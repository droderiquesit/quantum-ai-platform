# Every plaintext request becomes a redirect, and nothing is served over it.
#
# The HTTP listener exists because a person types a hostname without a scheme
# and their browser tries port 80 first. Answering that with a 301 to HTTPS is
# the difference between "it doesn't work" and a working front door; answering
# it with content would put a session cookie on the wire.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gitops-gateway
spec:
  parentRefs:
    - name: gitops
      namespace: gitops-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
