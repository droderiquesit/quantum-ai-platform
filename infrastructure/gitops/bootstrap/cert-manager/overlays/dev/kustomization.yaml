# cert-manager for dev: the vendored manifest, with every image moved to
# this environment's own registry at the digest infrastructure/egress/
# vendored-images.txt reviewed and vendor.yml mirrored and attested. The
# cluster's Binary Authorization policy admits nothing else, so an overlay
# that named the upstream repository would produce Pods that never start.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
images:
- name: quay.io/jetstack/cert-manager-controller
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/vendor/cert-manager-controller
  digest: sha256:416a2d76870d996460e62bd7f521bf14fa017be9e3e904aab92163a331fcb61a
- name: quay.io/jetstack/cert-manager-webhook
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/vendor/cert-manager-webhook
  digest: sha256:d8b3961b51c8c7320633f8208dc46bf88aa13804d0f7cbe48a096b2c523cee42
- name: quay.io/jetstack/cert-manager-cainjector
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/vendor/cert-manager-cainjector
  digest: sha256:ccf6b919ec0500745a47a910118f834f9636d0aac1ff221245cd2557ed8c7c98
patches:
- target:
    kind: Deployment
    name: cert-manager
    namespace: cert-manager
  # Requests for every cert-manager pod (owner decision 9 of 2026-10-25,
  # docs/blueprint/owner-decisions-2026-10-25.md). The vendored manifest sets
  # none, and GKE Autopilot bills a container with no request at its default
  # of 0.5 vCPU and 2 GiB. cert-manager here issues the one Certificate
  # Kargo's webhooks need. The controller and the cainjector watch the
  # cluster's resources and keep a cache (50m, 128Mi); the webhook only
  # answers admission calls (50m, 64Mi). Each pair sits inside Autopilot's
  # 1:1 to 1:6.5 vCPU-to-GiB ratio. Requests only, no limit. Whether they
  # suffice under load is unverified until a cluster runs them.
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cert-manager
      namespace: cert-manager
    spec:
      template:
        spec:
          containers:
          - name: cert-manager-controller
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
- target:
    kind: Deployment
    name: cert-manager-cainjector
    namespace: cert-manager
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cert-manager-cainjector
      namespace: cert-manager
    spec:
      template:
        spec:
          containers:
          - name: cert-manager-cainjector
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
- target:
    kind: Deployment
    name: cert-manager-webhook
    namespace: cert-manager
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cert-manager-webhook
      namespace: cert-manager
    spec:
      template:
        spec:
          containers:
          - name: cert-manager-webhook
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
