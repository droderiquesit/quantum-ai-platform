# Argo CD for dev: the vendored manifest, with every image moved to
# this environment's own registry at the digest infrastructure/egress/
# vendored-images.txt reviewed and vendor.yml mirrored and attested. The
# cluster's Binary Authorization policy admits nothing else, so an overlay
# that named the upstream repository would produce Pods that never start.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
images:
- name: quay.io/argoproj/argocd
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/vendor/argocd-patched
  digest: sha256:d0c2521327609c71da266792ccf3118f39df71e74205695d518bcedebce63f49
- name: public.ecr.aws/docker/library/redis
  newName: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev/vendor/redis
  digest: sha256:e957842a3e7962bfe3e5ab9814eab06e029a2f0d7b0f5d74178af12713b9ab4d
patches:
- target:
    kind: ServiceAccount
    name: argocd-repo-server
  patch: "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: argocd-repo-server\n  annotations:\n\
    \    iam.gke.io/gcp-service-account: qip-dev-argocd@algorik-qip-dev.iam.gserviceaccount.com\n"
- target:
    kind: ConfigMap
    name: argocd-cm
  # `url` is what Argo CD puts in every link it generates and every OAuth
  # redirect it builds. It said `https://argocd.qip-dev.internal`, a name
  # that resolves nowhere, which was honest while nothing reached the
  # service and is wrong now that something does.
  #
  # `admin.enabled` goes back to true here, and the base's `false` is left
  # alone on purpose. The base is what an environment with no front door
  # gets: no Dex, no local account, nothing to authenticate as, which is the
  # right posture for a service nobody can reach. This overlay is the one
  # that puts a load balancer in front, so it is the one that owes the
  # cluster an identity to log in with — and the credential it uses is
  # projected from Secret Manager by the bootstrap, never written here.
  #
  # The account is the *second* gate. IAP decides who may reach the service;
  # this decides who may act on it. Read the tfvars section that enables the
  # front door for why one of those alone is not enough.
  #
  # `resource.customizations.health.*` teaches Argo CD to read a Config
  # Connector resource, and without it a sync never concludes.
  #
  # Observed, not theorised. `infra.yml` run 72 found the dev Application at
  # `phase=Running` with
  #
  #   message=waiting for healthy state of
  #   iam.cnrm.cloud.google.com/IAMPolicyMember/... and 1 more resources
  #
  # and a `startedAt` four hours old — the same instant run 70 printed, so
  # the operation had never re-attempted. **A sync that cannot conclude is
  # worse than one that fails**: the per-object results freeze at the first
  # attempt, so run 72 reported the very 403 that had been fixed an hour
  # earlier by an Artifact Registry grant, and the report read as a fix that
  # had not worked. A stale result is indistinguishable from a fresh one.
  #
  # Every Config Connector resource carries `status.conditions[]` with a
  # `Ready` condition, so one script serves both kinds. Ready/True is
  # Healthy; Ready/False is **Degraded, carrying the controller's own reason
  # and message out** — a RunService that cannot pull its image should say so
  # where an operator looks, not make somebody read a sync result to find
  # out. Anything else is Progressing, which is what an unreconciled
  # resource honestly is.
  #
  # Degraded rather than Suspended on a false Ready, deliberately: a resource
  # Google refused is a failure, and reporting it as anything softer is the
  # "reads as protection, cannot fire" shape this repository refuses.
  #
  # Written as a block scalar rather than the one-line escaped form the
  # sibling patches use, because a Lua script inside `\n`-escaped quotes is
  # unreadable and the first attempt at it produced a file that did not
  # parse.
  patch: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: argocd-cm
    data:
      url: https://argocd.algorik.ai
      admin.enabled: "true"
      resource.customizations.health.iam.cnrm.cloud.google.com_IAMPolicyMember: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, c in ipairs(obj.status.conditions) do
            if c.type == "Ready" then
              if c.status == "True" then
                hs.status = "Healthy"
                hs.message = c.message or "ready"
                return hs
              end
              if c.status == "False" then
                hs.status = "Degraded"
                hs.message = (c.reason or "NotReady") .. ": " .. (c.message or "")
                return hs
              end
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Config Connector has not reported Ready yet"
        return hs
      resource.customizations.health.run.cnrm.cloud.google.com_RunService: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, c in ipairs(obj.status.conditions) do
            if c.type == "Ready" then
              if c.status == "True" then
                hs.status = "Healthy"
                hs.message = c.message or "ready"
                return hs
              end
              if c.status == "False" then
                hs.status = "Degraded"
                hs.message = (c.reason or "NotReady") .. ": " .. (c.message or "")
                return hs
              end
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Config Connector has not reported Ready yet"
        return hs
- target:
    kind: ConfigMap
    name: argocd-cmd-params-cm
  # TLS terminates at the load balancer, so argocd-server speaks plaintext
  # to it and must be told to stop redirecting to HTTPS itself.
  #
  # Without this the server answers the health check with a 308 to https,
  # the backend never becomes healthy, and the Gateway serves 502 for a
  # service that is running perfectly well. `insecure` names the hop between
  # Google's front end and the Pod, inside the VPC, after IAP has already
  # decided the caller may be there — not the hop a browser makes.
  patch: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: argocd-cmd-params-cm\ndata:\n  server.insecure: \"true\"\n"
- target:
    kind: Deployment
    name: argocd-applicationset-controller
  # Two controllers this platform never uses, removed from dev (owner
  # decision 9 of 2026-10-25, docs/blueprint/owner-decisions-2026-10-25.md).
  # Nothing in this repository declares an ApplicationSet
  # (`grep -rn 'kind: ApplicationSet' infrastructure/gitops` outside upstream/
  # finds nothing) and nothing configures a notification: argocd-notifications-cm
  # carries upstream's empty default. Each was a pod with no requests, which
  # GKE Autopilot bills at its default size whether or not it does anything.
  # The objects that exist only to run them go with them: the Deployment, its
  # Service, its identity, its RBAC and its NetworkPolicy. The CRD, the empty
  # argocd-notifications-cm and argocd-notifications-secret stay: they hold no
  # process, argocd-server serves the ApplicationSet API from the CRD alone,
  # and deleting a CRD is the one removal here that would delete objects too.
  #
  # `apply` in infra.yml is `kubectl apply --server-side` without `--prune`,
  # so on a cluster that already runs these two, removing them here stops
  # nothing. A recreated cluster never gets them; a surviving one needs them
  # deleted by a person (docs/ops/runbooks/dev-redeploy-readiness.md, §5).
  patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-applicationset-controller
- target:
    kind: Service
    name: argocd-applicationset-controller
  patch: |
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: argocd-applicationset-controller
- target:
    kind: ServiceAccount
    name: argocd-applicationset-controller
  patch: |
    $patch: delete
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: argocd-applicationset-controller
- target:
    kind: Role
    name: argocd-applicationset-controller
  patch: |
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: argocd-applicationset-controller
- target:
    kind: RoleBinding
    name: argocd-applicationset-controller
  patch: |
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: argocd-applicationset-controller
- target:
    kind: ClusterRole
    name: argocd-applicationset-controller
  patch: |
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: argocd-applicationset-controller
- target:
    kind: ClusterRoleBinding
    name: argocd-applicationset-controller
  patch: |
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: argocd-applicationset-controller
- target:
    kind: NetworkPolicy
    name: argocd-applicationset-controller-network-policy
  patch: |
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-applicationset-controller-network-policy
- target:
    kind: Deployment
    name: argocd-notifications-controller
  patch: |
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-notifications-controller
- target:
    kind: Service
    name: argocd-notifications-controller-metrics
  patch: |
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: argocd-notifications-controller-metrics
- target:
    kind: ServiceAccount
    name: argocd-notifications-controller
  patch: |
    $patch: delete
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: argocd-notifications-controller
- target:
    kind: Role
    name: argocd-notifications-controller
  patch: |
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: argocd-notifications-controller
- target:
    kind: RoleBinding
    name: argocd-notifications-controller
  patch: |
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: argocd-notifications-controller
- target:
    kind: NetworkPolicy
    name: argocd-notifications-controller-network-policy
  patch: |
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: argocd-notifications-controller-network-policy
- target:
    kind: StatefulSet
    name: argocd-application-controller
  # Requests for every Argo CD pod that stays (owner decision 9). Upstream
  # sets none, and GKE Autopilot bills a container with no request at its
  # default of 0.5 vCPU and 2 GiB, so six mostly idle controllers were billed
  # as six half-cores. The figures are the argo-helm chart's own commented
  # examples raised to this platform's load: the application controller
  # reconciles one Application (250m, 512Mi); the repo server renders
  # kustomizations of up to 34,050 lines, so it keeps memory (100m, 512Mi);
  # the server and redis are near idle (50m, 128Mi and 50m, 64Mi); the two
  # init containers copy a file and run a script (50m, 64Mi). Each pair sits
  # inside Autopilot's 1:1 to 1:6.5 vCPU-to-GiB ratio, so Autopilot does not
  # resize it. Requests only: no limit is set here, so this changes what is
  # reserved and billed, not when a pod is throttled or killed. Whether these
  # are enough under real load is unverified until a cluster runs them.
  patch: |
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: argocd-application-controller
    spec:
      template:
        spec:
          containers:
          - name: argocd-application-controller
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
- target:
    kind: Deployment
    name: argocd-repo-server
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-repo-server
    spec:
      template:
        spec:
          initContainers:
          - name: copyutil
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
          containers:
          - name: argocd-repo-server
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
- target:
    kind: Deployment
    name: argocd-server
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-server
    spec:
      template:
        spec:
          containers:
          - name: argocd-server
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
- target:
    kind: Deployment
    name: argocd-redis
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-redis
    spec:
      template:
        spec:
          initContainers:
          - name: secret-init
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
          containers:
          - name: redis
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
