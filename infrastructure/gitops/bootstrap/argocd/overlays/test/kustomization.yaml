# Argo CD for test: the vendored manifest, with every image moved to
# this environment's own registry at the digest infrastructure/egress/
# vendored-images.txt reviewed and vendor.yml mirrored and attested. The
# cluster's Binary Authorization policy admits nothing else, so an overlay
# that named the upstream repository would produce Pods that never start.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
images:
- name: quay.io/argoproj/argocd
  newName: europe-west2-docker.pkg.dev/unprovisioned/qip-test/vendor/argocd-patched
  digest: sha256:da7f314017cdc8e59475889137d0d7d1ee16b1f4b5b7778c7508649e450749a5
- name: public.ecr.aws/docker/library/redis
  newName: europe-west2-docker.pkg.dev/unprovisioned/qip-test/vendor/redis
  digest: sha256:e957842a3e7962bfe3e5ab9814eab06e029a2f0d7b0f5d74178af12713b9ab4d
patches:
- target:
    kind: ServiceAccount
    name: argocd-repo-server
  patch: "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: argocd-repo-server\n  annotations:\n\
    \    iam.gke.io/gcp-service-account: qip-test-argocd@unprovisioned.iam.gserviceaccount.com\n"
- target:
    kind: ConfigMap
    name: argocd-cm
  patch: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: argocd-cm\ndata:\n  url: https://argocd.qip-test.internal\n"
