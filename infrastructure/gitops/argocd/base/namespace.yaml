# The namespace Argo CD reconciles from, governed like the one it reconciles.
#
# Same restricted pod-security posture as the qip namespace: the reconciler
# holds cluster-admin-shaped RBAC by its nature, which is a reason for more
# containment of its pods, not less.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    name: argocd
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Deny everything, then permit what is named. The upstream install ships
# ingress policies per component; this is the egress half it does not ship,
# declared first so a manifest applied out of order fails closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# DNS, which everything needs and which the default deny would otherwise
# break.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # NodeLocal DNSCache breaks the selector rule above, invisibly: it
    # intercepts queries to the kube-dns ClusterIP with a NOTRACK rule on
    # the node, so the packet keeps the service VIP as its destination and
    # the datapath never translates it to a kube-dns pod the selector could
    # match. The policy engine is left asking an ipBlock question about
    # 10.8.0.10 — the VIP, service_cidr's tenth address — and until this
    # rule existed the answer was deny: every DNS query in this namespace
    # timed out, unnoticed because the platform workloads dial addresses,
    # not names. The argocd controller was the first process here to
    # resolve a name and found it immediately. Proven by probe, not
    # reasoning: a rule for the node subnet was tried first on the theory
    # the cache answers from the node, and resolution still timed out; this
    # VIP rule restored it within one retry. The selector rule stays for
    # the day the cache is disabled and the VIP resolves to real pods again.
    - to:
        - ipBlock:
            cidr: 10.8.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
