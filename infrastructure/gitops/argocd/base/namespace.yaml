# The namespace Argo CD reconciles from, governed like the one it reconciles.
#
# Same restricted pod-security posture as the qip namespace: the reconciler
# holds cluster-admin-shaped RBAC by its nature, which is a reason for more
# containment of its pods, not less.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    name: argocd
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Deny everything, then permit what is named. The upstream install ships
# ingress policies per component; this is the egress half it does not ship,
# declared first so a manifest applied out of order fails closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# DNS, which everything needs and which the default deny would otherwise
# break.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # NodeLocal DNSCache intercepts queries to the kube-dns ClusterIP and
    # answers them from a host-network pod on the node itself, which no
    # namespace-and-pod selector can ever match — host-network endpoints are
    # not pods to a NetworkPolicy. Without this rule the selector rule above
    # reads as DNS coverage and resolution times out; the argocd controller
    # was the first workload here to actually resolve a name and found it.
    # The range is the node subnet (subnet_cidr, 10.0.0.0/20), ports DNS
    # only.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/20
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
