# The annotations that put argocd-server behind the load balancer.
#
# Applied as a patch rather than by editing the vendored upstream file, so an
# Argo CD upgrade replaces that file wholesale without silently dropping the
# three facts below.
# No `namespace:` here on purpose. The kustomization's namespace transformer
# runs *after* patches, so the upstream Service is still namespace-less when
# the target is matched — naming argocd here produces
# `no matches for Id Service.v1.[noGrp]/argocd-server.argocd`, which is what
# happened the first time.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  annotations:
    # Container-native load balancing: the load balancer addresses pod IPs
    # directly through a network endpoint group rather than hopping via a
    # node port. One less hop, and health checks describe the pod rather than
    # the node it happens to be on.
    cloud.google.com/neg: '{"ingress": true}'
    # Which BackendConfig governs this Service — the one that turns IAP on.
    cloud.google.com/backend-config: '{"default": "argocd-server"}'
    # Speak HTTPS to the pod on the port named `https`. Without this the load
    # balancer sends plaintext, Argo CD answers 307 to its own HTTPS, and the
    # browser loops.
    cloud.google.com/app-protocols: '{"https":"HTTPS"}'
