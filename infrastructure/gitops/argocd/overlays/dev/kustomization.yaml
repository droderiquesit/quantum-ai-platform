# dev: the upstream image names become the vendored, attested copies in
# dev's own registry, pinned by the digests
# infrastructure/gitops/vendored-images.txt reviewed. Binary Authorization
# admits nothing else, so an overlay that forgot this transform would not
# start a single pod — the failure is loud and at admission, not quiet and
# at runtime.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # dev's published address, certificate and Ingress.
  - console-ingress.yaml
images:
  - name: quay.io/argoproj/argocd
    newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/vendor/argocd
    digest: sha256:e2aadfae709d904e87f46ba4aa49601d827b3022db22cd4d03aae816a2e7097b
  - name: public.ecr.aws/docker/library/redis
    newName: us-east4-docker.pkg.dev/algorik-dev/qip-dev/vendor/redis
    digest: sha256:e1b6db24cb4fdd89f4bc9be09f671ea3bec92fbd7042554f76c34aa2be9b59ad
