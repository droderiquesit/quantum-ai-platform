# The prod Application: the qip chart reconciled against the production cluster.
#
# Automated sync is enabled with prune and self-heal, but the prod GitHub
# environment carries required reviewers — a person must approve the workflow
# run before the digests commit lands. That is the human gate; Argo CD
# itself is unattended once the commit is on the branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qip-prod
  namespace: argocd
spec:
  project: qip
  source:
    repoURL: https://github.com/droderiquesit/quantum-ai-platform.git
    targetRevision: claude/autonomous-investment-platform-76gt4y
    path: infrastructure/helm/qip
    helm:
      valueFiles:
        - values-prod.yaml
        - values-prod-images.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: qip
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
