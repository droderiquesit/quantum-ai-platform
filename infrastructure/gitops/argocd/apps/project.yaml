# The qip AppProject: what the reconciler may deploy, from where, to where.
#
# The core install deliberately has no API server, and the `default`
# project that server would have bootstrapped — allowing every repo to every
# destination — therefore does not exist. Good: instead of recreating a
# permissive default, this project is the narrow statement of intent. One
# source repository, one destination namespace, and exactly one
# cluster-scoped kind (the chart's own Namespace). An Application that
# strays outside any of these is refused by the project before a manifest
# is rendered.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: qip
  namespace: argocd
spec:
  description: The qip platform, from its own repository, into its own namespace.
  sourceRepos:
    # Anonymous HTTPS — see dev.yaml on why the reconciler holds no
    # credential for a public repository.
    - https://github.com/droderiquesit/quantum-ai-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: qip
  # Exactly the cluster-scoped kinds the chart contains, and no others. The
  # first draft allowed only Namespace, which was not a narrower policy but a
  # broken one: the chart also carries the journal StorageClass and the
  # qip-burst ComputeClass, so Argo could never reconcile them and reported
  # them `Unknown` — a resource the reconciler is responsible for and cannot
  # touch is the worst of both readings. Anything beyond these three still
  # needs a commit here, which is the property the whitelist is for.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    # The journal volumes' StorageClass — provisioning parameters belong with
    # the workload that depends on them.
    - group: storage.k8s.io
      kind: StorageClass
    # The machine shape node auto-provisioning may invent for burst workloads.
    - group: cloud.google.com
      kind: ComputeClass
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
