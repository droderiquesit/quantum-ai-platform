# The qip AppProject: what the reconciler may deploy, from where, to where.
#
# The core install deliberately has no API server, and the `default`
# project that server would have bootstrapped — allowing every repo to every
# destination — therefore does not exist. Good: instead of recreating a
# permissive default, this project is the narrow statement of intent. One
# source repository, one destination namespace, and exactly one
# cluster-scoped kind (the chart's own Namespace). An Application that
# strays outside any of these is refused by the project before a manifest
# is rendered.
#
# Cutover update: edge cell destinations are added as wildcard entries so
# that edge Applications (applied by runbook, not pipeline) can reconcile
# against their own clusters without a project change per cell.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: qip
  namespace: argocd
spec:
  description: The qip platform, from its own repository, into its own namespace.
  sourceRepos:
    - https://github.com/droderiquesit/quantum-ai-platform.git
  destinations:
    # Central-plane clusters (dev, test, stage, prod) — all use the in-cluster
    # API server because Argo CD runs in the cluster it reconciles.
    - server: https://kubernetes.default.svc
      namespace: qip
    # Edge clusters — wildcarded so each cell's Application can target its own
    # cluster without a project commit per cell. The actual server URL is
    # substituted by the runbook in docs/operations/deploying-an-edge-cell.md.
    - server: "*"
      namespace: qip
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: cloud.google.com
      kind: ComputeClass
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
