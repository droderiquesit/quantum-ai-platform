# The dev Application: this repository's qip chart, reconciled by the Argo CD
# in the cluster it describes.
#
# Sync is automatic. This is the cut-over commit the previous version of this
# comment said would turn it on: deploy.yml no longer applies anything, so
# Argo CD is the only writer to the qip namespace and the objection to two
# unattended writers undoing each other no longer holds.
#
# `prune` and `selfHeal` are both on, and each earns its risk. Without prune,
# deleting a template from the chart leaves the object running in the cluster
# for ever, and the repository stops being an answer to "what is deployed".
# Without selfHeal, a `kubectl edit` outlives the next sync, which is the
# specific failure the composition roots already guard against for autonomy —
# `kubectl edit configmap` is named in .claude/rules/01-security-and-safety.md
# as the thing the second layer exists to catch.
#
# The trap this arrangement sets, recorded because it nearly fired: turning
# automation on makes values-dev-images.yaml authoritative *immediately*.
# While the kubectl path ran, that file only recorded and was allowed to lag,
# and it did — it named run 33339573747's digests while the cluster ran three
# different images. Enabling sync against it would have rolled all three
# workloads back to older builds, silently, as the first act of the new
# system. The file was reconciled to the running digests in the same commit
# that turned this on. Any future environment gets the same treatment before
# its Application is automated.
#
# Applied by hand like the install itself (see ../README.md), committed so
# the Application's definition has the same review trail as everything else
# it deploys.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qip-dev
  namespace: argocd
spec:
  # Not `default`: the core install bootstraps no default project, and the
  # qip project in project.yaml is the narrow one this Application belongs in.
  project: qip
  source:
    # Anonymous HTTPS, and the absence of a credential is the point. This
    # repository is public, so the reconciler needs no key to read it —
    # which is strictly better than the deploy key this replaced: a private
    # key held in the cluster is a key that can leak, be rotated wrongly, or
    # outlive the person who made it, and read access it grants was already
    # granted to everyone. 443 is the one port the repo server's egress
    # permits, so this needs no policy change either.
    #
    # If this repository is ever made private, this URL stops working and
    # the Application reports a comparison error rather than silently
    # serving stale manifests — at which point a credential becomes a real
    # requirement and gets its own reviewed commit.
    repoURL: https://github.com/droderiquesit/quantum-ai-platform.git
    # The platform's development branch, which is also its default branch.
    targetRevision: claude/autonomous-investment-platform-76gt4y
    path: infrastructure/helm/qip
    helm:
      valueFiles:
        - values-dev.yaml
        # The promoted digests — the file a Kargo stage will write.
        - values-dev-images.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: qip
  syncPolicy:
    automated:
      # Delete what the chart no longer declares, so the repository is the
      # whole answer rather than most of it.
      prune: true
      # Revert what was changed by hand. A console edit that survives is a
      # cluster whose state no commit explains.
      selfHeal: true
    syncOptions:
      # The namespace is the chart's own resource; Argo must not invent it.
      - CreateNamespace=false
      - ServerSideApply=true
