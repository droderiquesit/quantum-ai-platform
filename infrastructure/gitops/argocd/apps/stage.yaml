# The stage Application: the qip chart reconciled against the staging cluster.
#
# Automated sync with prune and self-heal. Stage mirrors prod's topology
# without its required-reviewer gate, so drift here is caught before prod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qip-stage
  namespace: argocd
spec:
  project: qip
  source:
    repoURL: https://github.com/droderiquesit/quantum-ai-platform.git
    targetRevision: claude/autonomous-investment-platform-76gt4y
    path: infrastructure/helm/qip
    helm:
      valueFiles:
        - values-stage.yaml
        - values-stage-images.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: qip
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
