# The test Application: the qip chart reconciled against the test cluster.
#
# Automated sync with prune and self-heal — the same policy as dev. The test
# environment exists to catch integration issues before they reach stage, and
# an unattended reconciler keeps it honest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qip-test
  namespace: argocd
spec:
  project: qip
  source:
    repoURL: https://github.com/droderiquesit/quantum-ai-platform.git
    targetRevision: claude/autonomous-investment-platform-76gt4y
    path: infrastructure/helm/qip
    helm:
      valueFiles:
        - values-test.yaml
        - values-test-images.yaml
  destination:
    # The test cluster's API server. Replace with the actual endpoint once
    # the test GKE cluster is provisioned.
    server: https://kubernetes.default.svc
    namespace: qip
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
