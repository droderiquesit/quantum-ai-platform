# Kargo's half of the load balancer: who the proxy admits, and how the load
# balancer decides the pod is alive.
#
# Identical in shape to infrastructure/gitops/argocd/base/console-backend.yaml
# and deliberately not factored into a shared component — the two are separate
# because they are allowed to diverge (a different health path, a different
# timeout) without the other silently inheriting it.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: kargo-api
  namespace: kargo
spec:
  # Identity-Aware Proxy, OFF, at the desk's explicit and repeated
  # instruction — the same decision as Argo CD's, whose BackendConfig records
  # the reasoning in full.
  #
  # Concretely: https://kargo.<address>.nip.io is reachable by anyone on the
  # internet, and Kargo's own admin login is the only remaining gate. That
  # password lives in Secret Manager as `algorik-kargo-admin-password`, so it
  # is a real credential rather than a default — but it is a password on a
  # public address, and Kargo is the engine that promotes releases between
  # environments.
  #
  # Re-enabling is this one field plus `kubectl apply -k
  # infrastructure/gitops/kargo/overlays/dev`. The IAP grant and the operator
  # list are deliberately left in place, so nothing else has to be rebuilt.
  # Leave `oauthclientCredentials` absent if it is: the Google-managed client
  # its absence selects is the only path Google still offers.
  iap:
    enabled: false

  # The load balancer speaks HTTPS to the pod, so the health check must too —
  # a plaintext probe against a TLS listener is refused at the handshake, the
  # backend never turns healthy, and the Ingress serves 502 with nothing in
  # the pod's own logs to explain it.
  healthCheck:
    type: HTTPS
    requestPath: /healthz
    port: 8080

  # Kargo's UI holds a long-lived stream open for live promotion state. The
  # default 30s backend timeout cuts that every thirty seconds and the UI
  # reconnects in a loop; five minutes is the same allowance Argo CD's
  # backend gets for the same reason.
  timeoutSec: 300
