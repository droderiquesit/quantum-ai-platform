# The annotations that put kargo-api behind the load balancer, plus a name
# for the port.
#
# Applied as a patch rather than by editing the rendered chart, so a Kargo
# upgrade replaces that file wholesale without silently dropping any of this.
#
# `namespace: kargo` here, and deliberately absent from Argo CD's otherwise
# identical patch. A patch target is matched on the identifier the resource
# has *at patch time*: the rendered Kargo chart names its namespace on every
# object, so the target must too, while Argo CD's upstream manifest is
# namespace-less and acquires one later from a namespace transformer. Getting
# either backwards fails loudly at build with `no matches for Id …`, which is
# the good case — it cannot silently apply to nothing.
apiVersion: v1
kind: Service
metadata:
  name: kargo-api
  namespace: kargo
  annotations:
    # Container-native load balancing: the load balancer addresses pod IPs
    # through a network endpoint group rather than hopping via a node port.
    cloud.google.com/neg: '{"ingress": true}'
    # Which BackendConfig governs this Service — the one that turns IAP on.
    cloud.google.com/backend-config: '{"default": "kargo-api"}'
    # Speak HTTPS to the pod. The chart already sets `appProtocol: https` on
    # the port, but GKE's ingress controller matches `HTTPS` uppercase and
    # ignores the lowercase form, so the annotation is what actually decides.
    # Without it the load balancer sends plaintext into a TLS listener and
    # every request is a 502 with nothing in the pod's log to explain it.
    cloud.google.com/app-protocols: '{"https":"HTTPS"}'
spec:
  ports:
    # The chart leaves this port unnamed, and both the annotation above and
    # the Ingress backend reference a port *by name*. Naming it is therefore
    # a precondition, not a tidy-up. One port exists, so this replaces it
    # rather than adding a second.
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8080
      appProtocol: https
