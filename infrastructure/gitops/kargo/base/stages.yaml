# The chain: dev → test → replay → paper → stage → prod, each requesting the
# warehouse's freight from the link before it (ADR 0036 decision 6, R12
# CICD-9112). `test` is the blueprint's "integration" and `stage` its
# "staging"; the names are the environments'.
#
# One registry. Every stage's `registry` and `warehouseRegistry` are the
# same path — the build registry `deploy.yml` builds into once, `qip-dev` in
# the dev project — so the digest a promotion writes into
# `envs/<stage>/kustomization.yaml` is the digest the warehouse discovered,
# byte for byte, in every environment. Until this change each stage named
# its own environment's registry, `deploy.yml` rebuilt per environment, and
# a promotion wrote dev's digest under a registry that had never held it:
# the bytes prod would have run were bytes nobody tested. The overlays now
# set only which stage this control plane's Argo CD is notified for.
#
# `replay` and `paper` are gates, not environments. Neither has a runtime of
# its own and neither writes an `envs/` directory: each runs the
# `record-gate` task, which commits the freight's three digests and its
# source commit into `gates/<stage>/freight.yaml`. No promotion policy
# promotes either automatically (projectconfig.yaml), so freight reaches
# `paper` only because a person promoted it out of `replay` after the replay
# of the event log under it held, and reaches `stage` only because a person
# promoted it out of `paper` after the paper-trading soak held. What each
# person checks is in kargo/README.md. `paper` alone also runs
# `verify-paper-ceiling` before it records anything (papertask.yaml): the
# paper-trading ceiling in the manifests the freight will roll out under is
# asserted, not remembered. The `replay` check is still a person's.
#
# `prod` is the stage that exists so a person can see what would be
# eligible, and whose promotion does nothing but fail. There is no
# promotion policy for it in projectconfig.yaml, and there is no promotion
# path in it either: the first and only step refuses, naming the two
# records that keep production behind a person. deploy.yml refuses a prod
# deployment nobody dispatched and infra.yml refuses a prod dispatch at all;
# this is the third refusal, and the acceptance suite reads it. Lifting it
# is an ADR, not an edit.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: qip
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: qip-images
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: registry
          value: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev
        - name: warehouseRegistry
          value: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev
        - name: argocdApplication
          value: ""
      steps:
        - task:
            name: promote-cloud-run
          as: promote
          vars:
            - name: registry
              value: ${{ vars.registry }}
            - name: warehouseRegistry
              value: ${{ vars.warehouseRegistry }}
            - name: argocdApplication
              value: ${{ vars.argocdApplication }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: test
  namespace: qip
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: qip-images
      sources:
        stages:
          - dev
  promotionTemplate:
    spec:
      vars:
        - name: registry
          value: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev
        - name: warehouseRegistry
          value: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev
        - name: argocdApplication
          value: ""
      steps:
        - task:
            name: promote-cloud-run
          as: promote
          vars:
            - name: registry
              value: ${{ vars.registry }}
            - name: warehouseRegistry
              value: ${{ vars.warehouseRegistry }}
            - name: argocdApplication
              value: ${{ vars.argocdApplication }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: replay
  namespace: qip
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: qip-images
      sources:
        stages:
          - test
  promotionTemplate:
    spec:
      vars:
        - name: warehouseRegistry
          value: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev
      steps:
        - task:
            name: record-gate
          as: record
          vars:
            - name: warehouseRegistry
              value: ${{ vars.warehouseRegistry }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: paper
  namespace: qip
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: qip-images
      sources:
        stages:
          - replay
  promotionTemplate:
    spec:
      vars:
        - name: warehouseRegistry
          value: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev
      steps:
        # The automated check, first: a promotion that fails here has
        # recorded nothing, so `stage` is offered nothing. See
        # papertask.yaml for what it asserts and what it cannot.
        - task:
            name: verify-paper-ceiling
          as: verify
        - task:
            name: record-gate
          as: record
          vars:
            - name: warehouseRegistry
              value: ${{ vars.warehouseRegistry }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stage
  namespace: qip
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: qip-images
      sources:
        stages:
          - paper
  promotionTemplate:
    spec:
      vars:
        - name: registry
          value: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev
        - name: warehouseRegistry
          value: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev
        - name: argocdApplication
          value: ""
      steps:
        - task:
            name: promote-cloud-run
          as: promote
          vars:
            - name: registry
              value: ${{ vars.registry }}
            - name: warehouseRegistry
              value: ${{ vars.warehouseRegistry }}
            - name: argocdApplication
              value: ${{ vars.argocdApplication }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: qip
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: qip-images
      sources:
        stages:
          - stage
  promotionTemplate:
    spec:
      vars: []
      steps:
        - uses: fail
          as: refuse-prod
          config:
            message: prod is promoted by nobody until an ADR lifts this refusal (ADR 0024 decision 3, ADR 0036 decision 6). deploy.yml and infra.yml refuse prod independently; this is the third refusal and it does not know about the other two.
