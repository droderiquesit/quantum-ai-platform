# The promotion (ADR 0036 decision 6): clone this repository at its default
# branch, write the freight's three digests into the stage's
# `envs/<stage>/kustomization.yaml`, commit with a message that names the
# freight, every digest and the source commit, push to the default branch,
# and tell Argo CD which commit to expect. One task shared by every stage,
# so the shape of a promotion cannot differ between environments; the vars
# are what differs, and the stage sets them.
#
# What refuses a bad promotion here, and where:
#
#   * Freight mixing commits is refused before this runs — the Warehouse's
#     freight-creation criteria require all three images' tags (the commit
#     sha deploy.yml pushes) to be equal, so no such freight exists to
#     promote. The `fail` step below is the second line: a task invoked
#     without a registry has nowhere to write.
#   * A digest the attestor never signed is not refused here. The commit
#     lands, Argo CD syncs it, Cloud Run's admission refuses the revision,
#     and the Application reads `Degraded` with the refusal in its
#     condition (decision 8). Kargo cannot see the attestation and does not
#     pretend to.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote-cloud-run
  namespace: qip
spec:
  vars:
    - name: gitRepo
      value: https://github.com/droderiquesit/quantum-ai-platform.git
    - name: branch
      value: main
    # The registry the stage's kustomization names — its own environment's.
    - name: registry
      value: ""
    # The registry the freight's images were discovered in — the warehouse's.
    # The two differ for every stage but the one whose environment holds the
    # warehouse; kargo/README.md says what that costs today.
    - name: warehouseRegistry
      value: ""
    # The Argo CD Application to notify, or empty for a stage whose
    # Application lives on another environment's control plane.
    - name: argocdApplication
      value: ""
    # The share of qip-api's requests a new digest's revision takes while its
    # SLO gate runs (ADR 0452). A design value of this record, not an owner
    # figure: small enough that a canary failing every request costs a tenth
    # of the service, large enough that a soak sees requests at all.
    - name: canaryPercent
      value: "10"
  steps:
    - uses: fail
      if: ${{ vars.registry == "" || vars.warehouseRegistry == "" }}
      config:
        message: This stage did not set `registry` and `warehouseRegistry`; a promotion with no registry has nowhere to write a digest.
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitRepo }}
        author:
          name: qip-kargo
          email: qip-kargo@algorik.internal
        checkout:
          - branch: ${{ vars.branch }}
            path: ./repo
    - uses: kustomize-set-image
      as: set-images
      config:
        path: ./repo/infrastructure/gitops/envs/${{ ctx.stage }}
        images:
          - image: qip-api
            newName: ${{ vars.registry }}/qip-api
            digest: ${{ imageFrom(vars.warehouseRegistry + "/qip-api").Digest }}
          - image: qip-fastbrain
            newName: ${{ vars.registry }}/qip-fastbrain
            digest: ${{ imageFrom(vars.warehouseRegistry + "/qip-fastbrain").Digest }}
          - image: qip-deepbrain
            newName: ${{ vars.registry }}/qip-deepbrain
            digest: ${{ imageFrom(vars.warehouseRegistry + "/qip-deepbrain").Digest }}
    # ── The qip-api canary (ADR 0452, R12-CICD-9116) ──────────────────────
    #
    # qip-api is the one promoted service a traffic split can canary: it
    # scales from zero on requests, so two revisions each serve a share of
    # requests and neither runs anything the other also runs. The fast and
    # deep brains are min = max = 1 singletons running a loop, and a split
    # would run two loops; they keep the digest swap above and nothing else.
    #
    # The state is the manifest, nothing beside it. `envs/<env>/api.yaml`
    # always carries two traffic targets: index 0 tagged `stable`, index 1
    # tagged `standby`. Each revision is named from its own image digest,
    # `qip-<env>-api-<first twelve hex>`, so the name of the previous
    # promoted digest's revision is known without asking Cloud Run, and a
    # return to that digest names a revision that already exists — Cloud Run
    # routes to it without creating, pulling or starting anything new. Three
    # cases, decided by the incoming revision's name `next`:
    #
    #   next == standby   complete or roll back to it: 100% to `next`, the
    #                     old stable kept at 0% under `standby`.
    #   next == stable    roll a canary back (or re-assert): 100% stable,
    #                     the canary kept at 0% under `standby`.
    #   otherwise         a new digest: 100-canaryPercent to stable,
    #                     canaryPercent to `next` under `standby`.
    #
    # So rollback to the previous digest is one action in every state —
    # `kargo promote --stage <env> --freight <the previous freight>` — and
    # so is completing a canary whose SLO gate passed (re-promote its
    # freight). The gate is envs/<env>/slo-gate.yaml, an Argo CD PostSync
    # hook that fails the sync, and so this promotion's argocd-update, when
    # the canary revision's own pushed series breach the objective or are
    # absent. An environment whose stable target names no revision yet
    # (`TO-PIN`, never promoted into) takes its first promotion at 100%: there
    # is nothing to split with, and that first promotion is not a canary.
    #
    # Unproven against a live Kargo, like papertask.yaml: the control plane
    # is suspended (ADR 0093). The expressions are parsed and pinned by
    # qip-acceptance's cloud_run_canary suite and have never been evaluated
    # by a controller.
    - uses: yaml-parse
      as: api_traffic
      config:
        path: ./repo/infrastructure/gitops/envs/${{ ctx.stage }}/api.yaml
        outputs:
          - name: stable
            fromExpression: spec.traffic[0].revision ?? ""
          - name: standby
            fromExpression: spec.traffic[1].revision ?? ""
    - uses: fail
      if: ${{ int(vars.canaryPercent) < 1 || int(vars.canaryPercent) > 50 }}
      config:
        message: canaryPercent is outside 1 to 50; a canary is a minority share of requests, and a value outside that range is refused rather than clamped (ADR 0452).
    - uses: yaml-update
      as: api_complete
      if: ${{ task.outputs.api_traffic.standby == "qip-" + ctx.stage + "-api-" + imageFrom(vars.warehouseRegistry + "/qip-api").Digest[7:19] && task.outputs.api_traffic.stable != task.outputs.api_traffic.standby }}
      config:
        path: ./repo/infrastructure/gitops/envs/${{ ctx.stage }}/api.yaml
        updates:
          - key: spec.template.revision
            value: ${{ task.outputs.api_traffic.standby }}
          - key: spec.traffic.0.revision
            value: ${{ task.outputs.api_traffic.standby }}
          - key: spec.traffic.0.percent
            value: ${{ 100 }}
          - key: spec.traffic.1.revision
            value: ${{ task.outputs.api_traffic.stable }}
          - key: spec.traffic.1.percent
            value: ${{ 0 }}
    - uses: yaml-update
      as: api_hold
      if: ${{ task.outputs.api_traffic.stable == "" || task.outputs.api_traffic.stable == "qip-" + ctx.stage + "-api-" + imageFrom(vars.warehouseRegistry + "/qip-api").Digest[7:19] }}
      config:
        path: ./repo/infrastructure/gitops/envs/${{ ctx.stage }}/api.yaml
        updates:
          - key: spec.template.revision
            value: ${{ "qip-" + ctx.stage + "-api-" + imageFrom(vars.warehouseRegistry + "/qip-api").Digest[7:19] }}
          - key: spec.traffic.0.type
            value: TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION
          - key: spec.traffic.0.revision
            value: ${{ "qip-" + ctx.stage + "-api-" + imageFrom(vars.warehouseRegistry + "/qip-api").Digest[7:19] }}
          - key: spec.traffic.0.percent
            value: ${{ 100 }}
          - key: spec.traffic.1.type
            value: TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION
          - key: spec.traffic.1.revision
            value: '${{ task.outputs.api_traffic.standby == "" ? "qip-" + ctx.stage + "-api-" + imageFrom(vars.warehouseRegistry + "/qip-api").Digest[7:19] : task.outputs.api_traffic.standby }}'
          - key: spec.traffic.1.percent
            value: ${{ 0 }}
    - uses: yaml-update
      as: api_canary
      if: ${{ task.outputs.api_traffic.stable != "" && task.outputs.api_traffic.stable != "qip-" + ctx.stage + "-api-" + imageFrom(vars.warehouseRegistry + "/qip-api").Digest[7:19] && task.outputs.api_traffic.standby != "qip-" + ctx.stage + "-api-" + imageFrom(vars.warehouseRegistry + "/qip-api").Digest[7:19] }}
      config:
        path: ./repo/infrastructure/gitops/envs/${{ ctx.stage }}/api.yaml
        updates:
          - key: spec.template.revision
            value: ${{ "qip-" + ctx.stage + "-api-" + imageFrom(vars.warehouseRegistry + "/qip-api").Digest[7:19] }}
          - key: spec.traffic.0.percent
            value: ${{ 100 - int(vars.canaryPercent) }}
          - key: spec.traffic.1.revision
            value: ${{ "qip-" + ctx.stage + "-api-" + imageFrom(vars.warehouseRegistry + "/qip-api").Digest[7:19] }}
          - key: spec.traffic.1.percent
            value: ${{ int(vars.canaryPercent) }}
    - uses: git-commit
      as: commit
      config:
        path: ./repo
        # `[skip ci]` in the subject, because without it the promotion feeds
        # itself: this commit lands on the default branch, `ci.yml` runs on
        # every push there, `deploy.yml` follows ci and tags each image with
        # the commit, the warehouse makes freight of the new tag, and dev's
        # auto-promotion (projectconfig.yaml) writes another commit. The
        # commit changes digests only — images ci already gated at the commit
        # their tag names — so skipping ci on it skips nothing that was not
        # already run. `qip-acceptance`'s gitops suite pins the token.
        message: |
          Promote freight ${{ ctx.targetFreight.name }} to ${{ ctx.stage }} [skip ci]

          Written by Kargo (infrastructure/gitops/kargo/base/promotiontask.yaml),
          promotion ${{ ctx.promotion }} in project ${{ ctx.project }}, from
          warehouse qip-images. Every image below was built, scanned, signed
          and attested by deploy.yml at the commit its tag names; the
          warehouse admits only a tag that is a commit sha and creates no
          freight whose three tags differ.

            source commit  ${{ imageFrom(vars.warehouseRegistry + "/qip-api").Tag }}
            qip-api        ${{ imageFrom(vars.warehouseRegistry + "/qip-api").Digest }}
            qip-fastbrain  ${{ imageFrom(vars.warehouseRegistry + "/qip-fastbrain").Digest }}
            qip-deepbrain  ${{ imageFrom(vars.warehouseRegistry + "/qip-deepbrain").Digest }}

          Argo CD's post-sync hook (envs/${{ ctx.stage }}/prove-serving.yaml)
          fails the sync unless the routed revision serves these digests.
    - uses: git-push
      config:
        path: ./repo
        targetBranch: ${{ vars.branch }}
    - uses: argocd-update
      if: ${{ vars.argocdApplication != "" }}
      config:
        apps:
          - name: ${{ vars.argocdApplication }}
            sources:
              - repoURL: ${{ vars.gitRepo }}
                desiredRevision: ${{ task.outputs.commit.commit }}
