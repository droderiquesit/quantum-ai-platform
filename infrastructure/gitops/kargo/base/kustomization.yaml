# Kargo, the promotion engine ADR 0017 decided on, plus the namespace
# governance and network posture the chart does not ship.
#
# upstream/kargo-v1.11.2.yaml is a *rendered* Helm chart, not a file any
# upstream publishes — Kargo distributes only the chart. The render is
# reproducible and the README records the exact command, so an upgrade is
# still reviewable as a diff. Two render-time choices matter: the admin
# credentials come from an existing Secret (kargo-api-admin, created out of
# band — the manifest carries no credential), and the external webhooks
# server is off (it exists to receive calls from the internet, and nothing
# routes in).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policies.yaml
  - upstream/kargo-v1.11.2.yaml
  # The load balancer's half: how it reaches kargo-api and who IAP lets
  # through. The address, certificate and Ingress are per-environment and
  # live in the overlays.
  - console-backend.yaml
patches:
  # The Service annotations and the port name that put kargo-api behind the
  # load balancer, kept out of the rendered chart so an upgrade cannot drop
  # them.
  - path: console-service-patch.yaml
