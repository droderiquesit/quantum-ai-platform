# Kargo on the prod control plane: the base, unchanged. There is one build
# registry, so nothing about where freight comes from differs between
# control planes (R12 CICD-9112), and the `prod` stage notifies no Argo CD
# application because its only promotion step refuses (stages.yaml). A patch
# naming `qip-prod` here would be configuration for a promotion that cannot
# happen, which reads as one that can.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
