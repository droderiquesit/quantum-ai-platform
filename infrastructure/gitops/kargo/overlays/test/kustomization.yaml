# Kargo on the test control plane. The project, the warehouse, the six-link
# chain and both promotion tasks are the base's, unchanged: there is one
# build registry, so nothing about where freight comes from or where a
# promotion writes it differs between control planes (R12 CICD-9112). What
# differs is which Argo CD this Kargo can reach — its own — so the one patch
# names `qip-test` as the application the `test` stage notifies.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- target:
    kind: Stage
    name: test
  patch: |-
    apiVersion: kargo.akuity.io/v1alpha1
    kind: Stage
    metadata:
      name: test
      namespace: qip
    spec:
      promotionTemplate:
        spec:
          vars:
          - name: registry
            value: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev
          - name: warehouseRegistry
            value: us-east4-docker.pkg.dev/algorik-qip-dev/qip-dev
          - name: argocdApplication
            value: qip-test
