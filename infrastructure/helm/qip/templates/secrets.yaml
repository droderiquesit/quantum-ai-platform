# How a credential gets from Secret Manager into a pod.
#
# This file is the middle of a chain that had a hole in it. Terraform creates
# the Secret Manager containers and grants each workload identity
# `roles/secretmanager.secretAccessor` on the ones it needs; the Deployments
# ask for credentials. Nothing joined the two, so every `qip-api` pod would
# have stopped at `CreateContainerConfigError: secret "qip-tokens" not found`
# and the rollout would have reported images pushed and a deployment started
# while no pod ever ran.
#
# The driver is GKE's managed Secret Manager add-on, enabled on the cluster in
# `modules/cluster`. It authenticates as the pod's Kubernetes service account
# through workload identity, which is why no key exists anywhere in this path.
#
# # Files, not environment variables
#
# Each secret is projected as a file and the process reads it through
# `qip_core::secret`, which takes `QIP_<NAME>_FILE` as an alternative to
# `QIP_<NAME>`. The obvious alternative — `secretObjects`, which syncs into a
# Kubernetes Secret that a `secretKeyRef` then reads — was rejected twice over:
#
#   * it writes the plaintext into etcd, where it is readable by anything with
#     `get secret` in this namespace, and
#   * a container's environment is resolved *before* its CSI volume is mounted,
#     so on a fresh cluster the synced Secret does not exist the first time a
#     pod starts. The pod fails, the volume mounts, the Secret appears, and the
#     next attempt works — a deployment that heals after one confusing failure
#     rather than one that comes up.
#
# # Rotation
#
# `versions/latest` rather than a pinned version, so adding a version rotates
# the credential. The projected file is refreshed by the driver, but a running
# process has already read it — the platform reads its credentials once at
# start-up, deliberately, so that a rotation mid-flight cannot change which key
# signed which envelope. Rotation therefore takes a restart, which
# `docs/security/credentials.md` says and this comment repeats because the
# person reading this file is the one who will wonder.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: qip-api-secrets
  namespace: qip
  labels:
    app.kubernetes.io/part-of: qip
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "project is required" .Values.project }}/secrets/qip-token-operator-{{ required "environment is required" .Values.environment }}/versions/latest"
        path: "token-operator"
      - resourceName: "projects/{{ required "project is required" .Values.project }}/secrets/qip-token-approver-{{ required "environment is required" .Values.environment }}/versions/latest"
        path: "token-approver"
      - resourceName: "projects/{{ required "project is required" .Values.project }}/secrets/qip-token-analyst-{{ required "environment is required" .Values.environment }}/versions/latest"
        path: "token-analyst"
      - resourceName: "projects/{{ required "project is required" .Values.project }}/secrets/qip-token-viewer-{{ required "environment is required" .Values.environment }}/versions/latest"
        path: "token-viewer"
      - resourceName: "projects/{{ required "project is required" .Values.project }}/secrets/qip-token-monitor-{{ required "environment is required" .Values.environment }}/versions/latest"
        path: "token-monitor"
      - resourceName: "projects/{{ required "project is required" .Values.project }}/secrets/qip-capital-envelope-key-{{ required "environment is required" .Values.environment }}/versions/latest"
        path: "capital-envelope-key"
---
# The brains verify envelopes against the same key the API signs them with, and
# read nothing else. A separate class rather than a shared one, because a
# SecretProviderClass is a list of what a pod may mount: giving the brains the
# API's class would hand every brain the five API tokens as well, which is the
# opposite of why each deployable has its own service account.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: qip-envelope-key
  namespace: qip
  labels:
    app.kubernetes.io/part-of: qip
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "project is required" .Values.project }}/secrets/qip-capital-envelope-key-{{ required "environment is required" .Values.environment }}/versions/latest"
        path: "capital-envelope-key"
