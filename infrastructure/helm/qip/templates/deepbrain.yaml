# The Deep Brain: world model, discovery, reasoning, simulation, optimisation
# and learning.
#
# The slow half of the platform. It is the one workload that may call a
# language model, and the one that may not reach a venue — the binary checks
# the second at start-up by refusing to run if any agent it hosts holds a
# market-touching capability.
#
# One replica. The intelligence loop is not horizontally scalable as written:
# two of these would each run the cycle and each write evidence, and the
# duplicate records would be indistinguishable from a replay.
#
# That is also why there is no HorizontalPodAutoscaler here. An autoscaler on
# this workload would not divide the work, it would multiply the brains — and
# because no work moves to a new replica, per-replica CPU never falls, so the
# autoscaler would never stop adding them. What was considered instead, and
# why it is not committed live, is at the foot of this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qip-deepbrain
  namespace: qip
  annotations:
    iam.gke.io/gcp-service-account: qip-deepbrain-{{ required "environment is required" .Values.environment }}@{{ required "project is required" .Values.project }}.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qip-deepbrain
  namespace: qip
  labels:
    app: qip-deepbrain
spec:
  replicas: 1
  # Recreate rather than RollingUpdate: with one replica a rolling update would
  # briefly run two, and two deep brains each running the cycle write two
  # copies of the same evidence.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qip-deepbrain
  template:
    metadata:
      labels:
        app: qip-deepbrain
    spec:
      serviceAccountName: qip-deepbrain
      automountServiceAccountToken: false
      # A cycle that is part way through should finish rather than leave a
      # half-written run behind.
      terminationGracePeriodSeconds: 120
      # No topologySpreadConstraints, and that is not an oversight.
      #
      # A spread constraint distributes replicas, and there is one replica: it
      # would constrain nothing today and would quietly become a reason to
      # believe this workload is zone-redundant when it is not. What protects
      # a single-replica deep brain from losing its zone is rescheduling into
      # another one, which the regional pool already allows and which costs a
      # cold start and a first cycle — see `warming` in the readiness note
      # below. If this ever runs more than one replica, the reasoning at the
      # foot of this file has to be settled first, and a spread constraint
      # added at the same time.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qip-deepbrain
          image: {{ required "imagePrefix is required" .Values.imagePrefix }}/qip-deepbrain@{{ include "qip.digest" (dict "value" .Values.images.deepbrain "name" "images.deepbrain") }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Liveness and readiness are deliberately different endpoints, and the
          # numbers below are deliberately not the Fast Brain's.
          #
          # /health says the process is alive, and on this node that is the only
          # question a liveness probe may ask. A deep-brain cycle runs research,
          # causal reasoning, simulation and optimisation, and the agents it
          # hosts may consult a language model, so a cycle legitimately takes
          # minutes. A liveness probe that could go red while one is in flight
          # would restart the node in the middle of every long analysis and it
          # would never finish one. failureThreshold is 6 rather than the
          # default 3: at a 30-second period that is three minutes of missed
          # probes before a restart, which is a wedged process rather than a
          # busy one.
          #
          # /ready says the node is worth consulting. It returns 503 while the
          # node is stopping, halted, stalled, persistently failing its cycles,
          # or still warming — that last one being the state with no fast-path
          # equivalent, because until the first cycle lands there is no world
          # model to consult. Note what does NOT make it unready: being slow.
          # initialDelaySeconds is 10 and the node will report `warming` for as
          # long as its first cycle takes, which is correct and needs no
          # startupProbe: readiness failing during warm-up removes the pod from
          # a Service, and liveness is not watching readiness.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            # The health surface this node serves. QIP_API_ADDRESS is not read
            # by this binary — it serves its own listener, not the API's — and
            # until now this file said exactly that and set it anyway, two
            # lines apart. A variable a workload does not read is not inert:
            # it is a value an operator can change, in a manifest that appears
            # to accept it, with no effect whatsoever. The same class of defect
            # kept QIP_MESH_CELLS out of every manifest and QIP_MIRROR_PATH in
            # edge-cell.yaml after the binary began refusing it, so it is now
            # checked rather than commented — see
            # backend/crates/tests/qip-acceptance/tests/manifest_wiring.rs.
            - name: QIP_DEEPBRAIN_HEALTH_ADDRESS
              value: "0.0.0.0:8080"
            - name: QIP_AUTONOMY_CEILING
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: autonomy_ceiling
            - name: QIP_CYCLE_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: cycle_interval_seconds
            # No QIP_LOG_LEVEL. Nothing in this workspace reads one — the
            # binaries write their banner and their refusals to stdout and
            # stderr unconditionally — so the `log_level` ConfigMap key it read
            # from was a dial connected to nothing, and it has gone with it. A
            # log level worth having is a change to the code that emits the
            # lines, not a key three manifests agree to pass to nobody.
            # The capital-envelope key, as a file. Absent, this process runs
            # on the seed-derived default — reproducible, mintable by anyone
            # who knows the seed, and refused outright once the autonomy
            # ceiling permits live trading.
            - name: QIP_CAPITAL_ENVELOPE_KEY_FILE
              value: /var/run/secrets/qip/capital-envelope-key
          resources:
            # Burstable rather than Guaranteed: a backtest wants whatever the
            # node has spare, and unlike the fast path it does not care about
            # being throttled for a few milliseconds.
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /var/lib/qip
            - name: secrets
              mountPath: /var/run/secrets/qip
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # Scratch space for a simulation run. Bounded, and emptyDir rather than
        # a claim on purpose: nothing written here is authoritative, and
        # anything that is goes to the evidence bucket.
        - name: work
          emptyDir:
            sizeLimit: 8Gi        # The envelope key, projected from Secret Manager as this workload's
        # own service account. A brain verifies and signs grants against the
        # same key the API does; a brain running on the seed-derived default is
        # refused outright once the ceiling permits live trading.
        - name: secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: qip-envelope-key
---
apiVersion: v1
kind: Service
metadata:
  name: qip-deepbrain
  namespace: qip
spec:
  selector:
    app: qip-deepbrain
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qip-deepbrain
  namespace: qip
spec:
  # maxUnavailable rather than minAvailable, because this workload has one
  # replica: `minAvailable: 1` on a single replica means no voluntary eviction
  # is ever allowed, which makes the node it lands on undrainable and turns
  # every cluster upgrade into an incident.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: qip-deepbrain
# ---------------------------------------------------------------------------
# The scaling axis this workload actually has, and why it is not committed
# live.
#
# The deep brain cannot be scaled out — the top of this file says why — so the
# only honest question left is whether the one replica is the right size. Right
# now nobody knows: it requests 1 CPU and 2Gi against a limit of 4 CPU and 8Gi,
# which is a four-fold band with no measurement behind it. A cycle that
# routinely wants 3 CPU is a cycle being throttled at a boundary nobody chose,
# and one that never exceeds 1.2 is holding a reservation the pool could give
# to something else.
#
# A VerticalPodAutoscaler in recommendation mode is what answers that. It
# watches actual usage and publishes a recommendation, and a human reads it and
# edits the numbers above in a diff.
#
# `updateMode: "Off"` is the whole point and must not be relaxed to `Auto`.
# `Auto` resizes a pod by evicting it. This workload runs one replica with
# `strategy: Recreate` and cycles that legitimately take minutes, so an
# automatic resize is a controller deciding, on a rolling average, to kill a
# research run in flight and leave a gap in the intelligence loop until the
# replacement finishes warming. A recommendation costs nothing and is read
# when somebody is looking; an eviction is spent whenever the controller feels
# like it.
#
# It is commented out, and that is the correct committed state rather than a
# draft. Two things must be true before uncommenting:
#
#   1. The cluster runs the vertical pod autoscaling addon. It does not: the
#      cluster module in infrastructure/terraform enables no such addon, so
#      the CRD does not exist. The deploy pipeline runs
#      `kubectl apply --server-side --dry-run=server` over the whole rendered
#      directory before it applies anything, and an unknown kind fails that
#      gate for every manifest in the directory — so committing this live now
#      would not add a recommendation, it would stop the platform deploying.
#   2. Somebody is going to read the recommendation. A recommender nobody
#      reads is a controller consuming cluster resource to write a number into
#      an object nobody opens.
#
# `targetRef` is written inline deliberately, and must stay that way if this is
# ever uncommented: the acceptance suite identifies workloads by a line reading
# `kind: Deployment` at any indentation, and a block-style ref would make this
# object look like a Deployment with no containers.
#
# What this is not: a substitute for the deep brain being able to run more than
# one replica. That needs leader election in the binary — a lease, a fenced
# hand-off, and a rule for the cycle in flight when leadership moves — and none
# of it exists today. Naming it here is not the same as having it.
#
# apiVersion: autoscaling.k8s.io/v1
# kind: VerticalPodAutoscaler
# metadata:
#   name: qip-deepbrain
#   namespace: qip
# spec:
#   targetRef: { apiVersion: apps/v1, kind: Deployment, name: qip-deepbrain }
#   updatePolicy:
#     updateMode: "Off"
#   resourcePolicy:
#     containerPolicies:
#       - containerName: qip-deepbrain
#         controlledResources: ["cpu", "memory"]
