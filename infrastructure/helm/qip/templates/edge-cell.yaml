{{- /*
Gated off by default (cell.enabled: false in values.yaml): bringing a cell up
is a deliberate, per-cell act with its own runbook
(docs/operations/deploying-an-edge-cell.md), never something the environment
render turns on as a side effect of deploying everything else in this chart.
*/ -}}
{{- if .Values.cell.enabled }}
{{- $cellId := required "cell.id is required" .Values.cell.id }}
{{- $cellRegion := required "cell.region is required" .Values.cell.region }}
{{- $venues := required "cell.venues is required" .Values.cell.venues }}
{{- if not $venues }}
{{- fail "cell.venues must have at least one entry: a cell with nothing to reach has nothing to do, and QIP_VENUES refuses to start empty" }}
{{- end }}
{{- $venueIds := $venues | keys | sortAlpha | join "," }}
# An edge cell.
#
# One of these per cell. `{{ $cellId }}`, `{{ $cellRegion }}` and `{{ $venueIds }}` are
# substituted at deploy time, the same way `{{ required "environment is required" .Values.environment }}`, `{{ required "project is required" .Values.project }}` and
# `IMAGE_TAG` are — see docs/operations/deploying-an-edge-cell.md.
#
# ADR 0008: the cell holds the whole hot path and decides without asking the
# central plane. What keeps that safe is that it never decides how much it may
# risk — it acts inside a `CapitalEnvelope` that is signed, bounded,
# venue-scoped and expiring. `QIP_CAPITAL_ENVELOPE_KEY` is the key it verifies
# that signature against, and it is the single most security-relevant value in
# this file: whoever can replace it can mint envelopes, which is the one way a
# cell's bound widens without the central plane agreeing.
#
# A cell that has lost contact with the centre keeps trading inside the
# envelope it already holds. The network policy therefore permits the central
# plane rather than requiring it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qip-edge-{{ $cellId }}
  namespace: qip
  annotations:
    # Matches the workload identity binding the edge-cell Terraform module
    # creates for `qip/qip-edge-{{ $cellId }}`.
    iam.gke.io/gcp-service-account: qip-edge-{{ $cellId }}-{{ required "environment is required" .Values.environment }}@{{ required "project is required" .Values.project }}.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qip-edge-{{ $cellId }}
  namespace: qip
  labels:
    app: qip-edge-node
    qip.io/cell: {{ $cellId }}
spec:
  # A StatefulSet rather than a Deployment, for one reason: the journal.
  # A cell's hash-chained decision record is evidence — the answer to "why did
  # this cell trade" after the fact — and evidence that lives on ephemeral pod
  # storage is evidence that disappears on the first restart. Stable identity
  # gives each replica its own journal volume that outlives its pod.
  #
  # Book and feature state stays on emptyDir below, deliberately: a cell
  # rebuilds its books from the feed, and state that survived a restart would
  # be state nobody reconciled against the venue.
  serviceName: qip-edge-{{ $cellId }}
  # Cells are independent; there is no leader to elect and no ordering to
  # respect, so replicas start together rather than one at a time.
  podManagementPolicy: Parallel
  # Fixed at two, and there is deliberately no HorizontalPodAutoscaler for a
  # cell. Scaling a cell is not a capacity decision, it is a risk one.
  #
  # A `CapitalEnvelope` is scoped to a *cell*: it carries a `cell` field, a
  # `gross_limit` that is the most that may be at risk at once, and an
  # `order_limit` per order. Each pod verifies that envelope and then enforces
  # it against the book it holds in its own memory — the book is rebuilt from
  # the feed into the emptyDir below, and nothing reconciles one pod's book
  # against another's. So a cell running N pods can hold N times its gross
  # limit at risk while every individual pod is correctly inside the envelope
  # it was handed, and the central plane, which signed one envelope, is
  # reasoning about a bound that no longer describes the exposure.
  #
  # That is precisely the failure the header of this file names as the one
  # that matters — a cell's bound widening without the central plane agreeing.
  # An autoscaler here would hand that widening to a CPU threshold, and let
  # load rather than an approver decide how much may be at risk.
  #
  # Two further consequences, either enough on its own:
  #
  #   * The central plane cannot tell the pods apart. A cell report is keyed
  #     by cell id, and every pod here is started with the same `QIP_CELL_ID`,
  #     so the second pod's report replaces the first pod's rather than adding
  #     to it. More pods do not produce more cells; they produce one cell that
  #     speaks with several voices and is heard as one.
  #   * Every replica takes its own journal claim from the template below, and
  #     the retention policy is Retain in both directions on purpose. An
  #     autoscaler would mint evidence volumes on a load spike and orphan them
  #     on the way back down, permanently, because nothing deletes a retained
  #     claim.
  #
  # A cell that needs more capacity gets a new cell — its own id, its own
  # envelope, its own subnet and its own venue rules, all of which the
  # edge-cell Terraform module already takes as a single map entry. That is
  # the scaling unit here, and it is deliberately something a person decides
  # rather than something a threshold decides.
  replicas: 2
  selector:
    matchLabels:
      app: qip-edge-node
      qip.io/cell: {{ $cellId }}
  template:
    metadata:
      labels:
        app: qip-edge-node
        qip.io/cell: {{ $cellId }}
    spec:
      serviceAccountName: qip-edge-{{ $cellId }}
      automountServiceAccountToken: false
      # Long enough to cancel every resting order and write the cell's closing
      # evidence. A cell killed with orders live leaves the book holding risk
      # nobody is watching.
      terminationGracePeriodSeconds: 60
      # The cell runs in its own region or it does not run.
      #
      # This is one line against the quietest failure in the whole deployment.
      # `{{ $cellRegion }}` is substituted into `QIP_CELL_REGION` below, where it is
      # a string the cell reports about itself; nothing until now made it a
      # statement about where the pods are. The Terraform module creates the
      # cell's subnet, identity and firewall rules in that region and creates
      # no compute, and a GKE node pool belongs to its cluster's location — so
      # a cell whose region is not this cluster's region has nowhere in this
      # cluster to correctly be.
      #
      # Without this selector it lands anyway, on the central plane's own
      # nodes, and comes up healthy: it serves `/health`, reports
      # `QIP_CELL_REGION` as the region it is not in, and the central plane
      # records a cell next to a venue that is a continent away. A cell's
      # entire argument is source-adjacency, and this is that argument being
      # false while every indicator says it is true.
      #
      # `topology.kubernetes.io/region` is set on every node by the cloud
      # provider, so this needs no node-pool label and no new Terraform. For a
      # cell whose region is the cluster's region — `london-1` in the
      # `europe-west2` clusters today — it changes nothing. For any other, the
      # pods stay `Pending`, which is the true state said out loud: that cell
      # has no nodes, and docs/operations/multi-region.md is what it would
      # take to give it some.
      nodeSelector:
        topology.kubernetes.io/region: {{ $cellRegion }}
      # Two replicas of a latency-sensitive workload on the same node share a
      # failure and a network card, and gain nothing.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: qip-edge-node
                  qip.io/cell: {{ $cellId }}
              topologyKey: kubernetes.io/hostname
      # And across zones as well as across nodes. The rule above already keeps
      # the two pods off one machine; this keeps them out of one zone, which is
      # the failure that takes both at once. A cell holds the whole hot path,
      # so losing every pod of one is losing the ability to trade — and to
      # cancel — for the venues that cell owns.
      #
      # `ScheduleAnyway`, and here the reason is sharper than elsewhere: the
      # anti-affinity above is `required`, so a hard zone rule on top of it
      # would mean a replacement pod needs a free node in a specific zone or it
      # does not start at all. During a zone outage that is the difference
      # between a cell running degraded on one pod and a cell running on none.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: qip-edge-node
              # The cell as well as the workload, for the same reason the rule
              # above and the policies below name it: two cells in one
              # namespace selected only by `app` would be spread against each
              # other, and one cell's placement would depend on another's.
              qip.io/cell: {{ $cellId }}
      # This one serves, unlike the two central-plane workloads. `qip-edge-node`
      # binds `QIP_HEALTH_PORT` and answers every request with the cell's state,
      # so the probes below point at something that exists rather than at the
      # shape a workload is being built towards.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qip-edge-node
          image: {{ required "imagePrefix is required" .Values.imagePrefix }}/qip-edge-node@{{ include "qip.digest" (dict "value" .Values.cell.imageDigest "name" "cell.imageDigest") }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The node serves a health surface on QIP_HEALTH_PORT and nothing
          # else. It is deliberately not the platform's HTTP server: a cell
          # whose liveness probe depends on the API crate has coupled the two,
          # and this probe is what tells the orchestrator the cell is alive.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: QIP_HEALTH_PORT
              value: "8080"
            # The store, named as literals rather than from the config map:
            # this is the one workload with a volume that outlives its pod, so
            # it is the one that may say `engine` without having nowhere to
            # write it.
            - name: QIP_STORAGE_TARGET
              value: "engine"
            - name: QIP_STORAGE_ROOT
              value: "/var/lib/qip/journal"
            # The autonomy ceiling, and the one variable in this file that
            # `qip-edge-node` does not read. It is set anyway, and the reason
            # is worth writing down rather than leaving as an inconsistency
            # somebody deletes.
            #
            # A cell's ceiling is structural: `qip_edge::Cell` has no
            # constructor taking a ceiling other than paper trading, which is
            # the third of the three layers in
            # .claude/rules/01-security-and-safety.md and the strongest of
            # them — there is no value of this variable that could raise it.
            # The composition-root layer, which is where a live value stops a
            # process, is implemented in qip-api, qip-fastbrain and
            # qip-deepbrain and not here.
            #
            # So this line is a governance marker rather than a control, and
            # `nothing_added_here_raises_the_autonomy_ceiling_anywhere` in the
            # infrastructure suite asserts every workload takes the ceiling
            # from the same named resource — a cell whose manifest silently
            # opted out of that assertion would be the one workload nobody
            # could see the ceiling of. `manifest_wiring.rs` carries it as its
            # single allowlisted exception, named there with this reasoning,
            # and the exception ends the day `qip-edge-node` reads the value
            # and refuses a live one at start-up like its three siblings.
            - name: QIP_AUTONOMY_CEILING
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: autonomy_ceiling
            # Neither QIP_CYCLE_INTERVAL_SECONDS nor QIP_LOG_LEVEL is set
            # here any more, and their absence is the correction rather than an
            # omission. `qip-edge-node` reads neither: it has no scheduler at
            # all, so its journal flush and its one mesh exchange ride the
            # liveness probe below — `periodSeconds: 10` is this cell's real
            # cadence, and the binary's own comment calls that a compromise
            # rather than a design. An operator who changed
            # `cycle_interval_seconds` in the ConfigMap changed nothing about
            # this workload, which is worse than having no dial: a dial that
            # does not turn anything is read as a dial that does.
            #
            # Which cell this is. It must match the `cell` field of every
            # envelope the central plane grants here, because the cell refuses
            # one addressed elsewhere.
            - name: QIP_CELL_ID
              value: "{{ $cellId }}"
            - name: QIP_CELL_REGION
              value: "{{ $cellRegion }}"
            # The venues this cell is configured for. `qip-edge-node` refuses to
            # start without it and refuses an empty list — a cell with no venue
            # has nothing to do, and one that started anyway would report itself
            # healthy while being unable to trade.
            #
            # This is what the cell is configured for; the Terraform `venues`
            # map and the egress rule below are what it may actually reach. All
            # three are substituted from the same map, so they cannot name
            # different venues, and the narrowest of them wins: a venue named
            # here with no firewall rule is a venue the cell cannot open.
            - name: QIP_VENUES
              value: {{ $venueIds | quote }}
            # Where the central plane is, for this cell specifically.
            #
            # The port is the cell's identity on this transport — the centre
            # binds one listener per cell and a mesh poll is a destructive read
            # with a single cursor — so this URL cannot be one shared value.
            # The per-cell key is how a per-cell value reaches a manifest that
            # is rendered by substituting {{ $cellId }}: the runbook's existing
            # `s#{{ $cellId }}#london-1#g` turns `mesh_peer_CELL_ID` into
            # `mesh_peer_london-1`, so no new placeholder is introduced and
            # nothing in docs/operations/deploying-an-edge-cell.md has to
            # change for this to work.
            #
            # `optional: true`, and that is a statement about ADR 0008 rather
            # than caution about a missing key. A cell decides alone; a cell
            # with no peer is detached, which is a legitimate state and not a
            # misconfiguration, so a missing key must leave the variable unset
            # and let the node start and say it is detached. A required
            # reference would instead hold the pod at
            # `CreateContainerConfigError` — turning "the centre has not been
            # told about this cell yet" into "this cell does not run", which is
            # exactly backwards for an architecture whose whole argument is
            # that a cell survives losing the centre.
            - name: QIP_MESH_PEER
              valueFrom:
                configMapKeyRef:
                  name: qip-config
                  key: mesh_peer_CELL_ID
                  optional: true
            # The key this cell verifies capital grants against. It named a
            # Kubernetes Secret `qip-capital-envelope-key` that nothing
            # created, so the cell could never have started. Projected from
            # Secret Manager by the CSI driver instead — see secrets.yaml.
            - name: QIP_CAPITAL_ENVELOPE_KEY_FILE
              value: /var/run/secrets/qip/capital-envelope-key
          resources:
            # Requests equal limits, for the same reason as the fast brain:
            # this is a hot path, and a hot path that is throttled or evicted
            # is not one.
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /var/lib/qip/state
            - name: journal
              mountPath: /var/lib/qip/journal
            - name: secrets
              mountPath: /var/run/secrets/qip
              readOnly: true
          # The cell is the one workload with a volume that outlives its pod,
          # so it is the one that names a durable store. The journal drains
          # here through `StoreMirror`, and the retention policy on the claim
          # is Retain: a cell that has been removed still has to account for
          # what it did while it ran.
          #
          # QIP_MIRROR_PATH used to select this destination on its own, and
          # this file went on setting it after the node stopped reading it.
          # That is not a stale comment, it is a cell that could not start:
          # `NodeConfig::from_env` refuses a non-empty QIP_MIRROR_PATH and
          # exits 78 rather than ignoring it, so every pod of every cell
          # deployed from this manifest died in a configuration-error loop —
          # the refusal working exactly as intended, against a manifest nobody
          # had updated. It names QIP_STORAGE_TARGET and QIP_STORAGE_ROOT as
          # the replacement, which are the two set above.
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # Local book and feature state. emptyDir on purpose: a cell rebuilds
        # its books from the feed on start, and state that survived a restart
        # would be state nobody reconciled against the venue.
        - name: state
          emptyDir:
            sizeLimit: 4Gi
        # The envelope verification key, projected from Secret Manager as the
        # cell's own service account. A cell mounts this and nothing else: it
        # verifies grants, and it has no business holding the API's tokens.
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: qip-envelope-key
  # The journal, per replica, outliving the pod that wrote it. Retained on
  # scale-down rather than deleted: a cell that is removed still has to be able
  # to answer for what it did while it ran.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: journal
        labels:
          app: qip-edge-node
          qip.io/cell: {{ $cellId }}
      spec:
        accessModes: ["ReadWriteOnce"]
        # Named rather than left to the cluster's default class, and the
        # reason is the snapshot rather than the disk.
        #
        # A volume snapshot is taken by the same CSI driver that provisioned
        # the volume — a snapshot class naming a different one fails rather
        # than falling back. Left to the default, what provisions this claim is
        # whatever class the cluster happens to carry, which on an older
        # cluster is the in-tree `kubernetes.io/gce-pd` provisioner. A journal
        # on one of those cannot be snapshotted by any CSI snapshot class at
        # all, and the way that is discovered is a backup schedule that has
        # been reporting success against volumes it never touched.
        #
        # base/journal-storage.yaml is the class, and it also fixes the second
        # half of what `Retain` below does not cover: the retention policy
        # keeps the *claim*, and the class is what keeps the *disk* when the
        # claim is finally deleted.
        #
        # Two things to know before applying this to a cell that already
        # exists. `volumeClaimTemplates` is immutable on a live StatefulSet, so
        # this is not an edit the API server will accept — it needs
        # `kubectl delete statefulset --cascade=orphan` and a re-apply, which
        # leaves the pods and the existing claims running and untouched. And
        # the existing claims keep the class they were bound with: only new
        # replicas take this one, so an established cell has to be migrated
        # by snapshot rather than by this line.
        storageClassName: qip-journal
        resources:
          requests:
            storage: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qip-edge-{{ $cellId }}
  namespace: qip
spec:
  selector:
    app: qip-edge-node
    qip.io/cell: {{ $cellId }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qip-edge-{{ $cellId }}
  namespace: qip
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: qip-edge-node
      qip.io/cell: {{ $cellId }}
---
# An edge cell accepts traffic from the API and nothing else.
#
# These two policies live here rather than in namespace.yaml because they
# are per-cell: the egress rule names this cell's venues. namespace.yaml is
# applied by the pipeline unrendered, and a placeholder in it would be
# rejected by the API server.
#
# The central plane reaches a cell to deliver a capital envelope and to recall
# one. Both are things the centre initiates; the cell asks for nothing, which
# is what lets it keep trading when the centre is unreachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-ingress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-edge-node
      # The cell as well as the workload. Two cells in one namespace selected
      # only by `app` would each get the other's venue rule, which is a wider
      # grant than either was given.
      qip.io/cell: {{ $cellId }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: qip-api
      ports:
        - protocol: TCP
          port: 8080
---
# What an edge cell may reach. The most security-relevant rule in this file.
#
# A cell holds the whole hot path: feed handlers, books, compiled strategies,
# local risk and the venue gateway. It decides without asking anyone. The only
# things standing between a compromised cell and an arbitrary outbound
# connection are this policy and the egress firewall the edge-cell Terraform
# module writes for the same cell.
#
# Three destinations, and the list is exhaustive:
#
#   1. Its own venues. `VENUE_CIDR_*` and `VENUE_PORT_*` are substituted per
#      cell from the same `venues` map the Terraform module takes, so the pod
#      policy and the firewall rule cannot name different things. A cell whose
#      venue map is empty ships with this rule absent and reaches no venue,
#      which is the correct state for a cell nobody has confirmed
#      connectivity for.
#   2. The central plane, for evidence and aggregate exposure. Permitted, not
#      required: a cell that cannot reach it keeps trading inside the envelope
#      it holds.
#   3. Google's private API endpoint, for the envelope verification key and
#      for telemetry.
#
# It may not reach the deep brain, another cell, or the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-egress
  namespace: qip
spec:
  podSelector:
    matchLabels:
      app: qip-edge-node
      # The cell as well as the workload. Two cells in one namespace selected
      # only by `app` would each get the other's venue rule, which is a wider
      # grant than either was given.
      qip.io/cell: {{ $cellId }}
  policyTypes:
    - Egress
  egress:
    # 1. Its venues.
    {{- range $vid, $v := $venues }}
    - to:
        - ipBlock:
            cidr: {{ required (printf "cell.venues.%s.cidr is required" $vid) $v.cidr }}
      ports:
        - protocol: TCP
          port: {{ required (printf "cell.venues.%s.port is required" $vid) $v.port }}
    {{- end }}
    # 2. The central plane: the API on 8080, and the mesh lane on the port
    #    this cell was given in `mesh_cells`.
    #
    #    Two ports rather than one because the mesh is not served on the API's
    #    port. `qip-api` binds a separate listener per cell — the address is
    #    the cell's identity, since a poll is a destructive read with one
    #    cursor and nothing else on the wire names the cell — and the
    #    `qip-api-mesh` Service publishes them. Permitting 8080 alone is how
    #    this cell would publish every delta into a connection the policy
    #    drops, with no error anywhere: a default-deny namespace answers an
    #    unpermitted flow by hanging, not by refusing.
    #
    #    The port is literal here because a NetworkPolicy cannot read a
    #    ConfigMap, so it is the same number as `mesh_cells` and
    #    `mesh_peer_CELL_ID` written a third time. `manifest_wiring.rs` is what
    #    keeps the three honest; do not change one of them alone.
    - to:
        - podSelector:
            matchLabels:
              app: qip-api
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9110
    # 3. Google APIs, through private access.
    - to:
        - ipBlock:
            cidr: 199.36.153.8/30
      ports:
        - protocol: TCP
          port: 443
{{- end }}
