# What collects the metrics the platform emits.
#
# Until this file existed the chain was broken at its last link, and the break
# was invisible because each half looked complete. The kernel records at the
# seams where facts become known; the health servers serve a valid Prometheus
# exposition on `/metrics`; the four Cloud Monitoring alert policies in
# `infrastructure/terraform/modules/observability` query metric names — and
# nothing carried a sample from the first to the third. Endpoints nothing
# scrapes are endpoints that exist for the benefit of whoever curls them.
#
# `PodMonitoring` is Google Managed Prometheus' own resource, and the cluster
# enables it (`managed_prometheus { enabled = true }` in modules/cluster). It
# is namespaced and selects pods directly, so a workload is scraped because it
# carries the label, not because somebody remembered to add it to a list.
#
# The brains are scraped and `qip-api` is not, deliberately. `qip-api` serves
# its exposition at `/api/v1/metrics` behind `Role::Monitor`, so a collector
# would need a bearer token — a credential held by the monitoring system for
# the sole purpose of reading a surface the brains already publish
# unauthenticated. The brains run the cycle, and the cycle is what the alert
# policies are about.
#
# `workload_metrics_exist` stays `false` in every tfvars. This resource makes
# ingestion possible; it does not make it a fact. Flipping that flag requires
# evidence that a pod was actually scraped — a descriptor visible in Cloud
# Monitoring — because a policy naming a descriptor that has never been
# ingested is refused at apply time, and a policy stored but never evaluated
# reads in the console as a project being watched.
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: qip-fastbrain
  namespace: qip
  labels:
    app.kubernetes.io/part-of: qip
    app.kubernetes.io/component: observability
spec:
  selector:
    matchLabels:
      app: qip-fastbrain
  endpoints:
    # The health port, by name rather than by number: the port is declared
    # `name: http` in the Deployment, and a number repeated here would be a
    # second place to change it when it moves.
    - port: http
      path: /metrics
      # Longer than the cycle interval would be, so a scrape cannot silently
      # sample the same cycle twice and report a rate of zero between them.
      interval: 30s
      timeout: 10s
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: qip-deepbrain
  namespace: qip
  labels:
    app.kubernetes.io/part-of: qip
    app.kubernetes.io/component: observability
spec:
  selector:
    matchLabels:
      app: qip-deepbrain
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      timeout: 10s
