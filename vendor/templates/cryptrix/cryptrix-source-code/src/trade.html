<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div class="flex items-center justify-between px-5 pt-4 pb-2">
          <h2 class="text-2xl font-extrabold">Trade</h2>
          <a
            href="limit-order.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="8" y1="6" x2="21" y2="6" />
              <line x1="8" y1="12" x2="21" y2="12" />
              <line x1="8" y1="18" x2="21" y2="18" />
            </svg>
          </a>
        </div>
        <div class="px-5 pb-24 animate-fade-up">
          <div
            class="flex bg-surface border border-white/[0.08] rounded-btn p-1 gap-1 mb-5"
          >
            <button
              id="tab-buy"
              onclick="switchTab('buy')"
              class="flex-1 h-10 rounded-[10px] text-sm font-bold bg-primary text-bg-dark"
            >
              Buy
            </button>
            <button
              id="tab-sell"
              onclick="switchTab('sell')"
              class="flex-1 h-10 rounded-[10px] text-sm font-semibold text-white/50"
            >
              Sell
            </button>
            <a
              href="limit-order.html"
              class="flex-1 h-10 rounded-[10px] text-sm font-semibold text-white/50 flex items-center justify-center"
              >Limit</a
            >
          </div>
          <a
            href="coin-detail.html?id=btc"
            class="flex items-center gap-3 bg-surface-2 border border-white/[0.08] rounded-[14px] p-3.5 mb-5"
          >
            <div
              class="w-11 h-11 rounded-[14px] flex items-center justify-center text-[11px] font-black"
              style="background: #f7931a22; color: #f7931a"
            >
              BTC
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-base font-bold">BTC / USDT</div>
              <div class="text-xs text-success">$43,900.24 · +2.34%</div>
            </div>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="rgba(255,255,255,0.4)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </a>
          <div class="text-center mb-5">
            <div class="text-[13px] text-white/40 mb-2">Amount (USDT)</div>
            <div
              id="trade-amount"
              class="text-[48px] font-black tracking-tight"
            >
              $0.00
            </div>
            <div class="text-sm text-white/40">≈ 0.00000 BTC</div>
          </div>
          <div class="grid grid-cols-4 gap-2 mb-5">
            <button
              onclick="setAmt('$100')"
              class="bg-surface-2 border border-white/[0.08] rounded-btn h-10 text-sm font-semibold"
            >
              $100
            </button>
            <button
              onclick="setAmt('$500')"
              class="bg-surface-2 border border-white/[0.08] rounded-btn h-10 text-sm font-semibold"
            >
              $500
            </button>
            <button
              onclick="setAmt('$1K')"
              class="bg-surface-2 border border-white/[0.08] rounded-btn h-10 text-sm font-semibold"
            >
              $1K
            </button>
            <button
              onclick="setAmt('$5K')"
              class="bg-surface-2 border border-white/[0.08] rounded-btn h-10 text-sm font-semibold"
            >
              $5K
            </button>
          </div>
          <div class="grid grid-cols-3 gap-2 mb-5">
            <button
              onclick="numpad('1')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              1
            </button>
            <button
              onclick="numpad('2')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              2
            </button>
            <button
              onclick="numpad('3')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              3
            </button>
            <button
              onclick="numpad('4')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              4
            </button>
            <button
              onclick="numpad('5')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              5
            </button>
            <button
              onclick="numpad('6')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              6
            </button>
            <button
              onclick="numpad('7')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              7
            </button>
            <button
              onclick="numpad('8')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              8
            </button>
            <button
              onclick="numpad('9')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              9
            </button>
            <button
              onclick="numpad('.')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              .
            </button>
            <button
              onclick="numpad('0')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              0
            </button>
            <button
              onclick="numpad('back')"
              class="h-14 bg-surface-2 border border-white/[0.08] rounded-xl text-xl font-semibold"
            >
              ⌫
            </button>
          </div>
          <div class="bg-surface-2 rounded-xl p-4 mb-5">
            <div class="flex justify-between py-1.5">
              <span class="text-[13px] text-white/40">Available USDT</span
              ><span class="text-[13px] font-semibold text-primary"
                >$12,450.00</span
              >
            </div>
            <div class="flex justify-between py-1.5">
              <span class="text-[13px] text-white/40">Est. BTC</span
              ><span class="text-[13px] font-semibold">≈ 0.00000 BTC</span>
            </div>
            <div class="flex justify-between py-1.5">
              <span class="text-[13px] text-white/40">Fee (0.1%)</span
              ><span class="text-[13px] font-semibold">$0.00</span>
            </div>
          </div>
          <a
            href="order-confirmation.html"
            class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-primary w-full"
            >Buy BTC</a
          >
        </div>
        <include-bottom-nav />
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script>
      document.getElementById("nav-trade")?.classList.add("text-primary");

      let amount = "";
      function numpad(k) {
        if (k === "back") {
          amount = amount.slice(0, -1);
        } else if (k === "." && amount.includes(".")) return;
        else amount += k;
        document.getElementById("trade-amount").textContent =
          "$" + (parseFloat(amount) || 0).toFixed(2);
      }
      function setAmt(a) {
        document.getElementById("trade-amount").textContent = a;
      }
      function switchTab(mode) {
        document.getElementById("tab-buy").className =
          "flex-1 h-10 rounded-[10px] text-sm font-" +
          (mode === "buy"
            ? "bold bg-primary text-bg-dark"
            : "semibold text-white/50");
        document.getElementById("tab-sell").className =
          "flex-1 h-10 rounded-[10px] text-sm font-" +
          (mode === "sell"
            ? "bold bg-error text-white"
            : "semibold text-white/50");
      }
    </script>
  </body>
</html>
