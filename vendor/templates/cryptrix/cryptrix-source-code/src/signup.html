<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div class="min-h-screen bg-bg-dark flex flex-col">
          <div class="flex items-center gap-3 px-5 pt-5">
            <a
              href="welcome.html"
              class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center"
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="rtl:rotate-180"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" /></svg
            ></a>
            <h1 class="text-[17px] font-bold">Create Account</h1>
          </div>
          <div class="flex-1 px-6 pt-6 pb-6 animate-fade-up">
            <p class="text-white/50 mb-7 text-[15px]">
              Join 500,000+ traders using AI-powered insights
            </p>
            <div class="grid grid-cols-2 gap-3 mb-4">
              <div>
                <label class="text-[13px] font-medium text-white/50 block mb-2"
                  >First Name</label
                >
                <input
                  type="text"
                  class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white placeholder-white/30 focus:outline-none focus:border-primary/50 transition-colors font-medium text-sm"
                  placeholder="Alex"
                  value="Alex"
                />
              </div>
              <div>
                <label class="text-[13px] font-medium text-white/50 block mb-2"
                  >Last Name</label
                >
                <input
                  type="text"
                  class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white placeholder-white/30 focus:outline-none focus:border-primary/50 transition-colors font-medium text-sm"
                  placeholder="Mercer"
                  value="Mercer"
                />
              </div>
            </div>
            <div class="mb-4">
              <label class="text-[13px] font-medium text-white/50 block mb-2"
                >Email Address</label
              >
              <div class="relative">
                <svg
                  class="absolute left-4 top-1/2 -translate-y-1/2 text-white/30"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                  />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
                <input
                  type="email"
                  class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 pl-11 pr-4 text-white placeholder-white/30 focus:outline-none focus:border-primary/50 transition-colors font-medium text-sm"
                  placeholder="you@example.com"
                />
              </div>
            </div>
            <div class="mb-4">
              <label class="text-[13px] font-medium text-white/50 block mb-2"
                >Phone Number</label
              >
              <input
                type="tel"
                class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white placeholder-white/30 focus:outline-none focus:border-primary/50 transition-colors font-medium text-sm"
                placeholder="+1 (555) 000-0000"
              />
            </div>
            <div class="mb-4">
              <label class="text-[13px] font-medium text-white/50 block mb-2"
                >Password</label
              >
              <input
                type="password"
                class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white placeholder-white/30 focus:outline-none focus:border-primary/50 transition-colors font-medium text-sm"
                placeholder="Min. 8 characters"
              />
              <div class="mt-2 mb-1">
                <div class="h-1.5 bg-surface/10 rounded-full overflow-hidden">
                  <div
                    class="h-full rounded-full w-[65%] bg-gradient-to-r from-warning to-success"
                  ></div>
                </div>
                <div class="text-xs text-white/40 mt-1">
                  Password strength:
                  <span class="text-warning font-semibold">Medium</span>
                </div>
              </div>
            </div>
            <div class="mb-4">
              <label class="text-[13px] font-medium text-white/50 block mb-2"
                >Referral Code (optional)</label
              >
              <input
                type="text"
                class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white placeholder-white/30 focus:outline-none focus:border-primary/50 transition-colors font-medium text-sm tracking-[3px]"
                placeholder="Enter referral code"
              />
            </div>
            <div class="flex items-start gap-2.5 mb-6">
              <div
                class="w-5 h-5 rounded-md bg-primary flex items-center justify-center flex-shrink-0 mt-0.5 cursor-pointer"
              >
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#0A0B0F"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              </div>
              <span class="text-[13px] text-white/50 leading-relaxed"
                >I agree to the
                <a href="terms.html" class="text-primary font-semibold"
                  >Terms of Service</a
                >
                and
                <a href="privacy.html" class="text-primary font-semibold"
                  >Privacy Policy</a
                ></span
              >
            </div>
            <a
              href="otp.html"
              class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-primary w-full mb-5"
            >
              Create Account
            </a>
            <div class="text-center text-sm">
              <span class="text-white/40">Already have an account? </span>
              <a href="signin.html" class="text-primary font-bold">Sign In</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>

    <script></script>
  </body>
</html>
