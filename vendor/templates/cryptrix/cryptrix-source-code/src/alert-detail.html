<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
     <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="price-alerts.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h1 class="text-[17px] font-bold">Alert Detail</h1>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <div class="text-center mb-8">
            <div
              class="w-20 h-20 rounded-full bg-primary/15 border-2 border-primary/25 flex items-center justify-center mx-auto mb-4"
            >
              <svg
                width="36"
                height="36"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#00D4AA"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
            </div>
            <div class="text-xl font-extrabold mb-1">ETH Price Alert</div>
            <span
              class="bg-success/15 text-success text-xs font-bold px-3 py-1 rounded-full"
            >
              Active
            </span>
          </div>
          <div
            class="bg-surface border border-white/[0.08] rounded-card p-4 mb-5"
          >
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Asset</span>
              <span class="text-[13px] font-semibold">Ethereum (ETH)</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Condition</span>
              <span class="text-[13px] font-semibold">Price Above</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Target Price</span>
              <span class="text-[13px] font-bold text-primary">$3,000.00</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Current Price</span>
              <span class="text-[13px] font-semibold">$2,554.87</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Distance</span>
              <span class="text-[13px] font-semibold text-warning"
                >+$445.13 (17.4%)</span
              >
            </div>
            <div class="flex justify-between py-2.5">
              <span class="text-[13px] text-white/40">Created</span>
              <span class="text-[13px] font-semibold">2024-03-01</span>
            </div>
          </div>
          <div
            class="bg-surface border border-white/[0.08] rounded-card p-4 mb-5"
          >
            <div class="text-[15px] font-bold mb-4">Notification Settings</div>
            <div class="flex items-center justify-between py-2">
              <span class="text-sm">Push Notification</span>
              <div
                class="w-12 h-6 bg-primary rounded-pill relative cursor-pointer"
              >
                <div
                  class="w-5 h-5 bg-surface rounded-full absolute right-0.5 top-0.5 shadow-sm"
                ></div>
              </div>
            </div>
            <div class="flex items-center justify-between py-2">
              <span class="text-sm">Email Alert</span>
              <div
                class="w-12 h-6 bg-primary rounded-pill relative cursor-pointer"
              >
                <div
                  class="w-5 h-5 bg-surface rounded-full absolute right-0.5 top-0.5 shadow-sm"
                ></div>
              </div>
            </div>
          </div>
          <div class="flex gap-3">
            <button
              onclick="showToast('Alert deleted', 'error')"
              class="flex-1 bg-error/15 text-error border border-error/20 rounded-btn h-12 font-bold"
            >
              Delete Alert
            </button>
            <a
              href="price-alerts.html"
              class="flex-1 bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center shadow-primary"
            >
              Done
            </a>
          </div>
        </div>
        <include-bottom-nav />
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
