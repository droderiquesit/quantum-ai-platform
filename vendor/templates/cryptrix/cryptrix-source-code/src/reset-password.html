<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div class="min-h-screen bg-bg-dark flex flex-col">
          <div class="px-6 pt-5">
            <a
              href="javascript:history.back()"
              class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center"
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="rtl:rotate-180"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" /></svg
            ></a>
          </div>
          <div class="flex-1 px-6 pt-10 pb-6 animate-fade-up">
            <div
              class="w-[72px] h-[72px] rounded-[20px] bg-primary/15 border-2 border-primary/20 flex items-center justify-center mb-6"
            >
              <svg
                width="36"
                height="36"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#00D4AA"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
            </div>
            <h2 class="text-[26px] font-extrabold mb-3">New Password</h2>
            <p class="text-white/50 text-[15px] leading-relaxed mb-9">
              Create a strong password for your account. At least 8 characters.
            </p>
            <div class="mb-4">
              <label class="text-[13px] font-medium text-white/50 block mb-2"
                >New Password</label
              >
              <input
                type="password"
                class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white placeholder-white/30 focus:outline-none focus:border-primary/50 font-medium text-sm"
                placeholder="Min. 8 characters"
              />
            </div>
            <div class="mb-4">
              <label class="text-[13px] font-medium text-white/50 block mb-2"
                >Confirm Password</label
              >
              <input
                type="password"
                class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white placeholder-white/30 focus:outline-none focus:border-primary/50 font-medium text-sm"
                placeholder="Confirm your password"
              />
            </div>
            <div class="mb-6">
              <div
                class="h-1.5 bg-surface/10 rounded-full overflow-hidden mb-1"
              >
                <div
                  class="h-full rounded-full w-4/5 bg-gradient-to-r from-success to-primary"
                ></div>
              </div>
              <div class="flex justify-between text-xs text-white/40">
                <span>Password strength:</span
                ><span class="text-success font-semibold">Strong</span>
              </div>
            </div>
            <a
              href="signin.html"
              class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-primary w-full"
              >Reset Password</a
            >
          </div>
        </div>
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script></script>
  </body>
</html>
