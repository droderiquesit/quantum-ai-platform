<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="pricing.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h2 class="text-[17px] font-bold">Checkout</h2>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <div
            class="bg-gradient-to-br from-primary/10 to-secondary/[0.06] border border-primary/20 rounded-card p-5 mb-5"
          >
            <div class="text-xs text-white/40 mb-1">Upgrading to</div>
            <div class="text-xl font-extrabold text-primary mb-1">
              Elite Plan
            </div>
            <div class="text-white/50 text-sm">
              Zero fees · AI portfolio manager · Dedicated support
            </div>
          </div>

          <div
            class="bg-surface border border-white/[0.08] rounded-card p-4 mb-5"
          >
            <div class="text-[15px] font-bold mb-4">Payment Method</div>
            <div class="flex gap-2 mb-4">
              <div
                class="px-4 py-2 text-sm font-semibold rounded-pill cursor-pointer border bg-primary text-bg-dark border-primary"
              >
                Credit Card
              </div>
              <div
                class="px-4 py-2 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                USDT
              </div>
              <div
                class="px-4 py-2 text-sm font-semibold rounded-pill cursor-pointer border bg-surface-2 text-white/60 border-white/10"
              >
                BTC
              </div>
            </div>

            <div class="mb-4">
              <label class="text-[13px] font-medium text-white/50 block mb-2"
                >Card Number</label
              >
              <input
                type="text"
                class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none"
                placeholder="4242 4242 4242 4242"
              />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-[13px] font-medium text-white/50 block mb-2"
                  >Expiry</label
                >
                <input
                  type="text"
                  class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none"
                  placeholder="MM/YY"
                />
              </div>
              <div>
                <label class="text-[13px] font-medium text-white/50 block mb-2"
                  >CVV</label
                >
                <input
                  type="text"
                  class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none"
                  placeholder="123"
                />
              </div>
            </div>
          </div>

          <div
            class="bg-surface border border-white/[0.08] rounded-card p-4 mb-5"
          >
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40"
                >Elite Plan (Monthly)</span
              >
              <span class="text-[13px] font-semibold text-white">$49.00</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40"
                >First Month Discount (20%)</span
              >
              <span class="text-[13px] font-semibold text-success">-$9.80</span>
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/40">Tax</span>
              <span class="text-[13px] font-semibold text-white">$0.00</span>
            </div>
            <div class="flex justify-between py-2.5">
              <span class="text-[13px] font-bold text-white">Total Today</span>
              <span class="text-[13px] font-bold text-primary">$39.20</span>
            </div>
          </div>

          <a
            href="payment-success.html"
            class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-primary w-full mb-3"
          >
            Pay $39.20
          </a>
          <div class="text-center text-xs text-white/30">
            Secure payment · Cancel anytime
          </div>
        </div>

        <include-bottom-nav />
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
