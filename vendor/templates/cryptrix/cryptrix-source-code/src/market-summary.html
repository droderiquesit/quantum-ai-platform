<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="/assets/images/logo.png" />
    <meta name="theme-color" content="#00D4AA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="market-overview.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h2 class="text-[17px] font-bold">Market Summary</h2>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-surface border border-white/[0.08] rounded-card p-4">
              <div class="text-[11px] text-white/40 mb-1">Total Market Cap</div>
              <div class="text-base font-extrabold mb-1">$1.84T</div>
              <div class="text-xs text-success">▲ 3.2%</div>
            </div>
            <div class="bg-surface border border-white/[0.08] rounded-card p-4">
              <div class="text-[11px] text-white/40 mb-1">24h Volume</div>
              <div class="text-base font-extrabold mb-1">$94.2B</div>
              <div class="text-xs text-success">▲ 18.5%</div>
            </div>
            <div class="bg-surface border border-white/[0.08] rounded-card p-4">
              <div class="text-[11px] text-white/40 mb-1">BTC Dominance</div>
              <div class="text-base font-extrabold mb-1">52.4%</div>
              <div class="text-xs text-error">▼ 0.3%</div>
            </div>
            <div class="bg-surface border border-white/[0.08] rounded-card p-4">
              <div class="text-[11px] text-white/40 mb-1">Fear & Greed</div>
              <div class="text-base font-extrabold mb-1">74 Greed</div>
              <div class="text-xs text-warning">Bullish</div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <div class="text-[15px] font-bold mb-3 text-success">
                🔥 Top Gainers
              </div>
              <div id="gainers"></div>
            </div>
            <div>
              <div class="text-[15px] font-bold mb-3 text-error">
                ❄️ Top Losers
              </div>
              <div id="losers"></div>
            </div>
          </div>
        </div>
        <include-bottom-nav />
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/market-summary.js"></script>
  </body>
</html>
