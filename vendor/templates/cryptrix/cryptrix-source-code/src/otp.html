<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div class="min-h-screen bg-bg-dark flex flex-col">
          <div class="px-6 pt-5">
            <a
              href="javascript:history.back()"
              class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
            </a>
          </div>
          <div class="flex-1 px-6 pt-10 pb-6 text-center animate-fade-up">
            <div
              class="w-20 h-20 rounded-[24px] bg-secondary/15 border-2 border-secondary/20 flex items-center justify-center mx-auto mb-7"
            >
              <svg
                width="40"
                height="40"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#7B61FF"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                />
                <polyline points="22,6 12,13 2,6" />
              </svg>
            </div>
            <h2 class="text-[26px] font-extrabold mb-3">Check Your Email</h2>
            <p class="text-white/50 text-[15px] leading-relaxed mb-10">
              We've sent a 6-digit verification code to<br />
              <strong class="text-white">alex.mercer@email.com</strong>
            </p>
            <!-- OTP inputs -->
            <div class="flex gap-3 justify-center mb-8" id="otp-group">
              <input
                type="tel"
                maxlength="1"
                class="otp-input w-12 h-14 bg-surface-2 border-2 border-white/10 rounded-xl text-center text-xl font-bold focus:outline-none focus:border-primary"
                value="4"
              />
              <input
                type="tel"
                maxlength="1"
                class="otp-input w-12 h-14 bg-surface-2 border-2 border-white/10 rounded-xl text-center text-xl font-bold focus:outline-none focus:border-primary"
                value="2"
              />
              <input
                type="tel"
                maxlength="1"
                class="otp-input w-12 h-14 bg-surface-2 border-2 border-white/10 rounded-xl text-center text-xl font-bold focus:outline-none focus:border-primary"
                value=""
              />
              <input
                type="tel"
                maxlength="1"
                class="otp-input w-12 h-14 bg-surface-2 border-2 border-white/10 rounded-xl text-center text-xl font-bold focus:outline-none focus:border-primary"
                value=""
              />
              <input
                type="tel"
                maxlength="1"
                class="otp-input w-12 h-14 bg-surface-2 border-2 border-white/10 rounded-xl text-center text-xl font-bold focus:outline-none focus:border-primary"
                value=""
              />
              <input
                type="tel"
                maxlength="1"
                class="otp-input w-12 h-14 bg-surface-2 border-2 border-white/10 rounded-xl text-center text-xl font-bold focus:outline-none focus:border-primary"
                value=""
              />
            </div>
            <div class="text-white/50 text-sm mb-8">
              Code expires in&nbsp;
              <strong class="text-primary" id="otp-timer">04:52</strong>
            </div>
            <a
              href="kyc-info.html"
              class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-primary w-full mb-4"
            >
              Verify Code
            </a>
            <div class="text-sm text-white/50">
              Didn't receive the code?
              <button
                onclick="showToast('Verification code resent', 'success')"
                class="text-primary font-bold"
              >
                Resend
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>

    <script>
      const inputs = document.querySelectorAll(".otp-input");
      inputs.forEach((inp, idx) => {
        inp.addEventListener("input", (e) => {
          if (e.target.value.length === 1 && idx < inputs.length - 1)
            inputs[idx + 1].focus();
        });
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !inp.value && idx > 0)
            inputs[idx - 1].focus();
        });
      });
    </script>
  </body>
</html>
