<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)] bg-bg-dark"
        id="app"
      >
        <!-- Header -->
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-surface border-b border-white/5 z-10"
        >
          <a
            href="trade.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/5 flex items-center justify-center flex-shrink-0 transition-all active:scale-95"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="rtl:rotate-180"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h1 class="text-[17px] font-bold text-white">Sell Crypto</h1>
          <div class="w-10"></div>
        </div>

        <div class="px-5 pt-5 pb-28 animate-fade-up">
          <!-- Portfolio Slice -->
          <div
            class="bg-surface rounded-[24px] p-5 mb-5 border border-white/5 shadow-sm flex items-center justify-between"
          >
            <div class="flex items-center gap-4">
              <div
                id="sell-coin-icon"
                class="w-12 h-12 rounded-[18px] flex items-center justify-center text-[10px] font-black"
                style="background: #627eea15; color: #627eea"
              >
                ETH
              </div>
              <div>
                <div
                  id="sell-coin-name"
                  class="text-base font-black text-white"
                >
                  Ethereum
                </div>
                <div class="text-[13px] text-white/50 font-medium">
                  Available:
                  <span id="sell-coin-balance" class="text-white font-bold"
                    >4.821 ETH</span
                  >
                </div>
              </div>
            </div>
            <button
              onclick="window.showCoinPickerSheet(updateSellCoin)"
              class="px-4 h-9 rounded-full bg-surface-2 text-white text-xs font-black transition-all active:scale-90"
            >
              Change
            </button>
          </div>

          <!-- Input Sections -->
          <div class="mb-5">
            <label class="text-[13px] font-bold text-white/50 block mb-2.5 ml-1"
              >Amount to Sell</label
            >
            <div class="relative">
              <input
                type="number"
                id="sell-input"
                class="w-full bg-surface border border-white/5 rounded-[20px] h-16 px-5 pr-24 text-white text-[24px] font-black focus:outline-none focus:ring-2 focus:ring-[#00D4AA]/20 transition-all placeholder:text-white/20"
                placeholder="0.00"
                value="1.2"
                oninput="updateValue(this.value)"
              />
              <div
                id="sell-symbol-badge"
                class="absolute right-3 top-1/2 -translate-y-1/2 px-4 h-10 flex items-center bg-surface-2 border border-white/5 rounded-xl text-sm font-black text-[#627eea]"
              >
                ETH
              </div>
            </div>

            <div class="grid grid-cols-4 gap-2 mt-4">
              <button
                onclick="setPercent(0.25)"
                class="h-10 rounded-xl bg-surface border border-white/5 text-[13px] font-bold text-white/50 hover:border-[#00D4AA] hover:text-[#00D4AA] transition-all"
              >
                25%
              </button>
              <button
                onclick="setPercent(0.5)"
                class="h-10 rounded-xl bg-surface border border-white/5 text-[13px] font-bold text-white/50 hover:border-[#00D4AA] hover:text-[#00D4AA] transition-all"
              >
                50%
              </button>
              <button
                onclick="setPercent(0.75)"
                class="h-10 rounded-xl bg-surface border border-white/5 text-[13px] font-bold text-white/50 hover:border-[#00D4AA] hover:text-[#00D4AA] transition-all"
              >
                75%
              </button>
              <button
                onclick="setPercent(1.0)"
                class="h-10 rounded-xl bg-surface border border-white/5 text-[13px] font-bold text-white/50 hover:border-[#00D4AA] hover:text-[#00D4AA] transition-all"
              >
                100%
              </button>
            </div>
          </div>

          <div class="flex justify-center -my-2 relative z-10">
            <div
              class="w-10 h-10 bg-surface rounded-full border border-white/5 flex items-center justify-center shadow-sm"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#FF4757"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M7 10l5 5 5-5" />
              </svg>
            </div>
          </div>

          <div class="mb-6">
            <label class="text-[13px] font-bold text-white/50 block mb-2.5 ml-1"
              >Estimated Value</label
            >
            <div
              class="bg-surface border border-white/5 rounded-[20px] p-5 flex items-center justify-between"
            >
              <div>
                <div
                  id="receive-value"
                  class="text-[24px] font-black text-white"
                >
                  $3,065.84
                </div>
                <div class="text-[13px] text-white/50 font-bold">USDT</div>
              </div>
              <div class="text-right">
                <div class="text-[13px] text-white/50 font-medium">
                  Price Impact
                </div>
                <div class="text-[13px] text-success font-bold">&lt; 0.01%</div>
              </div>
            </div>
          </div>

          <!-- Transaction Details -->
          <div
            class="bg-surface rounded-[24px] p-5 mb-8 border border-white/5 shadow-sm"
          >
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/50 font-medium"
                >Selling Price</span
              >
              <span
                id="sell-price-display"
                class="text-[13px] font-bold text-white"
                >$2,554.87</span
              >
            </div>
            <div class="flex justify-between py-2.5 border-b border-white/5">
              <span class="text-[13px] text-white/50 font-medium"
                >Fee (0.1%)</span
              >
              <span class="text-[13px] font-bold text-white">$3.06</span>
            </div>
            <div class="flex justify-between py-2.5">
              <span class="text-[13px] text-white/50 font-medium"
                >Net Receive</span
              >
              <span
                id="net-receive"
                class="text-[13px] font-black text-[#FF4757]"
                >$3,062.78</span
              >
            </div>
          </div>

          <a
            href="order-confirmation.html"
            class="bg-[#FF4757] text-white font-extrabold rounded-[18px] h-14 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg shadow-[#FF4757]/20 w-full text-[15px]"
          >
            Review Sell Order
          </a>
        </div>
        <include-bottom-nav />
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script>
      let currentSellCoin = window.AppData.coins[1]; // ETH
      const balance = 4.821;

      function updateSellCoin(id) {
        const coin = window.AppData.coins.find((c) => c.id === id);
        if (!coin) return;
        currentSellCoin = coin;

        document.getElementById("sell-coin-icon").style.background =
          coin.color + "15";
        document.getElementById("sell-coin-icon").style.color = coin.color;
        document.getElementById("sell-coin-icon").textContent =
          coin.symbol.substring(0, 3);
        document.getElementById("sell-coin-name").textContent = coin.name;
        document.getElementById("sell-symbol-badge").textContent = coin.symbol;
        document.getElementById("sell-symbol-badge").style.color = coin.color;
        document.getElementById("sell-price-display").textContent = formatPrice(
          coin.price,
        );

        updateValue(document.getElementById("sell-input").value);
        showToast(`${coin.name} selected`, "info");
      }

      function updateValue(val) {
        const amt = parseFloat(val) || 0;
        const value = amt * currentSellCoin.price;
        const fee = value * 0.001;
        document.getElementById("receive-value").textContent =
          `$${value.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
        document.getElementById("net-receive").textContent =
          `$${(value - fee).toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
      }

      function setPercent(p) {
        const val = (balance * p).toFixed(4);
        document.getElementById("sell-input").value = val;
        updateValue(val);
      }
    </script>
  </body>
</html>
