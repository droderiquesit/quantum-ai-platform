<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div class="flex items-center justify-between px-5 pt-4 pb-2">
          <h2 class="text-2xl font-extrabold">Staking</h2>
          <a
            href="stake-asset.html"
            class="w-10 h-10 rounded-xl bg-primary/15 border border-primary/20 flex items-center justify-center"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#00D4AA"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </a>
        </div>
        <div class="px-5 pb-28 animate-fade-up">
          <div
            class="bg-gradient-to-br from-primary/15 to-secondary/[0.08] border border-primary/20 rounded-card p-6 mb-5"
          >
            <div class="text-[13px] text-white/50 mb-1.5">
              Total Staked Value
            </div>
            <div
              class="text-[36px] font-black tracking-tight mb-3"
              id="staked-total"
            >
              $12,450
            </div>
            <div class="flex gap-5">
              <div>
                <div class="text-xs text-white/40">Pending Rewards</div>
                <div
                  class="text-lg font-extrabold text-success"
                  id="staked-rewards"
                >
                  $150.54
                </div>
              </div>
              <div class="w-px bg-surface/10"></div>
              <div>
                <div class="text-xs text-white/40">Avg. APY</div>
                <div class="text-lg font-extrabold text-primary">6.5%</div>
              </div>
              <div class="w-px bg-surface/10"></div>
              <div>
                <div class="text-xs text-white/40">Positions</div>
                <div class="text-lg font-extrabold">4</div>
              </div>
            </div>
          </div>
          <a
            href="claim-rewards.html"
            class="flex items-center gap-4 px-4 py-4 bg-success/[0.08] border border-success/20 rounded-card mb-6 cursor-pointer"
          >
            <div
              class="w-12 h-12 rounded-[14px] bg-success/20 flex items-center justify-center flex-shrink-0"
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#00C896"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon
                  points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                />
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-base font-bold">Claim Rewards</div>
              <div class="text-[13px] text-success">
                $150.54 available to claim
              </div>
            </div>
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="rgba(255,255,255,0.4)"
              stroke-width="2"
            >
              <path d="M9 18l6-6-6-6" />
            </svg>
          </a>
          <div class="text-[15px] font-bold mb-3">Active Positions</div>
          <div id="staking-positions"></div>
          <div class="text-[15px] font-bold mt-6 mb-3">Earn More</div>
          <a
            href="stake-asset.html"
            class="flex items-center gap-4 px-4 py-4 bg-surface-2 border border-white/[0.08] rounded-card cursor-pointer"
          >
            <div
              class="w-12 h-12 rounded-[14px] bg-primary/15 flex items-center justify-center"
            >
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#00D4AA"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="16" />
                <line x1="8" y1="12" x2="16" y2="12" />
              </svg>
            </div>
            <div>
              <div class="text-[15px] font-bold">Stake More Assets</div>
              <div class="text-[13px] text-white/40">
                Up to 18.5% APY available
              </div>
            </div>
            <svg
              class="ml-auto"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="rgba(255,255,255,0.4)"
              stroke-width="2"
            >
              <path d="M9 18l6-6-6-6" />
            </svg>
          </a>
          <div class="h-5"></div>
        </div>
        <include-bottom-nav />
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const d = window.AppData;
        if (!d) return;
        const el = document.getElementById("staking-positions");
        if (!el) return;
        el.innerHTML = d.staking
          .map((pos) => {
            const coin = d.getCoin(pos.coin);
            return (
              '<div class="bg-surface border border-white/[0.08] rounded-card p-4 mb-3 cursor-pointer" onclick=\'window.location.href="rewards-overview.html"\'>' +
              '<div class="flex items-center gap-3 mb-3">' +
              '<div class="w-11 h-11 rounded-[14px] flex items-center justify-center text-[11px] font-black flex-shrink-0" style="background:' +
              (coin?.color || "#888") +
              "22;color:" +
              (coin?.color || "#888") +
              '">' +
              pos.coin.substring(0, 3) +
              "</div>" +
              '<div class="flex-1 min-w-0"><div class="text-[15px] font-bold">' +
              (coin?.name || pos.coin) +
              '</div><div class="text-xs text-white/40">' +
              pos.lockPeriod +
              " · Started " +
              pos.startDate +
              "</div></div>" +
              '<span class="bg-primary/15 text-primary text-xs font-bold px-2.5 py-1 rounded-full">' +
              pos.apy +
              "% APY</span></div>" +
              '<div class="grid grid-cols-3 gap-3">' +
              '<div><div class="text-[11px] text-white/40">Staked</div><div class="text-sm font-bold">' +
              pos.amount +
              " " +
              pos.coin +
              "</div></div>" +
              '<div><div class="text-[11px] text-white/40">Rewards</div><div class="text-sm font-bold text-success">+' +
              pos.rewards +
              " " +
              pos.coin +
              "</div></div>" +
              '<div><div class="text-[11px] text-white/40">USD Value</div><div class="text-sm font-bold text-success">+$' +
              pos.rewardsUSD.toFixed(2) +
              "</div></div>" +
              "</div></div>"
            );
          })
          .join("");
      });
    </script>
  </body>
</html>
