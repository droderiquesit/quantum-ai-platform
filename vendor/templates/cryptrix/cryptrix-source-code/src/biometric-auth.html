<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
     <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div class="min-h-screen bg-bg-dark flex flex-col">
          <div class="px-6 pt-5">
            <a
              href="javascript:history.back()"
              class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
            </a>
          </div>
          <div
            class="flex-1 flex flex-col items-center justify-center px-8 pb-6 animate-fade-up"
          >
            <!-- Pulsing ring -->
            <div class="relative mb-10">
              <div
                class="absolute inset-[-24px] rounded-full border-2 border-primary/20 animate-pulse"
              ></div>
              <div
                class="absolute inset-[-12px] rounded-full border-2 border-primary/35 animate-pulse"
                style="animation-delay: 0.3s"
              ></div>
              <div
                id="bio-circle"
                class="w-[120px] h-[120px] rounded-full border-[2.5px] border-primary bg-gradient-to-br from-primary/12 to-secondary/8 flex items-center justify-center cursor-pointer"
              >
                <svg
                  id="bio-icon"
                  width="52"
                  height="52"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#00D4AA"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"
                  />
                  <path
                    d="M12 6c-1.1 0-2 .9-2 2v1c0 .55.45 1 1 1h2c.55 0 1-.45 1-1V8c0-1.1-.9-2-2-2z"
                  />
                  <path d="M7 14c0-2.76 2.24-5 5-5s5 2.24 5 5" />
                </svg>
              </div>
            </div>
            <!-- Method tabs -->
            <div
              class="flex bg-surface border border-white/[0.08] rounded-[14px] p-1 mb-8"
            >
              <button
                id="bio-btn-faceid"
                class="px-5 h-10 rounded-[10px] text-sm font-bold bg-primary text-bg-dark transition-colors"
              >
                Face ID
              </button>
              <button
                id="bio-btn-fp"
                class="px-5 h-10 rounded-[10px] text-sm font-semibold text-white/50 transition-colors"
              >
                Fingerprint
              </button>
            </div>
            <h2 id="bio-title" class="text-2xl font-extrabold text-center mb-2">
              Face ID
            </h2>
            <p
              id="bio-subtitle"
              class="text-white/50 text-center text-[15px] mb-8 max-w-[280px] leading-relaxed"
            >
              Look at your camera to authenticate securely
            </p>
            <div
              id="bio-status"
              class="flex items-center gap-2 px-5 py-2.5 bg-surface border border-white/[0.08] rounded-pill text-sm text-white/50 mb-9 transition-all"
            >
              <div class="w-2 h-2 rounded-full bg-warning animate-pulse"></div>
              Waiting for authentication...
            </div>
            <button
              id="bio-btn"
              class="w-full max-w-[280px] h-14 bg-gradient-to-r from-primary to-success text-bg-dark rounded-[16px] text-base font-extrabold shadow-primary transition-transform active:scale-95"
            >
              Authenticate
            </button>
            <a
              href="signin.html"
              class="mt-4 text-white/40 text-sm hover:text-white transition-colors block text-center"
            >
              Use password instead
            </a>
          </div>
          <div class="px-6 pb-10 text-center">
            <div class="inline-flex items-center gap-1.5 text-xs text-white/30">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#00C896"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
              256-bit encrypted · Biometric data never leaves your device
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
