<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
     <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="home.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h1 class="text-[17px] font-bold">Balance Details</h1>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <div
            class="text-center py-8 px-6 bg-gradient-to-br from-primary/15 to-secondary/10 border border-primary/20 rounded-[24px] mb-6"
          >
            <div class="text-[13px] text-white/50 mb-2">Total Balance</div>
            <div class="text-4xl font-black tracking-tight mb-3">
              $47,823.56
            </div>
            <div
              class="bg-success/15 text-success text-xs font-bold px-2 py-0.5 rounded-full inline-block"
            >
              ▲ +2.65% today
            </div>
          </div>
          <!-- Chart -->
          <div class="mb-6">
            <div class="h-[160px] mb-3">
              <canvas id="balance-chart"></canvas>
            </div>
            <div class="flex justify-around">
              <button
                class="px-3 py-1.5 text-xs font-semibold rounded-lg text-white/40"
              >
                1D
              </button>
              <button
                class="px-3 py-1.5 text-xs font-semibold rounded-lg text-white/40"
              >
                7D
              </button>
              <button
                class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-primary text-bg-dark"
              >
                30D
              </button>
              <button
                class="px-3 py-1.5 text-xs font-semibold rounded-lg text-white/40"
              >
                90D
              </button>
              <button
                class="px-3 py-1.5 text-xs font-semibold rounded-lg text-white/40"
              >
                1Y
              </button>
            </div>
          </div>
          <!-- Stats -->
          <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-surface border border-white/[0.08] rounded-card p-4">
              <div class="text-xs text-white/40 mb-1">Invested</div>
              <div class="text-[18px] font-extrabold" style="color: #8b91a8">
                $38,200.00
              </div>
            </div>
            <div class="bg-surface border border-white/[0.08] rounded-card p-4">
              <div class="text-xs text-white/40 mb-1">Total P&L</div>
              <div class="text-[18px] font-extrabold" style="color: #00c896">
                +$9,623.56
              </div>
            </div>
            <div class="bg-surface border border-white/[0.08] rounded-card p-4">
              <div class="text-xs text-white/40 mb-1">Day Change</div>
              <div class="text-[18px] font-extrabold" style="color: #00c896">
                +$1,234.78
              </div>
            </div>
            <div class="bg-surface border border-white/[0.08] rounded-card p-4">
              <div class="text-xs text-white/40 mb-1">ROI</div>
              <div class="text-[18px] font-extrabold" style="color: #00d4aa">
                +25.19%
              </div>
            </div>
          </div>
          <!-- Holdings -->
          <div class="text-[15px] font-bold mb-4">Holdings Breakdown</div>
          <div id="balance-holdings"></div>
        </div>
        <include-bottom-nav />
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
