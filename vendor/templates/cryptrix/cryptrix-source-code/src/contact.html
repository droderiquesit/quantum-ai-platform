<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="help-center.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0 transition-colors hover:bg-surface/5"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h1 class="text-[17px] font-bold">Contact Us</h1>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <div class="grid grid-cols-2 gap-3 mb-6">
            <button
              id="btn-live-chat"
              class="w-full bg-gradient-to-br from-primary/10 to-secondary/[0.06] border border-primary/20 rounded-card p-4 flex flex-col items-center justify-center cursor-pointer transition-transform active:scale-95"
            >
              <svg
                class="mb-2"
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#00D4AA"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                />
              </svg>
              <div class="text-sm font-bold text-white">Live Chat</div>
              <div class="text-xs text-success font-bold mt-1">Online now</div>
            </button>
            <button
              id="btn-email"
              class="w-full bg-gradient-to-br from-secondary/10 to-primary/[0.06] border border-secondary/20 rounded-card p-4 flex flex-col items-center justify-center cursor-pointer transition-transform active:scale-95"
            >
              <svg
                class="mb-2"
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#7B61FF"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                />
                <polyline points="22,6 12,13 2,6" />
              </svg>
              <div class="text-sm font-bold text-white">Email</div>
              <div class="text-xs text-white/40 font-semibold mt-1">
                Response within 24 hours
              </div>
            </button>
          </div>
          <div class="text-[15px] font-bold mb-4">Send a Message</div>
          <div class="mb-4">
            <label class="text-[13px] font-medium text-white/50 block mb-2"
              >Subject</label
            >
            <div class="relative">
              <select
                class="w-full bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white text-sm focus:outline-none appearance-none cursor-pointer"
              >
                <option>General Inquiry</option>
                <option>Technical Issue</option>
                <option>Account Issue</option>
                <option>Trading Question</option>
                <option>Deposits &amp; Withdrawals</option>
                <option>KYC &amp; Verification</option>
                <option>Billing &amp; Subscription</option>
              </select>
              <svg
                class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-white/40"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </div>
          </div>
          <div class="mb-4">
            <label class="text-[13px] font-medium text-white/50 block mb-2"
              >Message</label
            >
            <textarea
              class="w-full bg-surface-2 border border-white/10 rounded-card px-4 py-3 text-white text-sm focus:outline-none focus:border-primary/50 resize-none h-32 placeholder-white/30"
              placeholder="Please describe your issue in as much detail as possible. Include any error messages or steps to reproduce."
            ></textarea>
          </div>
          <div class="mb-6">
            <label class="text-[13px] font-medium text-white/50 block mb-2"
              >Attachment (optional)</label
            >
            <button
              id="btn-attach"
              class="w-full border-2 border-dashed border-white/15 rounded-card p-4 flex items-center justify-center gap-2 text-sm text-white/50 font-semibold cursor-pointer hover:border-primary/30 hover:bg-primary/5 transition-colors"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
              Attach a File or Screenshot
            </button>
          </div>
          <button
            id="btn-send"
            class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-primary w-full"
          >
            Send Message
          </button>
        </div>

        <include-bottom-nav />
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
