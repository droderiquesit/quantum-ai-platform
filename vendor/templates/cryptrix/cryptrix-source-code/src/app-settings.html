<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  </head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="profile.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h2 class="text-[17px] font-bold">App Settings</h2>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <div class="bg-surface border border-white/[0.08] rounded-card mb-4">
            <div
              class="px-4 py-4 border-b border-white/5 flex items-center justify-between"
            >
              <div>
                <div class="text-sm font-bold">Dark Mode</div>
                <div class="text-xs text-white/40">Current: Dark</div>
              </div>
              <button
                onclick="toggleTheme()"
                class="w-12 h-6 bg-primary rounded-pill relative cursor-pointer"
              >
                <div
                  class="w-5 h-5 bg-surface rounded-full absolute right-0.5 top-0.5"
                ></div>
              </button>
            </div>
            <div class="px-4 py-4 border-b border-white/5">
              <div class="text-sm font-bold mb-2">Language</div>
              <div class="relative">
                <select
                  class="w-full bg-surface-2 border border-white/10 rounded-btn h-11 px-4 text-white text-sm focus:outline-none appearance-none"
                >
                  <option>English</option>
                  <option>Spanish</option>
                  <option>French</option>
                  <option>German</option>
                  <option>Chinese</option>
                </select>
                <svg
                  class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-white/40"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <polyline points="6 9 12 15 18 9" />
                </svg>
              </div>
            </div>
            <div class="px-4 py-4 border-b border-white/5">
              <div class="text-sm font-bold mb-2">Currency</div>
              <div class="relative">
                <select
                  class="w-full bg-surface-2 border border-white/10 rounded-btn h-11 px-4 text-white text-sm focus:outline-none appearance-none"
                >
                  <option>USD — US Dollar</option>
                  <option>EUR — Euro</option>
                  <option>GBP — British Pound</option>
                </select>
                <svg
                  class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-white/40"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <polyline points="6 9 12 15 18 9" />
                </svg>
              </div>
            </div>
            <div class="px-4 py-4 flex items-center justify-between">
              <div>
                <div class="text-sm font-bold">Hide Portfolio Value</div>
                <div class="text-xs text-white/40">Privacy mode</div>
              </div>
              <div
                class="w-12 h-6 bg-surface/20 rounded-pill relative cursor-pointer"
              >
                <div
                  class="w-5 h-5 bg-surface rounded-full absolute left-0.5 top-0.5 shadow-sm"
                ></div>
              </div>
            </div>
          </div>
          <div class="bg-surface border border-white/[0.08] rounded-card mb-4">
            <div
              class="px-4 py-4 border-b border-white/5 flex items-center justify-between"
            >
              <div>
                <div class="text-sm font-bold">Biometric Login</div>
                <div class="text-xs text-white/40">Face ID / Fingerprint</div>
              </div>
              <div
                class="w-12 h-6 bg-primary rounded-pill relative cursor-pointer"
              >
                <div
                  class="w-5 h-5 bg-surface rounded-full absolute right-0.5 top-0.5 shadow-sm"
                ></div>
              </div>
            </div>
            <div class="px-4 py-4 flex items-center justify-between">
              <div>
                <div class="text-sm font-bold">Auto-Lock</div>
                <div class="text-xs text-white/40">5 minutes</div>
              </div>
              <div class="text-primary text-sm font-semibold cursor-pointer">
                Change
              </div>
            </div>
          </div>
          <div class="bg-surface border border-white/[0.08] rounded-card mb-6">
            <div
              class="px-4 py-4 border-b border-white/5 flex items-center justify-between"
            >
              <div class="text-sm font-bold">App Version</div>
              <div class="text-sm text-white/50">v2.0.0</div>
            </div>
            <div
              class="px-4 py-4 border-b border-white/5 flex items-center justify-between"
            >
              <div class="text-sm font-bold">Cache Size</div>
              <button
                onclick="showToast('App cache cleared', 'success')"
                class="text-primary text-xs font-bold"
              >
                Clear 24MB
              </button>
            </div>
            <div class="px-4 py-4 flex items-center justify-between">
              <div class="text-sm font-bold">Check for Updates</div>
              <button
                onclick="showToast('Cryptrix is up to date', 'info')"
                class="text-primary text-xs font-bold"
              >
                Check
              </button>
            </div>
          </div>
          <button
            onclick="showToast('Settings saved!', 'success')"
            class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-primary w-full"
          >
            Save Settings
          </button>
        </div>
        <include-bottom-nav />
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
