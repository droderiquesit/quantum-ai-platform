<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="/assets/images/logo.png" />
    <meta name="theme-color" content="#00D4AA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)] bg-bg-dark"
        id="app"
      >
        <div
          class="flex items-center px-5 pt-8 pb-4 sticky top-0 bg-bg-dark/95 backdrop-blur-sm z-10 border-b border-white/5"
        >
          <button
            onclick="history.back()"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center text-white mr-4 flex-shrink-0"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </button>
          <h2
            class="text-[20px] font-extrabold tracking-tight text-center flex-1 pr-14"
          >
            Withdraw
          </h2>
        </div>

        <div class="px-5 pt-5 pb-24 animate-fade-up">
          <div class="mb-4 text-left">
            <label class="text-[13px] font-bold text-white/50 block mb-2 px-1"
              >Asset</label
            >
            <div
              class="w-full bg-surface border border-white/10 rounded-xl h-14 px-4 flex items-center cursor-pointer transition-colors hover:bg-surface/[0.02]"
            >
              <span class="text-[14px] font-bold"
                >USDT —
                <span class="text-white/70 font-medium"
                  >$12,450.00 available</span
                ></span
              >
            </div>
          </div>

          <div class="mb-4 text-left">
            <label class="text-[13px] font-bold text-white/50 block mb-2 px-1"
              >Network</label
            >
            <div
              class="w-full bg-surface border border-white/10 rounded-xl h-14 px-4 flex items-center shadow-sm cursor-pointer transition-colors hover:bg-surface/[0.02]"
            >
              <span class="text-[14px] font-bold"
                >BNB Smart Chain (BEP-20)
                <span class="text-white/50 font-medium px-1">·</span>
                <span class="text-white/70 font-medium tracking-tight"
                  >Fee: ~$0.10</span
                ></span
              >
            </div>
          </div>

          <div class="mb-4 text-left">
            <label class="text-[13px] font-bold text-white/50 block mb-2 px-1"
              >Destination Address</label
            >
            <div class="relative">
              <input
                type="text"
                class="w-full bg-surface border border-white/10 rounded-xl h-14 px-4 pr-12 text-[14px] font-bold text-white placeholder-white/30 focus:outline-none focus:border-primary/50 transition-colors"
                placeholder="Enter wallet address or scan QR"
              />
              <button
                onclick="showToast('QR scanner activated', 'info')"
                class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-white/40 hover:text-white transition-colors"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="3" width="7" height="7" rx="1" />
                  <rect x="14" y="3" width="7" height="7" rx="1" />
                  <rect x="14" y="14" width="7" height="7" rx="1" />
                  <rect x="3" y="14" width="7" height="7" rx="1" />
                </svg>
              </button>
            </div>
          </div>

          <div class="mb-6 text-left">
            <label class="text-[13px] font-bold text-white/50 block mb-2 px-1"
              >Amount</label
            >
            <div class="relative">
              <input
                type="number"
                class="w-full bg-surface border border-white/10 rounded-xl h-14 px-4 pr-28 text-[15px] font-bold text-white placeholder-white/30 focus:outline-none focus:border-primary/50 transition-colors"
                placeholder="0.00"
                value="1000"
              />
              <div
                class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-2"
              >
                <span class="text-[14px] font-bold text-white/50">USDT</span>
                <button
                  class="text-[12px] font-black text-primary hover:text-primary-dark transition-colors"
                  onclick="showToast('Max amount selected', 'success')"
                >
                  MAX
                </button>
              </div>
            </div>
            <div class="flex items-center justify-between px-1 mt-2">
              <span class="text-[11px] font-bold text-white/40"
                >Available: $12,450.00</span
              >
              <span class="text-[11px] font-bold text-white/40">Min: $10</span>
            </div>
          </div>

          <div class="bg-surface border border-white/10 rounded-[16px] p-5">
            <div class="flex justify-between items-center mb-3.5">
              <span class="text-[13px] text-white/60 font-medium">Amount</span>
              <span class="text-[14px] font-bold tracking-tight"
                >$1,000.00</span
              >
            </div>
            <div class="flex justify-between items-center mb-3.5">
              <span class="text-[13px] text-white/60 font-medium"
                >Network Fee</span
              >
              <span class="text-[14px] font-bold tracking-tight text-warning"
                >$0.10</span
              >
            </div>
            <div
              class="flex justify-between items-center pt-3.5 border-t border-white/5"
            >
              <span class="text-[13px] text-white/60 font-medium"
                >You Receive</span
              >
              <span class="text-[14px] font-black tracking-tight text-success"
                >$999.90</span
              >
            </div>
          </div>

          <div
            class="bg-primary/10 border border-primary/20 rounded-xl p-3 flex items-center gap-3 mt-4"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-primary flex-shrink-0"
            >
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
            <span class="text-[13px] font-bold text-primary/80"
              >Two-factor authentication (2FA) is required to process this withdrawal</span
            >
          </div>

          <button
            onclick="showToast('Withdrawal initiated!', 'success')"
            class="bg-primary hover:bg-primary-dark text-bg-dark font-extrabold rounded-btn h-14 w-full mt-6 flex items-center justify-center transition-all active:scale-95 shadow-[0_4px_24px_rgba(0,212,170,0.2)] text-[15px]"
          >
            Verify & Withdraw
          </button>
        </div>
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  <script defer src="index.js"></script></body>
</html>
