<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="javascript:history.back()"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h1 class="text-[17px] font-bold">KYC Status</h1>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pb-10 pt-6 animate-fade-up text-center">
          <div
            class="w-24 h-24 rounded-full bg-success/15 border-2 border-success/25 flex items-center justify-center mx-auto mb-6 animate-pulse"
          >
            <svg
              width="44"
              height="44"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#00C896"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          </div>
          <div
            class="inline-block bg-success/15 text-success text-xs font-bold px-3 py-1 rounded-full mb-4"
          >
            VERIFIED
          </div>
          <h2 class="text-2xl font-extrabold mb-3">Identity Verified!</h2>
          <p
            class="text-white/50 text-sm leading-relaxed mb-8 max-w-[280px] mx-auto"
          >
            Your identity has been successfully verified. You now have full
            access to all Cryptrix features.
          </p>
          <div
            class="bg-surface border border-white/[0.08] rounded-card p-4 mb-6 text-left"
          >
            <div
              class="flex items-center justify-between py-2.5 gap-3 border-b border-white/5 last:border-0"
            >
              <span class="text-[13px] font-medium text-white/50">Status</span
              ><span class="text-[13px] font-semibold text-white"
                ><span class="text-success font-bold">✓ Verified</span></span
              >
            </div>
            <div
              class="flex items-center justify-between py-2.5 gap-3 border-b border-white/5 last:border-0"
            >
              <span class="text-[13px] font-medium text-white/50"
                >Verification Level</span
              ><span class="text-[13px] font-semibold text-white"
                >Level 2 — Full KYC</span
              >
            </div>
            <div
              class="flex items-center justify-between py-2.5 gap-3 border-b border-white/5 last:border-0"
            >
              <span class="text-[13px] font-medium text-white/50"
                >Daily Withdrawal Limit</span
              ><span class="text-[13px] font-semibold text-white">$50,000</span>
            </div>
            <div
              class="flex items-center justify-between py-2.5 gap-3 border-b border-white/5 last:border-0"
            >
              <span class="text-[13px] font-medium text-white/50"
                >Verified On</span
              ><span class="text-[13px] font-semibold text-white"
                >Mar 10, 2024</span
              >
            </div>
            <div
              class="flex items-center justify-between py-2.5 gap-3 border-b border-white/5 last:border-0"
            >
              <span class="text-[13px] font-medium text-white/50"
                >KYC Provider</span
              ><span class="text-[13px] font-semibold text-white"
                >Jumio · Tier 1</span
              >
            </div>
          </div>
          <a
            href="home.html"
            class="bg-primary text-bg-dark font-bold rounded-btn h-12 flex items-center justify-center gap-2 transition-all active:scale-95 shadow-primary w-full"
          >
            Go to Dashboard
          </a>
        </div>
      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
    <script></script>
  <script defer src="index.js"></script></body>
</html>
