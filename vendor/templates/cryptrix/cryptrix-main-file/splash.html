<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="min-h-screen bg-bg-dark flex flex-col items-center justify-center relative overflow-hidden"
        >
          <!-- Glow bg -->
          <div class="absolute inset-0 pointer-events-none">
            <div
              class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full bg-primary/10 blur-3xl"
            ></div>
            <div
              class="absolute top-2/3 right-0 w-40 h-40 rounded-full bg-secondary/10 blur-2xl"
            ></div>
          </div>
          <!-- Logo -->
          <div class="animate-float relative z-10 text-center">
            <div class="flex items-center justify-center mb-8">
              <img
                src="./assets/images/logo-192.png"
                alt="logo"
                class="size-20"
              />
            </div>
            <div class="text-white/50 text-[15px] font-medium tracking-wider">
              Smart Investing · AI Powered
            </div>
          </div>
          <!-- Loading bar -->
          <div class="absolute bottom-20 left-1/2 -translate-x-1/2 w-[200px]">
            <div class="h-[3px] bg-surface/10 rounded-full overflow-hidden">
              <div
                id="splash-bar"
                class="h-full bg-gradient-to-r from-primary to-secondary rounded-full w-0 transition-all duration-[2s] ease-in-out"
              ></div>
            </div>
          </div>
          <div class="absolute bottom-8 text-white/20 text-xs">v2.0.0</div>
        </div>
      </div>
    </div>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/charts.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>

    <script>
      setTimeout(() => {
        const bar = document.getElementById("splash-bar");
        if (bar) bar.style.width = "100%";
        setTimeout(() => {
          window.location.href = "welcome.html";
        }, 2200);
      }, 100);
    </script>
  <script defer src="index.js"></script></body>
</html>
