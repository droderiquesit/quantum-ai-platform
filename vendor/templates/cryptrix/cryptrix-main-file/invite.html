<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cryptrix — AI Crypto Investing & Trading App</title>
    <meta
      name="description"
      content="Invite your friends to Cryptrix and earn rewards. The more you share your referral link, the more you earn!"
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="/assets/images/logo.png" />
    <meta name="theme-color" content="#00D4AA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="shortcut icon" href="./assets/images/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Script (Placed early to prevent FOUC) -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme") || "dark";
        if (saved === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      })();
    </script>
  <link href="assets/css/index.css" rel="stylesheet"></head>
  <body class="font-sans overflow-x-hidden">
    <div class="min-h-screen flex justify-center">
      <div
        class="relative w-full max-w-[430px] min-h-screen overflow-x-hidden shadow-[0_0_80px_rgba(0,212,170,0.08)]"
        id="app"
      >
        <div
          class="flex items-center justify-between px-5 py-3.5 sticky top-0 bg-bg-dark/95 backdrop-blur-sm border-b border-white/5 z-10"
        >
          <a
            href="referral.html"
            class="w-10 h-10 rounded-xl bg-surface-2 border border-white/[0.08] flex items-center justify-center flex-shrink-0"
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </a>
          <h2 class="text-[17px] font-bold">Invite Friends</h2>
          <div class="w-10"></div>
        </div>
        <div class="px-5 pt-5 pb-24 animate-fade-up text-center">
          <div
            class="w-28 h-28 rounded-full bg-gradient-to-br from-primary/20 to-secondary/15 border-2 border-primary/25 flex items-center justify-center mx-auto mb-6 animate-float"
          >
            <svg
              width="52"
              height="52"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#00D4AA"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          </div>
          <h2 class="text-2xl font-extrabold mb-3">Invite Your Friends</h2>
          <p
            class="text-white/50 text-sm leading-relaxed mb-8 max-w-[280px] mx-auto"
          >
            Share Cryptrix with your network — both of you earn rewards. The more
            friends you refer, the more crypto you earn.
          </p>
          <div class="flex gap-3 mb-6">
            <input
              type="text"
              class="flex-1 bg-surface-2 border border-white/10 rounded-btn h-12 px-4 text-white placeholder-white/30 focus:outline-none text-sm"
              placeholder="Enter friend's email address"
            />
            <button
              onclick="showToast('Invitation sent!', 'success')"
              class="bg-primary text-bg-dark font-bold rounded-btn h-12 px-5 flex-shrink-0"
            >
              Send Invite
            </button>
          </div>
          <div class="flex flex-col gap-3 mb-6">
            <button
              onclick="showToast('Contacts loaded', 'info')"
              class="bg-surface-2 border border-white/[0.08] rounded-btn h-12 flex items-center justify-center gap-2 font-semibold text-sm w-full"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
              </svg>
              Import from Contacts
            </button>
            <button
              onclick="showToast('Link copied!', 'success')"
              class="bg-surface-2 border border-white/[0.08] rounded-btn h-12 flex items-center justify-center gap-2 font-semibold text-sm w-full"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                />
                <path
                  d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                />
              </svg>
              Copy Invite Link
            </button>
          </div>
          <a href="referral.html" class="text-primary font-semibold text-sm"
            >View Earnings Dashboard →</a
          >
        </div>
        <nav
  class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-surface border-t border-white/[0.08] flex items-center justify-around h-[72px] z-50"
>
  <a
    href="home.html"
    id="nav-home"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <polyline points="9 22 9 12 15 12 15 22" />
    </svg>
    <span class="text-[10px] font-semibold">Home</span>
  </a>
  <a
    href="market-overview.html"
    id="nav-market"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="22 7 13.5 15.5 8.5 10.5 1 18" />
      <polyline points="16 7 22 7 22 13" />
    </svg>
    <span class="text-[10px] font-semibold">Markets</span>
  </a>
  <a
    href="trade.html"
    id="nav-trade"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <div
      class="w-12 h-12 rounded-lg bg-primary flex flex-col items-center justify-center shadow-primary"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#000000"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="17 1 21 5 17 9" />
        <path d="M3 11V9a4 4 0 0 1 4-4h14" />
        <polyline points="7 23 3 19 7 15" />
        <path d="M21 13v2a4 4 0 0 1-4 4H3" />
      </svg>
      <span class="text-[10px] text-black font-semibold">Trade</span>
    </div>
  </a>
  <a
    href="portfolio-overview.html"
    id="nav-portfolio"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
      <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
    </svg>
    <span class="text-[10px] font-semibold">Portfolio</span>
  </a>
  <a
    href="profile.html"
    id="nav-profile"
    class="flex flex-col items-center gap-1 text-white/40 hover:text-primary transition-colors"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
      <circle cx="12" cy="7" r="4" />
    </svg>
    <span class="text-[10px] font-semibold">Profile</span>
  </a>
</nav>

      </div>
    </div>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/components.js"></script>
    <script src="./assets/js/app.js"></script>
  <script defer src="index.js"></script></body>
</html>
